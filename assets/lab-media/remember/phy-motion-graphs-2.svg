<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="A distance–time graph"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="80" y1="260" x2="549.0" y2="260.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><polygon points="560.0,260.0 549.0,254.5 549.0,265.5" fill="#16233f"/><line x1="80" y1="260" x2="80.0" y2="51.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><polygon points="80.0,40.0 74.5,51.0 85.5,51.0" fill="#16233f"/><text xml:space="preserve" x="560" y="286" font-size="16" font-weight="700" fill="#3d4560" text-anchor="end">time</text><text xml:space="preserve" x="90" y="46" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">distance</text><line x1="80" y1="260" x2="230" y2="170" stroke="#16233f" stroke-width="3.5" stroke-linecap="round"/><line x1="230" y1="170" x2="340" y2="170" stroke="#16233f" stroke-width="3.5" stroke-linecap="round"/><line x1="340" y1="170" x2="430" y2="60" stroke="#16233f" stroke-width="3.5" stroke-linecap="round"/><text xml:space="preserve" x="140" y="240" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">steady</text><text xml:space="preserve" x="285" y="160" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">stopped</text><text xml:space="preserve" x="395" y="130" font-size="16" font-weight="800" fill="#0b6e80" text-anchor="start">faster</text><text xml:space="preserve" x="460" y="220" font-size="19" font-weight="800" fill="#16233f" text-anchor="start">gradient = speed</text></g></svg>