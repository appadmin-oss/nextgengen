<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Two families of verbs"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="50" y="50" width="250" height="215" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="175" y="88" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">verb + -ing</text><text xml:space="preserve" x="175" y="130" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">enjoy swimming</text><text xml:space="preserve" x="175" y="165" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">finish eating</text><text xml:space="preserve" x="175" y="200" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">avoid shouting</text><text xml:space="preserve" x="175" y="235" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">keep trying</text><rect x="340" y="50" width="250" height="215" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="465" y="88" font-size="22" font-weight="800" fill="#a3361f" text-anchor="middle">verb + to</text><text xml:space="preserve" x="465" y="130" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">want to swim</text><text xml:space="preserve" x="465" y="165" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">hope to win</text><text xml:space="preserve" x="465" y="200" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">decide to go</text><text xml:space="preserve" x="465" y="235" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">refuse to pay</text><text xml:space="preserve" x="320" y="302" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">learn each verb with its partner</text></g></svg>