<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Ability, permission, duty, advice"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="40" y="50" width="270" height="110" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="175" y="92" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">can</text><text xml:space="preserve" x="175" y="130" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">ability: She can swim.</text><rect x="330" y="50" width="270" height="110" rx="8" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="465" y="92" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">may</text><text xml:space="preserve" x="465" y="130" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">permission: May I go out?</text><rect x="40" y="180" width="270" height="110" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="175" y="222" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">must</text><text xml:space="preserve" x="175" y="260" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">duty: You must obey.</text><rect x="330" y="180" width="270" height="110" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="465" y="222" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">should</text><text xml:space="preserve" x="465" y="260" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">advice: You should rest.</text></g></svg>