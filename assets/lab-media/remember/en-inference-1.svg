<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Clue + what you know = inference"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="20" y="80" width="180" height="140" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="110" y="115" font-size="17" font-weight="800" fill="#0b6e80" text-anchor="middle">clue in the text</text><text xml:space="preserve" x="110" y="160" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">Emeka shook</text><text xml:space="preserve" x="110" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">a wet umbrella.</text><text xml:space="preserve" x="215" y="160" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">+</text><rect x="230" y="80" width="180" height="140" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="115" font-size="17" font-weight="800" fill="#3d4560" text-anchor="middle">what you know</text><text xml:space="preserve" x="320" y="160" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">umbrellas are</text><text xml:space="preserve" x="320" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">used in rain</text><text xml:space="preserve" x="425" y="160" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">=</text><rect x="440" y="80" width="180" height="140" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="530" y="115" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">inference</text><text xml:space="preserve" x="530" y="160" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">It is raining</text><text xml:space="preserve" x="530" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">outside.</text><text xml:space="preserve" x="320" y="280" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">the text never says it — you work it out</text></g></svg>