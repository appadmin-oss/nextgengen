<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Idioms"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="72" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">The test was a piece of cake.</text><text xml:space="preserve" x="320" y="104" font-size="19" font-weight="700" fill="#0b6e80" text-anchor="middle">= it was very easy</text><text xml:space="preserve" x="320" y="152" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">She let the cat out of the bag.</text><text xml:space="preserve" x="320" y="184" font-size="19" font-weight="700" fill="#0b6e80" text-anchor="middle">= she told the secret</text><text xml:space="preserve" x="320" y="232" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">The thief took to his heels.</text><text xml:space="preserve" x="320" y="264" font-size="19" font-weight="700" fill="#0b6e80" text-anchor="middle">= he ran away</text></g></svg>