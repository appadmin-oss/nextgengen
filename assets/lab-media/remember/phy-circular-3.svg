<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Gravity holds a satellite in orbit"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><circle cx="220" cy="175" r="120" fill="none" stroke="#c9cedb" stroke-width="2"/><circle cx="220" cy="175" r="55" fill="#d9f2f6" stroke="#20b2c9" stroke-width="2"/><text xml:space="preserve" x="220" y="182" font-size="17" font-weight="800" fill="#0b6e80" text-anchor="middle">Earth</text><rect x="330.0" y="165.0" width="20.0" height="20.0" rx="0" fill="#aab2c5" stroke="#16233f" stroke-width="2"/><line x1="330" y1="175" x2="295.0" y2="175.0" stroke="#ef6b4d" stroke-width="3.5" stroke-linecap="round"/><polygon points="282.0,175.0 295.0,181.5 295.0,168.5" fill="#ef6b4d"/><line x1="340" y1="162" x2="340.0" y2="93.0" stroke="#20b2c9" stroke-width="3.5" stroke-linecap="round"/><polygon points="340.0,80.0 333.5,93.0 346.5,93.0" fill="#20b2c9"/><text xml:space="preserve" x="400" y="110" font-size="17" font-weight="800" fill="#a3361f" text-anchor="start">gravity is the</text><text xml:space="preserve" x="400" y="135" font-size="17" font-weight="800" fill="#a3361f" text-anchor="start">centripetal force</text><text xml:space="preserve" x="400" y="190" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">further out: weaker pull,</text><text xml:space="preserve" x="400" y="215" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">slower, longer year</text><text xml:space="preserve" x="400" y="265" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">T² ∝ r³  (Kepler)</text></g></svg>