<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="The moment of a force"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="120" y1="180" x2="540" y2="180" stroke="#16233f" stroke-width="7" stroke-linecap="round"/><polygon points="120,184 100,222 140,222" fill="#f3f5fa" stroke="#16233f" stroke-width="2" stroke-linejoin="round"/><line x1="420" y1="70" x2="420.0" y2="161.0" stroke="#ef6b4d" stroke-width="4" stroke-linecap="round"/><polygon points="420.0,174.0 426.5,161.0 413.5,161.0" fill="#ef6b4d"/><text xml:space="preserve" x="435" y="100" font-size="18" font-weight="800" fill="#a3361f" text-anchor="start">F = 10 N</text><line x1="270.0" y1="240.0" x2="130.0" y2="240.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="120.0,240.0 130.0,245.0 130.0,235.0" fill="#3d4560"/><line x1="270.0" y1="240.0" x2="410.0" y2="240.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="420.0,240.0 410.0,235.0 410.0,245.0" fill="#3d4560"/><line x1="120" y1="226" x2="120" y2="252" stroke="#3d4560" stroke-width="1.5" stroke-linecap="round"/><text xml:space="preserve" x="270" y="266" font-size="18" font-weight="800" fill="#3d4560" text-anchor="middle">d = 0.5 m</text><text xml:space="preserve" x="320" y="310" font-size="24" font-weight="800" fill="#16233f" text-anchor="middle">moment = F × d = 10 × 0.5 = 5 N m</text></g></svg>