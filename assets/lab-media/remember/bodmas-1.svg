<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Two answers?"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="90" font-size="40" font-weight="800" fill="#16233f" text-anchor="middle">3 + 4 × 2 = ?</text><rect x="110" y="150" width="180" height="70" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="200" y="195" font-size="26" font-weight="800" fill="#a3361f" text-anchor="middle">14 ✗</text><rect x="350" y="150" width="180" height="70" rx="8" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="440" y="195" font-size="26" font-weight="800" fill="#1d6b30" text-anchor="middle">11 ✓</text><text xml:space="preserve" x="320" y="270" font-size="17" font-weight="600" fill="#3d4560" text-anchor="middle">Left to right gives 14. The agreed order gives 11.</text></g></svg>