<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Prefixes are powers of ten"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="25.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text xml:space="preserve" x="65" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">G</text><text xml:space="preserve" x="65" y="135" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">× 10⁹</text><text xml:space="preserve" x="65" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">giga</text><rect x="110.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text xml:space="preserve" x="150" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">M</text><text xml:space="preserve" x="150" y="135" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">× 10⁶</text><text xml:space="preserve" x="150" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">mega</text><rect x="195.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text xml:space="preserve" x="235" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">k</text><text xml:space="preserve" x="235" y="135" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">× 10³</text><text xml:space="preserve" x="235" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">kilo</text><rect x="280.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="320" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text xml:space="preserve" x="320" y="135" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">the unit</text><rect x="365.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text xml:space="preserve" x="405" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">m</text><text xml:space="preserve" x="405" y="135" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">× 10⁻³</text><text xml:space="preserve" x="405" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">milli</text><rect x="450.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text xml:space="preserve" x="490" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">µ</text><text xml:space="preserve" x="490" y="135" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">× 10⁻⁶</text><text xml:space="preserve" x="490" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">micro</text><rect x="535.0" y="55.0" width="80.0" height="100.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text xml:space="preserve" x="575" y="100" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">n</text><text xml:space="preserve" x="575" y="135" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">× 10⁻⁹</text><text xml:space="preserve" x="575" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">nano</text><text xml:space="preserve" x="320" y="230" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">1 km = 1000 m     1 mA = 0.001 A     1 µs = 10⁻⁶ s</text><text xml:space="preserve" x="320" y="275" font-size="18" font-weight="700" fill="#0b6e80" text-anchor="middle">each step along the row is × 1000</text></g></svg>