<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Same impulse, different force"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="60" y1="230" x2="289.0" y2="230.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><polygon points="300.0,230.0 289.0,224.5 289.0,235.5" fill="#16233f"/><line x1="60" y1="230" x2="60.0" y2="71.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><polygon points="60.0,60.0 54.5,71.0 65.5,71.0" fill="#16233f"/><text xml:space="preserve" x="300" y="256" font-size="16" font-weight="700" fill="#3d4560" text-anchor="end">time</text><text xml:space="preserve" x="70" y="66" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">force</text><line x1="350" y1="230" x2="579.0" y2="230.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><polygon points="590.0,230.0 579.0,224.5 579.0,235.5" fill="#16233f"/><line x1="350" y1="230" x2="350.0" y2="71.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><polygon points="350.0,60.0 344.5,71.0 355.5,71.0" fill="#16233f"/><text xml:space="preserve" x="590" y="256" font-size="16" font-weight="700" fill="#3d4560" text-anchor="end">time</text><text xml:space="preserve" x="360" y="66" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">force</text><path d="M90 230 L110 90 L130 230 Z" fill="#f5b026" stroke="#16233f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M380 230 Q 470 183 560 230 Z" fill="#f5b026" stroke="#16233f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="180" y="270" font-size="17" font-weight="800" fill="#a3361f" text-anchor="middle">hard floor: big force</text><text xml:space="preserve" x="470" y="270" font-size="17" font-weight="800" fill="#0b6e80" text-anchor="middle">cushion: small force</text><text xml:space="preserve" x="320" y="310" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">same area = same change in momentum (F × t = mv − mu)</text></g></svg>