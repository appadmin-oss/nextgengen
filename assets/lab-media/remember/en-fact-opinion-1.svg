<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Fact and opinion"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="40" y="40" width="560" height="115" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="85" font-size="24" font-weight="800" fill="#16233f" text-anchor="middle">Lagos is in south-west Nigeria.</text><text xml:space="preserve" x="320" y="128" font-size="19" font-weight="800" fill="#0b6e80" text-anchor="middle">FACT — it can be checked</text><rect x="40" y="175" width="560" height="115" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="220" font-size="24" font-weight="800" fill="#16233f" text-anchor="middle">Lagos is the best city in Nigeria.</text><text xml:space="preserve" x="320" y="263" font-size="19" font-weight="800" fill="#a3361f" text-anchor="middle">OPINION — people can disagree</text></g></svg>