<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Average speed"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">60 km at 60 km/h → 1 h</text><text xml:space="preserve" x="320" y="115" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">60 km at 30 km/h → 2 h</text><text xml:space="preserve" x="320" y="185" font-size="26" font-weight="800" fill="#0b6e80" text-anchor="middle">average = 120 km ÷ 3 h = 40 km/h</text><text xml:space="preserve" x="320" y="250" font-size="22" font-weight="800" fill="#a3361f" text-anchor="middle">not (60 + 30) ÷ 2 = 45</text><text xml:space="preserve" x="320" y="290" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">total distance ÷ total time</text></g></svg>