<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Nouns with no plural"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="65" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">These nouns have no plural:</text><text xml:space="preserve" x="320" y="110" font-size="24" font-weight="800" fill="#0b6e80" text-anchor="middle">furniture · luggage · advice</text><text xml:space="preserve" x="320" y="150" font-size="24" font-weight="800" fill="#0b6e80" text-anchor="middle">information · equipment · news</text><text xml:space="preserve" x="320" y="220" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">✗ two furnitures → ✓ two pieces of furniture</text><text xml:space="preserve" x="320" y="265" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">✗ an advice → ✓ a piece of advice</text></g></svg>