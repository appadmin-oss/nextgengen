<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Hooks inside the words"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="90" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">tHERE has HERE in it — a place</text><text xml:space="preserve" x="320" y="150" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">thEIR: &#x27;I&#x27; own it — it belongs</text><text xml:space="preserve" x="320" y="210" font-size="22" font-weight="800" fill="#a3361f" text-anchor="middle">they&#x27;RE: the apostrophe is the missing &#x27;a&#x27; of are</text></g></svg>