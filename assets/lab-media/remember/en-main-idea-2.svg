<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Keep the points, drop the rest"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="40" y="80" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓</text><text xml:space="preserve" x="70" y="80" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Exercise keeps the heart strong.</text><text xml:space="preserve" x="40" y="125" font-size="20" font-weight="800" fill="#a3361f" text-anchor="start">✗</text><text x="70" y="125" font-size="17" font-weight="700" fill="#a3361f" text-anchor="start" style="text-decoration:line-through">For example, my uncle jogs every morning in Ibadan.</text><text xml:space="preserve" x="40" y="170" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓</text><text xml:space="preserve" x="70" y="170" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">It also lowers stress.</text><text xml:space="preserve" x="40" y="215" font-size="20" font-weight="800" fill="#a3361f" text-anchor="start">✗</text><text x="70" y="215" font-size="17" font-weight="700" fill="#a3361f" text-anchor="start" style="text-decoration:line-through">As I said, the heart grows stronger.</text><text xml:space="preserve" x="320" y="285" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="middle">keep the points · drop examples and repeats</text></g></svg>