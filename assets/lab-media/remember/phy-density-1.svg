463.5,169.0" fill="#ef6b4d"/><text xml:space="preserve" x="486" y="175" font-size="18" font-weight="800" fill="#a3361f" text-anchor="start">W = 9.6 N</text><text xml:space="preserve" x="320" y="295" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">mass stays 6 kg everywhere — weight is W = mg</text></g></svg>