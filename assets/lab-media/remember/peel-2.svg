<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="An example"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="40" y="70" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">P  School uniforms save families money.</text><text xml:space="preserve" x="40" y="115" font-size="17" font-weight="700" fill="#0b6e80" text-anchor="start">E  A set costs less than a week of new clothes.</text><text xml:space="preserve" x="40" y="160" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">E  So parents spend less on keeping up with fashion.</text><text xml:space="preserve" x="40" y="205" font-size="17" font-weight="700" fill="#a3361f" text-anchor="start">L  This is one reason uniforms help every family.</text></g></svg>