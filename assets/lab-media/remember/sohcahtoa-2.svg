<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="SOH CAH TOA"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="40" y="90" width="175" height="110" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="127" y="140" font-size="32" font-weight="800" fill="#16233f" text-anchor="middle">SOH</text><text xml:space="preserve" x="127" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">sin = O ÷ H</text><rect x="235" y="90" width="175" height="110" rx="10" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="322" y="140" font-size="32" font-weight="800" fill="#16233f" text-anchor="middle">CAH</text><text xml:space="preserve" x="322" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">cos = A ÷ H</text><rect x="430" y="90" width="175" height="110" rx="10" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="517" y="140" font-size="32" font-weight="800" fill="#16233f" text-anchor="middle">TOA</text><text xml:space="preserve" x="517" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">tan = O ÷ A</text><text xml:space="preserve" x="320" y="260" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">pick the ratio that uses the two sides you know</text></g></svg>