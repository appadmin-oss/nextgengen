<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Multiply or divide"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="160" y="80" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">km</text><text xml:space="preserve" x="480" y="80" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">m</text><line x1="210" y1="70" x2="430" y2="70" stroke="#20b2c9" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="320" y="55" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="middle">× 1,000</text><text xml:space="preserve" x="320" y="125" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">2.5 km = 2.5 × 1,000 = 2,500 m</text><text xml:space="preserve" x="160" y="195" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">g</text><text xml:space="preserve" x="480" y="195" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">kg</text><line x1="210" y1="185" x2="430" y2="185" stroke="#ef6b4d" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="320" y="170" font-size="18" font-weight="800" fill="#a3361f" text-anchor="middle">÷ 1,000</text><text xml:space="preserve" x="320" y="240" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">750 g = 750 ÷ 1,000 = 0.75 kg</text><text xml:space="preserve" x="320" y="290" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">to a smaller unit the number grows; to a bigger unit it shrinks</text></g></svg>