<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Same fact, two ways"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="110" y="90" width="180" height="90" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="200" y="145" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">2³ = 8</text><line x1="300" y1="135" x2="340" y2="135" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="340" y1="145" x2="300" y2="145" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="350" y="90" width="180" height="90" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="440" y="145" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">log₂ 8 = 3</text><text xml:space="preserve" x="320" y="250" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">base stays the base · the answer of a log is a power</text></g></svg>