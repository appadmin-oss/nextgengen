<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="The digit-sum test"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">2,145 → 2 + 1 + 4 + 5 = 12</text><text xml:space="preserve" x="320" y="120" font-size="18" font-weight="700" fill="#0b6e80" text-anchor="middle">12 is in the 3 times table, so 3 divides 2,145</text><text xml:space="preserve" x="320" y="175" font-size="18" font-weight="700" fill="#16233f" text-anchor="middle">÷ 9: the digit sum is in the 9 times table</text><text xml:space="preserve" x="320" y="235" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">÷ 2: last digit even   ÷ 5: ends in 0 or 5</text><text xml:space="preserve" x="320" y="270" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">÷ 10: ends in 0</text></g></svg>