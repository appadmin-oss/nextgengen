<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Real and likely"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="90" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">Zero: If you heat ice, it melts.</text><text xml:space="preserve" x="320" y="125" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">always true: present + present</text><text xml:space="preserve" x="320" y="190" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">First: If it rains, I will stay home.</text><text xml:space="preserve" x="320" y="225" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">likely future: present + will</text></g></svg>