<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Give + up"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="152" y="96" width="83" height="48" rx="6" fill="#d9f2f6" stroke="#d9f2f6" stroke-width="1.2"/><text xml:space="preserve" x="193.5" y="132" font-size="30" font-weight="700" fill="#16233f" text-anchor="middle">give</text><text xml:space="preserve" x="265.0" y="132" font-size="30" font-weight="700" fill="#16233f" text-anchor="middle">+</text><rect x="295" y="96" width="49" height="48" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text xml:space="preserve" x="319.5" y="132" font-size="30" font-weight="700" fill="#16233f" text-anchor="middle">up</text><text xml:space="preserve" x="374.0" y="132" font-size="30" font-weight="700" fill="#16233f" text-anchor="middle">=</text><rect x="404" y="96" width="83" height="48" rx="6" fill="#e3f1e6" stroke="#e3f1e6" stroke-width="1.2"/><text xml:space="preserve" x="445.5" y="132" font-size="30" font-weight="700" fill="#16233f" text-anchor="middle">stop</text><text xml:space="preserve" x="320" y="215" font-size="21" font-weight="800" fill="#16233f" text-anchor="middle">He gave up smoking = he stopped smoking.</text><text xml:space="preserve" x="320" y="265" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">the small word changes what the verb means</text></g></svg>