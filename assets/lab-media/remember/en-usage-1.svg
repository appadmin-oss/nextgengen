<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Everyday errors"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="300" y="70" font-size="20" font-weight="800" fill="#a3361f" text-anchor="end">✗ Borrow me your pen.</text><line x1="312" y1="63" x2="348" y2="63" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="360" y="70" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓ Lend me your pen.</text><text xml:space="preserve" x="320" y="100" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">lend = give for a while · borrow = take</text><text xml:space="preserve" x="300" y="148" font-size="20" font-weight="800" fill="#a3361f" text-anchor="end">✗ Off the light.</text><line x1="312" y1="141" x2="348" y2="141" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="360" y="148" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓ Switch off the light.</text><text xml:space="preserve" x="320" y="178" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">&#x27;off&#x27; is not a verb</text><text xml:space="preserve" x="300" y="226" font-size="20" font-weight="800" fill="#a3361f" text-anchor="end">✗ I am having two brothers.</text><line x1="312" y1="219" x2="348" y2="219" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="360" y="226" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓ I have two brothers.</text><text xml:space="preserve" x="320" y="256" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">&#x27;have&#x27; meaning own takes no -ing</text></g></svg>