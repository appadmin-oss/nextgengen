t-weight="700" fill="#16233f" text-anchor="start">W = 50 N × 2 m</text><text xml:space="preserve" x="370" y="210" font-size="26" font-weight="800" fill="#0b6e80" text-anchor="start">= 100 J</text><text xml:space="preserve" x="370" y="250" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">(distance moved along the force)</text></g></svg>