<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="A lever trades distance for force"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="70" y1="160" x2="570" y2="160" stroke="#16233f" stroke-width="7" stroke-linecap="round"/><polygon points="180,164 162,198 198,198" fill="#f3f5fa" stroke="#16233f" stroke-width="2" stroke-linejoin="round"/><rect x="72.0" y="102.0" width="56.0" height="54.0" rx="4" fill="#aab2c5" stroke="#16233f" stroke-width="2"/><text xml:space="preserve" x="100" y="92" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">load 400 N</text><line x1="500" y1="70" x2="500.0" y2="141.0" stroke="#ef6b4d" stroke-width="4" stroke-linecap="round"/><polygon points="500.0,154.0 506.5,141.0 493.5,141.0" fill="#ef6b4d"/><text xml:space="preserve" x="515" y="98" font-size="16" font-weight="800" fill="#a3361f" text-anchor="start">effort 125 N</text><line x1="139.0" y1="214.0" x2="110.0" y2="214.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="100.0,214.0 110.0,219.0 110.0,209.0" fill="#3d4560"/><line x1="139.0" y1="214.0" x2="168.0" y2="214.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="178.0,214.0 168.0,209.0 168.0,219.0" fill="#3d4560"/><text xml:space="preserve" x="139" y="238" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">0.5 m</text><line x1="341.0" y1="214.0" x2="192.0" y2="214.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="182.0,214.0 192.0,219.0 192.0,209.0" fill="#3d4560"/><line x1="341.0" y1="214.0" x2="490.0" y2="214.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="500.0,214.0 490.0,209.0 490.0,219.0" fill="#3d4560"/><text xml:space="preserve" x="341" y="238" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">2 m</text><text xml:space="preserve" x="320" y="274" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">MA = 400 ÷ 125 = 3.2    VR = 2 ÷ 0.5 = 4</text><text xml:space="preserve" x="320" y="310" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="middle">efficiency = MA ÷ VR × 100% = 80%</text></g></svg>