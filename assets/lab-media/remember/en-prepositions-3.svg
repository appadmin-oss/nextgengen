<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Fixed partners"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="60" y="80" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">We discussed the plan.</text><text xml:space="preserve" x="590" y="80" font-size="16" font-weight="700" fill="#a3361f" text-anchor="end">not &#x27;discussed about&#x27;</text><text xml:space="preserve" x="60" y="135" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">She is good at maths.</text><text xml:space="preserve" x="590" y="135" font-size="16" font-weight="700" fill="#a3361f" text-anchor="end">not &#x27;good in&#x27;</text><text xml:space="preserve" x="60" y="190" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">He entered the hall.</text><text xml:space="preserve" x="590" y="190" font-size="16" font-weight="700" fill="#a3361f" text-anchor="end">not &#x27;entered into&#x27;</text><text xml:space="preserve" x="60" y="245" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Congratulations on your result!</text><text xml:space="preserve" x="590" y="245" font-size="16" font-weight="700" fill="#a3361f" text-anchor="end">not &#x27;for&#x27;</text><text xml:space="preserve" x="320" y="300" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">some verbs take a fixed preposition — some take none</text></g></svg>