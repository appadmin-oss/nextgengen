<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Splitting a vector into parts"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="140" y1="250" x2="388.0" y2="250.0" stroke="#20b2c9" stroke-width="3" stroke-linecap="round"/><polygon points="400.0,250.0 388.0,244.0 388.0,256.0" fill="#20b2c9"/><line x1="400" y1="250" x2="400.0" y2="112.0" stroke="#ef6b4d" stroke-width="3" stroke-linecap="round"/><polygon points="400.0,100.0 394.0,112.0 406.0,112.0" fill="#ef6b4d"/><line x1="140" y1="250" x2="388.7395873813682" y2="106.4963918953645" stroke="#16233f" stroke-width="4.5" stroke-linecap="round"/><polygon points="400.0,100.0 385.5,100.9 392.0,112.1" fill="#16233f"/><path d="M200 250 A60 60 0 0 0 192 220" fill="none" stroke="#3d4560" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text xml:space="preserve" x="208" y="240" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">30°</text><text xml:space="preserve" x="255" y="158" font-size="19" font-weight="800" fill="#16233f" text-anchor="end">F = 10 N</text><text xml:space="preserve" x="270" y="282" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="middle">F cos 30° = 8.7 N</text><text xml:space="preserve" x="415" y="180" font-size="18" font-weight="800" fill="#a3361f" text-anchor="start">F sin 30° = 5 N</text></g></svg>