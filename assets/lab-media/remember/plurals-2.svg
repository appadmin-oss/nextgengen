<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Hissing endings and -y"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="90" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">box → boxes   church → churches</text><text xml:space="preserve" x="320" y="130" font-size="18" font-weight="700" fill="#0b6e80" text-anchor="middle">-s, -x, -ch, -sh: add -es</text><text xml:space="preserve" x="320" y="200" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">baby → babies   but   boy → boys</text><text xml:space="preserve" x="320" y="240" font-size="18" font-weight="700" fill="#a3361f" text-anchor="middle">consonant + y → -ies; vowel + y → -s</text></g></svg>