<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Two ends of a line"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="320" y1="180" x2="70" y2="180" stroke="#16233f" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><line x1="320" y1="180" x2="570" y2="180" stroke="#16233f" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><circle cx="320" cy="180" r="7" fill="#16233f" stroke="#16233f" stroke-width="1.5"/><rect x="50" y="80" width="220" height="70" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="160" y="123" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">small · little · tiny</text><rect x="370" y="80" width="220" height="70" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="480" y="123" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">big · large · huge</text><text xml:space="preserve" x="160" y="222" font-size="16" font-weight="700" fill="#0b6e80" text-anchor="middle">synonyms: same meaning</text><text xml:space="preserve" x="480" y="222" font-size="16" font-weight="700" fill="#a3361f" text-anchor="middle">synonyms: same meaning</text><text xml:space="preserve" x="320" y="285" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">small and big sit at opposite ends: antonyms</text></g></svg>