<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Negative, then positive"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="97" y="128" width="313" height="46" rx="6" fill="#fde3dc" stroke="#fde3dc" stroke-width="1.2"/><text xml:space="preserve" x="253.5" y="162" font-size="28" font-weight="700" fill="#16233f" text-anchor="middle">You don&#x27;t eat pork,</text><rect x="418" y="128" width="125" height="46" rx="6" fill="#d9f2f6" stroke="#d9f2f6" stroke-width="1.2"/><text xml:space="preserve" x="480.5" y="162" font-size="28" font-weight="700" fill="#16233f" text-anchor="middle">do you?</text><text xml:space="preserve" x="253" y="92" font-size="18" font-weight="800" fill="#a3361f" text-anchor="middle">− negative</text><text xml:space="preserve" x="480" y="92" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="middle">+ positive</text><text xml:space="preserve" x="320" y="250" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">a negative sentence takes a positive tag</text></g></svg>