<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Electrical power"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><circle cx="110" cy="160" r="30" fill="#f5b026" stroke="#16233f" stroke-width="2"/><line x1="89.0" y1="139.0" x2="131.0" y2="181.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><line x1="89.0" y1="181.0" x2="131.0" y2="139.0" stroke="#16233f" stroke-width="2" stroke-linecap="round"/><line x1="145.0" y1="160.0" x2="152.0" y2="160.0" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="134.74873734152916" y1="184.74873734152916" x2="139.698484809835" y2="189.698484809835" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="110.0" y1="195.0" x2="110.0" y2="202.0" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="85.25126265847084" y1="184.74873734152916" x2="80.301515190165" y2="189.698484809835" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="75.0" y1="160.0" x2="68.0" y2="160.0" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="85.25126265847084" y1="135.25126265847084" x2="80.30151519016499" y2="130.301515190165" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="110.0" y1="125.0" x2="109.99999999999999" y2="118.0" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><line x1="134.74873734152916" y1="135.25126265847084" x2="139.69848480983498" y2="130.301515190165" stroke="#f5b026" stroke-width="3" stroke-linecap="round"/><text xml:space="preserve" x="200" y="80" font-size="26" font-weight="800" fill="#16233f" text-anchor="start">P = I V = I²R = V² ÷ R</text><text xml:space="preserve" x="200" y="140" font-size="18" font-weight="700" fill="#3d4560" text-anchor="start">a 240 V lamp taking 0.25 A:</text><text xml:space="preserve" x="200" y="180" font-size="24" font-weight="800" fill="#0b6e80" text-anchor="start">P = 0.25 × 240 = 60 W</text><text xml:space="preserve" x="200" y="240" font-size="18" font-weight="700" fill="#3d4560" text-anchor="start">60 W = 60 joules every second</text></g></svg>