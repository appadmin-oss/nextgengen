<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 465" width="640" height="465" role="img" aria-labelledby="t d"><title id="t">Reorder level</title><desc id="d">Stock falls by 10 a day from 100. At the reorder level of 40 an order goes in; it arrives 3 days later as stock reaches the safety stock of 10. Reorder level = 10 × 3 + 10 = 40.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="465" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">When stock falls to the reorder level, order</text><line x1="70.0" y1="320.0" x2="610.0" y2="320.0" stroke="#3d4560" stroke-width="2"/><line x1="70.0" y1="80.0" x2="70.0" y2="320.0" stroke="#3d4560" stroke-width="2"/><text x="60.0" y="326.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">0</text><text x="60.0" y="230.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">40</text><text x="60.0" y="86.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">100</text><path d="M70.0 80.0 L373.8 296.0 L373.8 80.0 L610.0 248.0" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="70.0" y1="224.0" x2="610.0" y2="224.0" stroke="#9c3119" stroke-width="2" stroke-dasharray="7 5"/><text x="515.5" y="216.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">reorder level 40</text><rect x="70.0" y="296.0" width="540.0" height="24.0" rx="0" fill="#fdf0d2" stroke="none" stroke-width="1"/><text x="604.0" y="306.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="end">safety stock 10</text><line x1="272.5" y1="224.0" x2="272.5" y2="326.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="3 3"/><line x1="373.8" y1="80.0" x2="373.8" y2="326.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="3 3"/><text x="272.5" y="344.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">order</text><text x="373.8" y="344.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">arrives</text><text x="323.1" y="368.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">lead time 3 days</text><text x="24.0" y="404.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Reorder level = daily usage × lead time + safety stock = 10 × 3 + 10 =</text><text x="24.0" y="425.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">40. Status: =IF(E2&lt;=F2, &quot;REORDER&quot;, &quot;OK&quot;).</text><text x="624.0" y="455.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>