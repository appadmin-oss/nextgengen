<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 353" width="640" height="353" role="img" aria-labelledby="t d"><title id="t">Pitch deck sequence</title><desc id="d">A ten-slide pitch: title, problem, solution, market, business model, traction, competition, financials, team, and the ask.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="353" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A ten-slide pitch tells one story</text><rect x="24.0" y="60.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="31.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">1</text><text x="31.0" y="110.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Title</text><rect x="144.0" y="60.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="151.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">2</text><text x="151.0" y="110.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Problem</text><rect x="264.0" y="60.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="271.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">3</text><text x="271.0" y="110.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Solution</text><rect x="384.0" y="60.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="391.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">4</text><text x="391.0" y="110.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Market</text><rect x="504.0" y="60.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="511.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">5</text><text x="511.0" y="110.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Business</text><text x="511.0" y="131.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">model</text><rect x="24.0" y="164.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="31.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">6</text><text x="31.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Traction</text><rect x="144.0" y="164.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="151.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">7</text><text x="151.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Competition</text><rect x="264.0" y="164.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="271.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">8</text><text x="271.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Financials</text><rect x="384.0" y="164.0" width="114.0" height="84.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="391.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">9</text><text x="391.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Team</text><rect x="504.0" y="164.0" width="114.0" height="84.0" rx="6" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="511.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">10</text><text x="511.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The ask</text><text x="24.0" y="292.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">5–10 minutes. A stakeholder cares most about impact and safety; an</text><text x="24.0" y="313.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">investor about return and growth — shift the weight, not the facts.</text><text x="624.0" y="343.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>