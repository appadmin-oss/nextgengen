<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 465" width="640" height="465" role="img" aria-labelledby="t d"><title id="t">Procurement and separation of duties</title><desc id="d">Seven procurement steps — request, approve, three quotes, select and record why, pay and keep the receipt, check delivery, record in the register — each done by a different role.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="465" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Procurement in seven steps, by more than one person</text><circle cx="40.0" cy="78.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="84.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="66.0" y="60.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="84.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Request</text><rect x="390.0" y="60.0" width="226.0" height="36.0" rx="6" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="84.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Requester</text><circle cx="40.0" cy="124.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="130.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="66.0" y="106.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="130.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Approve</text><rect x="390.0" y="106.0" width="226.0" height="36.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="130.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Manager</text><circle cx="40.0" cy="170.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="176.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="66.0" y="152.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="176.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">3 quotes</text><rect x="390.0" y="152.0" width="226.0" height="36.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="176.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Buyer</text><circle cx="40.0" cy="216.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="66.0" y="198.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="222.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Select, record why</text><rect x="390.0" y="198.0" width="226.0" height="36.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="222.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Buyer</text><circle cx="40.0" cy="262.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="268.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">5</text><rect x="66.0" y="244.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="268.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Pay, keep receipt</text><rect x="390.0" y="244.0" width="226.0" height="36.0" rx="6" fill="#eee6f6" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="268.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Accounts</text><circle cx="40.0" cy="308.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">6</text><rect x="66.0" y="290.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="314.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Check delivery</text><rect x="390.0" y="290.0" width="226.0" height="36.0" rx="6" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="314.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Not the buyer</text><circle cx="40.0" cy="354.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="360.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">7</text><rect x="66.0" y="336.0" width="310.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Record in register</text><rect x="390.0" y="336.0" width="226.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="402.0" y="360.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Store</text><text x="24.0" y="404.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Separation of duties: the person who requests, approves, pays and</text><text x="24.0" y="425.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">receives should not all be one person.</text><text x="624.0" y="455.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>