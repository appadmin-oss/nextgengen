<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 467" width="640" height="467" role="img" aria-labelledby="t d"><title id="t">Scenario projections</title><desc id="d">Cumulative profit over twelve months for three scenarios: optimistic recovers its start-up costs around month 6, expected around month 9, and pessimistic never does within the year.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="467" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three scenarios: when does cumulative profit turn</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">positive?</text><line x1="84.0" y1="96.0" x2="84.0" y2="346.0" stroke="#3d4560" stroke-width="2"/><line x1="84.0" y1="233.5" x2="610.0" y2="233.5" stroke="#3d4560" stroke-width="2"/><text x="76.0" y="239.5" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">₦0</text><text x="76.0" y="346.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">start-up</text><line x1="84.0" y1="336.0" x2="610.0" y2="131.0" stroke="#1d6b30" stroke-width="3"/><text x="606.0" y="121.0" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end">Optimistic</text><circle cx="347.0" cy="233.5" r="6.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="84.0" y1="336.0" x2="610.0" y2="199.3" stroke="#0b6274" stroke-width="3"/><text x="606.0" y="189.3" font-size="16" font-weight="700" fill="#0b6274" text-anchor="end">Expected</text><circle cx="478.5" cy="233.5" r="6.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="84.0" y1="336.0" x2="610.0" y2="274.5" stroke="#9c3119" stroke-width="3"/><text x="606.0" y="264.5" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">Pessimistic</text><text x="84.0" y="370.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">month 0</text><text x="347.0" y="370.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">month 6</text><text x="610.0" y="370.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">month 12</text><text x="24.0" y="406.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">If the plan only works in the optimistic case, it is risky. And cash is not</text><text x="24.0" y="427.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">profit: customers pay late, stock is bought early.</text><text x="624.0" y="457.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>