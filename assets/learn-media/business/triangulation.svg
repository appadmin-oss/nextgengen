<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 421" width="640" height="421" role="img" aria-labelledby="t d"><title id="t">Triangulation</title><desc id="d">Four methods — survey, stopwatch observation, interviews and existing records — point at one finding; where the survey and the 38-minute stopwatch measurement disagree, trust the measurement and investigate.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="421" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Triangulate: do different methods agree?</text><rect x="244.0" y="176.0" width="152.0" height="68.0" rx="10" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="204.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Finding</text><text x="320.0" y="228.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">with its strength</text><rect x="25.0" y="86.0" width="180.0" height="64.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="115.0" y="111.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Survey</text><text x="115.0" y="136.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">“the queue is short”</text><line x1="205.0" y1="118.0" x2="240.0" y2="190.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="435.0" y="86.0" width="180.0" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="525.0" y="108.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Stopwatch</text><text x="525.0" y="133.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">38 min on 4</text><text x="525.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">Saturdays</text><line x1="435.0" y1="118.0" x2="400.0" y2="190.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="25.0" y="270.0" width="180.0" height="64.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="115.0" y="295.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Interviews</text><text x="115.0" y="320.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">6 parents</text><line x1="205.0" y1="302.0" x2="240.0" y2="230.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="435.0" y="270.0" width="180.0" height="64.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="525.0" y="295.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Records</text><text x="525.0" y="320.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">late-arrival log</text><line x1="435.0" y1="302.0" x2="400.0" y2="230.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="24.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">When the survey says “short” and the stopwatch says 38 minutes,</text><text x="24.0" y="381.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">trust the measurement and find out why people answered as they did.</text><text x="624.0" y="411.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>