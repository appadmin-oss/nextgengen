<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 321" width="640" height="321" role="img" aria-labelledby="t d"><title id="t">An inventory register with formulas</title><desc id="d">An inventory register: stock value in column E is the formula =C2*D2, filled down so row 3 reads =C3*D3, with =SUM(E2:E16) as the total.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="321" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Stock value by formula, filled down — never typed</text><rect x="24.0" y="60.0" width="44.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><rect x="68.0" y="60.0" width="170.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="76.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">A Product</text><rect x="238.0" y="60.0" width="90.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="246.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">C Qty</text><rect x="328.0" y="60.0" width="128.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="336.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">D Price ₦</text><rect x="456.0" y="60.0" width="160.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="464.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">E Value ₦</text><rect x="24.0" y="94.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">2</text><rect x="68.0" y="94.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="76.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Rice 50kg</text><rect x="238.0" y="94.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="246.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">12</text><rect x="328.0" y="94.0" width="128.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="336.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">78,000</text><rect x="456.0" y="94.0" width="160.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="464.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">=C2*D2</text><rect x="24.0" y="128.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">3</text><rect x="68.0" y="128.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="76.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Beans 50kg</text><rect x="238.0" y="128.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="246.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">8</text><rect x="328.0" y="128.0" width="128.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="336.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">65,000</text><rect x="456.0" y="128.0" width="160.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="464.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">=C3*D3</text><rect x="24.0" y="162.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">4</text><rect x="68.0" y="162.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="76.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Oil 25L</text><rect x="238.0" y="162.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="246.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">10</text><rect x="328.0" y="162.0" width="128.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="336.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">42,000</text><rect x="456.0" y="162.0" width="160.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="464.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">=C4*D4</text><rect x="24.0" y="196.0" width="44.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="219.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">17</text><rect x="68.0" y="196.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="76.0" y="219.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Total</text><rect x="238.0" y="196.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="328.0" y="196.0" width="128.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="456.0" y="196.0" width="160.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="464.0" y="219.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">=SUM(E2:E16)</text><line x1="590.0" y1="114.0" x2="590.0" y2="178.0" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="24.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Type =C2*D2 once, then drag the fill handle down: each row&#x27;s formula</text><text x="24.0" y="281.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">points at its own row. Freeze row 1 so the headers stay visible.</text><text x="624.0" y="311.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>