<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" width="640" height="345" role="img" aria-labelledby="t d"><title id="t">Planning backwards from a deadline</title><desc id="d">A timeline worked backwards from the 28 March event: invitations by 14 March, venue confirmed by 7 March, budget approved by 3 March.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="345" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Plan backwards from the event date</text><line x1="40.0" y1="120.0" x2="610.0" y2="120.0" stroke="#3d4560" stroke-width="3"/><circle cx="60.0" cy="120.0" r="11.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="60.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3 Mar</text><text x="60.0" y="156.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Budget</text><text x="60.0" y="177.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">approved</text><circle cx="220.0" cy="120.0" r="11.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="220.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">7 Mar</text><text x="220.0" y="156.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Venue</text><text x="220.0" y="177.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">confirmed</text><circle cx="380.0" cy="120.0" r="11.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="380.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">14 Mar</text><text x="380.0" y="156.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Invitations sent</text><circle cx="560.0" cy="120.0" r="11.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="560.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">28 Mar</text><text x="560.0" y="156.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Event</text><line x1="540.0" y1="216.0" x2="80.0" y2="216.0" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="310.0" y="242.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle">work out each date from the one after it</text><text x="24.0" y="284.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Each date becomes a calendar entry with its owner: all-day events for</text><text x="24.0" y="305.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">deadlines, reminders a few days before, 30 minutes before meetings.</text><text x="624.0" y="335.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>