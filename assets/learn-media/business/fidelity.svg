<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 307" width="640" height="307" role="img" aria-labelledby="t d"><title id="t">Prototype fidelity</title><desc id="d">A scale from low fidelity (paper sketches: fast, cheap, invites criticism, tests the big idea) to high fidelity (looks real: slower, people hold back, tests details).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="307" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Prototype fidelity: start low, rise as the design settles</text><defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#dff3f7"/><stop offset="1" stop-color="#fdf0d2"/></linearGradient></defs><rect x="24.0" y="60.0" width="592.0" height="40.0" rx="20" fill="url(#fg)" stroke="#16233f" stroke-width="1"/><text x="40.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Low fidelity</text><text x="600.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">High fidelity</text><rect x="24.0" y="120.0" width="288.0" height="147.0" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="38.0" y="150.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Paper sketch, rough slide</text><circle cx="44.0" cy="173.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="178.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Fast and cheap</text><circle cx="44.0" cy="202.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="207.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">People feel free to criticise</text><circle cx="44.0" cy="231.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="236.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tests the big idea</text><rect x="328.0" y="120.0" width="288.0" height="147.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="342.0" y="150.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Looks almost real</text><circle cx="348.0" cy="173.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="178.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Slower to make</text><circle cx="348.0" cy="202.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="207.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">People hold back criticism</text><circle cx="348.0" cy="231.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="236.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tests the details</text><text x="624.0" y="297.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>