<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 343" width="640" height="343" role="img" aria-labelledby="t d"><title id="t">Verifying hypotheses</title><desc id="d">Each hypothesis is checked by asking what would prove it wrong and looking for that evidence, then marked Supported, Contradicted or Untested; the riskiest are tested first.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="343" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">An AI can draft hypotheses; only evidence can sort</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">them</text><rect x="24.0" y="86.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="114.0" y="129.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Hypothesis</text><text x="114.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">with a number in it</text><line x1="207.0" y1="136.0" x2="227.0" y2="136.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230.0" y="86.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="131.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">What would prove</text><text x="320.0" y="152.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">it wrong?</text><line x1="413.0" y1="136.0" x2="433.0" y2="136.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="436.0" y="86.0" width="180.0" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="526.0" y="108.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Look for that</text><text x="526.0" y="129.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">evidence</text><text x="526.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">your survey,</text><text x="526.0" y="175.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">interviews, prices</text><rect x="24.0" y="202.0" width="186.0" height="48.0" rx="8" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25"/><text x="117.0" y="232.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Supported</text><rect x="226.0" y="202.0" width="186.0" height="48.0" rx="8" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="319.0" y="232.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Contradicted</text><rect x="428.0" y="202.0" width="186.0" height="48.0" rx="8" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="521.0" y="232.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Untested</text><text x="24.0" y="282.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Test the riskiest first: the one that would kill the business if it were</text><text x="24.0" y="303.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">wrong. Treat every statistic the assistant gives as unverified.</text><text x="624.0" y="333.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>