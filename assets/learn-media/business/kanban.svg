<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 407" width="640" height="407" role="img" aria-labelledby="t d"><title id="t">Kanban board</title><desc id="d">A Trello board with three lists — To do, Doing, Done — and one card per task with its owner; few cards in Doing at once.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="407" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A Kanban board: cards move left to right</text><rect x="24.0" y="60.0" width="186.7" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="88.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">To do (2)</text><rect x="34.0" y="106.0" width="166.7" height="62.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="44.0" y="142.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Print 200 flyers</text><rect x="34.0" y="180.0" width="166.7" height="62.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="44.0" y="216.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Buy drinks</text><rect x="226.7" y="60.0" width="186.7" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="238.7" y="88.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Doing (1)</text><rect x="236.7" y="106.0" width="166.7" height="62.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="246.7" y="132.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Book the hall ·</text><text x="246.7" y="153.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tunde</text><rect x="429.3" y="60.0" width="186.7" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="441.3" y="88.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Done (2)</text><rect x="439.3" y="106.0" width="166.7" height="62.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="449.3" y="142.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Set the date</text><rect x="439.3" y="180.0" width="166.7" height="62.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="449.3" y="216.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Make the budget</text><line x1="60.0" y1="310.0" x2="580.0" y2="310.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="24.0" y="346.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Limit work in progress: too many cards in Doing means nothing</text><text x="24.0" y="367.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">finishes. One owner and a due date on every card.</text><text x="624.0" y="397.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>