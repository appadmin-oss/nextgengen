<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 535" width="640" height="535" role="img" aria-labelledby="t d"><title id="t">IF and SUMIF</title><desc id="d">IF tests paid against due and returns Paid or Owing. SUMIF(C:C,&quot;Transport&quot;,E:E) adds only the three Transport rows: 6,000 + 1,500 + 2,500 = ₦10,000.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="535" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">IF makes a decision; SUMIF adds only the rows that</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">match</text><polygon points="140,96 250,138 140,180 30,138" fill="#fdf0d2" stroke="#16233f" stroke-width="1.5"/><text x="140.0" y="134.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Paid C2</text><text x="140.0" y="154.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">≥ due D2?</text><line x1="250.0" y1="138.0" x2="300.0" y2="116.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="250.0" y1="138.0" x2="300.0" y2="166.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="304.0" y="96.0" width="120.0" height="36.0" rx="6" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25"/><text x="364.0" y="120.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">“Paid”</text><rect x="304.0" y="148.0" width="120.0" height="36.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="364.0" y="172.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">“Owing”</text><text x="440.0" y="120.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">yes</text><text x="440.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">no</text><text x="24.0" y="216.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start">=IF(C2&gt;=D2, &quot;Paid&quot;, &quot;Owing&quot;)</text><rect x="24.0" y="240.0" width="190.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="263.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">A Item</text><rect x="214.0" y="240.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="263.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">C Category</text><rect x="414.0" y="240.0" width="202.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="263.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">E Amount ₦</text><rect x="24.0" y="274.0" width="190.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="297.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Fuel</text><rect x="214.0" y="274.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="297.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Transport</text><rect x="414.0" y="274.0" width="202.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="297.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">6,000</text><rect x="24.0" y="308.0" width="190.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="331.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Eggs</text><rect x="214.0" y="308.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="331.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Stock</text><rect x="414.0" y="308.0" width="202.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="331.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">9,000</text><rect x="24.0" y="342.0" width="190.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="365.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Bus fare</text><rect x="214.0" y="342.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="365.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Transport</text><rect x="414.0" y="342.0" width="202.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="365.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">1,500</text><rect x="24.0" y="376.0" width="190.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="399.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Rent</text><rect x="214.0" y="376.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="399.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Rent</text><rect x="414.0" y="376.0" width="202.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="399.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">50,000</text><rect x="24.0" y="410.0" width="190.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="433.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Bike hire</text><rect x="214.0" y="410.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="433.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Transport</text><rect x="414.0" y="410.0" width="202.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="433.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">2,500</text><text x="24.0" y="474.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">=SUMIF(C:C, &quot;Transport&quot;, E:E) checks column C and adds column E</text><text x="24.0" y="495.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">where it matches: 6,000 + 1,500 + 2,500 = ₦10,000.</text><text x="624.0" y="525.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>