<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d"><title id="t">Coding open answers</title><desc id="d">Open answers are tagged with themes — cost, no one to ask, transport — and the themes are counted; one answer can carry two themes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="380" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Coding open answers: read, tag with themes, count</text><rect x="24.0" y="60.0" width="340.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="87.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">“Lessons cost too much for us”</text><rect x="24.0" y="112.0" width="340.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="139.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">“No one at home can help with maths”</text><rect x="24.0" y="164.0" width="340.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="191.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">“The fees and the bus fare”</text><rect x="24.0" y="216.0" width="340.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="243.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">“I can&#x27;t get there after school”</text><rect x="420.0" y="70.0" width="196.0" height="48.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><text x="434.0" y="100.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">cost: 2</text><line x1="366.0" y1="81.0" x2="418.0" y2="94.0" stroke="#3d4560" stroke-width="1.5"/><line x1="366.0" y1="185.0" x2="418.0" y2="94.0" stroke="#3d4560" stroke-width="1.5"/><rect x="420.0" y="136.0" width="196.0" height="48.0" rx="8" fill="#dff3f7" stroke="#16233f" stroke-width="1.25"/><text x="434.0" y="166.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">no one to ask: 1</text><line x1="366.0" y1="133.0" x2="418.0" y2="160.0" stroke="#3d4560" stroke-width="1.5"/><rect x="420.0" y="202.0" width="196.0" height="48.0" rx="8" fill="#fde5df" stroke="#16233f" stroke-width="1.25"/><text x="434.0" y="232.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">transport: 2</text><line x1="366.0" y1="185.0" x2="418.0" y2="226.0" stroke="#3d4560" stroke-width="1.5"/><line x1="366.0" y1="237.0" x2="418.0" y2="226.0" stroke="#3d4560" stroke-width="1.5"/><text x="24.0" y="298.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">One answer can carry two themes. Report the count and the base</text><text x="24.0" y="319.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">(“cost: 23 of 40, 58%”) and keep a quote that says it in people&#x27;s own</text><text x="24.0" y="340.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">words.</text><text x="624.0" y="370.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>