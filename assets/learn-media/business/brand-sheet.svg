<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">A brand sheet</title><desc id="d">A brand sheet: the logo, a palette with hex codes (main #1B5E20, accent #F5B026, text #16233F, white ground), one heading and one body font, three voice words, and a 4.5:1 contrast rule.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="400" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A one-page brand sheet keeps everyone consistent</text><rect x="24.0" y="60.0" width="592.0" height="300.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><circle cx="90.0" cy="130.0" r="40.0" fill="#1b5e20" stroke="none" stroke-width="1"/><text x="150.0" y="122.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Logo</text><text x="150.0" y="146.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">simple; works small, in one colour</text><rect x="44.0" y="188.0" width="120.0" height="44.0" rx="4" fill="#1b5e20" stroke="#16233f" stroke-width="1"/><text x="44.0" y="256.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Main #1B5E20</text><rect x="186.0" y="188.0" width="120.0" height="44.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="186.0" y="256.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Accent #F5B026</text><rect x="328.0" y="188.0" width="120.0" height="44.0" rx="4" fill="#16233f" stroke="#16233f" stroke-width="1"/><text x="328.0" y="256.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Text #16233F</text><rect x="470.0" y="188.0" width="120.0" height="44.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1"/><text x="470.0" y="256.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Ground #FFFFFF</text><text x="44.0" y="296.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Fonts: one for headings, one for body</text><text x="44.0" y="324.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Voice: friendly · clear · local</text><text x="44.0" y="348.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">Text on ground at least 4.5:1</text><text x="624.0" y="390.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>