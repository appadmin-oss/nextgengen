<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 321" width="640" height="321" role="img" aria-labelledby="t d"><title id="t">A running balance</title><desc id="d">A tracker whose balance column uses =F2+D3-E3: opening ₦20,000, plus ₦18,000 sales is ₦38,000, minus ₦9,000 eggs is ₦29,000, minus ₦2,500 transport is ₦26,500.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="321" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A running balance: each row starts from the row above</text><rect x="24.0" y="60.0" width="40.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><rect x="64.0" y="60.0" width="244.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="72.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Description</text><rect x="308.0" y="60.0" width="96.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="396.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">In ₦</text><rect x="404.0" y="60.0" width="90.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="486.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">Out ₦</text><rect x="494.0" y="60.0" width="122.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">Balance ₦</text><rect x="24.0" y="94.0" width="40.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="44.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">2</text><rect x="64.0" y="94.0" width="244.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="72.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Opening balance</text><rect x="308.0" y="94.0" width="96.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="404.0" y="94.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="494.0" y="94.0" width="122.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">20,000</text><rect x="24.0" y="128.0" width="40.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="44.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">3</text><rect x="64.0" y="128.0" width="244.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="72.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Sold 12 lunch packs</text><rect x="308.0" y="128.0" width="96.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="396.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">18,000</text><rect x="404.0" y="128.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="494.0" y="128.0" width="122.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">38,000</text><rect x="24.0" y="162.0" width="40.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="44.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">4</text><rect x="64.0" y="162.0" width="244.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="72.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Bought 2 crates of eggs</text><rect x="308.0" y="162.0" width="96.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="404.0" y="162.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="486.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">9,000</text><rect x="494.0" y="162.0" width="122.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">29,000</text><rect x="24.0" y="196.0" width="40.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="44.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">5</text><rect x="64.0" y="196.0" width="244.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="72.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Transport</text><rect x="308.0" y="196.0" width="96.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="404.0" y="196.0" width="90.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="486.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">2,500</text><rect x="494.0" y="196.0" width="122.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">26,500</text><text x="24.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">In F3: =F2+D3-E3, then fill down. Money in and money out stay in</text><text x="24.0" y="281.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">separate columns, never one column of minus signs.</text><text x="624.0" y="311.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>