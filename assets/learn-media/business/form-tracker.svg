<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 363" width="640" height="363" role="img" aria-labelledby="t d"><title id="t">From form to tracker</title><desc id="d">Form columns (timestamp, request) on the left; your tracking columns (status, owner, due) added to their right; each request moves New → In progress → Waiting → Done, and the requester is told.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="363" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Tracking columns go to the RIGHT of the form&#x27;s</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">columns</text><rect x="24.0" y="86.0" width="140.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Timestamp</text><rect x="164.0" y="86.0" width="130.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="172.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Request</text><rect x="294.0" y="86.0" width="110.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="302.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Status</text><rect x="404.0" y="86.0" width="96.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="412.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Owner</text><rect x="500.0" y="86.0" width="116.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="508.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Due</text><rect x="24.0" y="120.0" width="140.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">12/03 09:14</text><rect x="164.0" y="120.0" width="130.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="172.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Fan broken</text><rect x="294.0" y="120.0" width="110.0" height="34.0" rx="0" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="302.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Done</text><rect x="404.0" y="120.0" width="96.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="412.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ife</text><rect x="500.0" y="120.0" width="116.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="508.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">15/03</text><rect x="24.0" y="154.0" width="140.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">13/03 11:02</text><rect x="164.0" y="154.0" width="130.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="172.0" y="177.0" font-size="16