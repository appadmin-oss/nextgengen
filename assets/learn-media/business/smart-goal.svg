<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 424" width="640" height="424" role="img" aria-labelledby="t d"><title id="t">A SMART goal</title><desc id="d">The goal “Reduce average check-in time to under 15 minutes by the end of term” checked as SMART: specific, measurable against a 40-minute baseline, achievable, relevant, and time-bound.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="424" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A SMART goal, taken apart</text><rect x="24.0" y="60.0" width="592.0" height="60.0" rx="10" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="86.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">“Reduce average check-in time to under 15 minutes by the end of</text><text x="40.0" y="107.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">term.”</text><circle cx="44.0" cy="158.0" r="18.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="44.0" y="165.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">S</text><text x="74.0" y="164.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Specific</text><text x="200.0" y="164.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">check-in time, not “things”</text><circle cx="44.0" cy="208.0" r="18.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="44.0" y="215.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">M</text><text x="74.0" y="214.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Measurable</text><text x="200.0" y="214.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">minutes, against a 40-minute baseline</text><circle cx="44.0" cy="258.0" r="18.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="44.0" y="265.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">A</text><text x="74.0" y="264.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Achievable</text><text x="200.0" y="264.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">with the staff and money you have</text><circle cx="44.0" cy="308.0" r="18.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="44.0" y="315.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">R</text><text x="74.0" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Relevant</text><text x="200.0" y="314.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">it is the problem the sponsor approved</text><circle cx="44.0" cy="358.0" r="18.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="44.0" y="365.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">T</text><text x="74.0" y="364.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Time-bound</text><text x="200.0" y="364.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">by the end of term</text><text x="624.0" y="414.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>