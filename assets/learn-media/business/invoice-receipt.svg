<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="t d"><title id="t">From invoice to bank</title><desc id="d">A sales invoice creates accounts receivable (money owed to you); a receipt linked to that invoice moves it into the bank account, and Aged Receivables shows who still owes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="440" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A sale in accounting software: invoice, then receipt</text><rect x="64.0" y="60.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Sales invoice</text><text x="76.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Bill to the customer: who, what, price, due date.</text><circle cx="40.0" cy="93.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="99.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="129.0" x2="340.0" y2="147.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="151.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="177.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Accounts receivable</text><text x="76.0" y="203.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Unpaid invoice = money owed to you.</text><circle cx="40.0" cy="184.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="190.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="220.0" x2="340.0" y2="238.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="242.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="268.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Receipt</text><text x="76.0" y="294.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Money in, linked to the invoice it pays.</text><circle cx="40.0" cy="275.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="281.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="311.0" x2="340.0" y2="329.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="333.0" width="552.0" height="67.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="359.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Bank account</text><text x="76.0" y="385.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Balance updates; Aged Receivables shows who still owes.</text><circle cx="40.0" cy="366.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="372.5" font-size="16" font-weight=