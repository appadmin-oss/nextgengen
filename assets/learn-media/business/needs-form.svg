<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 607" width="640" height="607" role="img" aria-labelledby="t d"><title id="t">Needs-assessment form</title><desc id="d">A needs-assessment form in order: introduction, a screening question, behaviour questions, rating scales, then one or two open questions.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="607" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The shape of a needs-assessment form</text><rect x="64.0" y="60.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Introduction</text><text x="76.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Who you are, why you ask, how long, how answers are used.</text><circle cx="40.0" cy="93.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="99.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="129.0" x2="340.0" y2="147.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="151.0" width="552.0" height="88.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="177.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Screening question</text><text x="76.0" y="203.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Confirms they are in your target group; if not, thank them and</text><text x="76.0" y="224.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">end.</text><circle cx="40.0" cy="195.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="201.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="241.0" x2="340.0" y2="259.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="263.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="289.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Behaviour questions</text><text x="76.0" y="315.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“In the last month, how many times did you…?”</text><circle cx="40.0" cy="296.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="302.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="332.0" x2="340.0" y2="350.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="354.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="380.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Rating scales</text><text x="76.0" y="406.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">How serious is each problem?</text><circle cx="40.0" cy="387.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="393.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><line x1="340.0" y1="423.0" x2="340.0" y2="441.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="445.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="471.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">One or two open questions</text><text x="76.0" y="497.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“What is the hardest part of…?”</text><circle cx="40.0" cy="478.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="484.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">5</text><text x="24.0" y="542.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Under 10 questions, no personal data you do not need — and talk to at</text><text x="24.0" y="563.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">least five people in person as well.</text><text x="624.0" y="597.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>