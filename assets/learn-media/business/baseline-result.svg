<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 331" width="640" height="331" role="img" aria-labelledby="t d"><title id="t">Baseline, target and result</title><desc id="d">Average check-in time fell from a 38-minute baseline to 17 minutes in the pilot (−55%), just short of the 15-minute target.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="331" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Check-in time: baseline, target and pilot result</text><text x="24.0" y="98.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Baseline</text><rect x="150.0" y="76.0" width="418.0" height="34.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="578.0" y="100.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">38 min</text><text x="24.0" y="158.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Pilot result</text><rect x="150.0" y="136.0" width="187.0" height="34.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="347.0" y="160.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">17 min</text><text x="24.0" y="218.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Target</text><rect x="150.0" y="196.0" width="165.0" height="34.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="325.0" y="220.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">15 min</text><text x="24.0" y="270.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Change = 17 − 38 = −21 minutes (−55%). Nearly met. Two Saturdays is</text><text x="24.0" y="291.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">indicative, not conclusive: was attendance unusually low?</text><text x="624.0" y="321.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>