<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" width="640" height="496" role="img" aria-labelledby="t d"><title id="t">Break-even chart</title><desc id="d">Revenue (₦500 a unit) and total cost (₦60,000 fixed plus ₦200 a unit) cross at 200 units: below that is loss, above it profit.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="496" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Break-even is where revenue meets total cost</text><line x1="84.0" y1="330.0" x2="604.0" y2="330.0" stroke="#3d4560" stroke-width="2"/><line x1="84.0" y1="70.0" x2="84.0" y2="330.0" stroke="#3d4560" stroke-width="2"/><text x="76.0" y="336.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">₦0</text><text x="76.0" y="206.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">₦100k</text><text x="76.0" y="76.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">₦200k</text><text x="84.0" y="354.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">0</text><text x="344.0" y="354.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">200</text><text x="604.0" y="354.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">400</text><polygon points="84.0,252.0 344.0,200.0 84.0,330.0" fill="#fde5df"/><polygon points="344.0,200.0 604.0,70.0 604.0,148.0" fill="#e3f1e6"/><line x1="84.0" y1="330.0" x2="604.0" y2="70.0" stroke="#0b6274" stroke-width="3"/><line x1="84.0" y1="252.0" x2="604.0" y2="148.0" stroke="#9c3119" stroke-width="3"/><line x1="84.0" y1="252.0" x2="604.0" y2="252.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="344.0" cy="200.0" r="7.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="356.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">200 units</text><text x="474.0" y="101.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle">Revenue</text><text x="565.0" y="182.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle">Total cost</text><text x="604.0" y="276.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">Fixed costs ₦60k</text><text x="344.0" y="378.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Units sold a month</text><text x="24.0" y="414.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Price ₦500, variable cost ₦200: contribution ₦300.</text><text x="24.0" y="435.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">=ROUNDUP(60000/(500-200),0) = 200 units. Left of it is loss, right of</text><text x="24.0" y="456.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">it profit.</text><text x="624.0" y="486.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>