<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 518" width="640" height="518" role="img" aria-labelledby="t d"><title id="t">Gross and net profit</title><desc id="d">Sales ₦600,000 minus cost of sales ₦360,000 leaves gross profit ₦240,000 (40%); minus expenses ₦180,000 leaves net profit ₦60,000 (10%).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="518" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">From sales to net profit: ₦600,000 becomes ₦60,000</text><rect x="40.0" y="90.0" width="92.0" height="270.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="86.0" y="80.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦600k</text><text x="86.0" y="384.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Sales</text><line x1="132.0" y1="90.0" x2="156.0" y2="90.0" stroke="#3d4560" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="156.0" y="90.0" width="92.0" height="162.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="202.0" y="80.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦360k</text><text x="202.0" y="384.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Cost of</text><text x="202.0" y="405.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">sales</text><line x1="248.0" y1="252.0" x2="272.0" y2="252.0" stroke="#3d4560" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="272.0" y="252.0" width="92.0" height="108.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="318.0" y="242.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦240k</text><text x="318.0" y="384.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Gross profit</text><line x1="364.0" y1="252.0" x2="388.0" y2="252.0" stroke="#3d4560" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="388.0" y="252.0" width="92.0" height="81.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="434.0" y="242.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦180k</text><text x="434.0" y="384.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Expenses</text><line x1="480.0" y1="333.0" x2="504.0" y2="333.0" stroke="#3d4560" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="504.0" y="333.0" width="92.0" height="27.0" rx="0" fill="#1d6b30" stroke="#16233f" stroke-width="1"/><text x="550.0" y="323.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦60k</text><text x="550.0" y="384.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Net profit</text><line x1="30.0" y1="360.0" x2="616.0" y2="360.0" stroke="#3d4560" stroke-width="2"/><text x="318.0" y="282.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">40%</text><text x="24.0" y="436.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Gross margin = 240 ÷ 600 = 40%: the product makes money. Net</text><text x="24.0" y="457.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">margin = 60 ÷ 600 = 10%: what the whole business keeps after</text><text x="24.0" y="478.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">overheads.</text><text x="624.0" y="508.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>