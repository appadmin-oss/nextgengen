<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-labelledby="t d"><title id="t">SUM, AVERAGE, MIN and MAX</title><desc id="d">A week of sales in ₦ thousands (32, 28, 45, 0, 38, 90, 41): SUM ₦274k, AVERAGE ₦39k, MIN ₦0 on the closed day, MAX ₦90k on Saturday. One big day pulls the average up, so the median is often a better typical day.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="450" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Four functions, four questions about a column of sales</text><line x1="60.0" y1="290.0" x2="440.0" y2="290.0" stroke="#3d4560" stroke-width="2"/><rect x="70.0" y="219.6" width="36.0" height="70.4" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="88.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Mon</text><text x="88.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">32</text><rect x="122.0" y="228.4" width="36.0" height="61.6" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="140.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Tue</text><text x="140.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">28</text><rect x="174.0" y="191.0" width="36.0" height="99.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="192.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Wed</text><text x="192.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">45</text><rect x="226.0" y="290.0" width="36.0" height="0.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="244.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Thu</text><text x="244.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">0</text><rect x="278.0" y="206.4" width="36.0" height="83.6" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="296.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Fri</text><text x="296.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">38</text><rect x="330.0" y="92.0" width="36.0" height="198.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="348.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Sat</text><text x="348.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">90</text><rect x="382.0" y="199.8" width="36.0" height="90.2" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="400.0" y="312.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Sun</text><text x="400.0" y="334.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">41</text><line x1="60.0" y1="203.9" x2="434.0" y2="203.9" stroke="#9c3119" stroke-width="2" stroke-dasharray="6 4"/><rect x="454.0" y="74.0" width="162.0" height="50.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="464.0" y="96.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">=SUM ₦274k</text><text x="464.0" y="116.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the total</text><rect x="454.0" y="132.0" width="162.0" height="50.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="464.0" y="154.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">=AVERAGE ₦39k</text><text x="464.0" y="174.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">a typical day?</text><rect x="454.0" y="190.0" width="162.0" height="50.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="464.0" y="212.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">=MIN ₦0</text><text x="464.0" y="232.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the worst day</text><rect x="454.0" y="248.0" width="162.0" height="50.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="464.0" y="270.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">=MAX ₦90k</text><text x="464.0" y="290.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the best day</text><text x="70.0" y="64.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Daily sales, ₦ thousands</text><text x="24.0" y="368.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The dashed line is the average (₦39k). One big Saturday pulls it up;</text><text x="24.0" y="389.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">=MEDIAN(...) gives a better “typical day”. A zero is a fact; a blank is a</text><text x="24.0" y="410.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">missing record.</text><text x="624.0" y="440.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>