<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" width="640" height="375" role="img" aria-labelledby="t d"><title id="t">A rating scale</title><desc id="d">A behaviour-based question — “Submits the attendance report by Monday 10am” — rated on one scale anchored 1 Rarely, 3 Usually, 5 Always, with a required example.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="375" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Rate behaviour on one scale, with an example</text><rect x="24.0" y="60.0" width="592.0" height="60.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="96.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">“Submits the attendance report by Monday 10am”</text><circle cx="60.0" cy="162.0" r="20.0" fill="#ffffff" stroke="#16233f" stroke-width="1.5"/><text x="60.0" y="168.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="60.0" y="208.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Rarely</text><circle cx="188.0" cy="162.0" r="20.0" fill="#ffffff" stroke="#16233f" stroke-width="1.5"/><text x="188.0" y="168.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><circle cx="316.0" cy="162.0" r="20.0" fill="#ffffff" stroke="#16233f" stroke-width="1.5"/><text x="316.0" y="168.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="316.0" y="208.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Usually</text><circle cx="444.0" cy="162.0" r="20.0" fill="#fdf0d2" stroke="#16233f" stroke-width="1.5"/><text x="444.0" y="168.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><circle cx="572.0" cy="162.0" r="20.0" fill="#ffffff" stroke="#16233f" stroke-width="1.5"/><text x="572.0" y="168.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">5</text><text x="572.0" y="208.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Always</text><rect x="24.0" y="232.0" width="592.0" height="50.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="262.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Example: “Late twice this term, on both rainy Mondays.”</text><text x="24.0" y="314.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Not “Is a responsible person” — that is personality. The same anchored</text><text x="24.0" y="335.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">scale for every question; ratings without examples are opinions.</text><text x="624.0" y="365.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>