<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 499" width="640" height="499" role="img" aria-labelledby="t d"><title id="t">Operating rhythm</title><desc id="d">A routine linking the tools: owners move Trello cards daily, the lead updates the Sheets tracker on Friday, the team reviews the dashboard on Monday, and a monthly report goes to management.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="499" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">An operating rhythm: who updates what, when</text><circle cx="320.0" cy="257.5" r="150.0" fill="none" stroke="#f3f5fa" stroke-width="18"/><path d="M405.3 134.1 A150 150 0 0 1 460.7 205.6" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M460.7 309.4 A150 150 0 0 1 405.3 380.9" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M234.7 380.9 A150 150 0 0 1 179.3 309.4" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M179.3 205.6 A150 150 0 0 1 234.7 134.1" fill="none" stroke="#3d45