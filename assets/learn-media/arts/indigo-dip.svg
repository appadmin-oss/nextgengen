<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" width="640" height="468" role="img" aria-labelledby="t d"><title id="t">The indigo dip</title><desc id="d">In a healthy reduced vat the indigo is yellow-green; lifted out, the cloth turns green and then blue within a minute or two as oxygen fixes it; once fully blue, it is dipped again.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="468" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The indigo dip: yellow-green in the vat, blue in the air</text><rect x="54.0" y="60.0" width="126.0" height="110.0" rx="6" fill="#c8c25a" stroke="#16233f" stroke-width="1.5"/><text x="117.0" y="196.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">In the vat</text><text x="117.0" y="218.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">yellow-green</text><text x="117.0" y="239.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">leuco-indigo soaks in</text><line x1="184.0" y1="115.0" x2="252.0" y2="115.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="256.0" y="60.0" width="126.0" height="110.0" rx="6" fill="#4c9a6a" stroke="#16233f" stroke-width="1.5"/><text x="319.0" y="196.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Lifted out</text><text x="319.0" y="218.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">turns green as air</text><text x="319.0" y="239.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">reaches it</text><line x1="386.0" y1="115.0" x2="454.0" y2="115.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="458.0" y="60.0" width="126.0" height="110.0" rx="6" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><text x="521.0" y="196.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">A minute or two later</text><text x="521.0" y="218.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">blue: oxygen locks it</text><text x="521.0" y="239.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">in</text><path d="M521 276 C500 322 140 322 117 276" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="320.0" y="346.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">wait until fully blue, then dip again</text><text x="24.0" y="386.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Lower the wet cloth in slowly, with no splashing: oxygen spoils the vat.</text><text x="24.0" y="407.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Many short dips give deeper, more even, more lasting colour than one</text><text x="24.0" y="428.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">long one.</text><text x="624.0" y="458.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>