<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 399" width="640" height="399" role="img" aria-labelledby="t d"><title id="t">Cost of a plate</title><desc id="d">An example plate: food ₦750 (a ₦15,000 pot for 20), packaging ₦300, gas ₦100, transport ₦50, waste ₦75 and your time ₦250 — a cost of ₦1,525 before a margin, so a price of about ₦2,000.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="399" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">What a plate of jollof really costs (an example)</text><rect x="24.0" y="60.0" width="360.0" height="71.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="101.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Food: ₦15,000 pot ÷ 20 plates</text><text x="372.0" y="101.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦750</text><rect x="24.0" y="131.0" width="360.0" height="44.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="36.0" y="159.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Packaging</text><text x="372.0" y="159.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦300</text><rect x="24.0" y="175.0" width="360.0" height="32.0" rx="0" fill="#eee6f6" stroke="#16233f" stroke-width="1"/><text x="36.0" y="197.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Gas</text><text x="372.0" y="197.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦100</text><rect x="24.0" y="207.0" width="360.0" height="29.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="36.0" y="227.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Transport</text><text x="372.0" y="227.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦50</text><rect x="24.0" y="236.0" width="360.0" height="30.5" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="36.0" y="257.2" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Waste</text><text x="372.0" y="257.2" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦75</text><rect x="24.0" y="266.5" width="360.0" height="41.0" rx="0" fill="#e3f1e6" stroke="#16233f" stroke-width="1"/><text x="36.0" y="293.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Your time</text><text x="372.0" y="293.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦250</text><path d="M396 60 h10 V307.5 h-10" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="424.0" y="123.8" width="192.0" height="120.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="436.0" y="153.8" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Cost ₦1,525</text><text x="436.0" y="183.8" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">+ margin</text><text x="436.0" y="217.8" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Price ≈ ₦2,000</text><text x="24.0" y="337.5" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Never price below cost to compete. Ingredient prices move fast:</text><text x="24.0" y="358.5" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">re-cost the menu regularly.</text><text x="624.0" y="389.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>