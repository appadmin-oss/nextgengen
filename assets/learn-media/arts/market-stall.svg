<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 479" width="640" height="479" role="img" aria-labelledby="t d"><title id="t">A market stall</title><desc id="d">A market stall from the front: the best pieces at eye level on stands and boxes, everything else grouped on the table, and a price tag on every piece.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="479" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A stall, from the front: use height, show prices, group</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">things</text><rect x="24.0" y="156.0" width="592.0" height="70.0" rx="4" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="40.0" y="186.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">eye level: the best pieces</text><text x="40.0" y="210.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">on stands and boxes</text><rect x="24.0" y="316.0" width="592.0" height="70.0" rx="0" fill="#e9dcc3" stroke="#16233f" stroke-width="1.5"/><rect x="380.0" y="196.0" width="56.0" height="120.0" rx="3" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><rect x="386.0" y="202.0" width="44.0" height="22.0" rx="2" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="408.0" y="219.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦</text><rect x="450.0" y="146.0" width="56.0" height="170.0" rx="3" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><rect x="456.0" y="152.0" width="44.0" height="22.0" rx="2" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="478.0" y="169.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦</text><rect x="530.0" y="196.0" width="56.0" height="120.0" rx="3" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><rect x="536.0" y="202.0" width="44.0" height="22.0" rx="2" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="558.0" y="219.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">₦</text><text x="40.0" y="356.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">table: grouped by colour, type or price</text><line x1="24.0" y1="386.0" x2="616.0" y2="386.0" stroke="#3d4560" stroke-width="2"/><text x="24.0" y="418.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A price on every piece — many shoppers will not ask. Record what</text><text x="24.0" y="439.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">sold, what was picked up and put down, and what people asked for.</text><text x="624.0" y="469.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>