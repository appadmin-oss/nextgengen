<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d"><title id="t">Upcycling process</title><desc id="d">Upcycling in four steps: collect and clean the waste properly, test what it can do, design something that uses its strengths, then prototype and improve.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="276" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Upcycling: start from what the material is good at</text><rect x="24.0" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="88.2" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Collect,</text><text x="88.2" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">clean</text><text x="88.2" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">wash, dry,</text><text x="88.2" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">labels off</text><line x1="155.5" y1="110.0" x2="175.5" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="178.5" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="242.8" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Test it</text><text x="242.8" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">bend, cut,</text><text x="242.8" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">glue, stitch?</text><line x1="310.0" y1="110.0" x2="330.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="333.0" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="397.2" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Design for it</text><text x="397.2" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">use its</text><text x="397.2" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">strengths</text><line x1="464.5" y1="110.0" x2="484.5" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="487.5" y="60.0" width="128.5" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="551.8" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Prototype</text><text x="551.8" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">test, improve</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Sachets and bags: waterproof, flexible. Tyres: tough. Can edges are</text><text x="24.0" y="211.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">very sharp: gloves, file them smooth. Never burn plastic to shape it —</text><text x="24.0" y="232.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the fumes are toxic.</text><text x="624.0" y="266.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>