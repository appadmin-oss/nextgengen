<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 503" width="640" height="503" role="img" aria-labelledby="t d"><title id="t">Rig, focus, cue</title><desc id="d">Three stages: rig the lantern with a clamp and a safety bond, focus it on the area and shape it with shutters or barn doors, then plot cues with a number, a moment and a fade time, called “stand by… go”.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="503" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Getting a lantern working: rig, focus, cue</text><rect x="64.0" y="60.0" width="552.0" height="88.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Rig</text><text x="76.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Clamp it to the bar and always fit a safety bond. Trained people</text><text x="76.0" y="133.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">only at height; gloves — lanterns get hot.</text><circle cx="40.0" cy="104.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="110.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="150.0" x2="340.0" y2="168.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="172.0" width="552.0" height="88.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="198.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Focus</text><text x="76.0" y="224.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Aim at the area with someone standing in it; shape the edge with</text><text x="76.0" y="245.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">shutters or barn doors.</text><circle cx="40.0" cy="216.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="262.0" x2="340.0" y2="280.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="284.0" width="552.0" height="88.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="310.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Cue</text><text x="76.0" y="336.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">A number, the exact moment (“as she sits”) and a fade time — in</text><text x="76.0" y="357.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the desk and the prompt book.</text><circle cx="40.0" cy="328.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="334.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="374.0" x2="340.0" y2="392.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="396.0" width="552.0" height="67.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="422.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">The call</text><text x="76.0" y="448.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“Lighting cue 12 — stand by.” … “Go.”</text><circle cx="40.0" cy="429.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="435.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="624.0" y="493.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>