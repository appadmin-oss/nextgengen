<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" role="img" aria-labelledby="t d"><title id="t">Objective, obstacle, tactic</title><desc id="d">A character wants an objective (to get the loan); an obstacle (he refuses) stands in the way; the character tries tactics — charm, plead, guilt-trip — changing each time one fails.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="368" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Objective, obstacle, tactic: the engine of a scene</text><rect x="24.0" y="100.0" width="150.0" height="110.0" rx="10" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="99.0" y="152.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">My character</text><text x="99.0" y="174.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">wants…</text><rect x="466.0" y="120.0" width="150.0" height="70.0" rx="10" fill="#e3f1e6" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="541.0" y="152.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Objective</text><text x="541.0" y="174.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">“to get the loan”</text><rect x="306.0" y="90.0" width="28.0" height="130.0" rx="4" fill="#ef6b4d" stroke="#16233f" stroke-width="1.5"/><text x="320.0" y="246.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle">Obstacle: he refuses</text><line x1="178.0" y1="117.0" x2="302.0" y2="117.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="248.0" y="110.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle">charm</text><line x1="178.0" y1="155.0" x2="302.0" y2="155.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="248.0" y="148.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle">plead</text><line x1="178.0" y1="193.0" x2="302.0" y2="193.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="248.0" y="186.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle">guilt-trip</text><text x="24.0" y="286.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Tactics are verbs done to the other person. When one fails, change</text><text x="24.0" y="307.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">tactic — those changes keep the scene alive. You cannot play a feeling,</text><text x="24.0" y="328.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">only an action.</text><text x="624.0" y="358.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>