<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-labelledby="t d"><title id="t">Cue-to-cue rehearsal</title><desc id="d">Across the running time of a show, only the short stretches around each cue are played in a cue-to-cue technical rehearsal; long scenes with no technical change are skipped.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="318" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Cue to cue: rehearse only the moments around each</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">cue</text><rect x="24.0" y="116.0" width="592.0" height="40.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="24.0" y="106.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">The whole show</text><rect x="25.6" y="116.0" width="56.0" height="40.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="53.6" y1="160.0" x2="53.6" y2="178.0" stroke="#3d4560" stroke-width="1.5"/><rect x="90.7" y="116.0" width="56.0" height="40.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="118.7" y1="160.0" x2="118.7" y2="178.0" stroke="#3d4560" stroke-width="1.5"/><rect x="144.0" y="116.0" width="56.0" height="40.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="172.0" y1="160.0" x2="172.0" y2="178.0" stroke="#3d4560" stroke-width="1.5"/><rect x="469.6" y="116.0" width="56.0" height="40.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="497.6" y1="160.0" x2="497.6" y2="178.0" stroke="#3d4560" stroke-width="1.5"/><rect x="546.6" y="116.0" width="56.0" height="40.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><line x1="574.6" y1="160.0" x2="574.6" y2="178.0" stroke="#3d4560" stroke-width="1.5"/><text x="334.8" y="142.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">long scene: skipped</text><text x="24.0" y="200.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Gold: played around each cue, checked, fixed, then on to the next.</text><text x="24.0" y="236.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">At each cue: right moment, right level and speed, can everyone see and</text><text x="24.0" y="257.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">hear, is it safe? Then dress rehearsals, at performance speed, without</text><text x="24.0" y="278.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">stopping.</text><text x="624.0" y="308.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>