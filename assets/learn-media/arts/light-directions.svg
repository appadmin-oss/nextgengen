<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 481" width="640" height="481" role="img" aria-labelledby="t d"><title id="t">Directions of stage light</title><desc id="d">Light from the front shows faces but flattens them, from the side gives shape, from behind separates the actor from the background, and from below looks unnatural and spooky.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="481" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Direction of light changes what the audience sees</text><rect x="24.0" y="60.0" width="288.0" height="156.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="94.0" cy="140.0" r="26.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="94.0" y1="198.0" x2="94.0" y2="172.0" stroke="#7a4a00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="158.0" y="124.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Front</text><text x="158.0" y="150.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">shows faces,</text><text x="158.0" y="171.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">flattens them</text><rect x="328.0" y="60.0" width="288.0" height="156.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="398.0" cy="140.0" r="26.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="340.0" y1="140.0" x2="366.0" y2="140.0" stroke="#7a4a00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="462.0" y="124.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Side</text><text x="462.0" y="150.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">gives shape</text><rect x="24.0" y="230.0" width="288.0" height="156.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="94.0" cy="310.0" r="26.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="94.0" y1="252.0" x2="94.0" y2="278.0" stroke="#7a4a00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="158.0" y="294.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Back</text><text x="158.0" y="320.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">separates actor</text><text x="158.0" y="341.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">from</text><text x="158.0" y="362.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">background</text><rect x="328.0" y="230.0" width="288.0" height="156.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="398.0" cy="310.0" r="26.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="348.0" y1="374.0" x2="448.0" y2="374.0" stroke="#3d4560" stroke-width="3"/><line x1="438.0" y1="370.0" x2="412.0" y2="338.0" stroke="#7a4a00" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="462.0" y="294.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Below</text><text x="462.0" y="320.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">from the floor:</text><text x="462.0" y="341.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">unnatural,</text><text x="462.0" y="362.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">spooky</text><text x="24.0" y="420.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Lighting&#x27;s four jobs: visibility first, then mood, focus and time of day —</text><text x="24.0" y="441.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">through intensity, colour, direction, distribution and movement.</text><text x="624.0" y="471.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>