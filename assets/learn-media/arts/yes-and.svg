<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 349" width="640" height="349" role="img" aria-labelledby="t d"><title id="t">Yes, and</title><desc id="d">An offer (“Doctor, my leg has turned blue!”) can be blocked (“No it hasn&#x27;t” — the scene dies) or accepted and built on with “yes, and” (“And it&#x27;s glowing slightly…”), which grows the scene.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="349" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">“Yes, and” grows a scene; blocking ends it</text><rect x="24.0" y="60.0" width="592.0" height="50.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="92.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Offer: “Doctor, my leg has turned blue!”</text><line x1="160.0" y1="112.0" x2="120.0" y2="152.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="480.0" y1="112.0" x2="520.0" y2="152.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="24.0" y="156.0" width="292.0" height="96.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="197.4" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Blocking</text><text x="36.0" y="222.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“No it hasn&#x27;t.” — the scene dies</text><rect x="336.0" y="156.0" width="292.0" height="96.0" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="348.0" y="186.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Yes, and</text><text x="348.0" y="212.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“And it&#x27;s glowing slightly. Eaten</text><text x="348.0" y="233.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">anything strange?”</text><text x="24.0" y="288.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Wimping — accepting but adding nothing — leaves your partner doing</text><text x="24.0" y="309.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">all the work. Scripted scenes work the same way: every line is an offer.</text><text x="624.0" y="339.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>