<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 355" width="640" height="355" role="img" aria-labelledby="t d"><title id="t">Choosing a joint</title><desc id="d">PVA for paper, card and wood; contact adhesive for leather and rubber; epoxy for metal and glass; stitching for fabric and leather; screws or rivets where it must come apart.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="355" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Choose the joint for the material</text><rect x="24.0" y="60.0" width="196.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Material</text><rect x="220.0" y="60.0" width="196.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="228.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Join with</text><rect x="416.0" y="60.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Note</text><rect x="24.0" y="94.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Paper, card, wood</text><rect x="220.0" y="94.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="228.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">PVA</text><rect x="416.0" y="94.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">clamp while it dries</text><rect x="24.0" y="128.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Leather, rubber</text><rect x="220.0" y="128.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="228.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Contact adhesive</text><rect x="416.0" y="128.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">both sides, tacky</text><rect x="24.0" y="162.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Metal, glass</text><rect x="220.0" y="162.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="228.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Epoxy</text><rect x="416.0" y="162.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">mix exactly</text><rect x="24.0" y="196.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Fabric, leather</text><rect x="220.0" y="196.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="228.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Stitching</text><rect x="416.0" y="196.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">flexible, strong</text><rect x="24.0" y="230.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="253.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Something to repair</text><rect x="220.0" y="230.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="228.0" y="253.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Screws, rivets</text><rect x="416.0" y="230.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="253.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">can be undone</text><text x="24.0" y="294.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Clean, dry, slightly rough surfaces and a thin, even layer. Hot glue is</text><text x="24.0" y="315.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">quick but weak under heat or stress. Test sample joints to destruction.</text><text x="624.0" y="345.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>