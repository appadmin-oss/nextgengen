<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 471" width="640" height="471" role="img" aria-labelledby="t d"><title id="t">Plating</title><desc id="d">A plate seen from above: rice shaped for height, the protein at the front as the focal point, three pieces of plantain, a green for colour contrast, empty space, and a clean wiped rim.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="471" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Plating: space, height, colour, odd numbers, clean rim</text><circle cx="210.0" cy="230.0" r="150.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><circle cx="210.0" cy="230.0" r="118.0" fill="none" stroke="#c9cedb" stroke-width="1.5"/><circle cx="200.0" cy="210.0" r="52.0" fill="#e2843a" stroke="#16233f" stroke-width="1.5"/><ellipse cx="230" cy="280" rx="44" ry="24" fill="#8d5524" stroke="#16233f"/><ellipse cx="270" cy="170" rx="22" ry="11" fill="#f5b026" stroke="#16233f" transform="rotate(-30 270 170)"/><ellipse cx="270" cy="200" rx="22" ry="11" fill="#f5b026" stroke="#16233f" transform="rotate(-30 270 200)"/><ellipse cx="270" cy="230" rx="22" ry="11" fill="#f5b026" stroke="#16233f" transform="rotate(-30 270 230)"/><circle cx="150.0" cy="276.0" r="16.0" fill="#43a047" stroke="#16233f" stroke-width="1"/><text x="380.0" y="120.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">clean rim, wiped</text><text x="380.0" y="170.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">plantain: three, not two</text><text x="380.0" y="220.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">rice shaped for height</text><text x="380.0" y="280.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">protein at the front: focal point</text><text x="380.0" y="330.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">green for colour contrast</text><text x="24.0" y="410.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Photograph in side daylight, from above for flat dishes or about 45° for</text><text x="24.0" y="431.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">height, and at once — food dulls quickly.</text><text x="624.0" y="461.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>