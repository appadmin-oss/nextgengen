<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" role="img" aria-labelledby="t d"><title id="t">Beadwork pattern and tension</title><desc id="d">A planned repeat (red, red, gold, black) laid out before threading, and three tensions: too tight kinks and stiffens, even lies flat and straight, too loose leaves gaps.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="452" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Beadwork: plan the repeat, keep the tension even</text><circle cx="60.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="93.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="126.0" cy="90.0" r="13.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><circle cx="159.0" cy="90.0" r="13.0" fill="#16233f" stroke="#16233f" stroke-width="1"/><circle cx="192.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="225.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="258.0" cy="90.0" r="13.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><circle cx="291.0" cy="90.0" r="13.0" fill="#16233f" stroke="#16233f" stroke-width="1"/><circle cx="324.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="357.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="390.0" cy="90.0" r="13.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><circle cx="423.0" cy="90.0" r="13.0" fill="#16233f" stroke="#16233f" stroke-width="1"/><circle cx="456.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="489.0" cy="90.0" r="13.0" fill="#c62828" stroke="#16233f" stroke-width="1"/><circle cx="522.0" cy="90.0" r="13.0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><circle cx="555.0" cy="90.0" r="13.0" fill="#16233f" stroke="#16233f" stroke-width="1"/><text x="60.0" y="132.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">red – red – gold – black, repeated exactly</text><text x="24.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Too tight</text><text x="24.0" y="212.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">stiff, kinks</text><circle cx="210.0" cy="186.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="238.0" cy="202.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="266.0" cy="186.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="294.0" cy="202.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="322.0" cy="186.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="350.0" cy="202.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="378.0" cy="186.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="406.0" cy="202.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="434.0" cy="186.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="462.0" cy="202.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><line x1="200.0" y1="194.0" x2="476.0" y2="194.0" stroke="#3d4560" stroke-width="1"/><text x="24.0" y="254.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Even</text><text x="24.0" y="276.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">lies flat and straight</text><circle cx="210.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="238.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="266.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="294.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="322.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="350.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="378.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="406.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="434.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="462.0" cy="258.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><line x1="200.0" y1="258.0" x2="476.0" y2="258.0" stroke="#3d4560" stroke-width="1"/><text x="24.0" y="318.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Too loose</text><text x="24.0" y="340.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">gaps, wobble</text><circle cx="210.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="244.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="278.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="312.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="346.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="380.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="414.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="448.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="482.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><circle cx="516.0" cy="322.0" r="12.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><line x1="200.0" y1="322.0" x2="530.0" y2="322.0" stroke="#3d4560" stroke-width="1"/><text x="24.0" y="370.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Finish securely: thread back through several beads and knot between</text><text x="24.0" y="391.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">them, or use a crimp bead on wire. A piece that comes undone is</text><text x="24.0" y="412.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">worthless.</text><text x="624.0" y="442.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>