<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 471" width="640" height="471" role="img" aria-labelledby="t d"><title id="t">Subtext</title><desc id="d">An iceberg: above the water the line “I&#x27;m fine”; below it the subtext — I&#x27;m furious, I&#x27;m heartbroken, please ask me again.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="471" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A script is the tip of an iceberg</text><rect x="24.0" y="130.0" width="592.0" height="260.0" rx="0" fill="#dff3f7" stroke="none" stroke-width="1"/><polygon points="250,70 390,70 420,130 220,130" fill="#ffffff" stroke="#16233f" stroke-width="2"/><polygon points="220,130 420,130 540,350 100,350" fill="#eef4fb" stroke="#16233f" stroke-width="2"/><text x="320.0" y="106.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">“I&#x27;m fine.”</text><text x="320.0" y="180.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Subtext</text><text x="320.0" y="216.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">I&#x27;m furious</text><text x="320.0" y="242.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">I&#x27;m heartbroken</text><text x="320.0" y="268.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">please ask me again</text><text x="600.0" y="110.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">the words</text><text x="600.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">what is meant</text><text x="24.0" y="410.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Mark beats where the topic, tactic or situation changes, and an action</text><text x="24.0" y="431.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">verb for each line, in pencil.</text><text x="624.0" y="461.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>