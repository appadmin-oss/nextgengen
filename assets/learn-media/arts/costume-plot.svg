<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 287" width="640" height="287" role="img" aria-labelledby="t d"><title id="t">Costume plot</title><desc id="d">A costume plot grid of characters by scenes, showing what each wears and highlighting the scenes where a change happens.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="287" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A costume plot shows every change at a glance</text><rect x="24.0" y="60.0" width="140.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Character</text><rect x="164.0" y="60.0" width="160.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="172.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Scene 1</text><rect x="324.0" y="60.0" width="146.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="332.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Scene 2</text><rect x="470.0" y="60.0" width="146.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c