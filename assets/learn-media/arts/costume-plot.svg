/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Kemi</text><rect x="164.0" y="162.0" width="160.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="172.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">jeans, T-shirt</text><rect x="324.0" y="162.0" width="146.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="332.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">same</text><rect x="470.0" y="162.0" width="146.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="478.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">same</text><text x="24.0" y="226.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Red = a change. A quick change is planned on paper, pre-set in the</text><text x="24.0" y="247.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">wings in order, with fast fastenings, and rehearsed with the dresser.</text><text x="624.0" y="277.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>