<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d"><title id="t">Making eba</title><desc id="d">Eba in four steps: properly boiling water, sprinkle the garri and let it absorb, turn firmly with a wooden spatula pressing out lumps, then serve hot, wrapped and shaped.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="276" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Eba: texture comes from the method</text><rect x="24.0" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="88.2" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Water</text><text x="88.2" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">properly</text><text x="88.2" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">boiling</text><line x1="155.5" y1="110.0" x2="175.5" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="178.5" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="242.8" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Sprinkle</text><text x="242.8" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">garri</text><text x="242.8" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">let it absorb</text><text x="242.8" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">briefly</text><line x1="310.0" y1="110.0" x2="330.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="333.0" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="397.2" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Turn firmly</text><text x="397.2" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">press out</text><text x="397.2" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">lumps</text><line x1="464.5" y1="110.0" x2="484.5" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="487.5" y="60.0" width="128.5" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="551.8" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Serve hot</text><text x="551.8" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">wrapped,</text><text x="551.8" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">shaped</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Warm water gives a raw, gritty, sticky result. More garri makes it firmer</text><text x="24.0" y="211.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">— ask the customer. Turn and serve without stopping: it sets as it</text><text x="24.0" y="232.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">cools.</text><text x="624.0" y="266.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>