<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 475" width="640" height="475" role="img" aria-labelledby="t d"><title id="t">Cooking methods by temperature</title><desc id="d">Moist heat — boiling, simmering, steaming — cannot go above about 100°C, so food softens without browning; dry heat goes far higher; browning starts above about 140°C and deep frying is 170–180°C.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="475" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Cooking methods by how hot they get</text><line x1="120.0" y1="70.0" x2="120.0" y2="380.0" stroke="#3d4560" stroke-width="2"/><line x1="112.0" y1="380.0" x2="120.0" y2="380.0" stroke="#16233f" stroke-width="2"/><text x="106.0" y="386.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">0°C</text><line x1="112.0" y1="225.0" x2="120.0" y2="225.0" stroke="#16233f" stroke-width="2"/><text x="106.0" y="231.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">100°C</text><line x1="112.0" y1="163.0" x2="120.0" y2="163.0" stroke="#16233f" stroke-width="2"/><text x="106.0" y="169.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">140°C</text><line x1="112.0" y1="101.0" x2="120.0" y2="101.0" stroke="#16233f" stroke-width="2"/><text x="106.0" y="107.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">180°C</text><rect x="136.0" y="225.0" width="220.0" height="151.0" rx="6" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="148.0" y="251.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Moist heat: up to 100°C</text><text x="148.0" y="277.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">boiling, simmering,</text><text x="148.0" y="299.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">steaming (moi moi)</text><text x="148.0" y="321.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">softens, does not brown</text><rect x="372.0" y="70.0" width="244.0" height="151.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="384.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Dry heat: far hotter</text><text x="384.0" y="122.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">frying, roasting,</text><text x="384.0" y="144.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">baking, grilling (suya)</text><text x="384.0" y="166.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the outside browns</text><line x1="120.0" y1="163.0" x2="364.0" y2="163.0" stroke="#9c3119" stroke-width="2" stroke-dasharray="6 4"/><text x="132.0" y="155.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start">browning above 140°C</text><line x1="120.0" y1="108.8" x2="364.0" y2="108.8" stroke="#7a4a00" stroke-width="3"/><text x="132.0" y="100.8" font-size="16" font-weight="800" fill="#7a4a00" text-anchor="start">deep frying 170–180°C</text><text x="24.0" y="414.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Water cannot pass 100°C, so boiled meat never browns — which is why</text><text x="24.0" y="435.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">a stew whose meat is browned first tastes richer.</text><text x="624.0" y="465.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>