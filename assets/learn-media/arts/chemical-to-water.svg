<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" role="img" aria-labelledby="t d"><title id="t">Mixing chemicals safely</title><desc id="d">Caustic soda is added slowly to water, never water poured onto it, which can boil and spit; gloves, apron and goggles first, good ventilation, and 15 minutes of running water for a splash in the eye.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="386" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Add chemical to water — never water to chemical</text><rect x="24.0" y="60.0" width="288.0" height="210.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="38.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Never</text><circle cx="44.0" cy="113.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="118.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Water poured onto caustic</text><text x="56.0" y="139.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">soda: it can boil and spit</text><rect x="328.0" y="60.0" width="288.0" height="210.0" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="342.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Always</text><circle cx="348.0" cy="113.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="118.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Caustic soda added slowly to</text><text x="360.0" y="139.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">the water</text><circle cx="348.0" cy="163.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="168.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Gloves, apron, goggles on</text><text x="360.0" y="189.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">first</text><circle cx="348.0" cy="213.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="218.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Outdoors or by open</text><text x="360.0" y="239.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">windows</text><text x="24.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Splash in the eye: rinse with clean running water for at least 15 minutes</text><text x="24.0" y="321.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and get medical help. Label every container; dye pots are never used</text><text x="24.0" y="342.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">for food again.</text><text x="624.0" y="376.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>