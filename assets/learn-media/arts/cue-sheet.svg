<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 321" width="640" height="321" role="img" aria-labelledby="t d"><title id="t">Sound cue sheet</title><desc id="d">A sound cue sheet listing each cue&#x27;s number, what it is, the moment it happens, its level and its fade — so anyone could run the show the same way.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="321" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A cue sheet: the same show every night</text><rect x="24.0" y="60.0" width="60.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Cue</text><rect x="84.0" y="60.0" width="160.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="92.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">What</text><rect x="244.0" y="60.0" width="172.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="252.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">When</text><rect x="416.0" y="60.0" width="100.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Level</text><rect x="516.0" y="60.0" width="100.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="524.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Fade</text><rect x="24.0" y="94.0" width="60.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Q1</text><rect x="84.0" y="94.0" width="160.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="92.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Pre-show music</text><rect x="244.0" y="94.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="252.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">house open</text><rect x="416.0" y="94.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">-10 dB</text><rect x="516.0" y="94.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="524.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">snap</text><rect x="24.0" y="128.0" width="60.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Q2</text><rect x="84.0" y="128.0" width="160.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="92.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Music out</text><rect x="244.0" y="128.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="252.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">house lights out</text><rect x="416.0" y="128.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">off</text><rect x="516.0" y="128.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="524.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">5 s</text><rect x="24.0" y="162.0" width="60.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Q3</text><rect x="84.0" y="162.0" width="160.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="92.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Rain effect</text><rect x="244.0" y="162.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="252.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">“It&#x27;s late…”</text><rect x="416.0" y="162.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">-15 dB</text><rect x="516.0" y="162.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="524.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">3 s</text><rect x="24.0" y="196.0" width="60.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Q4</text><rect x="84.0" y="196.0" width="160.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="92.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Lapel mic 1 up</text><rect x="244.0" y="196.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="252.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ada enters</text><rect x="416.0" y="196.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="424.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">set</text><rect x="516.0" y="196.0" width="100.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="524.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">—</text><text x="24.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Fresh batteries in every radio mic, every show, with a log. Respond to</text><text x="24.0" y="281.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">“Sound Q7, stand by… Go.” and write every setting down.</text><text x="624.0" y="311.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>