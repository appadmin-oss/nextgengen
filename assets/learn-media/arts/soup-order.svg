<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 447" width="640" height="447" role="img" aria-labelledby="t d"><title id="t">Soup order</title><desc id="d">Soup order: oil warmed, aromatics fried, pre-boiled protein, stock, long-cooking thickeners such as egusi or ogbono, and leaves last for only a few minutes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="447" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Soups and stews: what goes in when</text><rect x="24.0" y="60.0" width="592.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="38.0" y="87.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">1 Oil</text><text x="220.0" y="87.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">warm, not smoking</text><rect x="24.0" y="110.0" width="592.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="38.0" y="137.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">2 Aromatics</text><text x="220.0" y="137.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">onion, pepper, iru, crayfish</text><rect x="24.0" y="160.0" width="592.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="38.0" y="187.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">3 Protein</text><text x="220.0" y="187.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">pre-boiled, with its stock</text><rect x="24.0" y="210.0" width="592.0" height="42.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="38.0" y="237.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">4 Stock</text><rect x="24.0" y="260.0" width="592.0" height="42.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="38.0" y="287.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">5 Long-cooking</text><text x="220.0" y="287.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">egusi, ogbono, cocoyam</text><rect x="24.0" y="310.0" width="592.0" height="42.0" rx="6" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="38.0" y="337.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">6 Leaves last</text><text x="220.0" y="337.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">ugu, bitterleaf, efo: minutes only</text><line x1="600.0" y1="64.0" x2="600.0" y2="348.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="24.0" y="386.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Long cooking goes in early, delicate things late. Taste at every stage</text><text x="24.0" y="407.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">with a clean spoon — you can add salt, never remove it.</text><text x="624.0" y="437.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>