<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298" role="img" aria-labelledby="t d"><title id="t">Checking an AI claim</title><desc id="d">A decision on whether a claim can be found in a reliable source.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="298" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A specific claim? Find it somewhere else</text><rect x="20" y="64" width="200" height="64" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 200 64"><text x="120" y="90.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">A number, name,</text><text x="120" y="110.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">quote or source</text></g><line x1="222" y1="96" x2="262" y2="96" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="380,50 495,96 380,142 265,96" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="314.5 67 131 58"><text x="380" y="91.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">found in a</text><text x="380" y="112.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">reliable source?</text></g><line x1="497" y1="96" x2="520" y2="60" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="524" y="30" width="96" height="52" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="524 30 96 52"><text x="572" y="50.176" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">use it,</text><text x="572" y="70.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">cite that</text></g><line x1="497" y1="96" x2="520" y2="132" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="524" y="112" width="96" height="52" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="524 112 96 52"><text x="572" y="132.176" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">probably</text><text x="572" y="152.976" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">invented</text></g><text x="510" y="52" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">yes</text><text x="510" y="150" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end" xml:space="preserve">no</text><text x="20" y="196" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Most likely to be wrong:</text><text x="20" y="222" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• rare, local or recent topics</text><text x="20" y="248" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• exact numbers, dates, names, quotes</text><text x="20" y="274" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• questions that assume something false</text></g></svg>