<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">Pull request workflow</title><desc id="d">Six steps from issue to merge.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">From issue to merge</text><rect x="20" y="60" width="180" height="56" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 180 56"><text x="110" y="82.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1 Issue</text><text x="110" y="102.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">what and why</text></g><line x1="202" y1="88" x2="226" y2="88" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230" y="60" width="180" height="56" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 60 180 56"><text x="320" y="82.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">2 Branch</text><text x="320" y="102.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">one issue each</text></g><line x1="412" y1="88" x2="436" y2="88" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="440" y="60" width="180" height="56" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 60 180 56"><text x="530" y="82.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">3 Commits</text><text x="530" y="102.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">small, clear</text></g><path d="M530 118 V146 H110 V170" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="174" width="180" height="56" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 174 180 56"><text x="110" y="196.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">4 Pull request</text><text x="110" y="216.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">what changed</text></g><line x1="202" y1="202" x2="226" y2="202" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230" y="174" width="180" height="56" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 174 180 56"><text x="320" y="196.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">5 Review</text><text x="320" y="216.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">+ tests run</text></g><line x1="412" y1="202" x2="436" y2="202" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="440" y="174" width="180" height="56" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 174 180 56"><text x="530" y="196.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">6 Merge</text><text x="530" y="216.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">into main</text></g><text x="20" y="270" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Small PRs get real reviews; 2,000 lines get a shrug.</text></g></svg>