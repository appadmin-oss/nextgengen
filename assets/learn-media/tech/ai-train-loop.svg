<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d"><title id="t">Train and test loop</title><desc id="d">Six steps in a loop from choosing classes to fixing the data.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="276" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The data matters more than the algorithm</text><rect x="20" y="60" width="180" height="74" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 180 74"><text x="110" y="91.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">1 Choose</text><text x="110" y="111.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">classes + “nothing”</text></g><rect x="230" y="60" width="180" height="74" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 60 180 74"><text x="320" y="91.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">2 Collect</text><text x="320" y="111.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">100+ each, varied</text></g><rect x="440" y="60" width="180" height="74" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 60 180 74"><text x="530" y="101.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">3 Train</text></g><rect x="440" y="180" width="180" height="74" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 180 180 74"><text x="530" y="211.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">4 Test</text><text x="530" y="231.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">new light, new people</text></g><rect x="230" y="180" width="180" height="74" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 180 180 74"><text x="320" y="211.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">5 Find failures</text><text x="320" y="231.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">why did it fail?</text></g><rect x="20" y="180" width="180" height="74" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 180 180 74"><text x="110" y="221.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">6 Fix the data</text></g><line x1="202" y1="97" x2="226" y2="97" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="412" y1="97" x2="436" y2="97" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="530" y1="136" x2="530" y2="176" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="436" y1="217" x2="412" y2="217" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="226" y1="217" x2="202" y2="217" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M110 178 V140" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="124" y="162" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start" xml:space="preserve">again</text></g></svg>