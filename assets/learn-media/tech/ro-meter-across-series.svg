<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" width="640" height="322" role="img" aria-labelledby="t d"><title id="t">Measuring voltage and current</title><desc id="d">A meter across a resistor, and a meter in the loop.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="322" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Voltage across, current through</text><path d="M40 90 H290 V230 H40 V90" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="110" y="76" width="80" height="28" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><g data-fit="110 76 80 28"><text x="150" y="96" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">220 Ω</text></g><path d="M110 90 V150" fill="none" stroke="#0b6274" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 90 V150" fill="none" stroke="#0b6274" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="105" y="150" width="90" height="44" rx="10" fill="#dff3f7" stroke="#0b6274" stroke-width="1.25"/><g data-fit="105 150 90 44"><text x="150" y="177.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">V</text></g><text x="155" y="262" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" xml:space="preserve">across the part (parallel)</text><path d="M360 90 H610 V230 H360 V90" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="460" y="76" width="80" height="28" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><g data-fit="460 76 80 28"><text x="500" y="96" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">220 Ω</text></g><rect x="590" y="140" width="12" height="50" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.25"/><rect x="564" y="140" width="64" height="50" rx="10" fill="#dff3f7" stroke="#0b6274" stroke-width="1.25"/><g data-fit="564 140 64 50"><text x="596" y="170.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">mA</text></g><text x="480" y="262" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" xml:space="preserve">in the loop (series)</text><text x="20" y="304" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">Never put the meter on current across a battery: a short circuit.</text></g></svg>