<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d"><title id="t">Hysteresis</title><desc id="d">A wobbling distance reading with on and off thresholds and the buzzer&#x27;s on period.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="310" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Two thresholds stop the flicker</text><line x1="70" y1="250" x2="590" y2="250" stroke="#3d4560" stroke-width="2"/><line x1="70" y1="60" x2="70" y2="250" stroke="#3d4560" stroke-width="2"/><line x1="70" y1="136" x2="590" y2="136" stroke="#1d6b30" stroke-width="2" stroke-dasharray="6 4"/><text x="62" y="142" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">25</text><line x1="70" y1="174" x2="590" y2="174" stroke="#9c3119" stroke-width="2" stroke-dasharray="6 4"/><text x="62" y="180" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end" xml:space="preserve">20</text><path d="M70 90.4 L130 120.8 L180 158.8 L220 177.8 L250 169.4 L280 180.1 L310 167.9 L350 189.2 L400 166.4 L440 143.6 L470 124.6 L520 105.6 L590 90.4" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="213" y="258" width="239" height="16" rx="3" fill="#f5b026"/><text x="590" y="274" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end" xml:space="preserve">time →</text><text x="332" y="296" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">buzzer on: from below 20 until above 25</text><text x="590" y="72" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end" xml:space="preserve">distance (cm)</text></g></svg>