<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286" role="img" aria-labelledby="t d"><title id="t">Feedback loop</title><desc id="d">Five steps in order, ending by telling users what changed.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="286" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Listen, act, and say what you did</text><rect x="20" y="64" width="180" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 180 52"><text x="110" y="94.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1 Collect</text></g><line x1="202" y1="90" x2="226" y2="90" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230" y="64" width="180" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 64 180 52"><text x="320" y="94.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">2 Group + count</text></g><line x1="412" y1="90" x2="436" y2="90" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="440" y="64" width="180" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 64 180 52"><text x="530" y="94.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">3 Problem, not fix</text></g><path d="M530 118 V176 H414" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="230" y="150" width="180" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 150 180 52"><text x="320" y="180.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">4 Prioritise</text></g><line x1="228" y1="176" x2="204" y2="176" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="20" y="150" width="180" height="52" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 150 180 52"><text x="110" y="180.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">5 Close the loop</text></g><path d="M110 148 V122" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="20" y="240" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">“Add a button for X” usually means “I couldn&#x27;t do Y”: solve Y.</text><text x="20" y="266" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Telling people what changed keeps them telling you.</text></g></svg>