<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282" role="img" aria-labelledby="t d"><title id="t">Sense, think, act</title><desc id="d">Three boxes in a loop with an automatic-door example.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="282" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Sense, think, act — again and again</text><rect x="20" y="64" width="180" height="90" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 180 90"><text x="110" y="93.348" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Sense</text><text x="110" y="114.876" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">sensors</text><text x="110" y="135.676" font-size="16" font-weight="500" fill="#0b6274" text-anchor="middle" xml:space="preserve">infrared sees you</text></g><line x1="202" y1="109" x2="226" y2="109" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230" y="64" width="180" height="90" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 64 180 90"><text x="320" y="93.348" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Think</text><text x="320" y="114.876" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">controller</text><text x="320" y="135.676" font-size="16" font-weight="500" fill="#0b6274" text-anchor="middle" xml:space="preserve">decides: open</text></g><line x1="412" y1="109" x2="436" y2="109" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="440" y="64" width="180" height="90" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 64 180 90"><text x="530" y="93.348" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Act</text><text x="530" y="114.876" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">actuators</text><text x="530" y="135.676" font-size="16" font-weight="500" fill="#0b6274" text-anchor="middle" xml:space="preserve">motor opens door</text></g><path d="M530 156 V196 H110 V160" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="320" y="220" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">the world changes; sense again</text><text x="20" y="262" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">No sensing, no reacting: not really a robot.</text></g></svg>