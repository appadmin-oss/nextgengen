<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="640" height="304" role="img" aria-labelledby="t d"><title id="t">Where bias comes from</title><desc id="d">Training data mostly from one group, a model, and more mistakes for the missing group.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="304" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Skewed data in, skewed results out</text><rect x="20" y="60" width="190" height="170" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Training data</text><circle cx="44" cy="110" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="78" cy="110" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="112" cy="110" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="146" cy="110" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="180" cy="110" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="44" cy="138" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="78" cy="138" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="112" cy="138" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="146" cy="138" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="180" cy="138" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="44" cy="166" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="78" cy="166" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="112" cy="166" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="146" cy="166" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="180" cy="166" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="44" cy="194" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="78" cy="194" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="112" cy="194" r="10" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><circle cx="146" cy="194" r="10" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><circle cx="180" cy="194" r="10" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><line x1="214" y1="145" x2="254" y2="145" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="258" y="115" width="120" height="60" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="258 115 120 60"><text x="318" y="149.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">model</text></g><line x1="380" y1="145" x2="420" y2="145" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="424" y="60" width="196" height="170" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="440" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Mistakes</text><text x="440" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">group in the data</text><rect x="440" y="134" width="30" height="18" rx="3" fill="#20b2c9"/><text x="480" y="149" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">few</text><text x="440" y="186" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">group left out</text><rect x="440" y="196" width="120" height="18" rx="3" fill="#ef6b4d"/><text x="568" y="211" font-size="16" font-weight="600" fill="#9c3119" text-anchor="start" xml:space="preserve">many</text><text x="20" y="262" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Ask: who was in the data, who is missing, and how often</text><text x="20" y="286" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">does it fail for each group?</text></g></svg>