<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d"><title id="t">Now, next, later roadmap</title><desc id="d">Three columns of outcomes from certain to uncertain.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="310" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Now · Next · Later — outcomes, not features</text><rect x="20" y="58" width="186" height="180" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 58 186 180"><text x="34" y="88" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Now</text><text x="34" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Parents find their</text><text x="34" y="148" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">child&#x27;s class</text><text x="34" y="172" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">without calling</text></g><rect x="227" y="58" width="186" height="180" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="227 58 186 180"><text x="241" y="88" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Next</text><text x="241" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">New families reach</text><text x="241" y="148" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">their first session</text></g><rect x="434" y="58" width="186" height="180" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="434 58 186 180"><text x="448" y="88" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Later</text><text x="448" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Volunteers swap</text><text x="448" y="148" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">shifts themselves</text></g><line x1="40" y1="266" x2="600" y2="266" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="320" y="292" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle" xml:space="preserve">less certain →  no far-off dates</text></g></svg>