<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" role="img" aria-labelledby="t d"><title id="t">Value and effort grid</title><desc id="d">A 2 by 2 grid of value against effort, and the RICE formula.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="404" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Value against effort</text><rect x="90" y="60" width="214" height="114" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="90 60 214 114"><text x="197" y="111.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Do first</text><text x="197" y="133.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">quick wins</text></g><rect x="310" y="60" width="214" height="114" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="310 60 214 114"><text x="417" y="111.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Plan carefully</text><text x="417" y="133.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">big bets</text></g><rect x="90" y="180" width="214" height="114" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="90 180 214 114"><text x="197" y="242.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Maybe</text></g><rect x="310" y="180" width="214" height="114" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="310 180 214 114"><text x="417" y="242.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Don&#x27;t</text></g><text x="310" y="322" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle" xml:space="preserve">effort →</text><text x="62" y="180" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle" transform="rotate(-90 62 180)">value →</text><text x="20" y="360" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">RICE = Reach × Impact × Confidence ÷ Effort</text><text x="20" y="386" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">The numbers are estimates; the conversation is the value.</text></g></svg>