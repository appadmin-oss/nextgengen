<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d"><title id="t">Responding to a hacked account</title><desc id="d">Three columns of actions: minutes, same day, after.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="320" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Taken over? Three phases, in order</text><rect x="20" y="58" width="186" height="214" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 58 186 214"><text x="34" y="88" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Minutes</text><text x="34" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">new password</text><text x="34" y="156" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">sign out all</text><text x="34" y="188" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">turn on 2FA</text><text x="34" y="220" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">call the bank</text></g><line x1="208" y1="165" x2="224" y2="165" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="227" y="58" width="186" height="214" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="227 58 186 214"><text x="241" y="88" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Same day</text><text x="241" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">official recovery</text><text x="241" y="156" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">remove attacker&#x27;s</text><text x="241" y="188" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">rules and devices</text><text x="241" y="220" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">warn contacts</text></g><line x1="415" y1="165" x2="431" y2="165" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="434" y="58" width="186" height="214" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="434 58 186 214"><text x="448" y="88" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">After</text><text x="448" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">how did it</text><text x="448" y="156" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">happen?</text><text x="448" y="188" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">fix that habit</text><text x="448" y="220" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">report it</text></g><text x="20" y="302" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">Never pay a “recovery expert” who contacts you.</text></g></svg>