e" xml:space="preserve">low, near wheels</text></g><rect x="240" y="120" width="160" height="50" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="240 120 160 50"><text x="320" y="149.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">controller</text></g><text x="320" y="62" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">front: caster + line sensors</text><text x="130" y="300" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">drive wheel</text><text x="510" y="300" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">drive wheel</text><text x="20" y="336" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Same speed both sides: it must go straight, before any code.</text></g></svg>