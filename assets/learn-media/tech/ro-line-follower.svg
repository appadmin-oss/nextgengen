<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" role="img" aria-labelledby="t d"><title id="t">Line follower logic</title><desc id="d">Three top-down views of two sensors and a line, with the action for each.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="334" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Two sensors, three cases</text><rect x="20" y="56" width="186" height="170" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="104" y="57" width="18" height="168" fill="#16233f"/><circle cx="79" cy="150" r="11" fill="#20b2c9" stroke="#16233f" stroke-width="2"/><circle cx="147" cy="150" r="11" fill="#20b2c9" stroke="#16233f" stroke-width="2"/><text x="113" y="254" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">both see floor</text><text x="113" y="280" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">go straight</text><rect x="227" y="56" width="186" height="170" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="277" y="57" width="18" height="168" fill="#16233f"/><circle cx="286" cy="150" r="11" fill="#ef6b4d" stroke="#16233f" stroke-width="2"/><circle cx="354" cy="150" r="11" fill="#20b2c9" stroke="#16233f" stroke-width="2"/><text x="320" y="254" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">left sees line</text><text x="320" y="280" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">turn left</text><rect x="434" y="56" width="186" height="170" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="552" y="57" width="18" height="168" fill="#16233f"/><circle cx="493" cy="150" r="11" fill="#20b2c9" stroke="#16233f" stroke-width="2"/><circle cx="561" cy="150" r="11" fill="#ef6b4d" stroke="#16233f" stroke-width="2"/><text x="527" y="254" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">right sees line</text><text x="527" y="280" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">turn right</text><text x="20" y="316" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Better: steer in proportion to how far off the line you are.</text></g></svg>