<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-labelledby="t d"><title id="t">A time-driven trigger</title><desc id="d">Four steps from a Monday trigger to an email.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="312" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The sheet now sends itself</text><rect x="20" y="70" width="130" height="84" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 130 84"><text x="85" y="106.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Monday</text><text x="85" y="126.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">07:00 trigger</text></g><line x1="152" y1="112" x2="173" y2="112" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="177" y="70" width="130" height="84" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="177 70 130 84"><text x="242" y="106.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">script runs</text><text x="242" y="126.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">Apps Script</text></g><line x1="309" y1="112" x2="330" y2="112" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="334" y="70" width="130" height="84" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="334 70 130 84"><text x="399" y="106.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">reads</text><text x="399" y="126.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">Summary tab</text></g><line x1="466" y1="112" x2="487" y2="112" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="491" y="70" width="130" height="84" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="491 70 130 84"><text x="556" y="106.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">emails</text><text x="556" y="126.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">centre lead</text></g><text x="20" y="196" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Before switching on:</text><text x="20" y="222" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• run it by hand and check</text><text x="20" y="248" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• send to yourself first</text><text x="20" y="274" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• note the trigger, owner and recipients</text></g></svg>