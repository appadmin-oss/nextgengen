<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d"><title id="t">Tasks, not jobs</title><desc id="d">A teacher&#x27;s tasks sorted into those tools help with and those that need the person.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="310" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A job is a bundle of tasks: a teacher</text><rect x="20" y="58" width="290" height="200" rx="10" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="16" font-weight="800" fill="#0b6274" text-anchor="start" xml:space="preserve">Tools can help</text><text x="36" y="118" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• drafting letters home</text><text x="36" y="148" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• practice questions</text><text x="36" y="178" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• summarising a report</text><rect x="330" y="58" width="290" height="200" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Needs the person</text><text x="346" y="118" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• mentoring a pupil</text><text x="346" y="148" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• a worried parent</text><text x="346" y="178" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• judging what&#x27;s next</text><text x="346" y="208" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• being accountable</text><text x="20" y="290" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Deep skill in real work + using the tools well = in demand.</text></g></svg>