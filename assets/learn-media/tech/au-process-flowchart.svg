<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 374" width="640" height="374" role="img" aria-labelledby="t d"><title id="t">Process flowchart</title><desc id="d">A form-handling process with two decisions.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="374" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Steps are boxes, decisions are diamonds</text><rect x="20" y="60" width="170" height="56" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 170 56"><text x="105" y="92.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">form submitted</text></g><line x1="192" y1="88" x2="222" y2="88" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="310,48 395,88 310,128 225,88" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="259.5 62 101 52"><text x="310" y="83.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">centre</text><text x="310" y="104.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">given?</text></g>