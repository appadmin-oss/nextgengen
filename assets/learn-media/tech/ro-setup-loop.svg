<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" width="640" height="302" role="img" aria-labelledby="t d"><title id="t">Arduino setup and loop</title><desc id="d">A flowchart of setup then a repeating loop, and the blink timing.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="302" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">setup() once, then loop() for ever</text><rect x="20" y="64" width="140" height="50" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 140 50"><text x="90" y="93.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">power on</text></g><line x1="162" y1="89" x2="196" y2="89" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="200" y="64" width="160" height="50" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="200 64 160 50"><text x="280" y="83.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">setup()</text><text x="280" y="103.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">once</text></g><line x1="362" y1="89" x2="396" y2="89" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="400" y="64" width="160" height="50" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="400 64 160 50"><text x="480" y="83.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">loop()</text><text x="480" y="103.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">again and again</text></g><path d="M562 80 H590 V40 H480 V60" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="20" y="160" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">pin 13</text><path d="M100 220 V170 H230 V220 H360 V170 H490 V220 H620" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="162" font-size="16" font-weight="600" fill="#0b6274" text-anchor="middle" xml:space="preserve">HIGH 500 ms</text><text x="295" y="244" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">LOW 500 ms</text><text x="20" y="284" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Change the delays and the blink changes.</text></g></svg>