<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">Annotated design handover</title><desc id="d">A phone screen with notes on components, states and behaviour.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="400" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Annotate behaviour, not just looks</text><rect x="40" y="56" width="220" height="330" rx="22" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><rect x="58" y="86" width="184" height="40" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="58 86 184 40"><text x="150" y="110.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Find a class</text></g><rect x="58" y="140" width="184" height="44" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="58 140 184 44"><text x="150" y="166.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">Centre ▾</text></g><rect x="58" y="196" width="184" height="70" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="58 196 184 70"><text x="150" y="225.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">No classes yet</text><text x="150" y="245.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">at this centre</text></g><rect x="58" y="316" width="184" height="46" rx="8" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="58 316 184 46"><text x="150" y="343.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Show classes</text></g><line x1="262" y1="101" x2="286" y2="101" stroke="#3d4560" stroke-width="1.5"/><text x="292" y="106" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">focus order: 1 heading, 2 select</text><line x1="262" y1="157" x2="286" y2="157" stroke="#3d4560" stroke-width="1.5"/><text x="292" y="162" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">select: Input/Select, required</text><line x1="262" y1="226" x2="286" y2="226" stroke="#3d4560" stroke-width="1.5"/><text x="292" y="231" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">empty state: exact words</text><line x1="262" y1="334" x2="286" y2="334" stroke="#3d4560" stroke-width="1.5"/><text x="292" y="339" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">Primary button, medium →</text><line x1="262" y1="358" x2="286" y2="358" stroke="#3d4560" stroke-width="1.5"/><text x="292" y="363" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">tap: load list, show loading</text></g></svg>