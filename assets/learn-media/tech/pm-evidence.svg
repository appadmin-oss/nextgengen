<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d"><title id="t">Strength of evidence</title><desc id="d">Three levels from know to assume.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="320" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">How sure are we, and why?</text><rect x="20" y="60" width="160" height="60" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 160 60"><text x="100" y="95.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">We know</text></g><text x="196" y="96" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">seen behaviour, data, repeated stories</text><rect x="20" y="132" width="160" height="60" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 132 160 60"><text x="100" y="167.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">We believe</text></g><text x="196" y="168" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">some signs, not yet proven</text><rect x="20" y="204" width="160" height="60" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 204 160 60"><text x="100" y="239.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">We assume</text></g><text x="196" y="240" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">opinions, “would you…?”, one loud voice</text><line x1="600" y1="270" x2="600" y2="66" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="590" y="290" font-size="16" font-weight="700" fill="#3d4560" text-anchor="end" xml:space="preserve">stronger</text><text x="20" y="300" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Test the riskiest assumption cheaply, before building.</text></g></svg>