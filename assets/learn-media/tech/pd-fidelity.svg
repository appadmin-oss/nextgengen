<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" width="640" height="292" role="img" aria-labelledby="t d"><title id="t">Prototype fidelity</title><desc id="d">Three levels of fidelity with the question each answers.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="292" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">How real does the prototype need to be?</text><rect x="20" y="66" width="186" height="110" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 66 186 110"><text x="113" y="115.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Low</text><text x="113" y="137.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">paper screens</text></g><text x="113" y="206" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">do they get the flow?</text><line x1="208" y1="121" x2="224" y2="121" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="227" y="66" width="186" height="110" rx="10" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25" filter="url(#sh)"/><g data-fit="227 66 186 110"><text x="320" y="115.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Medium</text><text x="320" y="137.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">clickable greyscale</text></g><text x="320" y="206" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">can they navigate?</text><line x1="415" y1="121" x2="431" y2="121" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="434" y="66" width="186" height="110" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="434 66 186 110"><text x="527" y="115.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">High</text><text x="527" y="137.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">realistic, in Figma</text></g><text x="527" y="206" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">do words and look work?</text><text x="20" y="246" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">slower and more expensive →</text><text x="20" y="272" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">A prototype is disposable: it exists to answer a question.</text></g></svg>