<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">MoSCoW prioritisation</title><desc id="d">Four boxes of features: must, should, could, won&#x27;t.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="400" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Sort every idea into four buckets</text><rect x="20" y="58" width="290" height="136" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 58 290 136"><text x="34" y="86" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Must</text><text x="34" y="116" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• see classes at my centre</text><text x="34" y="140" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• book a place</text><text x="34" y="164" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• get a confirmation</text></g><rect x="330" y="58" width="290" height="136" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 58 290 136"><text x="344" y="86" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Should</text><text x="344" y="116" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• reminder the day before</text></g><rect x="20" y="208" width="290" height="136" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 208 290 136"><text x="34" y="236" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Could</text><text x="34" y="266" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• pay online</text></g><rect x="330" y="208" width="290" height="136" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 208 290 136"><text x="344" y="236" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Won&#x27;t — this time</text><text x="344" y="266" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• chat with other parents</text></g><text x="20" y="380" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">If it solves the problem without it, it is not a must.</text></g></svg>