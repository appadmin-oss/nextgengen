<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d"><title id="t">Interview questions</title><desc id="d">A hypothetical question beside a past-event question.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="300" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Ask what they did, not what they would do</text><rect x="20" y="58" width="290" height="190" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Prediction: unreliable</text><text x="36" y="122" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">“Would you use an app</text><text x="36" y="146" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">to book classes?”</text><text x="36" y="196" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Most say yes.</text><text x="36" y="220" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Few ever would.</text><rect x="330" y="58" width="290" height="190" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="86" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">Past event: useful</text><text x="346" y="122" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">“Tell me about the last</text><text x="346" y="146" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">time you booked a class.</text><text x="346" y="170" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">What happened first?”</text><text x="346" y="220" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Then: why? what next?</text><text x="20" y="280" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Not “Was it frustrating?” (leading) but “How was that?”</text></g></svg>