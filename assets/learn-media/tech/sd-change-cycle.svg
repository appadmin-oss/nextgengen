<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">The steps of a software change</title><desc id="d">Seven boxes from understanding to shipping, with writing highlighted.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Writing code is one step of seven</text><rect x="20" y="66" width="130" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 66 130 60"><text x="85" y="100.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1 Understand</text></g><line x1="152" y1="96" x2="173" y2="96" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="177" y="66" width="130" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="177 66 130 60"><text x="242" y="100.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">2 Read code</text></g><line x1="309" y1="96" x2="330" y2="96" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="334" y="66" width="130" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="334 66 130 60"><text x="399" y="100.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">3 Decide</text></g><line x1="466" y1="96" x2="487" y2="96" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="491" y="66" width="130" height="60" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="491 66 130 60"><text x="556" y="90.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">4 Write</text><text x="556" y="110.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">a few lines</text></g><path d="M556 128 V152 H85 V174" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="178" width="130" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 178 130 52"><text x="85" y="208.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">5 Test</text></g><line x1="152" y1="204" x2="173" y2="204" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="177" y="178" width="130" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="177 178 130 52"><text x="242" y="208.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">6 Review</text></g><line x1="309" y1="204" x2="330" y2="204" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="334" y="178" width="130" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="334 178 130 52"><text x="399" y="208.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">7 Ship, watch</text></g><text x="20" y="270" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Most of the week is reading, testing, reviewing and talking.</text></g></svg>