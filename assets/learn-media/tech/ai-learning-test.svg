<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-labelledby="t d"><title id="t">Learning or cheating</title><desc id="d">A yes/no question with two outcomes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="312" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Did the tool help you learn, or learn for you?</text><rect x="150" y="60" width="340" height="100" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="150 60 340 100"><text x="320" y="93.776" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">Could you do it again now,</text><text x="320" y="114.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">without the tool, and</text><text x="320" y="135.376" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">explain every part?</text></g><line x1="150" y1="120" x2="110" y2="190" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="490" y1="120" x2="530" y2="190" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="118" y="150" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">yes</text><text x="522" y="150" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">no</text><rect x="20" y="194" width="200" height="60" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 194 200 60"><text x="120" y="218.176" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="middle" xml:space="preserve">It helped</text><text x="120" y="238.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">you learn</text></g><rect x="420" y="194" width="200" height="60" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="420 194 200 60"><text x="520" y="218.176" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle" xml:space="preserve">It did the</text><text x="520" y="238.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">learning for you</text></g><text x="20" y="292" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Unsure of the rules? Ask — and say when you used a tool.</text></g></svg>