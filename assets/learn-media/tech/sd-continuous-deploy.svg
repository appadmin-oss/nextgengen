<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">Continuous deployment</title><desc id="d">A pipeline from merge through tests to deploy or stop.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Merge → tests → deploy, automatically</text><rect x="20" y="70" width="150" height="56" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 150 56"><text x="95" y="102.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">merge to main</text></g><line x1="172" y1="98" x2="206" y2="98" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="210" y="70" width="140" height="56" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="210 70 140 56"><text x="280" y="102.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">run all tests</text></g><line x1="352" y1="98" x2="366" y2="98" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="440,58 510,98 440,138 370,98" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="397 72 86 52"><text x="440" y="104" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">pass?</text></g><line x1="510" y1="98" x2="530" y2="98" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="534" y="72" width="86" height="52" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="534 72 86 52"><text x="577" y="102.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">deploy</text></g><line x1="440" y1="140" x2="440" y2="172" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="340" y="176" width="200" height="52" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="340 176 200 52"><text x="440" y="206.576" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">stop, tell the team</text></g><text x="20" y="270" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Then test the live version: ports, env variables, file-name case.</text></g></svg>