<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-labelledby="t d"><title id="t">Relative and absolute references</title><desc id="d">The same formula copied down with and without dollar signs.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="324" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Copy it down: what moves, what stays</text><rect x="20" y="60" width="200" height="40" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="20 60 200 40"><text x="120" y="84.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">F1: fee rate  ₦500</text></g><rect x="20" y="116" width="290" height="160" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="144" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Relative: F1 moves</text><text x="36" y="182" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">row 2:  =C2*F1</text><text x="36" y="214" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">row 3:  =C3*F2</text><text x="36" y="252" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">F2 is empty → 0</text><rect x="330" y="116" width="290" height="160" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="144" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">Absolute: $F$1 stays</text><text x="346" y="182" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">row 2:  =C2*$F$1</text><text x="346" y="214" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">row 3:  =C3*$F$1</text><text x="346" y="252" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">always the fee rate</text><text x="20" y="306" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Check a few rows by hand: a wrong copy is wrong on every row.</text></g></svg>