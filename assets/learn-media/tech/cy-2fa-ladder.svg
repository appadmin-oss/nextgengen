<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d"><title id="t">Strength of two-step methods</title><desc id="d">Three steps rising: SMS, authenticator app, passkey.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="380" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Second steps, weakest to strongest</text><rect x="20" y="220" width="190" height="80" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 220 190 80"><text x="115" y="250" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">SMS code</text></g><text x="115" y="326" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">SIM swap can steal it</text><rect x="225" y="150" width="190" height="150" rx="8" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25" filter="url(#sh)"/><g data-fit="225 150 190 150"><text x="320" y="180" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Authenticator app</text></g><text x="320" y="326" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">new code every 30 s</text><rect x="430" y="80" width="190" height="220" rx="8" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="430 80 190 220"><text x="525" y="110" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Passkey or key</text></g><text x="525" y="326" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">won&#x27;t work on fake sites</text><text x="20" y="362" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Any of them beats a password alone. Never share a code.</text></g></svg>