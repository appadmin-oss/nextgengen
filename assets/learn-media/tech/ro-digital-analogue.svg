<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img" aria-labelledby="t d"><title id="t">Digital and analogue inputs</title><desc id="d">A two-level button signal beside a 0 to 1023 range.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="306" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Digital: two values. Analogue: a range</text><rect x="20" y="58" width="290" height="230" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Button: digital</text><path d="M40 130 H100 V200 H170 V130 H290" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="124" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">HIGH</text><text x="108" y="222" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">LOW = pressed</text><text x="36" y="266" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">pull-up: pressed reads LOW</text><rect x="330" y="58" width="290" height="230" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Light sensor: analogue</text><rect x="350" y="200" width="18" height="20" fill="#20b2c9" opacity="0.25"/><rect x="374" y="191" width="18" height="29" fill="#20b2c9" opacity="0.32"/><rect x="398" y="182" width="18" height="38" fill="#20b2c9" opacity="0.39"/><rect x="422" y="173" width="18" height="47" fill="#20b2c9" opacity="0.46"/><rect x="446" y="164" width="18" height="56" fill="#20b2c9" opacity="0.53"/><rect x="470" y="155" width="18" height="65" fill="#20b2c9" opacity="0.60"/><rect x="494" y="146" width="18" height="74" fill="#20b2c9" opacity="0.67"/><rect x="518" y="137" width="18" height="83" fill="#20b2c9" opacity="0.74"/><rect x="542" y="128" width="18" height="92" fill="#20b2c9" opacity="0.81"/><rect x="566" y="119" width="18" height="101" fill="#20b2c9" opacity="0.88"/><rect x="590" y="110" width="18" height="110" fill="#20b2c9" opacity="0.95"/><text x="346" y="246" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">0 V → 0</text><text x="604" y="246" font-size="16" font-weight="700" fill="#16233f" text-anchor="end" xml:space="preserve">5 V → 1023</text><text x="346" y="270" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">analogRead(A0)</text></g></svg>