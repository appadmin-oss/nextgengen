<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">Ohm&#x27;s law triangle</title><desc id="d">A triangle with V over I and R, and a worked example.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">V = I × R</text><polygon points="160,60 280,270 40,270" fill="#fdf0d2" stroke="#3d4560" stroke-width="2"/><line x1="85" y1="190" x2="235" y2="190" stroke="#3d4560" stroke-width="2"/><line x1="160" y1="190" x2="160" y2="270" stroke="#3d4560" stroke-width="2"/><text x="160" y="168" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">V</text><text x="120" y="248" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">I</text><text x="200" y="248" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">R</text><text x="320" y="90" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">V  volts — the push</text><text x="320" y="118" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">I   amps — the flow</text><text x="320" y="146" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">R  ohms — the narrow pipe</text><rect x="320" y="170" width="300" height="100" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="320 170 300 100"><text x="470" y="203.776" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Cover I:  I = V ÷ R</text><text x="470" y="224.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">5 V ÷ 250 Ω = 0.02 A</text><text x="470" y="245.376" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">= 20 mA</text></g></g></svg>