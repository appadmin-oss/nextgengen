<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" width="640" height="322" role="img" aria-labelledby="t d"><title id="t">Motor driver wiring</title><desc id="d">Signal from Arduino, power from a battery, and a shared ground.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="322" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The Arduino signals; the battery powers</text><rect x="20" y="70" width="150" height="80" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 150 80"><text x="95" y="104.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Arduino</text><text x="95" y="124.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">~20 mA a pin</text></g><rect x="245" y="70" width="150" height="80" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="245 70 150 80"><text x="320" y="104.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">motor driver</text><text x="320" y="124.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">L298N / TB6612</text></g><rect x="470" y="70" width="150" height="80" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="470 70 150 80"><text x="545" y="104.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">DC motor</text><text x="545" y="124.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">100s of mA</text></g><rect x="245" y="192" width="150" height="56" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="245 192 150 56"><text x="320" y="224.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">motor battery</text></g><line x1="172" y1="100" x2="241" y2="100" stroke="#0b6274" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="206" y="92" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" xml:space="preserve">signal</text><line x1="397" y1="100" x2="466" y2="100" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="432" y="92" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">power</text><line x1="320" y1="190" x2="320" y2="154" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><path d="M95 152 V280 H545 V152" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="320" y1="250" x2="320" y2="280" stroke="#16233f" stroke-width="3"/><text x="320" y="304" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">one common ground for all three</text></g></svg>