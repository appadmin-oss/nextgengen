<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 431" width="640" height="431" role="img" aria-labelledby="t d"><title id="t">Typography basics</title><desc id="d">Serif type has small feet and feels traditional, sans-serif is clean and screen-friendly, display type is for a few large words; the headline is at least twice the body size, with body line spacing of 1.3–1.5.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="431" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Serif, sans-serif, display — and the space between lines</text><rect x="24.0" y="60.0" width="186.0" height="120.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="117" y="126" font-size="44" font-weight="700" fill="#16233f" text-anchor="middle" style="font-family:Georgia,'Times New Roman',serif">Ag</text><text x="117.0" y="152.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Serif</text><text x="117.0" y="172.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">small feet: traditional</text><rect x="226.0" y="60.0" width="186.0" height="120.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="319" y="126" font-size="44" font-weight="700" fill="#16233f" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif">Ag</text><text x="319.0" y="152.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Sans-serif</text><text x="319.0" y="172.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">clean: easy on screens</text><rect x="428.0" y="60.0" width="186.0" height="120.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="521" y="126" font-size="44" font-weight="700" fill="#16233f" text-anchor="middle" style="font-family:'Comic Sans MS','Brush Script MT',cursive">Ag</text><text x="521.0" y="152.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Display</text><text x="521.0" y="172.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">a few big words only</text><text x="24.0" y="236.0" font-size="30" font-weight="800" fill="#16233f" text-anchor="start">Headline at least twice the body</text><text x="24.0" y="274.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Body text with leading of 1.3 to 1.5 times its</text><text x="24.0" y="298.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">size is comfortable to read, line after line,</text><text x="24.0" y="322.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">aligned left with a ragged right edge.</text><text x="24.0" y="370.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">16 px text on 24 px lines is a leading of 1.5. At most two typefaces; pair</text><text x="24.0" y="391.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">contrasting ones; keep body text plain. Avoid long runs of capitals.</text><text x="624.0" y="421.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>