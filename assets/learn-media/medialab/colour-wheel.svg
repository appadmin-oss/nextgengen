<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 577" width="640" height="577" role="img" aria-labelledby="t d"><title id="t">The colour wheel</title><desc id="d">A twelve-hue colour wheel: complementary colours sit opposite (blue and orange); analogous colours are neighbours (green, blue-green, blue). Below, a 60-30-10 bar: 60% main colour, 30% secondary, 10% accent for the most important thing.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="577" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The colour wheel: opposites contrast, neighbours calm</text><path d="M153.8 94.8 A140 140 0 0 1 226.2 94.8 L208.1 162.4 A70 70 0 0 0 171.9 162.4 Z" fill="#e53935" stroke="#fff" stroke-width="2"/><path d="M226.2 94.8 A140 140 0 0 1 289.0 131.0 L239.5 180.5 A70 70 0 0 0 208.1 162.4 Z" fill="#f4511e" stroke="#fff" stroke-width="2"/><path d="M289.0 131.0 A140 140 0 0 1 325.2 193.8 L257.6 211.9 A70 70 0 0 0 239.5 180.5 Z" fill="#fb8c00" stroke="#fff" stroke-width="2"/><path d="M325.2 193.8 A140 140 0 0 1 325.2 266.2 L257.6 248.1 A70 70 0 0 0 257.6 211.9 Z" fill="#ffb300" stroke="#fff" stroke-width="2"/><path d="M325.2 266.2 A140 140 0 0 1 289.0 329.0 L239.5 279.5 A70 70 0 0 0 257.6 248.1 Z" fill="#fdd835" stroke="#fff" stroke-width="2"/><path d="M289.0 329.0 A140 140 0 0 1 226.2 365.2 L208.1 297.6 A70 70 0 0 0 239.5 279.5 Z" fill="#9ccc65" stroke="#fff" stroke-width="2"/><path d="M226.2 365.2 A140 140 0 0 1 153.8 365.2 L171.9 297.6 A70 70 0 0 0 208.1 297.6 Z" fill="#43a047" stroke="#fff" stroke-width="2"/><path d="M153.8 365.2 A140 140 0 0 1 91.0 329.0 L140.5 279.5 A70 70 0 0 0 171.9 297.6 Z" fill="#00897b" stroke="#fff" stroke-width="2"/><path d="M91.0 329.0 A140 140 0 0 1 54.8 266.2 L122.4 248.1 A70 70 0 0 0 140.5 279.5 Z" fill="#1e88e5" stroke="#fff" stroke-width="2"/><path d="M54.8 266.2 A140 140 0 0 1 54.8 193.8 L122.4 211.9 A70 70 0 0 0 122.4 248.1 Z" fill="#3949ab" stroke="#fff" stroke-width="2"/><path d="M54.8 193.8 A140 140 0 0 1 91.0 131.0 L140.5 180.5 A70 70 0 0 0 122.4 211.9 Z" fill="#8e24aa" stroke="#fff" stroke-width="2"/><path d="M91.0 131.0 A140 140 0 0 1 153.8 94.8 L171.9 162.4 A70 70 0 0 0 140.5 180.5 Z" fill="#d81b60" stroke="#fff" stroke-width="2"/><line x1="99.9" y1="282.0" x2="280.1" y2="178.0" stroke="#16233f" stroke-width="3"/><circle cx="99.9" cy="282.0" r="7.0" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><circle cx="280.1" cy="178.0" r="7.0" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M220.2 379.0 A152 152 0 0 1 45.9 278.3" fill="none" stroke="#16233f" stroke-width="4" stroke-linecap="round"/><text x="360.0" y="100.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Complementary</text><text x="360.0" y="124.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">opposite: blue and orange,</text><text x="360.0" y="146.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the straight line</text><text x="360.0" y="190.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Analogous</text><text x="360.0" y="214.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">neighbours: green, blue-green,</text><text x="360.0" y="236.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">blue, the outer arc</text><text x="360.0" y="280.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Monochrome</text><text x="360.0" y="304.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">shades of one colour</text><text x="24.0" y="404.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">60-30-10: main, secondary, accent</text><rect x="24.0" y="418.0" width="355.2" height="40.0" rx="0" fill="#dfe8f5" stroke="#16233f" stroke-width="1"/><rect x="379.2" y="418.0" width="177.6" height="40.0" rx="0" fill="#1e3a8a" stroke="#16233f" stroke-width="1"/><rect x="556.8" y="418.0" width="59.2" height="40.0" rx="0" fill="#fb8c00" stroke="#16233f" stroke-width="1"/><text x="36.0" y="444.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">60% background</text><text x="391.2" y="444.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="start">30%</text><text x="616.0" y="480.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">10% accent: the headline or button</text><text x="24.0" y="516.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Text must still read: aim for 4.5:1, and never rely on red against green</text><text x="24.0" y="537.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">alone — about 1 in 12 men cannot easily tell them apart.</text><text x="624.0" y="567.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>