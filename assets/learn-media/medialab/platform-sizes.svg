<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 441" width="640" height="441" role="img" aria-labelledby="t d"><title id="t">Social media sizes</title><desc id="d">Common sizes drawn to the same scale: a 1080 × 1350 feed post (4:5), a 1080 × 1080 square, a 1080 × 1920 Story (9:16) whose top and bottom are covered by buttons, and a 1200 × 675 landscape image.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="441" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Start at the right size: the frames, to scale</text><rect x="24.0" y="151.5" width="118.8" height="148.5" rx="4" fill="#dff3f7" stroke="#16233f" stroke-width="1.5"/><text x="24.0" y="324.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Feed 4:5</text><text x="24.0" y="346.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">1080 × 1350</text><rect x="158.8" y="181.2" width="118.8" height="118.8" rx="4" fill="#dff3f7" stroke="#16233f" stroke-width="1.5"/><text x="158.8" y="324.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Square 1:1</text><text x="158.8" y="346.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">1080 × 1080</text><rect x="293.6" y="88.8" width="118.8" height="211.2" rx="4" fill="#dff3f7" stroke="#16233f" stroke-width="1.5"/><rect x="293.6" y="88.8" width="118.8" height="26.0" rx="4" fill="#fde5df" stroke="#16233f" stroke-width="1"/><rect x="293.6" y="266.0" width="118.8" height="34.0" rx="4" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="293.6" y="324.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Stories 9:16</text><text x="293.6" y="346.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">1080 × 1920</text><rect x="428.4" y="225.8" width="132.0" height="74.2" rx="4" fill="#dff3f7" stroke="#16233f" stroke-width="1.5"/><text x="428.4" y="324.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">X, LinkedIn 16:9</text><text x="428.4" y="346.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">1200 × 675</text><text x="24.0" y="380.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Red bands on the Story frame: buttons and the profile name cover</text><text x="24.0" y="401.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">them, so keep text clear. One message, six words or fewer, large type.</text><text x="624.0" y="431.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>