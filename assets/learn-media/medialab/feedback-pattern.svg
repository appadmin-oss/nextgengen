<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255" role="img" aria-labelledby="t d"><title id="t">Giving feedback</title><desc id="d">Useful feedback in three parts: the specific thing (the headline is pale yellow on white), its effect (hard to read from a distance), and a suggestion (try navy).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="255" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Feedback that helps: thing, effect, suggestion</text><rect x="24.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="114.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">The specific thing</text><text x="114.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">“The headline is</text><text x="114.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">pale yellow on</text><text x="114.0" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">white…”</text><line x1="207.0" y1="110.0" x2="227.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Its effect</text><text x="320.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">“…so it&#x27;s hard to</text><text x="320.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">read from a</text><text x="320.0" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">distance…”</text><line x1="413.0" y1="110.0" x2="433.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="436.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="526.0" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">A suggestion</text><text x="526.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">“…try navy.”</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Not “it&#x27;s bad” or “it&#x27;s nice”. Praise specific things in public; raise</text><text x="24.0" y="211.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">problems in private.</text><text x="624.0" y="245.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>