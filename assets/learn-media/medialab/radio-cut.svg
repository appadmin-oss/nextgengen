<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 369" width="640" height="369" role="img" aria-labelledby="t d"><title id="t">Radio cut and B-roll</title><desc id="d">First the radio cut: interview answers in story order make sense by sound alone. Then B-roll clips are laid over the joins while the interview audio continues underneath.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="369" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Build the radio cut first, then cover it with B-roll</text><text x="24.0" y="78.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">1  Radio cut: interview answers only, in story order</text><rect x="24.0" y="90.0" width="150.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="180.0" y="90.0" width="140.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="326.0" y="90.0" width="160.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="492.0" y="90.0" width="124.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="24.0" y="160.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">2  B-roll laid over it, hiding the joins</text><rect x="24.0" y="210.0" width="150.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="180.0" y="210.0" width="140.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="326.0" y="210.0" width="160.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="492.0" y="210.0" width="124.0" height="34.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="144.0" y="172.0" width="80.0" height="34.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="314.0" y="172.0" width="70.0" height="34.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="464.0" y="172.0" width="90.0" height="34.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="184.0" y="270.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">picture: B-roll</text><text x="616.0" y="270.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">sound: the interview carries on</text><text x="24.0" y="308.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Log the footage first. When you shorten what someone said, the</text><text x="24.0" y="329.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">meaning must stay the same.</text><text x="624.0" y="359.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>