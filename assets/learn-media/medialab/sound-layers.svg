<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 383" width="640" height="383" role="img" aria-labelledby="t d"><title id="t">Soundtrack layers</title><desc id="d">Three sound layers on a timeline — dialogue, music and atmosphere — with the music level dipping down every time someone speaks.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="383" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three layers of sound, and music dipped under speech</text><text x="24.0" y="104.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Dialogue</text><rect x="150.0" y="70.0" width="466.0" height="60.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="24.0" y="184.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Music</text><rect x="150.0" y="150.0" width="466.0" height="60.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="24.0" y="264.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Atmosphere</text><rect x="150.0" y="230.0" width="466.0" height="60.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="219.9" y="78.0" width="116.5" height="44.0" rx="3" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="429.6" y="78.0" width="116.5" height="44.0" rx="3" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><path d="M150.0 170.0 L205.9 170.0 L219.9 196.0 L336.4 196.0 L350.4 170.0 L415.6 170.0 L429.6 196.0 L546.1 196.0 L560.1 170.0 L616.0 170.0" fill="none" stroke="#7a4a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 260 L616 260" fill="none" stroke="#1d6b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="278.1" y="192.0" font-size="16" font-weight="700" fill="#7a4a00" text-anchor="middle">music dips</text><text x="24.0" y="322.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Use music licensed for your use and credit it; add subtitles, because</text><text x="24.0" y="343.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">most people watch social video with the sound off.</text><text x="624.0" y="373.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>