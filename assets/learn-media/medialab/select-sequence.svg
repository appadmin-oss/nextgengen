<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 449" width="640" height="449" role="img" aria-labelledby="t d"><title id="t">Selecting and sequencing</title><desc id="d">About 60 photos narrow to about 35 after removing blurred, badly lit or unconsented shots, then to the strongest 5–8; the final sequence varies wide, medium and close shots.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="449" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Choosing is where the story is made</text><rect x="24.0" y="60.0" width="592.0" height="52.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="320.0" y="82.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">All your photos</text><text x="320.0" y="104.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">about 60</text><rect x="74.0" y="122.0" width="492.0" height="52.0" rx="8" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="320.0" y="144.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Remove blurred, badly lit, no consent</text><text x="320.0" y="166.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">about 35</text><rect x="124.0" y="184.0" width="392.0" height="52.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="320.0" y="206.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">The strongest, each adding something new</text><text x="320.0" y="228.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">5 to 8</text><rect x="24.0" y="260.0" width="88.0" height="70.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="68.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Wide</text><rect x="124.0" y="276.0" width="88.0" height="54.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="168.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Medium</text><rect x="224.0" y="290.0" width="88.0" height="40.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="268.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Close</text><rect x="324.0" y="260.0" width="88.0" height="70.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="368.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Wide</text><rect x="424.0" y="290.0" width="88.0" height="40.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="468.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Close</text><rect x="524.0" y="276.0" width="88.0" height="54.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="568.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Medium</text><text x="24.0" y="388.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Vary wide, medium and close so the rhythm does not go flat; open</text><text x="24.0" y="409.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">strong, end with feeling; edit colour and brightness to match.</text><text x="624.0" y="439.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>