<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 517" width="640" height="517" role="img" aria-labelledby="t d"><title id="t">Light direction</title><desc id="d">Top view of light around a face: from the side it shows shape and texture; from the front (behind the camera) it is even but can be flat; from behind it makes a silhouette with glowing edges.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="517" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Where the light comes from, seen from above</text><circle cx="320.0" cy="250.0" r="34.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="320.0" y="256.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">face</text><rect x="300.0" y="366.0" width="40.0" height="26.0" rx="4" fill="#16233f" stroke="none" stroke-width="1"/><text x="320.0" y="416.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">camera</text><circle cx="320.0" cy="100.0" r="18.0" fill="#fff3c4" stroke="#7a4a00" stroke-width="2"/><line x1="320.0" y1="126.0" x2="320.0" y2="204.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="350.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Back</text><text x="350.0" y="118.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">silhouette, glowing edges</text><circle cx="170.0" cy="250.0" r="18.0" fill="#fff3c4" stroke="#7a4a00" stroke-width="2"/><line x1="196.0" y1="250.0" x2="274.0" y2="250.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="170.0" y="220.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Side</text><text x="166.0" y="294.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">shape and texture</text><circle cx="426.1" cy="356.1" r="18.0" fill="#fff3c4" stroke="#7a4a00" stroke-width="2"/><line x1="407.7" y1="337.7" x2="352.5" y2="282.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="454.1" y="354.1" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Front</text><text x="454.1" y="376.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">even, can look flat</text><text x="24.0" y="456.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Midday sun is hard: stand people in open shade facing the bright area.</text><text x="24.0" y="477.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The hour after sunrise and before sunset is soft, warm and low.</text><text x="624.0" y="507.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>