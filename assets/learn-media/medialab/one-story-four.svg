<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 431" width="640" height="431" role="img" aria-labelledby="t d"><title id="t">One story, four pieces</title><desc id="d">One community story at the centre, told through four linked pieces — a 2–3 minute documentary, a 5–8 image photo story, a 300-word article and promotional graphics — sharing one visual identity.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="431" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">One community story, four pieces, one identity</text><rect x="220.0" y="174.0" width="200.0" height="72.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="204.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">One story</text><text x="320.0" y="230.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">one identity</text><rect x="25.0" y="78.0" width="190.0" height="64.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="120.0" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Documentary</text><text x="120.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">2–3 minutes</text><line x1="215.0" y1="110.0" x2="220.0" y2="190.0" stroke="#3d4560" stroke-width="2"/><rect x="425.0" y="78.0" width="190.0" height="64.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="520.0" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Photo story</text><text x="520.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">5–8 images</text><line x1="425.0" y1="110.0" x2="420.0" y2="190.0" stroke="#3d4560" stroke-width="2"/><rect x="25.0" y="278.0" width="190.0" height="64.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="120.0" y="303.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Article</text><text x="120.0" y="328.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">about 300 words</text><line x1="215.0" y1="310.0" x2="220.0" y2="230.0" stroke="#3d4560" stroke-width="2"/><rect x="425.0" y="278.0" width="190.0" height="64.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="520.0" y="303.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Graphics</text><text x="520.0" y="328.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">poster and posts</text><line x1="425.0" y1="310.0" x2="420.0" y2="230.0" stroke="#3d4560" stroke-width="2"/><text x="24.0" y="370.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Shared colours, fonts and title treatment; the same spelling of names</text><text x="24.0" y="391.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and the same facts in every piece.</text><text x="624.0" y="421.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>