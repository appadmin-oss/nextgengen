<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 409" width="640" height="409" role="img" aria-labelledby="t d"><title id="t">Kanban board</title><desc id="d">A Kanban board with To do, Doing and Done columns, one card per small task and one owner on each card.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="409" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">To do, Doing, Done: one card per task, one owner per</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">card</text><rect x="24.0" y="86.0" width="186.7" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="114.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">To do</text><rect x="34.0" y="130.0" width="166.7" height="58.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="44.0" y="154.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Book the location</text><text x="44.0" y="175.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">· Ife</text><rect x="34.0" y="198.0" width="166.7" height="58.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="44.0" y="222.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Write captions ·</text><text x="44.0" y="243.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tobi</text><rect x="226.7" y="86.0" width="186.7" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="238.7" y="114.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Doing</text><rect x="236.7" y="130.0" width="166.7" height="58.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="246.7" y="154.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Film B-roll at the</text><text x="246.7" y="175.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">market · Ada</text><rect x="429.3" y="86.0" width="186.7" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="441.3" y="114.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Done</text><rect x="439.3" y="130.0" width="166.7" height="58.0" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="449.3" y="154.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Write interview</text><text x="449.3" y="175.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">questions · Ada</text><text x="24.0" y="348.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A five-minute stand-up each session: what I finished, what I am doing</text><text x="24.0" y="369.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">next, what is blocking me. Raise a slipping deadline early.</text><text x="624.0" y="399.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>