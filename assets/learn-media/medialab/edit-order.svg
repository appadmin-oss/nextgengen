<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" width="640" height="234" role="img" aria-labelledby="t d"><title id="t">Photo editing order</title><desc id="d">Photo edits in order: crop and straighten, exposure, contrast with highlights and shadows, colour and white balance, then a little sharpening — never adding or removing content.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="234" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Edit in this order: each step affects the next</text><rect x="24.0" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.8" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">1 Crop</text><text x="76.8" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">and level</text><line x1="132.6" y1="99.5" x2="142.6" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="145.6" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="198.4" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">2</text><text x="198.4" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Exposure</text><text x="198.4" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">brightness</text><line x1="254.2" y1="99.5" x2="264.2" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="267.2" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">3 Contrast</text><text x="320.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">lights and</text><text x="320.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">darks</text><line x1="375.8" y1="99.5" x2="385.8" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="388.8" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="441.6" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">4 Colour</text><text x="441.6" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">white</text><text x="441.6" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">balance</text><line x1="497.4" y1="99.5" x2="507.4" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="510.4" y="60.0" width="105.6" height="79.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="563.2" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">5 Sharpen</text><text x="563.2" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">a little, last</text><text x="24.0" y="169.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Improving light and colour is editing. Adding or removing people or</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">objects, or changing what happened, makes a photograph misleading.</text><text x="624.0" y="224.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>