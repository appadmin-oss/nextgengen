<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 499" width="640" height="499" role="img" aria-labelledby="t d"><title id="t">A poster set</title><desc id="d">Three posters that belong together: the same headline bar, layout grid, colours and logo position, each with its own photo and headline — the problem, the effect, the action.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="499" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A set: change the image and headline, keep everything</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">else</text><rect x="24.0" y="86.0" width="186.0" height="260.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><rect x="36.0" y="98.0" width="162.0" height="50.0" rx="3" fill="#f5b026" stroke="none" stroke-width="1"/><text x="44.0" y="118.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Bags block</text><text x="44.0" y="139.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">gutters</text><rect x="36.0" y="158.0" width="162.0" height="110.0" rx="3" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="117.0" y="218.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">photo 1</text><rect x="36.0" y="282.0" width="120.0" height="10.0" rx="3" fill="#c9cedb" stroke="none" stroke-width="1"/><rect x="36.0" y="300.0" width="90.0" height="10.0" rx="3" fill="#c9cedb" stroke="none" stroke-width="1"/><circle cx="182.0" cy="314.0" r="14.0" fill="#16233f" stroke="none" stroke-width="1"/><rect x="226.0" y="86.0" width="186.0" height="260.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><rect x="238.0" y="98.0" width="162.0" height="50.0" rx="3" fill="#f5b026" stroke="none" stroke-width="1"/><text x="246.0" y="118.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Floods reach</text><text x="246.0" y="139.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">homes</text><rect x="238.0" y="158.0" width="162.0" height="110.0" rx="3" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="319.0" y="218.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">photo 2</text><rect x="238.0" y="282.0" width="120.0" height="10.0" rx="3" fill="#c9cedb" stroke="none" stroke-width="1"/><rect x="238.0" y="300.0" width="90.0" height="10.0" rx="3" fill="#c9cedb" stroke="none" stroke-width="1"/><circle cx="384.0" cy="314.0" r="14.0" fill="#16233f" stroke="none" stroke-width="1"/><rect x="428.0" y="86.0" width="186.0" height="260.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><rect x="440.0" y="98.0" width="162.0" height="50.0" rx="3" fill="#f5b026" stroke="none" stroke-width="1"/><text x="448.0" y="118.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Bring your own</text><text x="448.0" y="139.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">bag</text><rect x="440.0" y="158.0" width="162.0" height="110.0" rx="3" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="521.0" y="218.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">photo 3</text><rect x="440.0" y="282.0" width="120.0" height="10.0" rx="3" fill="#c9cedb" stroke="none" stroke-width="1"/><rect x="440.0" y="300.0" width="90.0" height="10.0" rx="3" fill="#c9cedb" stroke="none" stroke-width="1"/><circle cx="586.0" cy="314.0" r="14.0" fill="#16233f" stroke="none" stroke-width="1"/><text x="24.0" y="376.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Same: colours, fonts, grid, logo position.</text><text x="24.0" y="402.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start">Changes: the image and the headline.</text><text x="24.0" y="438.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Poster 1 states the problem, poster 2 the effect on people, poster 3 the</text><text x="24.0" y="459.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">action. Then the 3-second test.</text><text x="624.0" y="489.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>