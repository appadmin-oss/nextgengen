<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392" role="img" aria-labelledby="t d"><title id="t">A storyboard</title><desc id="d">A three-frame storyboard: shot 1 wide at eye level of the market at dawn, shot 2 medium of the tailor threading her machine, shot 3 a low close-up of her face — each with sound and length.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="392" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A storyboard: one box per shot, with notes</text><rect x="24.0" y="60.0" width="186.0" height="110.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="117.0" y="122.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">shot 1</text><text x="24.0" y="196.0" font-size="16" font-weight="800" fill="#0b6274" text-anchor="start">WIDE · eye level</text><text x="24.0" y="220.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Market at dawn</text><text x="24.0" y="242.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">street sounds · 4 s</text><rect x="226.0" y="60.0" width="186.0" height="110.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="319.0" y="122.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">shot 2</text><text x="226.0" y="196.0" font-size="16" font-weight="800" fill="#0b6274" text-anchor="start">MEDIUM · still</text><text x="226.0" y="220.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Tailor threads</text><text x="226.0" y="241.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">machine</text><text x="226.0" y="263.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">machine starts · 3 s</text><rect x="428.0" y="60.0" width="186.0" height="110.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="521.0" y="122.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">shot 3</text><text x="428.0" y="196.0" font-size="16" font-weight="800" fill="#0b6274" text-anchor="start">CLOSE-UP · low</text><text x="428.0" y="220.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Her face, smiling</text><text x="428.0" y="242.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“I started with one…” ·</text><text x="428.0" y="263.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">5 s</text><text x="24.0" y="310.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Each frame: shot size, angle, movement, what happens, what is heard,</text><text x="24.0" y="331.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">roughly how long. Stick figures are fine; someone else should be able</text><text x="24.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">to film it.</text><text x="624.0" y="382.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>