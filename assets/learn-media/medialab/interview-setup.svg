<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 437" width="640" height="437" role="img" aria-labelledby="t d"><title id="t">Interview set-up</title><desc id="d">Top view of an interview: the interviewer sits beside the camera, the speaker looks at the interviewer rather than the lens, the microphone is close, and a window gives soft side light.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="437" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">An interview set-up, seen from above</text><rect x="180.0" y="290.0" width="40.0" height="26.0" rx="4" fill="#16233f" stroke="none" stroke-width="1"/><text x="200.0" y="342.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">camera</text><circle cx="270.0" cy="302.0" r="18.0" fill="#dff3f7" stroke="#16233f" stroke-width="1.5"/><text x="298.0" y="308.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">interviewer, beside the camera</text><circle cx="220.0" cy="160.0" r="40.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="220.0" y="166.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">speaker</text><line x1="238.0" y1="198.0" x2="262.0" y2="278.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="270.0" y="224.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">looks at the interviewer, not the lens</text><circle cx="174.0" cy="198.0" r="6.0" fill="#9c3119" stroke="none" stroke-width="1"/><text x="160.0" y="204.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">mic close</text><rect x="30.0" y="100.0" width="18.0" height="120.0" rx="0" fill="#fff3c4" stroke="#7a4a00" stroke-width="2"/><text x="60.0" y="90.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">window: soft light</text><text x="24.0" y="376.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Frame a medium close-up, slightly off-centre. Open questions, one at a</text><text x="24.0" y="397.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">time, then stay quiet — and no “mm-hm” while they speak.</text><text x="624.0" y="427.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>