<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 439" width="640" height="439" role="img" aria-labelledby="t d"><title id="t">Three-act structure</title><desc id="d">Three acts with a tension curve: the beginning introduces the person and their world, tension rises through the middle as they face the problem, and the end shows what changed.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="439" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three acts: a person, a problem, a change</text><rect x="40.0" y="60.0" width="140.0" height="220.0" rx="0" fill="#fdf0d2" stroke="none" stroke-width="1"/><rect x="180.0" y="60.0" width="280.0" height="220.0" rx="0" fill="#fde5df" stroke="none" stroke-width="1"/><rect x="460.0" y="60.0" width="140.0" height="220.0" rx="0" fill="#e3f1e6" stroke="none" stroke-width="1"/><path d="M40.0 250 C208.0 230 348.0 160 443.2 90 S544.0 220 600.0 230" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="110.0" y="306.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Beginning</text><text x="110.0" y="328.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">the person, their</text><text x="110.0" y="349.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">world</text><text x="320.0" y="306.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Middle</text><text x="320.0" y="328.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">the problem, what they try</text><text x="530.0" y="306.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">End</text><text x="530.0" y="328.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">what changed</text><text x="320.0" y="86.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">tension keeps us watching</text><text x="24.0" y="378.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Show, don&#x27;t tell: “She walked to the borehole twice before school,</text><text x="24.0" y="399.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">every day, for a year.”</text><text x="624.0" y="429.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>