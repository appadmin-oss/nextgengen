<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" role="img" aria-labelledby="t d"><title id="t">Branches and merging</title><desc id="d">A branch leaves main, carries three commits for one fix (“Fix crash when name is empty”), and is merged back into main after a teammate reviews it.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="352" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Branches let people work in parallel, then merge</text><line x1="40.0" y1="100.0" x2="600.0" y2="100.0" stroke="#0b6274" stroke-width="4"/><text x="40.0" y="84.0" font-size="16" font-weight="800" fill="#0b6274" text-anchor="start">main</text><path d="M150 100 C190 100 190 190 230 190 L430 190 C470 190 470 100 510 100" fill="none" stroke="#9c3119" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="330.0" y="224.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle">branch: fix-empty-name</text><circle cx="80.0" cy="100.0" r="9.0" fill="#ffffff" stroke="#0b6274" stroke-width="3"/><circle cx="150.0" cy="100.0" r="9.0" fill="#ffffff" stroke="#0b6274" stroke-width="3"/><circle cx="330.0" cy="100.0" r="9.0" fill="#ffffff" stroke="#0b6274" stroke-width="3"/><circle cx="510.0" cy="100.0" r="9.0" fill="#ffffff" stroke="#0b6274" stroke-width="3"/><circle cx="590.0" cy="100.0" r="9.0" fill="#ffffff" stroke="#0b6274" stroke-width="3"/><circle cx="260.0" cy="190.0" r="9.0" fill="#ffffff" stroke="#9c3119" stroke-width="3"/><circle cx="330.0" cy="190.0" r="9.0" fill="#ffffff" stroke="#9c3119" stroke-width="3"/><circle cx="400.0" cy="190.0" r="9.0" fill="#ffffff" stroke="#9c3119" stroke-width="3"/><text x="510.0" y="82.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">merge after review</text><rect x="24.0" y="250.0" width="592.0" height="60.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="276.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Commit message:</text><text x="40.0" y="298.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“Fix crash when name is empty”</text><text x="624.0" y="342.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>