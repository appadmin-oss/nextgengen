<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 347" width="640" height="347" role="img" aria-labelledby="t d"><title id="t">Data minimisation</title><desc id="d">A field audit: keep the name, replace date of birth with an age range, delete the unused home address, and keep the parent&#x27;s phone with restricted access.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="347" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Audit every field: keep it, make it less sensitive, or</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">delete it</text><rect x="24.0" y="86.0" width="170.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Field</text><rect x="194.0" y="86.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="202.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Used for?</text><rect x="394.0" y="86.0" width="222.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="402.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Decision</text><rect x="24.0" y="120.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Name</text><rect x="194.0" y="120.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="202.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">the register</text><rect x="394.0" y="120.0" width="222.0" height="34.0" rx="0" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="402.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Keep</text><rect x="24.0" y="154.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Date of birth</text><rect x="194.0" y="154.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="202.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">age group only</text><rect x="394.0" y="154.0" width="222.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="402.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Age range</text><rect x="24.0" y="188.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="211.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Home address</text><rect x="194.0" y="188.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="202.0" y="211.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">nothing yet</text><rect x="394.0" y="188.0" width="222.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="402.0" y="211.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Delete</text><rect x="24.0" y="222.0" width="170.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="245.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Phone</text><rect x="194.0" y="222.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="202.0" y="245.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">parent contact</text><rect x="394.0" y="222.0" width="222.0" height="34.0" rx="0" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="402.0" y="245.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Keep, restricted</text><text x="24.0" y="286.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Data you never collected cannot leak. Decide how long each field is</text><text x="24.0" y="307.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">kept and who can see it — the starting setting is private.</text><text x="624.0" y="337.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>