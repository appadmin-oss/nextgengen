<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 321" width="640" height="321" role="img" aria-labelledby="t d"><title id="t">Responding to risks</title><desc id="d">Risks scored likelihood × damage: generator failure 16, prevent by testing weekly; a key person ill 12, prepare by training a second person; late payment 12, keep a reserve; minor theft 4, accept.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="321" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">For the top risks: prevent, prepare or accept</text><rect x="24.0" y="60.0" width="176.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Risk</text><rect x="200.0" y="60.0" width="120.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="208.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Score</text><rect x="320.0" y="60.0" width="104.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="328.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Decide</text><rect x="424.0" y="60.0" width="192.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="432.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Action</text><rect x="24.0" y="94.0" width="176.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Generator fails</text><rect x="200.0" y="94.0" width="120.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="208.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">4 × 4 = 16</text><rect x="320.0" y="94.0" width="104.0" height="34.0" rx="0" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="328.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Prevent</text><rect x="424.0" y="94.0" width="192.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="432.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">test it weekly</text><rect x="24.0" y="128.0" width="176.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Key person ill</text><rect x="200.0" y="128.0" width="120.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="208.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">3 × 4 = 12</text><rect x="320.0" y="128.0" width="104.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="328.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Prepare</text><rect x="424.0" y="128.0" width="192.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="432.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">train a second person</text><rect x="24.0" y="162.0" width="176.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Customer pays late</text><rect x="200.0" y="162.0" width="120.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="208.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">4 × 3 = 12</text><rect x="320.0" y="162.0" width="104.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="328.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Prepare</text><rect x="424.0" y="162.0" width="192.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="432.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">keep a cash reserve</text><rect x="24.0" y="196.0" width="176.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Minor theft</text><rect x="200.0" y="196.0" width="120.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="208.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">2 × 2 = 4</text><rect x="320.0" y="196.0" width="104.0" height="34.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="328.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Accept</text><rect x="424.0" y="196.0" width="192.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="432.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">write it down</text><text x="24.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Score each risk likely × damaging, 1–5 each; the highest scores get</text><text x="24.0" y="281.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">attention first. Prevent lowers the chance; prepare lowers the damage.</text><text x="624.0" y="311.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>