<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 437" width="640" height="437" role="img" aria-labelledby="t d"><title id="t">Phone order process</title><desc id="d">A phone-order flowchart: take the name and write the order, decide “In stock?” — yes, confirm price and delivery; no, offer the alternative, and if refused, note it and end politely.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="437" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A written process with its decision points: taking a</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">phone order</text><ellipse cx="200" cy="108" rx="110" ry="22" fill="#fdf0d2" stroke="#16233f"/><text x="200.0" y="114.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Customer calls</text><line x1="200.0" y1="130.0" x2="200.0" y2="150.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="70.0" y="152.0" width="260.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="200.0" y="178.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Take name, write on order sheet</text><line x1="200.0" y1="192.0" x2="200.0" y2="212.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="200,214 290,246 200,278 110,246" fill="#ffffff" stroke="#16233f" stroke-width="1.5"/><text x="200.0" y="252.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">In stock?</text><line x1="200.0" y1="278.0" x2="200.0" y2="308.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="210.0" y="298.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">yes</text><rect x="70.0" y="310.0" width="260.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="200.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Confirm price and delivery</text><line x1="290.0" y1="246.0" x2="370.0" y2="246.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="326.0" y="236.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">no</text><rect x="372.0" y="226.0" width="244.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="494.0" y="252.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Offer the alternative</text><line x1="494.0" y1="266.0" x2="494.0" y2="308.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="504.0" y="292.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">refuses</text><rect x="372.0" y="310.0" width="244.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="494.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Note it, end politely</text><text x="24.0" y="376.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Steps start with a verb; every decision says what decides it; the</text><text x="24.0" y="397.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">process has an owner. Test it by handing it to a classmate.</text><text x="624.0" y="427.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>