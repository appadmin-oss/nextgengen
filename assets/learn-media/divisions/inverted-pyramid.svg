<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 407" width="640" height="407" role="img" aria-labelledby="t d"><title id="t">The inverted pyramid</title><desc id="d">An upside-down pyramid: the key message at the wide top, then key details, then background, then extras at the narrow bottom, so a reader who stops early still has the point.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="407" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The inverted pyramid: most important first</text><polygon points="24.0,60 616.0,60 561.0,120 79.0,120" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="320.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">The key message</text><text x="320.0" y="108.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">the one line most people will read</text><polygon points="79.0,124 561.0,124 506.0,184 134.0,184" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="320.0" y="150.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Key details</text><text x="320.0" y="172.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">who, what, when, where</text><polygon points="134.0,188 506.0,188 451.0,248 189.0,248" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="320.0" y="224.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Background</text><polygon points="189.0,252 451.0,252 396.0,312 244.0,312" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="320.0" y="288.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Extras</text><text x="24.0" y="346.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Cut ruthlessly, be concrete — “Last term, 40 children built their first</text><text x="24.0" y="367.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">website” — and read it aloud.</text><text x="624.0" y="397.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>