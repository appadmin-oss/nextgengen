<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 393" width="640" height="393" role="img" aria-labelledby="t d"><title id="t">Vanity and action metrics</title><desc id="d">For a sign-up goal, 4,200 views, 380 likes and 95 clicks flatter; the 31 sign-ups are the number that says whether it worked. (Bars drawn on a compressed scale.)</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="393" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Measure the action you asked for, not the biggest</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">number</text><text x="24.0" y="114.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Views</text><rect x="150.0" y="94.0" width="220.3" height="32.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="380.3" y="116.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">4,200 · a scroll-past counts</text><text x="24.0" y="170.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Likes</text><rect x="150.0" y="150.0" width="66.3" height="32.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="226.3" y="172.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">380 · easy to give</text><text x="24.0" y="226.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Link clicks</text><rect x="150.0" y="206.0" width="33.1" height="32.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="193.1" y="228.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">95 · closer</text><text x="24.0" y="282.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Sign-ups</text><rect x="150.0" y="262.0" width="30.0" height="32.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="190.0" y="284.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">31 · the goal</text><text x="24.0" y="332.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Decide the measure before you publish. Here the goal was sign-ups: 31</text><text x="24.0" y="353.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">is the answer to “did it work?”, however large the views look.</text><text x="624.0" y="383.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>