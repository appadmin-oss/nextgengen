<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" width="640" height="388" role="img" aria-labelledby="t d"><title id="t">Estimate against real costs</title><desc id="d">An example re-costing: the estimate of ₦160 a cup counted ingredients and a little packaging; real prices add more packaging, transport and waste, making ₦250 a cup.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="388" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Re-costing: the estimate against real market prices</text><text x="24.0" y="80.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Week 3 estimate</text><rect x="24.0" y="90.0" width="280.0" height="40.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="304.0" y="90.0" width="40.0" height="40.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="354.0" y="116.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">₦160 a cup</text><text x="24.0" y="170.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Real prices</text><rect x="24.0" y="180.0" width="300.0" height="40.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="324.0" y="180.0" width="120.0" height="40.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><rect x="444.0" y="180.0" width="50.0" height="40.0" rx="0" fill="#5b2a86" stroke="#16233f" stroke-width="1"/><rect x="494.0" y="180.0" width="30.0" height="40.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="534.0" y="206.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">₦250 a cup</text><rect x="24.0" y="250.0" width="22.0" height="22.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="54.0" y="267.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Ingredients</text><rect x="174.0" y="250.0" width="22.0" height="22.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="204.0" y="267.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Packaging</text><rect x="324.0" y="250.0" width="22.0" height="22.0" rx="0" fill="#5b2a86" stroke="#16233f" stroke-width="1"/><text x="354.0" y="267.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Transport</text><rect x="474.0" y="250.0" width="22.0" height="22.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="504.0" y="267.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Waste</text><text x="24.0" y="306.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">An example: the estimate missed packaging, transport and waste, so</text><text x="24.0" y="327.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the cost per cup rose from ₦160 to ₦250 and break-even went up. Date</text><text x="24.0" y="348.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">every costing.</text><text x="624.0" y="378.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>