<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d"><title id="t">The shape of a critique</title><desc id="d">A critique in three moves: describe what you saw or heard without judging, say what it did to you, then offer one specific thing to try.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="276" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A critique in three moves</text><rect x="24.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="114.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">What I saw or</text><text x="114.0" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">heard</text><text x="114.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">describe, no</text><text x="114.0" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">judging</text><line x1="207.0" y1="110.0" x2="227.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="103.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">What it did to me</text><text x="320.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">the effect, honestly</text><line x1="413.0" y1="110.0" x2="433.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="436.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="526.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">One thing to try</text><text x="526.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">specific, the maker</text><text x="526.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">may take it or leave</text><text x="526.0" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">it</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Observation the maker cannot argue with, response that is your honest</text><text x="24.0" y="211.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">experience, a suggestion they are free to use. Receive it in silence and</text><text x="24.0" y="232.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">write it down.</text><text x="624.0" y="266.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>