<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 504" width="640" height="504" role="img" aria-labelledby="t d"><title id="t">The practice zone</title><desc id="d">Three rings: comfort (what you can already do) in the centre, the practice zone just beyond it where you fail sometimes, and too hard outside. Deliberate practice works in the practice zone.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="504" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Practise just beyond what you can already do</text><circle cx="320.0" cy="230.0" r="165.0" fill="#fde5df" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="230.0" r="110.0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="230.0" r="55.0" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.5"/><text x="320.0" y="236.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Comfort</text><text x="320.0" y="154.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Practice zone</text><text x="320.0" y="96.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Too hard</text><text x="24.0" y="420.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Deliberate practice works in the middle ring: one specific weakness,</text><text x="24.0" y="441.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">slow and correct, immediate feedback, short and fully focused,</text><text x="24.0" y="462.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">repeated over days.</text><text x="624.0" y="494.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>