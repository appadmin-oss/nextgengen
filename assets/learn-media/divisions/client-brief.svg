<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 461" width="640" height="461" role="img" aria-labelledby="t d"><title id="t">Working to a client brief</title><desc id="d">Write back the brief in your own words, get the client to confirm it, deliver a draft with an agreed two rounds of revisions, and treat a new concept or format as a new, separately charged job.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="461" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Working to a client brief without disputes</text><rect x="64.0" y="60.0" width="552.0" height="88.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Write back what you understood</text><text x="76.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Audience, action, format, length, deadline, budget, what they</text><text x="76.0" y="133.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">supply.</text><circle cx="40.0" cy="104.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="110.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="150.0" x2="340.0" y2="168.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="172.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="198.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Client confirms</text><text x="76.0" y="224.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Misunderstandings surface now, not after the work.</text><circle cx="40.0" cy="205.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="211.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="241.0" x2="340.0" y2="259.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="263.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="289.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Draft, then two agreed rounds of revisions</text><text x="76.0" y="315.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Changes to what was agreed.</text><circle cx="40.0" cy="296.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="302.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="332.0" x2="340.0" y2="350.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="354.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="380.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">A new concept or format is a new job</text><text x="76.0" y="406.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Quoted and charged separately.</text><circle cx="40.0" cy="387.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="393.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="624.0" y="451.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>