<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 465" width="640" height="465" role="img" aria-labelledby="t d"><title id="t">Vertical and landscape formats</title><desc id="d">A 9:16 vertical frame for phone feeds (often muted: hook in the first seconds, captions, subject centred away from the buttons) beside a 16:9 landscape frame for YouTube and screens.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="465" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">One story, two frames</text><rect x="24.0" y="60.0" width="126.6" height="225.0" rx="8" fill="#dff3f7" stroke="#16233f" stroke-width="2"/><rect x="24.0" y="60.0" width="126.6" height="36.0" rx="8" fill="#fde5df" stroke="#16233f" stroke-width="1"/><rect x="24.0" y="235.0" width="126.6" height="50.0" rx="8" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="87.3" y="178.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">keep text here</text><text x="24.0" y="313.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">9:16 vertical</text><text x="24.0" y="337.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Phones, often muted:</text><text x="24.0" y="358.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">hook in 1–3 s, captions,</text><text x="24.0" y="379.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">subject centred</text><rect x="190.6" y="60.0" width="300.0" height="168.8" rx="8" fill="#dff3f7" stroke="#16233f" stroke-width="2"/><text x="190.6" y="256.8" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">16:9 landscape</text><text x="190.6" y="280.8" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Watched with intent: room for</text><text x="190.6" y="301.8" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">context and interviews</text><text x="624.0" y="455.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>