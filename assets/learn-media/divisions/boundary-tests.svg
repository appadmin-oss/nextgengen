<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 301" width="640" height="301" role="img" aria-labelledby="t d"><title id="t">Boundary tests</title><desc id="d">On a number line where 5 to 25 is allowed, the four boundary tests are 4 (refuse), 5 (accept), 25 (accept) and 26 (refuse).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="301" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">If ages 5 to 25 are allowed, test 4, 5, 25 and 26</text><line x1="40.0" y1="136.0" x2="600.0" y2="136.0" stroke="#3d4560" stroke-width="2"/><rect x="102.2" y="122.0" width="414.8" height="28.0" rx="4" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="309.6" y="142.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">allowed</text><circle cx="81.5" cy="136.0" r="9.0" fill="#9c3119" stroke="none" stroke-width="1"/><text x="77.5" y="172.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">4</text><text x="77.5" y="194.0" font-size="16" font-weight="600" fill="#9c3119" text-anchor="end">refuse</text><circle cx="102.2" cy="136.0" r="9.0" fill="#1d6b30" stroke="none" stroke-width="1"/><text x="106.2" y="84.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">5</text><text x="106.2" y="106.0" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="start">accept</text><circle cx="517.0" cy="136.0" r="9.0" fill="#1d6b30" stroke="none" stroke-width="1"/><text x="513.0" y="84.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">25</text><text x="513.0" y="106.0" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="end">accept</text><circle cx="537.8" cy="136.0" r="9.0" fill="#9c3119" stroke="none" stroke-width="1"/><text x="541.8" y="172.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">26</text><text x="541.8" y="194.0" font-size="16" font-weight="600" fill="#9c3119" text-anchor="start">refuse</text><text x="24.0" y="240.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Faults hide at the edges. Also test empty, zero, very large, missing,</text><text x="24.0" y="261.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">duplicated and the wrong type — and make sure the test can fail.</text><text x="624.0" y="291.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>