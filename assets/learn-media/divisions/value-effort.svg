<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 493" width="640" height="493" role="img" aria-labelledby="t d"><title id="t">Value against effort</title><desc id="d">A 2×2 of value against effort: high value, low effort are quick wins to do first; high value, high effort are major projects to schedule; low value, low effort are fill-ins; low value, high effort are cut.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="493" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Score tasks by value against effort</text><rect x="92.0" y="60.0" width="262.0" height="150.0" rx="0" fill="#e3f1e6" stroke="#ffffff" stroke-width="3"/><text x="106.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Quick wins</text><text x="106.0" y="116.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">do these first</text><rect x="354.0" y="60.0" width="262.0" height="150.0" rx="0" fill="#fdf0d2" stroke="#ffffff" stroke-width="3"/><text x="368.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Major projects</text><text x="368.0" y="116.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">plan and schedule</text><rect x="92.0" y="210.0" width="262.0" height="150.0" rx="0" fill="#f3f5fa" stroke="#ffffff" stroke-width="3"/><text x="106.0" y="240.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Fill-ins</text><text x="106.0" y="266.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">only if there is time</text><rect x="354.0" y="210.0" width="262.0" height="150.0" rx="0" fill="#fde5df" stroke="#ffffff" stroke-width="3"/><text x="368.0" y="240.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Cut these</text><text x="368.0" y="266.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">drop deliberately</text><line x1="92.0" y1="374.0" x2="610.0" y2="374.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="354.0" y="400.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Effort →</text><line x1="78.0" y1="360.0" x2="78.0" y2="64.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text transform="translate(66 210.0) rotate(-90)" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Value →</text><text x="24.0" y="428.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Draw the line and cut. A good “no”: acknowledge, give the reason, offer</text><text x="24.0" y="449.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">what you can.</text><text x="624.0" y="483.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>