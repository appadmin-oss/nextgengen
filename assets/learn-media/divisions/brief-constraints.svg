<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 477" width="640" height="477" role="img" aria-labelledby="t d"><title id="t">Working to a brief</title><desc id="d">A brief&#x27;s constraints — purpose, audience, length, deadline, budget, must-haves and must-nots — narrow the choices down to a few strong ideas.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="477" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A tight brief removes thousands of decisions</text><rect x="24.0" y="60.0" width="592.0" height="36.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="320.0" y="84.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Purpose</text><rect x="52.0" y="100.0" width="536.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="320.0" y="124.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Audience</text><rect x="80.0" y="140.0" width="480.0" height="36.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="320.0" y="164.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Length or size</text><rect x="108.0" y="180.0" width="424.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="320.0" y="204.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Deadline</text><rect x="136.0" y="220.0" width="368.0" height="36.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="320.0" y="244.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Budget and materials</text><rect x="164.0" y="260.0" width="312.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="320.0" y="284.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Must-haves, must-nots</text><line x1="320.0" y1="306.0" x2="320.0" y2="332.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="200.0" y="336.0" width="240.0" height="44.0" rx="10" fill="#e3f1e6" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="364.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">a few strong ideas</text><text x="24.0" y="416.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">List every constraint before you begin, ask about anything unclear</text><text x="24.0" y="437.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">before, not after, then check your ideas against the brief.</text><text x="624.0" y="467.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>