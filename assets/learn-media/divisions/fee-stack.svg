<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" width="640" height="550" role="img" aria-labelledby="t d"><title id="t">Costing creative work</title><desc id="d">A fee built from materials, all of the time (planning, making, rehearsing, travel, admin), travel and equipment, and the agreed number of revisions — then said plainly: “The fee is ₦80,000.”</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="550" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">What a fee has to cover</text><rect x="24.0" y="60.0" width="330.0" height="63.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="36.0" y="97.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Materials</text><rect x="24.0" y="123.0" width="330.0" height="210.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="224.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Time: planning, making,</text><text x="36.0" y="245.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">rehearsing, travel, admin</text><rect x="24.0" y="333.0" width="330.0" height="50.4" rx="0" fill="#eee6f6" stroke="#16233f" stroke-width="1"/><text x="36.0" y="364.2" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Travel and equipment</text><rect x="24.0" y="383.4" width="330.0" height="54.6" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="36.0" y="416.7" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Agreed revisions</text><path d="M366 60 h10 V438.0 h-10" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="394.0" y="205.0" width="222.0" height="88.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="408.0" y="239.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">The fee is ₦80,000.</text><text x="408.0" y="269.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Said plainly.</text><text x="24.0" y="468.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Time is usually the biggest part and the one people forget. If a client</text><text x="24.0" y="489.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">cannot afford it, offer a smaller version, not a discount on the same</text><text x="24.0" y="510.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">work.</text><text x="624.0" y="540.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>