<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435" width="640" height="435" role="img" aria-labelledby="t d"><title id="t">The story spine</title><desc id="d">Tension rises through the story spine — a character, what they want, what blocks them, what they do — peaks at the turn, where it could go either way, then resolves in what changes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="435" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The story spine, and the turn inside it</text><path d="M40.0 260.0 L180.0 240.0 L320.0 170.0 L443.2 100.0 L600.0 200.0" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="40.0" cy="260.0" r="7.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="40.0" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Who</text><text x="40.0" y="336.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">a character</text><circle cx="180.0" cy="240.0" r="7.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="180.0" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Wants</text><text x="180.0" y="336.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">a goal</text><circle cx="320.0" cy="170.0" r="7.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="320.0" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Blocked</text><text x="320.0" y="336.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">an obstacle</text><circle cx="443.2" cy="100.0" r="7.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="443.2" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">The turn</text><text x="443.2" y="336.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">either way</text><circle cx="600.0" cy="200.0" r="7.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="600.0" y="314.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">What changes</text><text x="600.0" y="336.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="end">the result</text><text x="443.2" y="82.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle">tension highest</text><line x1="40.0" y1="290.0" x2="600.0" y2="290.0" stroke="#c9cedb" stroke-width="1.5"/><text x="24.0" y="374.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Once upon a time… Every day… One day… Because of that… Because</text><text x="24.0" y="395.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">of that… Until finally…</text><text x="624.0" y="425.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>