<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" width="640" height="442" role="img" aria-labelledby="t d"><title id="t">Binary search</title><desc id="d">Searching 100 steps for a fault by checking the middle each time: 1–100, 51–100, 51–75, 63–75, 63–69, 66–69, then step 67 found in about seven checks.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="442" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Halve the possibilities: 100 steps, about 7 checks</text><rect x="24.0" y="60.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="24.0" y="60.0" width="592.0" height="28.0" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="32.0" y="80.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">check 1: steps 1–100</text><rect x="24.0" y="100.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="320.0" y="100.0" width="296.0" height="28.0" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="32.0" y="120.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">check 2: steps 51–100</text><rect x="24.0" y="140.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="320.0" y="140.0" width="148.0" height="28.0" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="32.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">check 3: steps 51–75</text><rect x="24.0" y="180.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="391.0" y="180.0" width="77.0" height="28.0" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="32.0" y="200.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">check 4: steps 63–75</text><rect x="24.0" y="220.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="391.0" y="220.0" width="41.4" height="28.0" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="32.0" y="240.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">check 5: steps 63–69</text><rect x="24.0" y="260.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="408.8" y="260.0" width="23.7" height="28.0" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="32.0" y="280.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">check 6: steps 66–69</text><rect x="24.0" y="300.0" width="592.0" height="28.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="414.7" y="300.0" width="11.8" height="28.0" rx="4" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="32.0" y="320.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">found: step 67</text><text x="24.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Is the value right at the middle step? Yes: the fault is after it. No: before</text><text x="24.0" y="381.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">it. Each check throws away half — the same on code, circuits and long</text><text x="24.0" y="402.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">processes.</text><text x="624.0" y="432.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>