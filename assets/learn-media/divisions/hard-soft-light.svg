<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 422" width="640" height="422" role="img" aria-labelledby="t d"><title id="t">Hard and soft light</title><desc id="d">A small light source such as bare sun gives a hard, sharp-edged shadow; a large source such as a window or cloudy sky gives a soft, graded shadow that flatters a face.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="422" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Hard light from a small source, soft light from a big one</text><rect x="24.0" y="60.0" width="292.0" height="250.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="170.0" y="88.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Hard: bare sun, bare bulb</text><rect x="160.0" y="106.0" width="20.0" height="14.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><circle cx="170.0" cy="210.0" r="34.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><path d="M176 244 L214 286 L144 286 L164 244 Z" fill="#3d4560"/><text x="170.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">sharp shadow edge</text><rect x="336.0" y="60.0" width="292.0" height="250.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="482.0" y="88.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Soft: window, cloud, bounce</text><rect x="412.0" y="106.0" width="140.0" height="14.0" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1"/><circle cx="482.0" cy="210.0" r="34.0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><defs><radialGradient id="sg"><stop offset="0" stop-color="#3d4560" stop-opacity=".7"/><stop offset="1" stop-color="#3d4560" stop-opacity="0"/></radialGradient></defs><ellipse cx="488" cy="270" rx="62" ry="22" fill="url(#sg)"/><text x="482.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">gentle, graded shadow</text><text x="24.0" y="340.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Face the subject towards the window, never with it behind them.</text><text x="24.0" y="361.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Midday sun is hard: move into open shade. A white sheet bounces light</text><text x="24.0" y="382.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">into the shadow side.</text><text x="624.0" y="412.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>