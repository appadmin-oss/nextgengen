<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" width="640" height="442" role="img" aria-labelledby="t d"><title id="t">Evidence ladder</title><desc id="d">Evidence from weakest to strongest: people saying they would buy, people describing what they actually did, watching real transactions, and people paying or pre-ordering.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="442" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">From weak to strong evidence that people want it</text><rect x="24.0" y="270.0" width="592.0" height="67.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="296.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">They say they would buy it</text><text x="36.0" y="322.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">polite, imagined, costs nothing</text><rect x="64.0" y="200.0" width="552.0" height="67.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="226.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">They describe what they did</text><text x="76.0" y="252.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">past behaviour predicts</text><rect x="104.0" y="130.0" width="512.0" height="67.0" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="116.0" y="156.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">You watch them do it</text><text x="116.0" y="182.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">real transactions</text><rect x="144.0" y="60.0" width="472.0" height="67.0" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="156.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">They pay or pre-order</text><text x="156.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the strongest evidence</text><line x1="606.0" y1="330.0" x2="606.0" y2="72.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="24.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Ask “When did you last…? What did you buy? How much?” — never</text><text x="24.0" y="381.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">“Would you buy this?”. The gap between what people say and what</text><text x="24.0" y="402.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">they do is the finding.</text><text x="624.0" y="432.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>