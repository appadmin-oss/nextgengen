<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" width="640" height="327" role="img" aria-labelledby="t d"><title id="t">Revenue and profit</title><desc id="d">Sales of ₦500,000 against goods costing ₦420,000 plus ₦100,000 of rent, transport and an assistant: costs of ₦520,000 exceed sales, a loss of ₦20,000.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="327" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Busy is not profitable: ₦500,000 of sales, ₦20,000 lost</text><rect x="60.0" y="80.0" width="250.0" height="46.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="320.0" y="110.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Sales ₦500,000</text><rect x="60.0" y="146.0" width="210.0" height="46.0" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1"/><rect x="270.0" y="146.0" width="50.0" height="46.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="330.0" y="168.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Costs ₦520,000</text><text x="330.0" y="188.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">goods ₦420k + running ₦100k</text><line x1="310.0" y1="70.0" x2="310.0" y2="206.0" stroke="#9c3119" stroke-width="2" stroke-dasharray="5 4"/><text x="310.0" y="226.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle">₦20,000 loss</text><text x="24.0" y="266.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Revenue is all the money coming in; profit is what is left after all costs.</text><text x="24.0" y="287.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Watch profit, not turnover.</text><text x="624.0" y="317.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>