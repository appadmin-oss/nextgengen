<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d"><title id="t">Volume swell</title><desc id="d">Two loudness-over-time curves. A picked note jumps to full volume at once and fades. A swell starts silent and rises smoothly, so the pick&#x27;s attack cannot be heard.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="320" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A picked note against a volume swell</text><rect x="30.0" y="60.0" width="280.0" height="170.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="44.0" y="86.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Picked</text><line x1="50.0" y1="210.0" x2="295.0" y2="210.0" stroke="#3d4560" stroke-width="1.5" stroke-linecap="butt"/><path d="M50 210 L60 100 C100 120 180 170 295 200" fill="none" stroke="#1a4fb4" stroke-width="3"/><rect x="340.0" y="60.0" width="280.0" height="170.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="354.0" y="86.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Swell</text><line x1="360.0" y1="210.0" x2="605.0" y2="210.0" stroke="#3d4560" stroke-width="1.5" stroke-linecap="butt"/><path d="M360 210 C430 210 450 110 500 108 C550 106 570 150 605 180" fill="none" stroke="#1a4fb4" stroke-width="3"/><text x="30.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Start with the volume at zero and roll it up after picking: the attack vanishes,</text><text x="30.0" y="284.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and the note blooms like a bowed string or a pad.</text><text x="626" y="311" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>