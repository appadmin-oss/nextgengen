<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" role="img" aria-labelledby="t d"><title id="t">Guitar pedal order</title><desc id="d">Guitar, then tuner, drive or distortion, modulation (chorus, phaser), delay, reverb, and finally the amp.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="336" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The signal chain: guitar to speaker</text><rect x="20.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="85.0" y="105.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Guitar</text><rect x="175.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="240.0" y="105.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Tuner</text><rect x="330.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="395.0" y="105.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Drive</text><rect x="485.0" y="70.0" width="130.0" height="56.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="550.0" y="105.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Modulation</text><rect x="485.0" y="180.0" width="130.0" height="56.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="550.0" y="215.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Delay</text><rect x="330.0" y="180.0" width="130.0" height="56.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="395.0" y="215.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Reverb</text><rect x="175.0" y="180.0" width="130.0" height="56.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="240.0" y="215.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Amp</text><line x1="150.0" y1="98.0" x2="173.0" y2="98.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="305.0" y1="98.0" x2="328.0" y2="98.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="460.0" y1="98.0" x2="483.0" y2="98.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="548.0" y1="128.0" x2="548.0" y2="178.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="483.0" y1="208.0" x2="460.0" y2="208.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="328.0" y1="208.0" x2="305.0" y2="208.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="20.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Drive before delay and reverb keeps the echoes clean.</text><text x="626" y="327" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>