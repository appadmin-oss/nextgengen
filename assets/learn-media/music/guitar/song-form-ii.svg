<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" width="640" height="222" role="img" aria-labelledby="t d"><title id="t">Song form with pre-chorus, bridge and a key change</title><desc id="d">Verse, Pre-chorus, Chorus, Verse, Pre-chorus, Chorus, Bridge, then a final chorus a tone higher.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="222" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Adding a pre-chorus, a bridge — and a lift</text><rect x="22.0" y="70.0" width="79.3" height="80.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="61.7" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Verse</text><rect x="105.3" y="70.0" width="37.7" height="80.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="124.2" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Pre</text><rect x="147.0" y="70.0" width="79.3" height="80.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="186.7" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Chorus</text><rect x="230.3" y="70.0" width="79.3" height="80.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="270.0" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Verse</text><rect x="313.7" y="70.0" width="37.7" height="80.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="332.5" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Pre</text><rect x="355.3" y="70.0" width="79.3" height="80.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="395.0" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Chorus</text><rect x="438.7" y="70.0" width="79.3" height="80.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="478.3" y="116.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Bridge</text><rect x="522.0" y="70.0" width="96.0" height="80.0" rx="8" fill="#ef6b4d" stroke="#16233f" stroke-width="1.2"/><text x="570.0" y="116.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Chorus ↑</text><text x="20.0" y="186.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Pre-chorus builds; bridge brings new chords; last chorus goes up a tone.</text><text x="626" y="213" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>