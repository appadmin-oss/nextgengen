<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" role="img" aria-labelledby="t d"><title id="t">E-shape barre chord</title><desc id="d">Chord box for F as an E-shape barre at fret 1: index across all six strings, middle finger G string fret 2, ring finger A string fret 3, little finger D string fret 3. The same shape at fret 3 is G, fret 5 A, fret 6 B-flat, fret 8 C.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="404" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The E-shape barre: one shape, every major chord</text><text x="135.0" y="66.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">F (barre at fret 1)</text><line x1="70.0" y1="110.0" x2="70.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="96.0" y1="110.0" x2="96.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="122.0" y1="110.0" x2="122.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="148.0" y1="110.0" x2="148.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="174.0" y1="110.0" x2="174.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="200.0" y1="110.0" x2="200.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="70.0" y1="110.0" x2="200.0" y2="110.0" stroke="#16233f" stroke-width="5" stroke-linecap="butt"/><line x1="70.0" y1="142.0" x2="200.0" y2="142.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="70.0" y1="174.0" x2="200.0" y2="174.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="70.0" y1="206.0" x2="200.0" y2="206.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><line x1="70.0" y1="238.0" x2="200.0" y2="238.0" stroke="#16233f" stroke-width="1.4" stroke-linecap="butt"/><rect x="61.0" y="117.0" width="148.0" height="18" rx="9" fill="#16233f"/><text x="70.0" y="132.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><circle cx="96.0" cy="190.0" r="10.5" fill="#16233f" stroke="#16233f" stroke-width="1.2"/><text x="96.0" y="196.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><circle cx="122.0" cy="190.0" r="10.5" fill="#16233f" stroke="#16233f" stroke-width="1.2"/><text x="122.0" y="196.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><circle cx="148.0" cy="158.0" r="10.5" fill="#16233f" stroke="#16233f" stroke-width="1.2"/><text x="148.0" y="164.0" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="70.0" y="260.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">E</text><text x="96.0" y="260.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">A</text><text x="122.0" y="260.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">D</text><text x="148.0" y="260.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">G</text><text x="174.0" y="260.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">B</text><text x="200.0" y="260.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">E</text><rect x="330.0" y="100.0" width="270.0" height="32.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="346.0" y="123.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">barre at fret 1</text><text x="584.0" y="123.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">F</text><rect x="330.0" y="140.0" width="270.0" height="32.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="346.0" y="163.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">barre at fret 3</text><text x="584.0" y="163.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">G</text><rect x="330.0" y="180.0" width="270.0" height="32.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="346.0" y="203.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">barre at fret 5</text><text x="584.0" y="203.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">A</text><rect x="330.0" y="220.0" width="270.0" height="32.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="346.0" y="243.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">barre at fret 6</text><text x="584.0" y="243.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">B♭</text><rect x="330.0" y="260.0" width="270.0" height="32.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="346.0" y="283.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">barre at fret 8</text><text x="584.0" y="283.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">C</text><text x="330.0" y="320.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Named after the low-E note</text><text x="330.0" y="344.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">under the index finger. Lift the</text><text x="330.0" y="368.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">middle finger for the minor.</text><text x="626" y="395" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>