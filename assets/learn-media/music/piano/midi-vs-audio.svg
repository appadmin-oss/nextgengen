<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d"><title id="t">MIDI versus audio</title><desc id="d">Left: a MIDI recording as note bars (C, E, G) holding note, velocity, start and length. Right: an audio recording as a sound wave. MIDI can be re-voiced and edited note by note; audio cannot change instrument.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">MIDI stores what you played; audio stores the sound</text><rect x="20.0" y="60.0" width="290.0" height="210.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="165.0" y="90.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">MIDI</text><rect x="40.0" y="190.0" width="76.0" height="24.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="48.0" y="208.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">C4</text><rect x="120.0" y="156.0" width="46.0" height="24.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="128.0" y="174.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">E4</text><rect x="170.0" y="122.0" width="106.0" height="24.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="178.0" y="140.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">G4</text><text x="165.0" y="250.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">note, velocity, start, length</text><rect x="330.0" y="60.0" width="290.0" height="210.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="475.0" y="90.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Audio</text><path d="M345 165.0 L348 212.4 L351 171.4 L354 122.9 L357 153.6 L360 201.5 L363 180.3 L366 134.0 L369 147.0 L372 190.6 L375 184.7 L378 144.5 L381 144.4 L384 180.8 L387 185.8 L390 153.5 L393 144.7 L396 172.7 L399 184.4 L402 160.7 L405 146.8 L408 166.5 L411 181.6 L414 165.9 L417 150.1 L420 162.2 L423 178.1 L426 169.3 L429 153.7 L432 159.6 L435 207.5 L438 192.8 L441 130.2 L444 135.2 L447 192.4 L450 195.7 L453 144.3 L456 134.5 L459 179.6 L462 194.6 L465 155.8 L468 137.0 L471 169.6 L474 191.0 L477 164.3 L480 141.4 L483 162.4 L486 186.0 L489 170.2 L492 146.7 L495 157.9 L498 180.6 L501 173.6 L504 152.0 L507 155.5 L510 175.5 L513 175.0 L516 156.9 L519 154.9 L522 171.0 L525 209.7 L528 146.8 L531 122.1 L534 175.7 L537 205.3 L540 160.7 L543 128.0 L546 163.9 L549 198.3 L552 170.5 L555 135.6 L558 156.1 L561 190.4 L564 176.5 L567 143.5 L570 151.7 L573 182.6 L576 179.4 L579 151.0 L582 150.1 L585 175.7 L588 179.9 L591 157.3 L594 150.5 L597 170.0 L600 178.8 L603 162.4" fill="none" stroke="#1a4fb4" stroke-width="2"/><text x="475.0" y="250.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">the sound wave itself</text><text x="20.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">With MIDI you can change the instrument, fix a wrong note or the timing later;</text><text x="20.0" y="324.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">with audio you cannot change the instrument.</text><text x="626" y="351" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>