<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" role="img" aria-labelledby="t d"><title id="t">Dorian and Mixolydian modes</title><desc id="d">D Dorian: D E F G A B C D on the white keys, a minor scale whose B (a major 6th) gives its colour; use it over Dm7. G Mixolydian: G A B C D E F G, a major scale whose F (a flat 7th) gives its colour; use it over G7.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="386" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Two modes for improvising — white keys only</text><rect x="260.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="281.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">D</text><rect x="302.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="323.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">E</text><rect x="344.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="365.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">F</text><rect x="386.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="407.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">G</text><rect x="428.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="449.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="470.0" y="70" width="42" height="100" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="491.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">B</text><rect x="512.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="533.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">C</text><rect x="554.0" y="70" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="575.0" y="160.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">D</text><rect x="289.4" y="70" width="25.2" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="373.4" y="70" width="25.2" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="415.4" y="70" width="25.2" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="457.4" y="70" width="25.2" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="541.4" y="70" width="25.2" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><text x="20.0" y="110.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">D Dorian</text><text x="20.0" y="136.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">the note that gives</text><text x="20.0" y="158.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">it its colour: gold</text><text x="260.0" y="194.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">minor, with a major 6th (B) — over Dm7</text><rect x="260.0" y="220" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="281.0" y="310.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">G</text><rect x="302.0" y="220" width="42" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="323.0" y="310.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="344.0" y