e note that gives</text><text x="20.0" y="308.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">it its colour: gold</text><text x="260.0" y="344.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">major, with a flat 7th (F) — over G7</text><text x="626" y="377" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>