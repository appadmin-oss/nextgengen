<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" role="img" aria-labelledby="t d"><title id="t">Ternary form with modulation</title><desc id="d">Three blocks: A in the home key C major; B in a related key, reached with D7 to G or E7 to A minor; A again in C, reached with G7 to C, with a coda.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="306" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Ternary form: A – B – A, with a trip to a related key</text><rect x="20.0" y="70.0" width="180.0" height="110.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="110.0" y="120.0" font-size="32" font-weight="900" fill="#16233f" text-anchor="middle">A</text><text x="110.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">home key: C major</text><rect x="210.0" y="70.0" width="220.0" height="110.0" rx="10" fill="#d3f1f6" stroke="#16233f" stroke-width="1.4"/><text x="320.0" y="120.0" font-size="32" font-weight="900" fill="#16233f" text-anchor="middle">B</text><text x="320.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">contrast: G or A minor</text><rect x="440.0" y="70.0" width="180.0" height="110.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="530.0" y="120.0" font-size="32" font-weight="900" fill="#16233f" text-anchor="middle">A</text><text x="530.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C again + coda</text><line x1="150.0" y1="200.0" x2="260.0" y2="200.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="205.0" y="226.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">D7 → G (or E7 → Am)</text><line x1="380.0" y1="200.0" x2="490.0" y2="200.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="435.0" y="226.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">G7 → C</text><text x="20.0" y="270.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The new key&#x27;s V makes it sound like home; the old key&#x27;s V brings you back.</text><text x="626" y="297" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>