<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" width="640" height="476" role="img" aria-labelledby="t d"><title id="t">How the voice works</title><desc id="d">A figure from head to chest with three labelled parts: the power source, breath from the lungs controlled by the diaphragm; the vibrator, the vocal folds in the larynx; and the resonators, the throat, mouth and nose.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="476" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Your voice: power, vibrator, resonators</text><path d="M170 70 C110 70 100 130 112 160 C118 176 130 188 150 194 L150 230 L120 240 C80 250 70 300 70 400 L270 400 C270 300 260 250 220 240 L190 230 L190 200 C226 196 236 160 230 120 C224 86 204 70 170 70 Z" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><ellipse cx="170" cy="140" rx="34" ry="22" fill="#fde7b8" stroke="#16233f" stroke-width="1.5"/><circle cx="170.0" cy="214.0" r="10" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><ellipse cx="135" cy="320" rx="30" ry="56" fill="#fcd9cf" stroke="#16233f" stroke-width="1.5"/><ellipse cx="205" cy="320" rx="30" ry="56" fill="#fcd9cf" stroke="#16233f" stroke-width="1.5"/><path d="M95 386 Q170 350 245 386" fill="none" stroke="#1a4fb4" stroke-width="5"/><line x1="204.0" y1="140.0" x2="300.0" y2="140.0" stroke="#5a6488" stroke-width="1.2" stroke-linecap="butt"/><text x="310.0" y="140.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">3. Resonators</text><text x="310.0" y="164.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">throat, mouth, nose: amplify and colour</text><line x1="180.0" y1="214.0" x2="300.0" y2="214.0" stroke="#5a6488" stroke-width="1.2" stroke-linecap="butt"/><text x="310.0" y="214.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">2. Vibrator</text><text x="310.0" y="238.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">vocal folds in the larynx</text><line x1="236.0" y1="330.0" x2="300.0" y2="330.0" stroke="#5a6488" stroke-width="1.2" stroke-linecap="butt"/><text x="310.0" y="330.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">1. Power: breath</text><text x="310.0" y="354.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">lungs, driven by the diaphragm (blue)</text><text x="20.0" y="440.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Stand: feet hip-width, knees soft, head level, shoulders down.</text><text x="626" y="467" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>