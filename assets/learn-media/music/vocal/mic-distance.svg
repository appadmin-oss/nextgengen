<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="t d"><title id="t">Microphone distance</title><desc id="d">A singer&#x27;s head and a microphone at three distances: about a hand&#x27;s width (5 to 10 cm) for normal singing, closer for soft passages, further back for loud or high notes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="372" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Working the microphone</text><circle cx="80.0" cy="100.0" r="22" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M100 102 l10 2 l-10 6" fill="none" stroke="#16233f" stroke-width="2"/><rect x="172.0" y="90.0" width="26.0" height="22.0" rx="10" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><rect x="198.0" y="96.0" width="80.0" height="10.0" rx="3" fill="#16233f" stroke="#16233f" stroke-width="1.25"/><path d="M112 126 L172 126" stroke="#f5b026" stroke-width="3"/><text x="370.0" y="98.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Normal singing</text><text x="370.0" y="122.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">a hand&#x27;s width, 5–10 cm</text><circle cx="80.0" cy="180.0" r="22" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M100 182 l10 2 l-10 6" fill="none" stroke="#16233f" stroke-width="2"/><rect x="140.0" y="170.0" width="26.0" height="22.0" rx="10" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><rect x="166.0" y="176.0" width="80.0" height="10.0" rx="3" fill="#16233f" stroke="#16233f" stroke-width="1.25"/><path d="M112 206 L140 206" stroke="#f5b026" stroke-width="3"/><text x="370.0" y="178.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Soft, close</text><text x="370.0" y="202.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">come in: you are heard</text><circle cx="80.0" cy="260.0" r="22" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M100 262 l10 2 l-10 6" fill="none" stroke="#16233f" stroke-width="2"/><rect x="222.0" y="250.0" width="26.0" height="22.0" rx="10" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><rect x="248.0" y="256.0" width="80.0" height="10.0" rx="3" fill="#16233f" stroke="#16233f" stroke-width="1.25"/><path d="M112 286 L222 286" stroke="#f5b026" stroke-width="3"/><text x="370.0" y="258.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Loud or high</text><text x="370.0" y="282.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">back off: no distortion</text><text x="20.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Hold the body, never the grille. Point it at your mouth, never at a speaker.</text><text x="626" y="363" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>