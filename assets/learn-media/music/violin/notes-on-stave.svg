<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" role="img" aria-labelledby="t d"><title id="t">Open strings and first-position notes on the treble stave</title><desc id="d">Treble stave. The open strings: G below two ledger lines, D in the space below the stave, A in the second space, E in the top space. Then on the A string: A open (0), B on the middle line with finger 1, C sharp in the third space with finger 2, D on the fourth line with finger 3.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="352" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Where the violin&#x27;s notes sit on the stave</text><line x1="20.0" y1="110.0" x2="620.0" y2="110.0" stroke="#16233f" stroke-width="1.3" stroke-linecap="butt"/><line x1="20.0" y1="124.0" x2="620.0" y2="124.0" stroke="#16233f" stroke-width="1.3" stroke-linecap="butt"/><line x1="20.0" y1="138.0" x2="620.0" y2="138.0" stroke="#16233f" stroke-width="1.3" stroke-linecap="butt"/><line x1="20.0" y1="152.0" x2="620.0" y2="152.0" stroke="#16233f" stroke-width="1.3" stroke-linecap="butt"/><line x1="20.0" y1="166.0" x2="620.0" y2="166.0" stroke="#16233f" stroke-width="1.3" stroke-linecap="butt"/><path d="M47.7 182.1 C48.4 192.6 33.7 194.0 33.0 184.9 M47.7 182.1 L42.1 97.4 C40.7 80.6 57.5 83.4 51.9 102.3 C47.0 118.4 26.7 131.0 26.7 152.0 C26.7 170.9 58.2 171.6 58.2 152.7 C58.2 138.0 39.3 137.3 38.6 150.6 C38.3 156.9 42.8 159.7 46.3 159.0" fill="none" stroke="#16233f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="34.7" cy="184.2" r="3.9200000000000004" fill="#16233f" stroke="none" stroke-width="1.5"/><line x1="93.9" y1="180.0" x2="126.1" y2="180.0" stroke="