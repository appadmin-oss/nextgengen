<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d"><title id="t">Keeping the bow straight</title><desc id="d">Seen from above: four strings, the end of the fingerboard and the bridge. The bow crosses the strings parallel to the bridge, about halfway between bridge and fingerboard. A slanted bow drifts towards the fingerboard (thin, airy sound) or the bridge (glassy, squeaky).</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="420" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A straight bow: parallel to the bridge</text><rect x="200.0" y="60.0" width="240.0" height="70.0" rx="4" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><rect x="190.0" y="262.0" width="260.0" height="12.0" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="462.0" y="274.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">bridge</text><line x1="250.0" y1="60.0" x2="250.0" y2="300.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><line x1="296.0" y1="60.0" x2="296.0" y2="300.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><line x1="342.0" y1="60.0" x2="342.0" y2="300.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><line x1="388.0" y1="60.0" x2="388.0" y2="300.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><rect x="228.5" y="84.0" width="183.0" height="26.0" rx="6" fill="#3d4560" stroke="#3d4560" stroke-width="1.25"/><text x="320.0" y="104.0" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">end of fingerboard</text><rect x="60.0" y="190.0" width="520.0" height="12.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="60.0" y="182.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">bow: parallel to the bridge</text><path d="M80 236 L560 160" stroke="#a3361f" stroke-width="3" stroke-dasharray="8 6"/><text x="462.0" y="236.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">contact point</text><line x1="455.0" y1="231.0" x2="425.0" y2="200.0" stroke="#5a6488" stroke-width="1.2" stroke-linecap="butt"/><text x="20.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Contact point: about halfway from the bridge to the fingerboard.</text><text x="20.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Dashed red: a slanted bow drifts — toward the fingerboard the sound</text><text x="20.0" y="384.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">goes thin and airy; toward the bridge, glassy and squeaky.</text><text x="626" y="411" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>