<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346" role="img" aria-labelledby="t d"><title id="t">A major on the A and E strings</title><desc id="d">On the A string: open A, finger 1 B, finger 2 C sharp, finger 3 D. On the E string: open E, finger 1 F sharp, finger 2 G sharp, finger 3 A. Fingers 2 and 3 sit close together (a semitone); the other gaps are tones.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="346" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A major on the A and E strings</text><text x="20.0" y="106.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">A string</text><line x1="150.0" y1="100.0" x2="620.0" y2="100.0" stroke="#16233f" stroke-width="2.5" stroke-linecap="butt"/><circle cx="170.0" cy="100.0" r="16" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="170.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">A</text><text x="170.0" y="140.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">open</text><circle cx="290.0" cy="100.0" r="18" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="290.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">B</text><text x="290.0" y="142.0" font-size="17" font-weight="800" fill="#1a4fb4" text-anchor="middle">1</text><circle cx="410.0" cy="100.0" r="18" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="410.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">C♯</text><text x="410.0" y="142.0" font-size="17" font-weight="800" fill="#1a4fb4" text-anchor="middle">2</text><circle cx="470.0" cy="100.0" r="18" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="470.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">D</text><text x="470.0" y="142.0" font-size="17" font-weight="800" fill="#1a4fb4" text-anchor="middle">3</text><text x="230.0" y="78.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">tone</text><text x="350.0" y="78.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">tone</text><text x="440.0" y="78.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">semi</text><text x="20.0" y="216.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">E string</text><line x1="150.0" y1="210.0" x2="620.0" y2="210.0" stroke="#16233f" stroke-width="2.5" stroke-linecap="butt"/><circle cx="170.0" cy="210.0" r="16" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="170.0" y="216.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">E</text><text x="170.0" y="250.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">open</text><circle cx="290.0" cy="210.0" r="18" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="290.0" y="216.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">F♯</text><text x="290.0" y="252.0" font-size="17" font-weight="800" fill="#1a4fb4" text-anchor="middle">1</text><circle cx="410.0" cy="210.0" r="18" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="410.0" y="216.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">G♯</text><text x="410.0" y="252.0" font-size="17" font-weight="800" fill="#1a4fb4" text-anchor="middle">2</text><circle cx="470.0" cy="210.0" r="18" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="470.0" y="216.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">A</text><text x="470.0" y="252.0" font-size="17" font-weight="800" fill="#1a4fb4" text-anchor="middle">3</text><text x="230.0" y="188.0" font-size=