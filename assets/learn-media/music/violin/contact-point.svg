<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d"><title id="t">Bow contact point and tone</title><desc id="d">Three lanes between bridge and fingerboard. Near the bridge: loud and brilliant, needing more weight and a slower bow. Middle: full. Near the fingerboard: soft and airy, needing less weight and a faster bow.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Contact point: from bridge to fingerboard</text><rect x="20.0" y="70.0" width="600.0" height="70.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><rect x="20.0" y="70.0" width="200.0" height="70.0" rx="0" fill="#fcd9cf" stroke="#c9cedb" stroke-width="1.25"/><text x="120.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">near the bridge</text><rect x="220.0" y="70.0" width="200.0" height="70.0" rx="0" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="320.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">middle</text><rect x="420.0" y="70.0" width="200.0" height="70.0" rx="0" fill="#d3f1f6" stroke="#c9cedb" stroke-width="1.25"/><text x="520.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">near the fingerboard</text><text x="20.0" y="170.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">Sound</text><text x="160.0" y="170.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">loud, brilliant</text><text x="360.0" y="170.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">full</text><text x="560.0" y="170.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">soft, sweet, airy</text><text x="20.0" y="210.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">Weight</text><text x="160.0" y="210.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">more</text><text x="360.0" y="210.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">medium</text><text x="560.0" y="210.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">less</text><text x="20.0" y="250.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">Bow speed</text><text x="160.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">slower</text><text x="360.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">medium</text><text x="560.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">faster</text><text x="20.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Louder: more weight, more speed and nearer the bridge, together.</text><text x="20.0" y="324.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Messa di voce: one bow, soft → loud → soft, without a crunch or a whistle.</text><text x="626" y="351" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>