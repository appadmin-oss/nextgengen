<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d"><title id="t">Tuning the violin in fifths</title><desc id="d">The four strings G, D, A, E, each a perfect fifth apart. Tune A to 440 hertz first, then each neighbouring pair together until the fifth sounds steady.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="310" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Tuning in fifths: G – D – A – E</text><circle cx="120.0" cy="140.0" r="32" fill="#fde7b8" stroke="#16233f" stroke-width="2"/><text x="120.0" y="148.0" font-size="24" font-weight="900" fill="#16233f" text-anchor="middle">G</text><path d="M154 120 Q185 84 216 120" fill="none" stroke="#3d4560" stroke-width="2" marker-end="url(#a)"/><text x="185.0" y="84.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">5th</text><circle cx="250.0" cy="140.0" r="32" fill="#fde7b8" stroke="#16233f" stroke-width="2"/><text x="250.0" y="148.0" font-size="24" font-weight="900" fill="#16233f" text-anchor="middle">D</text><path d="M284 120 Q315 84 346 120" fill="none" stroke="#3d4560" stroke-width="2" marker-end="url(#a)"/><text x="315.0" y="84.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">5th</text><circle cx="380.0" cy="140.0" r="32" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="380.0" y="148.0" font-size="24" font-weight="900" fill="#16233f" text-anchor="middle">A</text><path d="M414 120 Q445 84 476 120" fill="none" stroke="#3d4560" stroke-width="2" marker-end="url(#a)"/><text x="445.0" y="84.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">5th</text><circle cx="510.0" cy="140.0" r="32" fill="#fde7b8" stroke="#16233f" stroke-width="2"/><text x="510.0" y="148.0" font-size="24" font-weight="900" fill="#16233f" text-anchor="middle">E</text><text x="380.0" y="200.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">A = 440 Hz, from the oboe or piano</text><text x="20.0" y="250.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Tune A first. Then play two open strings together (A–D, D–G, A–E)</text><text x="20.0" y="274.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and turn until the wobble (the &quot;beats&quot;) stops and the fifth locks.</text><text x="626" y="301" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>