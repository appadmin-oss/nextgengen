<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" width="640" height="336" role="img" aria-labelledby="t d"><title id="t">The EQ frequency spectrum and a high-pass filter</title><desc id="d">The audible spectrum in three bands: lows 20 to 250 Hz (kick, bass), mids 250 Hz to 4 kHz (instruments and voice), highs 4 to 20 kHz (air, cymbals, sibilance). A high-pass filter curve rolls off the low end.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="336" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">EQ: the frequency spectrum, low to high</text><rect x="20.0" y="70.0" width="180.0" height="80.0" rx="0" fill="#fcd9cf" stroke="#16233f" stroke-width="1.2"/><text x="110.0" y="104.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Lows 20–250 Hz</text><text x="110.0" y="130.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">kick, bass: weight</text><rect x="200.0" y="70.0" width="250.0" height="80.0" rx="0" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="325.0" y="104.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Mids 250 Hz–4 kHz</text><text x="325.0" y="130.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">instruments, the voice</text><rect x="450.0" y="70.0" width="170.0" height="80.0" rx="0" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="535.0" y="104.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Highs 4–20 kHz</text><text x="535.0" y="130.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">air, cymbals, &quot;s&quot;</text><path d="M20 260 C90 260 120 190 170 190 L620 190" fill="none" stroke="#1a4fb4" stroke-width="4"/><line x1="20.0" y1="190.0" x2="620.0" y2="190.0" stroke="#c9cedb" stroke-width="1" stroke-linecap="butt" stroke-dasharray="4 4"/><text x="240.0" y="236.0" font-size="16" font-weight="800" fill="#1a4fb4" text-anchor="start">high-pass filter: cuts the low rumble</text><text x="20.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Cut before you boost; small moves (2–4 dB) usually beat big ones.</text><text x="626" y="327" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>