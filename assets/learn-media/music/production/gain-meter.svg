<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" role="img" aria-labelledby="t d"><title id="t">Recording level meter</title><desc id="d">A level meter in dBFS from −48 to 0. The target zone for peaks is −12 to −6 dBFS; 0 dBFS is the ceiling where the signal clips.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="284" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Gain staging: aim for peaks at −12 to −6 dBFS</text><rect x="20.0" y="90.0" width="540.0" height="40.0" rx="4" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><rect x="425.0" y="90.0" width="67.5" height="40.0" rx="0" fill="#bfe5c6" stroke="#16233f" stroke-width="1.2"/><rect x="552.0" y="90.0" width="8.0" height="40.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1.2"/><line x1="20.0" y1="130.0" x2="20.0" y2="140.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><text x="20.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">-48</text><line x1="155.0" y1="130.0" x2="155.0" y2="140.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><text x="155.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">-36</text><line x1="290.0" y1="130.0" x2="290.0" y2="140.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><text x="290.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">-24</text><line x1="425.0" y1="130.0" x2="425.0" y2="140.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><text x="425.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">-12</text><line x1="492.5" y1="130.0" x2="492.5" y2="140.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><text x="492.5" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">-6</text><line x1="560.0" y1="130.0" x2="560.0" y2="140.0" stroke="#16233f" stroke-width="1.5" stroke-linecap="butt"/><text x="560.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">0</text><text x="458.8" y="80.0" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="middle">target</text><text x="560.0" y="80.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">clip</text><text x="20.0" y="200.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">0 dBFS is the ceiling: anything that hits it clips into distortion that cannot be</text><text x="20.0" y="224.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">removed. Set the gain while the singer performs their LOUDEST part.</text><text x="20.0" y="248.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Too quiet can be turned up later; clipped is ruined.</text><text x="626" y="275" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>