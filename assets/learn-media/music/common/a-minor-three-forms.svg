<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" width="640" height="516" role="img" aria-labelledby="t d"><title id="t">Three forms of A minor</title><desc id="d">Keyboards from A to A. Natural minor: A B C D E F G A. Harmonic minor raises the 7th to G sharp. Melodic minor going up raises the 6th and 7th to F sharp and G sharp.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="516" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A minor in three forms</text><rect x="230.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="250.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">A</text><rect x="270.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="290.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">B</text><rect x="310.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="330.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="350.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="370.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">D</text><rect x="390.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="410.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">E</text><rect x="430.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="450.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">F</text><rect x="470.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="490.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">G</text><rect x="510.0" y="70" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="530.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">A</text><rect x="258.0" y="70" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="338.0" y="70" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="378.0" y="70" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="458.0" y="70" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="498.0" y="70" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><text x="20.0" y="110.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Natural</text><text x="20.0" y="136.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">A B C D E F G A</text><rect x="230.0" y="210" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="250.0" y="300.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">A</text><rect x="270.0" y="210" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="290.0" y="300.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">B</text><rect x="310.0" y="210" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="330.0" y="300.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="350.0" y="210" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="370.0" y="300.0" font-size="1