ext x="290.0" y="440.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">B</text><rect x="310.0" y="350" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="330.0" y="440.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="350.0" y="350" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="370.0" y="440.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">D</text><rect x="390.0" y="350" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="410.0" y="440.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">E</text><rect x="430.0" y="350" width="40" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><rect x="470.0" y="350" width="40" height="100" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><rect x="510.0" y="350" width="40" height="100" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="530.0" y="440.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">A</text><rect x="258.0" y="350" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="338.0" y="350" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="378.0" y="350" width="24.0" height="62.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="458.0" y="350" width="24.0" height="62.0" rx="2" fill="#ef6b4d" stroke="#16233f" stroke-width="1.4"/><rect x="498.0" y="350" width="24.0" height="62.0" rx="2" fill="#ef6b4d" stroke="#16233f" stroke-width="1.4"/><text x="20.0" y="390.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Melodic (going up)</text><text x="20.0" y="416.0" font-size="16" font-weight="600" fill="#a3361f" text-anchor="start">raise 6th and 7th: F♯ G♯</text><text x="470.0" y="342.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">F♯</text><text x="510.0" y="342.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">G♯</text><text x="20.0" y="482.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Coming down, the melodic minor returns to the natural form (G, F).</text><text x="626" y="507" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>