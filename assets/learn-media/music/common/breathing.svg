<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" width="640" height="458" role="img" aria-labelledby="t d"><title id="t">Breathing with the diaphragm</title><desc id="d">Two torso outlines. Breathing in: the lungs fill, the dome-shaped diaphragm flattens downwards and the belly and lower ribs move outwards, shoulders still. Breathing out: the diaphragm rises and the belly comes in as the air is pushed out steadily.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="458" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Breathing low: the diaphragm drops, the belly moves out</text><path d="M100 100 C80 160 80 300 110 330 L230 330 C260 300 260 160 240 100 Z" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><ellipse cx="140" cy="168" rx="26" ry="62" fill="#fcd9cf" stroke="#16233f" stroke-width="1.5"/><ellipse cx="200" cy="168" rx="26" ry="62" fill="#fcd9cf" stroke="#16233f" stroke-width="1.5"/><path d="M95 238 Q170 218 245 238" fill="none" stroke="#1a4fb4" stroke-width="5"/><line x1="170.0" y1="198.0" x2="170.0" y2="238.0" stroke="#1a4fb4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="262.0" y1="280.0" x2="288.0" y2="280.0" stroke="#a3361f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="78.0" y1="280.0" x2="52.0" y2="280.0" stroke="#a3361f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="170.0" y="362.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Breathing in</text><path d="M400 100 C380 160 380 300 410 330 L530 330 C560 300 560 160 540 100 Z" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><ellipse cx="440" cy="140" rx="26" ry="46" fill="#fcd9cf" stroke="#16233f" stroke-width="1.5"/><ellipse cx="500" cy="140" rx="26" ry="46" fill="#fcd9cf" stroke="#16233f" stroke-width="1.5"/><path d="M395 210 Q470 150 545 210" fill="none" stroke="#1a4fb4" stroke-width="5"/><line x1="470.0" y1="190.0" x2="470.0" y2="154.0" stroke="#1a4fb4" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="588.0" y1="280.0" x2="566.0" y2="280.0" stroke="#a3361f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="352.0" y1="280.0" x2="374.0" y2="280.0" stroke="#a3361f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="470.0" y="362.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Breathing out</text><text x="20.0" y="398.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Blue: the diaphragm. In, it flattens down and the belly and lower ribs move out;</text><text x="20.0" y="422.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the shoulders stay still. Out, the muscles push the air out steadily.</text><text x="626" y="449" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>