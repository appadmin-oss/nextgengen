<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" width="640" height="252" role="img" aria-labelledby="t d"><title id="t">The backbeat</title><desc id="d">A bar counted 1 and 2 and 3 and 4 and. Kick drum on beats 1 and 3, snare on beats 2 and 4.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="252" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The backbeat: kick on 1 and 3, snare on 2 and 4</text><rect x="131.0" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="160.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="192.2" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="221.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="253.5" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="283.1" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="314.8" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="344.4" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="376.0" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="405.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="437.2" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="466.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&am