<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d"><title id="t">Accents and ghost notes</title><desc id="d">A sixteenth-note grid. Hi-hat on every sixteenth; the snare&#x27;s backbeat on 2 and 4 at full volume with quiet ghost notes between; the kick on 1, the &#x27;and&#x27; of 2 and the &#x27;e&#x27; of 3 rather than only on 1 and 3. One example pattern for practising ghost notes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="320" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Accents and ghost notes: an example to practise</text><rect x="131.0" y="60.0" width="28.6" height="166.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="145.3" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="161.6" y="60.0" width="28.6" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="175.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">e</text><rect x="192.2" y="60.0" width="28.6" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="206.6" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="222.9" y="60.0" width="28.6" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="237.2" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">a</text><rect x="253.5" y="60.0" width="28.6" height="166.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="267.8" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="284.