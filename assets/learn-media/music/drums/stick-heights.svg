<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" aria-labelledby="t d"><title id="t">Stick height and dynamics</title><desc id="d">Five sticks rising from the drum head at increasing heights, labelled pp, p, mf, f, ff: the higher the stick starts, the louder the note.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="380" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Volume comes from stick height</text><rect x="50.0" y="280.0" width="60.0" height="10.0" rx="3" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><line x1="80.0" y1="274.0" x2="80.0" y2="262.0" stroke="#f5b026" stroke-width="8" stroke-linecap="round"/><circle cx="80.0" cy="274.0" r="5" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="80.0" y="250.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle" font-style="italic">pp</text><rect x="165.0" y="280.0" width="60.0" height="10.0" rx="3" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><line x1="195.0" y1="274.0" x2="195.0" y2="244.0" stroke="#f5b026" stroke-width="8" stroke-linecap="round"/><circle cx="195.0" cy="274.0" r="5" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="195.0" y="232.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle" font-style="italic">p</text><rect x="280.0" y="280.0" width="60.0" height="10.0" rx="3" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><line x1="310.0" y1="274.0" x2="310.0" y2="199.0" stroke="#f5b026" stroke-width="8" stroke-linecap="round"/><circle cx="310.0" cy="274.0" r="5" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="310.0" y="187.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle" font-style="italic">mf</text><rect x="395.0" y="280.0" width="60.0" height="10.0" rx="3" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><line x1="425.0" y1="274.0" x2="425.0" y2="136.0" stroke="#f5b026" stroke-width="8" stroke-linecap="round"/><circle cx="425.0" cy="274.0" r="5" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="425.0" y="124.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle" font-style="italic">f</text><rect x="510.0" y="280.0" width="60.0" height="10.0" rx="3" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><line x1="540.0" y1="274.0" x2="540.0" y2="82.0" stroke="#f5b026" stroke-width="8" stroke-linecap="round"/><circle cx="540.0" cy="274.0" r="5" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="540.0" y="70.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle" font-style="italic">ff</text><text x="20.0" y="320.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Low stick (a few cm): soft. High stick (20 cm and more, from the wrist): loud.</text><text x="20.0" y="344.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Same relaxed stroke and rebound every time — only the height changes.</text><text x="626" y="371" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>