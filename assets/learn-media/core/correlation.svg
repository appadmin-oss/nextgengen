<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" width="720" height="356" role="img" aria-labelledby="t d"><title id="t">Correlation is not causation</title><desc id="d">Hot weather raises both cold-drink sales and swimming, so the two rise together without one causing the other.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="356" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect x="255" y="40" width="210" height="60" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="360" y="76" font-size="18" font-weight="700" fill="#16233f" text-anchor="middle">Hot weather</text><line x1="300" y1="102" x2="170" y2="180" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="420" y1="102" x2="550" y2="180" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="60" y="182" width="220" height="60" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="170" y="217" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">More cold drinks sold</text><rect x="440" y="182" width="220" height="60" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="550" y="217" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">More people swimming</text><line x1="282" y1="212" x2="438" y2="212" stroke="#ef6b4d" stroke-width="2.5" stroke-dasharray="7 5"/><text x="360" y="202" font-size="13" font-weight="700" fill="#a3361f" text-anchor="middle">related…</text><text x="360" y="268" font-size="13" font-weight="700" fill="#a3361f" text-anchor="middle">…but neither causes the other</text><text x="360" y="306" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Correlation is not causation: look for a hidden third thing.</text><text x="706" y="346" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>