<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d"><title id="t">Strong passwords and 2-step verification</title><desc id="d">Weak passwords are short, personal or reused; strong ones are long passphrases, unique per account, with 2-step verification turned on.</desc><rect width="720" height="320" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="21" font-weight="800" fill="#16233f" text-anchor="start">Strong passwords, and a second lock</text><rect x="30" y="62" width="320" height="150" rx="12" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5"/><text x="46" y="92" font-size="17" font-weight="800" fill="#8c2a14" text-anchor="start">Weak</text><text x="46" y="120" font-size="13.5" font-weight="600" fill="#8c2a14" text-anchor="start">✗ password123</text><text x="46" y="142" font-size="13.5" font-weight="600" fill="#8c2a14" text-anchor="start">✗ ada2010</text><text x="46" y="164" font-size="13.5" font-weight="600" fill="#8c2a14" text-anchor="start">✗ your name + birthday</text><text x="46" y="186" font-size="13.5" font-weight="600" fill="#8c2a14" text-anchor="start">✗ the same one everywhere</text><rect x="370" y="62" width="320" height="150" rx="12" fill="#dff2e4" stroke="#1d6b30" stroke-width="1.5"/><text x="386" y="92" font-size="17" font-weight="800" fill="#1d6b30" text-anchor="start">Strong</text><text x="386" y="120" font-size="13.5" font-weight="600" fill="#1d6b30" text-anchor="start">✓ a passphrase: four random words</text><text x="386" y="142" font-size="13.5" font-weight="600" fill="#1d6b30" text-anchor="start">✓ plum-river-kettle-sunday</text><text x="386" y="164" font-size="13.5" font-weight="600" fill="#1d6b30" text-anchor="start">✓ a different one for every account</text><text x="386" y="186" font-size="13.5" font-weight="600" fill="#1d6b30" text-anchor="start">✓ kept in a password manager</text><rect x="30" y="228" width="660" height="74" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="46" y="256" font-size="15" font-weight="800" fill="#16233f" text-anchor="start">Turn on 2-step verification (2FA):</text><text x="46" y="280" font-size="13" font-weight="500" fill="#3d4560" text-anchor="start">a code from your phone as well as the password — a stolen password alone no longer opens the account.</text></g></svg>