<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="t d"><title id="t">Ten everyday keyboard shortcuts</title><desc id="d">Copy, cut, paste, undo, redo, save, find, select all, print and switch window, with their key combinations.</desc><rect width="720" height="310" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Ten shortcuts every computer user should know</text><rect x="30" y="66" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="90" y="100" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+C</text><text x="90" y="144" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">copy</text><rect x="164" y="66" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="224" y="100" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+X</text><text x="224" y="144" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">cut</text><rect x="298" y="66" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="358" y="100" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+V</text><text x="358" y="144" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">paste</text><rect x="432" y="66" width="120" height="54" rx="9" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="492" y="100" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+Z</text><text x="492" y="144" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">undo</text><rect x="566" y="66" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="626" y="100" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+Y</text><text x="626" y="144" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">redo</text><rect x="30" y="170" width="120" height="54" rx="9" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="90" y="204" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+S</text><text x="90" y="248" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">save</text><rect x="164" y="170" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="224" y="204" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+F</text><text x="224" y="248" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">find</text><rect x="298" y="170" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="358" y="204" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+A</text><text x="358" y="248" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">select all</text><rect x="432" y="170" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="492" y="204" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Ctrl+P</text><text x="492" y="248" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">print</text><rect x="566" y="170" width="120" height="54" rx="9" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><text x="626" y="204" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Alt+Tab</text><text x="626" y="248" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="middle">switch window</text><text x="30" y="290" font-size="13.5" font-weight="600" fill="#3d4560" text-anchor="start">On a Mac use Cmd instead of Ctrl. Undo (Ctrl+Z) and Save (Ctrl+S) rescue the most work.</text></g></svg>