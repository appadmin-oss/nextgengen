<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 352" width="940" height="352" role="img" aria-labelledby="t d"><title id="t">Typographic hierarchy</title><desc id="d">A flyer&#x27;s text at five levels, from a large bold headline down to a small caption, so the eye reads them in order.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="940" height="352" fill="#ffffff"/><rect width="940" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="24" y="24" width="600" height="280" rx="12" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40" y="70" font-size="40" font-weight="800" fill="#16233f" text-anchor="start">NGG Saturday Showcase</text><text x="40" y="112" font-size="22" font-weight="600" fill="#3d4560" text-anchor="start">Music, code and art by the Club&#x27;s members</text><text x="40" y="170" font-size="17" font-weight="700" fill="#0b6e80" text-anchor="start">Saturday 14 March · 11am · Egbeda Centre</text><text x="40" y="215" font-size="15" font-weight="400" fill="#16233f" text-anchor="start">Come and see what a term of practice sounds like. Free entry; bring</text><text x="40" y="237" font-size="15" font-weight="400" fill="#16233f" text-anchor="start">your family. Refreshments from the catering class.</text><text x="40" y="280" font-size="12" font-weight="400" fill="#3d4560" text-anchor="start">Photo: the 2026 junior band</text><line x1="630" y1="58" x2="664" y2="58" stroke="#ef6b4d" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="680" cy="58" r="12" fill="#f5b026" stroke="#16233f"/><text x="680" y="63" font-size="13" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="700" y="63" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Headline — biggest, boldest</text><line x1="630" y1="104" x2="664" y2="104" stroke="#ef6b4d" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="680" cy="104" r="12" fill="#f5b026" stroke="#16233f"/><text x="680" y="109" font-size="13" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="700" y="109" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Subheading — supports it</text><line x1="630" y1="164" x2="664" y2="164" stroke="#ef6b4d" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="680" cy="164" r="12" fill="#f5b026" stroke="#16233f"/><text x="680" y="169" font-size="13" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="700" y="169" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Key facts — colour or weight</text><line x1="630" y1="222" x2="664" y2="222" stroke="#ef6b4d" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="680" cy="222" r="12" fill="#f5b026" stroke="#16233f"/><text x="680" y="227" font-size="13" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="700" y="227" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Body — 15–16 px, easy to read</text><line x1="630" y1="276" x2="664" y2="276" stroke="#ef6b4d" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="680" cy="276" r="12" fill="#f5b026" stroke="#16233f"/><text x="680" y="281" font-size="13" font-weight="800" fill="#16233f" text-anchor="middle">5</text><text x="700" y="281" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Caption — smallest</text><text x="926" y="342" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>