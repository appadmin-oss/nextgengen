<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 332" width="720" height="332" role="img" aria-labelledby="t d"><title id="t">The 3-2-1 backup rule</title><desc id="d">Three copies, on two different kinds of storage, with one kept somewhere else.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="332" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">The 3-2-1 backup rule</text><rect x="30" y="66" width="210" height="190" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="135" cy="120" r="34" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="135" y="134" font-size="36" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="135" y="190" font-size="14" font-weight="700" fill="#16233f" text-anchor="middle">copies of anything important</text><text x="135" y="214" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">the original + two backups</text><rect x="258" y="66" width="210" height="190" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="363" cy="120" r="34" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="363" y="134" font-size="36" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="363" y="190" font-size="14" font-weight="700" fill="#16233f" text-anchor="middle">different kinds of storage</text><text x="363" y="214" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">e.g. laptop and a flash drive</text><rect x="486" y="66" width="210" height="190" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="591" cy="120" r="34" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="591" y="134" font-size="36" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="591" y="190" font-size="14" font-weight="700" fill="#16233f" text-anchor="middle">copy somewhere else</text><text x="591" y="214" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">in the cloud, or away from home</text><text x="30" y="290" font-size="14" font-weight="600" fill="#3d4560" text-anchor="start">Phones get lost, stolen and dropped. Work that exists in one place is work you can lose.</text><text x="706" y="322" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>