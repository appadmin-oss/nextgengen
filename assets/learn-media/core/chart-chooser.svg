<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 412" width="720" height="412" role="img" aria-labelledby="t d"><title id="t">Choosing a chart</title><desc id="d">Bar for comparing groups, line for change over time, pie only for parts of one whole, histogram or dot plot for spread, scatter for relationships.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="412" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="42" font-size="21" font-weight="800" fill="#16233f" text-anchor="start">Choose the chart by the QUESTION you are asking</text><rect x="30" y="66" width="410" height="50" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="46" y="97" font-size="15" font-weight="600" fill="#16233f" text-anchor="start">Compare amounts between groups</text><rect x="470" y="66" width="220" height="50" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="580" y="97" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Bar chart</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="442" y1="91" x2="466" y2="91" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="30" y="128" width="410" height="50" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="46" y="159" font-size="15" font-weight="600" fill="#16233f" text-anchor="start">Show change over time</text><rect x="470" y="128" width="220" height="50" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="580" y="159" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Line chart</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="442" y1="153" x2="466" y2="153" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="30" y="190" width="410" height="50" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="46" y="221" font-size="15" font-weight="600" fill="#16233f" text-anchor="start">Show parts of ONE whole (few parts)</text><rect x="470" y="190" width="220" height="50" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="580" y="221" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Pie chart — or a bar chart</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="442" y1="215" x2="466" y2="215" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="30" y="252" width="410" height="50" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="46" y="283" font-size="15" font-weight="600" fill="#16233f" text-anchor="start">Show how values are spread</text><rect x="470" y="252" width="220" height="50" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="580" y="283" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Histogram / dot plot</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="442" y1="277" x2="466" y2="277" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="30" y="314" width="410" height="50" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="46" y="345" font-size="15" font-weight="600" fill="#16233f" text-anchor="start">Is one thing related to another?</text><rect x="470" y="314" width="220" height="50" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="580" y="345" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Scatter plot</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="442" y1="339" x2="466" y2="339" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="706" y="402" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>