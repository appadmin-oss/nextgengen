<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 522" width="720" height="522" role="img" aria-labelledby="t d"><title id="t">The data investigation cycle (PPDAC)</title><desc id="d">Five steps in a loop: Problem, Plan, Data, Analysis, Conclusion — and the conclusion raises the next question.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="522" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><circle cx="360" cy="250" r="165" fill="none" stroke="#f3f5fa" stroke-width="22"/><path d="M418.1 95.6 A165 165 0 0 1 488.9 147.0" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M524.8 257.6 A165 165 0 0 1 497.8 340.8" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M403.7 409.1 A165 165 0 0 1 316.3 409.1" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M222.2 340.8 A165 165 0 0 1 195.2 257.6" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M231.1 147.0 A165 165 0 0 1 301.9 95.6" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="268.0" y="51.0" width="184" height="68" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="360.0" y="79.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">1. Problem</text><text x="360.0" y="101.0" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">What do we want to know?</text><rect x="424.9243251887003" y="165.01219592813368" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="516.9243251887003" y="193.01219592813368" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">2. Plan</text><text x="516.9243251887003" y="215.01219592813368" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">What will we measure, how?</text><rect x="364.98456662825805" y="349.4878040718663" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="456.98456662825805" y="377.4878040718663" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">3. Data</text><text x="456.98456662825805" y="399.4878040718663" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Collect it, tidy it</text><rect x="171.01543337174195" y="349.4878040718663" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="263.01543337174195" y="377.4878040718663" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">4. Analysis</text><text x="263.01543337174195" y="399.4878040718663" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Summaries and charts</text><rect x="111.07567481129965" y="165.0121959281337" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="203.07567481129965" y="193.0121959281337" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">5. Conclusion</text><text x="203.07567481129965" y="215.0121959281337" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Answer, and new questions</text><text x="360" y="256" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">PPDAC</text><text x="706" y="512" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>