<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-labelledby="t d"><title id="t">Four principles of layout</title><desc id="d">Contrast, repetition, alignment and proximity — the four checks for any page.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="392" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="30" y="30" width="325" height="150" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="50" y="72" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Contrast</text><text x="50" y="110" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">make different things</text><text x="50" y="134" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">look very different</text><rect x="375" y="30" width="325" height="150" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="395" y="72" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Repetition</text><text x="395" y="110" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">repeat fonts, colours</text><text x="395" y="134" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">and shapes</text><rect x="30" y="200" width="325" height="150" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="50" y="242" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Alignment</text><text x="50" y="280" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">every item lines up</text><text x="50" y="304" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">with something</text><rect x="375" y="200" width="325" height="150" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="395" y="242" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Proximity</text><text x="395" y="280" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">group related things;</text><text x="395" y="304" font-size="15.5" font-weight="500" fill="#3d4560" text-anchor="start">space unrelated ones</text><text x="706" y="382" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>