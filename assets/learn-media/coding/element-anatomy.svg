<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="t d"><title id="t">Anatomy of an HTML element</title><desc id="d">A link element split into opening tag, attribute, value, content and closing tag.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="296" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The parts of an element</text><rect x="52" y="120" width="535.6" height="46" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="52 120 535.6 46"><text x="66" y="150" font-size="18" font-weight="600" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;a href=&quot;https://freecodecamp.org&quot;&gt;Practise&lt;/a&gt;</text></g><path d="M99.4 118 V110 H140.6 V118" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="100" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">attribute</text><path d="M153.4 118 V110 H432.2 V118" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="292.8" y="100" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">its value</text><path d="M531.4 118 V110 H572.6 V118" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="552" y="100" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">closing tag</text><path d="M67 168 V176 H443 V168" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="255" y="200" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">opening tag</text><path d="M445 168 V176 H529.4 V168" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="487.2" y="200" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" xml:space="preserve">content</text><text x="20" y="250" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Attributes go inside the opening tag, as name=&quot;value&quot;.</text><text x="20" y="276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">The closing tag repeats the name with a slash: &lt;/a&gt;.</text></g></svg>