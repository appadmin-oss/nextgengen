<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" width="640" height="354" role="img" aria-labelledby="t d"><title id="t">Validating a form on submit</title><desc id="d">A decision: valid sends; invalid stops and explains.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="354" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">What happens when the form is sent</text><rect x="20" y="60" width="160" height="50" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 160 50"><text x="100" y="89.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">submit event</text></g><line x1="182" y1="85" x2="216" y2="85" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="320,47 420,85 320,123 220,85" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="262 60 116 50"><text x="320" y="91" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">valid?</text></g><line x1="422" y1="85" x2="476" y2="85" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="448" y="76" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">yes</text><rect x="480" y="60" width="140" height="50" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="480 60 140 50"><text x="550" y="89.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">form is sent</text></g><line x1="320" y1="125" x2="320" y2="154" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="332" y="146" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">no</text><rect x="120" y="158" width="400" height="40" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="120 158 400 40"><text x="320" y="182.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">e.preventDefault()  — stop the send</text></g><rect x="120" y="204" width="400" height="40" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="120 204 400 40"><text x="320" y="228.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">say what to fix, with an example</text></g><rect x="120" y="250" width="400" height="40" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="120 250 400 40"><text x="320" y="274.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">aria-invalid=&quot;true&quot; on the field</text></g><rect x="120" y="296" width="400" height="40" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="120 296 400 40"><text x="320" y="320.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">focus the field; keep what they typed</text></g></g></svg>