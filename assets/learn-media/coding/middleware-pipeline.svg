<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" width="640" height="264" role="img" aria-labelledby="t d"><title id="t">Express middleware</title><desc id="d">Four steps joined by next().</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="264" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A request passes through, in order</text><rect x="20" y="70" width="140" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 140 76"><text x="90" y="102.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">express.json()</text><text x="90" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">fills req.body</text></g><line x1="162" y1="108" x2="174" y2="108" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="168" y="168" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">next()</text><rect x="176" y="70" width="140" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="176 70 140 76"><text x="246" y="102.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">logger</text><text x="246" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">prints the URL</text></g><line x1="318" y1="108" x2="330" y2="108" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="324" y="168" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">next()</text><rect x="332" y="70" width="140" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="332 70 140 76"><text x="402" y="102.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">static</text><text x="402" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">serves files</text></g><line x1="474" y1="108" x2="486" y2="108" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="480" y="168" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">next()</text><rect x="488" y="70" width="140" height="76" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="488 70 140 76"><text x="558" y="102.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">your route</text><text x="558" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">sends a reply</text></g><rect x="20" y="196" width="600" height="52" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 196 600 52"><text x="320" y="226.576" font-size="16" font-weight="600" fill="#9c3119" text-anchor="middle" xml:space="preserve">No next() and no response? The browser waits, then times out.</text></g></g></svg>