<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 311" width="640" height="311" role="img" aria-labelledby="t d"><title id="t">Event listeners</title><desc id="d">Click, event, listener, page update.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="311" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Something happens, your function runs</text><rect x="20" y="70" width="140" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 140 76"><text x="90" y="102.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">User clicks</text><text x="90" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">the button</text></g><circle cx="34" cy="70" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="20 56 28 28"><text x="34" y="76" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">1</text></g><line x1="162" y1="108" x2="174" y2="108" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="176" y="70" width="140" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="176 70 140 76"><text x="246" y="102.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Browser fires</text><text x="246" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">&quot;click&quot;</text></g><circle cx="190" cy="70" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="176 56 28 28"><text x="190" y="76" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">2</text></g><line x1="318" y1="108" x2="330" y2="108" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="332" y="70" width="140" height="76" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="332 70 140 76"><text x="402" y="102.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Your listener</text><text x="402" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">runs (event)</text></g><circle cx="346" cy="70" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="332 56 28 28"><text x="346" y="76" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">3</text></g><line x1="474" y1="108" x2="486" y2="108" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="488" y="70" width="140" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="488 70 140 76"><text x="558" y="102.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Page</text><text x="558" y="122.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">updates</text></g><circle cx="502" cy="70" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="488 56 28 28"><text x="502" y="76" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">4</text></g><rect x="20" y="176" width="600" height="119" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 176 600 119"><text x="34" y="203.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">button.addEventListener(&quot;click&quot;, () =&gt; {</tspan></text><text x="34" y="228.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  presses++;</tspan></text><text x="34" y="253.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  button.textContent = `Pressed ${presses} times`;</tspan></text><text x="34" y="278.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">});</tspan></text></g></g></svg>