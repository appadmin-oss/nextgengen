<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">GitHub Pages addresses</title><desc id="d">Repository files mapped to web addresses.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Each file in the repo becomes an address</text><rect x="20" y="60" width="180" height="42" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 180 42"><text x="110" y="85.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">index.html</text></g><line x1="204" y1="81" x2="236" y2="81" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="244" y="87" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">…github.io/my-first-site/</text><rect x="20" y="116" width="180" height="42" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 116 180 42"><text x="110" y="141.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">styles.css</text></g><line x1="204" y1="137" x2="236" y2="137" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="244" y="143" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">…/my-first-site/styles.css</text><rect x="20" y="172" width="180" height="42" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 172 180 42"><text x="110" y="197.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">images/me.jpg</text></g><line x1="204" y1="193" x2="236" y2="193" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="244" y="199" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">…/my-first-site/images/me.jpg</text><rect x="20" y="238" width="600" height="76" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 238 600 76"><text x="34" y="270.176" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Online, capitals matter:</text><text x="34" y="290.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Photo.JPG and photo.jpg are two different files.</text></g></g></svg>