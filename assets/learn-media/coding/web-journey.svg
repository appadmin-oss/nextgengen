<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" width="640" height="356" role="img" aria-labelledby="t d"><title id="t">How a web page loads</title><desc id="d">Browser, DNS server and web server exchange four messages; then the browser draws the page.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="356" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">What happens when you open a page</text><rect x="20" y="56" width="150" height="250" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 56 150 250"><text x="95" y="134.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Browser</text><text x="95" y="155.676" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">on your phone</text><text x="95" y="176.476" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve"></text><text x="95" y="197.276" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">5. reads the</text><text x="95" y="218.076" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">HTML and</text><text x="95" y="238.876" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">draws the page</text></g><rect x="470" y="56" width="150" height="92" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="470 56 150 92"><text x="545" y="96.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">DNS server</text><text x="545" y="118.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">names → numbers</text></g><rect x="470" y="176" width="150" height="130" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="470 176 150 130"><text x="545" y="235.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Web server</text><text x="545" y="257.276" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">holds the site</text></g><line x1="174" y1="96" x2="464" y2="96" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="319" y="87" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1. Where is nextgengenius.ng?</text><line x1="464" y1="134" x2="174" y2="134" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="319" y="125" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">2. At 203.0.113.7</text><line x1="174" y1="222" x2="464" y2="222" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="319" y="213" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">3. HTTP request: GET /</text><line x1="464" y1="268" x2="174" y2="268" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="319" y="259" font-size="16" fon