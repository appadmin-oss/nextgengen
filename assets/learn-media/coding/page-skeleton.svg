<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="t d"><title id="t">HTML page skeleton</title><desc id="d">A tree: html contains head (meta, title, link) and body (the visible content).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="410" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Every page: a head and a body</text><rect x="220" y="54" width="200" height="46" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 54 200 46"><text x="320" y="81.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;html lang=&quot;en&quot;&gt;</text></g><path d="M300 102 V120 H130 V138" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M340 102 V120 H500 V138" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="140" width="220" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 140 220 46"><text x="130" y="168.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;head&gt;</text></g><rect x="40" y="198" width="200" height="36" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="40 198 200 36"><text x="140" y="220.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;meta charset&gt;</text></g><rect x="40" y="242" width="200" height="36" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="40 242 200 36"><text x="140" y="264.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;meta viewport&gt;</text></g><rect x="40" y="286" width="200" height="36" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="40 286 200 36"><text x="140" y="308.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;title&gt;</text></g><rect x="40" y="330" width="200" height="36" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="40 330 200 36"><text x="140" y="352.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;link stylesheet&gt;</text></g><rect x="380" y="140" width="240" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="380 140 240 46"><text x="500" y="168.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;body&gt;</text></g><rect x="400" y="198" width="220" height="36" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="400 198 220 36"><text x="510" y="220.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt;h1&gt;, &lt;p&gt;, &lt;img&gt;…</text></g><text x="130" y="392" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">about the page: not shown</text><text x="500" y="262" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">what the visitor sees</text></g></svg>