<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">Anatomy of an error message</title><desc id="d">An error split into type, message and location.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Read all of the error</text><rect x="20" y="56" width="600" height="94" rx="8" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 56 600 94"><text x="34" y="83.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#9c3119" font-weight="800">TypeError</tspan><tspan fill="#16233f" font-weight="500">: Cannot read properties</tspan></text><text x="34" y="108.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">of undefined (reading &#x27;name&#x27;)</tspan></text><text x="34" y="133.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#3d4560" font-weight="500">    at </tspan><tspan fill="#0b6274" font-weight="800">app.js:14</tspan></text></g><rect x="20" y="170" width="192" height="104" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 170 192 104"><text x="116" y="205.776" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">the kind</text><text x="116" y="226.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">TypeError: a value</text><text x="116" y="247.376" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">used the wrong way</text></g><rect x="224" y="170" width="192" height="104" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="224 170 192 104"><text x="320" y="205.776" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">what happened</text><text x="320" y="226.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">a value you expected</text><text x="320" y="247.376" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">was undefined</text></g><rect x="428" y="170" width="192" height="104" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="428 170 192 104"><text x="524" y="205.776" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">where</text><text x="524" y="226.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">file app.js,</text><text x="524" y="247.376" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">line 14</text></g></g></svg>