<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" role="img" aria-labelledby="t d"><title id="t">Express route order</title><desc id="d">The same two routes in two orders.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="328" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The first matching route wins</text><rect x="20" y="60" width="230" height="50" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 230 50"><text x="135" y="89.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">GET /api/tasks/search</text></g><rect x="280" y="56" width="340" height="120" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="296" y="82" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">Right order</text><text x="296" y="114" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">1. /api/tasks/search  ✓ match</text><text x="296" y="146" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">2. /api/tasks/:id</text><rect x="280" y="190" width="340" height="120" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="296" y="216" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Wrong order</text><text x="296" y="248" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">1. /api/tasks/:id  ← id = &quot;search&quot;</text><text x="296" y="280" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">2. /api/tasks/search  never reached</text><line x1="252" y1="86" x2="276" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/></g></svg>