<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 309" width="640" height="309" role="img" aria-labelledby="t d"><title id="t">An Express route</title><desc id="d">A request matched to a route and the JSON it returns.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="309" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A request finds its route</text><rect x="20" y="60" width="200" height="52" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 200 52"><text x="120" y="90.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">GET /hello/Kemi</text></g><line x1="222" y1="86" x2="256" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="262" y="56" width="358" height="169" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="262 56 358 169"><text x="276" y="83.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">app.get(&quot;/hello/:name&quot;,</tspan></text><text x="276" y="108.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  (req, res) =&gt; {</tspan></text><text x="276" y="133.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  const n = req.params.name;</tspan></text><text x="276" y="158.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  res.json({ message:</tspan></text><text x="276" y="183.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">    `Hello, ${n}!` });</tspan></text><text x="276" y="208.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">});</tspan></text></g><rect x="20" y="150" width="200" height="60" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 150 200 60"><text x="120" y="174.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">req.params.name</text><text x="120" y="194.976" font-size="16" font-weight="600" fill="#0b6274" text-anchor="middle" xml:space="preserve">= &quot;Kemi&quot;</text></g><rect x="20" y="245" width="600" height="48" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 245 600 48"><text x="320" y="273.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">{ &quot;message&quot;: &quot;Hello, Kemi!&quot; }</text></g><path d="M440 227 V241" fill="none" stroke="#1d6b30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag)"/></g></svg>