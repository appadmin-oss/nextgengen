<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img" aria-labelledby="t d"><title id="t">Accessible form field</title><desc id="d">A label, a tall field with a focus outline and a written error.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="240" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A field that works on a phone</text><text x="40" y="82" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Phone number</text><rect x="40" y="94" width="380" height="48" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="2"/><rect x="34" y="88" width="392" height="60" rx="12" fill="none" stroke="#f5b026" stroke-width="3"/><text x="56" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">0803 12</text><text x="40" y="176" font-size="16" font-weight="600" fill="#b42318" text-anchor="start" xml:space="preserve">Enter 11 digits, like 0803 123 4567.</text><text x="456" y="82" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">← label above</text><text x="456" y="110" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">← focus ring shows</text><text x="456" y="134" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">← ≥ 44px tall</text><text x="456" y="176" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">← error in words</text><text x="20" y="222" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Never remove the focus outline without a better one.</text></g></svg>