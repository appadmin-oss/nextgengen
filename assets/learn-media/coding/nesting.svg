<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282" role="img" aria-labelledby="t d"><title id="t">Nesting HTML elements</title><desc id="d">Correctly nested boxes beside crossed, broken ones.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="282" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Close in the reverse order you opened</text><rect x="20" y="60" width="290" height="170" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="18" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">Right</text><rect x="40" y="102" width="250" height="110" rx="10" fill="#ffffff" stroke="#3d4560" stroke-width="1.25"/><g data-fit="40 102 250 110"></g><text x="52" y="126" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;p&gt;</text><text x="278" y="200" font-size="16" font-weight="700" fill="#16233f" text-anchor="end" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;/p&gt;</text><rect x="76" y="138" width="178" height="40" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="76 138 178 40"><text x="165" y="164" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;a&gt;…&lt;/a&gt;</text></g><rect x="330" y="60" width="290" height="170" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="86" font-size="18" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Broken</text><rect x="350" y="102" width="180" height="110" rx="10" fill="#ffffff" stroke="#3d4560" stroke-width="1.25"/><rect x="420" y="136" width="180" height="60" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><text x="362" y="126" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;p&gt;</text><text x="434" y="162" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;a&gt;…&lt;/p&gt;</text><text x="590" y="188" font-size="16" font-weight="700" fill="#16233f" text-anchor="end" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">&lt;/a&gt;</text><text x="20" y="262" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">The inner box must end before the outer one does.</text></g></svg>