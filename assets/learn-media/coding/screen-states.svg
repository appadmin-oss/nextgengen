<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-labelledby="t d"><title id="t">The states of a data screen</title><desc id="d">Four phone screens: loading, empty, error, loaded.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="318" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Design all four states, not one</text><rect x="20" y="56" width="140" height="220" rx="14" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="90" y="300" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Loading</text><rect x="28" y="96" width="124" height="120" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="28 96 124 120"><text x="90" y="160.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Loading…</text></g><rect x="174" y="56" width="140" height="220" rx="14" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="244" y="300" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Empty</text><rect x="182" y="96" width="124" height="120" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="182 96 124 120"><text x="244" y="150.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">No books yet</text><text x="244" y="170.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">— add one</text></g><rect x="328" y="56" width="140" height="220" rx="14" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="398" y="300" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Error</text><rect x="336" y="96" width="124" height="120" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="336 96 124 120"><text x="398" y="150.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Couldn&#x27;t load.</text><text x="398" y="170.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">[ Retry ]</text></g><rect x="482" y="56" width="140" height="220" rx="14" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="552" y="300" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Loaded</text><rect x="490" y="96" width="124" height="120" rx="6" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="490 96 124 120"><text x="552" y="150.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Arrow of God</text><text x="552" y="170.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">Efuru</text></g></g></svg>