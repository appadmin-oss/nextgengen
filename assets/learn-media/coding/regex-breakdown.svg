<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" width="640" height="278" role="img" aria-labelledby="t d"><title id="t">Regular expression breakdown</title><desc id="d">Six pieces of a phone-number pattern and the digits each matches.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="278" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A pattern, one piece at a time</text><rect x="22" y="60" width="56" height="48" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="22 60 56 48"><text x="50" y="89.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">^</text></g><g data-fit="22 112 56 30"><text x="50" y="134" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">start</text></g><rect x="82" y="60" width="70" height="48" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="82 60 70 48"><text x="117" y="89.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">0</text></g><g data-fit="82 112 70 30"><text x="117" y="134" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">a zero</text></g><rect x="82" y="154" width="70" height="42" rx="6" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="82 154 70 42"><text x="117" y="179.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">0</text></g><rect x="156" y="60" width="104" height="48" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="156 60 104 48"><text x="208" y="89.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">[789]</text></g><g data-fit="156 112 104 30"><text x="208" y="134" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">7, 8 or 9</text></g><rect x="156" y="154" width="104" height="42" rx="6" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="156 154 104 42"><text x="208" y="179.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">8</text></g><rect x="264" y="60" width="92" height="48" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="264 60 92 48"><text x="310" y="89.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">[01]</text></g><g data-fit="264 112 92 30"><text x="310" y="134" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">0 or 1</text></g><rect x="264" y="154" width="92" height="42" rx="6" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="264 154 92 42"><text x="310" y="179.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">0</text></g><rect x="360" y="60" width="174" height="48" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="360 60 174 48"><text x="447" y="89.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">\d{8}</text></g><g data-fit="360 112 174 30"><text x="447" y="134" font-size="