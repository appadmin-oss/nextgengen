<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img" aria-labelledby="t d"><title id="t">Password hashing</title><desc id="d">A password turned one way into a stored hash.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="262" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Store the hash, never the password</text><rect x="20" y="64" width="170" height="50" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 170 50"><text x="105" y="93.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">&quot;orange-canoe&quot;</text></g><line x1="192" y1="89" x2="236" y2="89" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="240" y="64" width="120" height="50" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="240 64 120 50"><text x="300" y="93.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">bcrypt</text></g><line x1="362" y1="89" x2="396" y2="89" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="400" y="64" width="220" height="50" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="400 64 220 50"><text x="510" y="93.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">$2b$12$Kx9…</text></g><text x="510" y="140" font-size="16" font-weight="600" fill="#0b6274" text-anchor="middle" xml:space="preserve">stored in the database</text><text x="300" y="140" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">one way only</text><rect x="20" y="170" width="600" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 170 600 76"><text x="34" y="202.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">At login: hash what was typed, compare the hashes.</text><text x="34" y="222.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">A leaked database shows hashes, not passwords.</text></g></g></svg>