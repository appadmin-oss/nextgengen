<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">Function anatomy</title><desc id="d">A call passes 82 in; the function returns a grade.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Argument in, return value out</text><rect x="20" y="90" width="140" height="56" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 90 140 56"><text x="90" y="122.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">grade(82)</text></g><line x1="164" y1="118" x2="210" y2="118" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="187" y="108" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">82</text><rect x="216" y="60" width="404" height="144" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="216 60 404 144"><text x="230" y="87.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">function grade(</tspan><tspan fill="#0b6274" font-weight="800">score</tspan><tspan fill="#16233f" font-weight="500">) {</tspan></text><text x="230" y="112.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  if (score &gt;= 70)</tspan></text><text x="230" y="137.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#9c3119" font-weight="700">    return </tspan><tspan fill="#16233f" font-weight="500">&quot;Distinction&quot;;</tspan></text><text x="230" y="162.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  …</tspan></text><text x="230" y="187.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">}</tspan></text></g><path d="M418 208 V238 H90 V150" fill="none" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><text x="254" y="230" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">returns &quot;Distinction&quot;</text><text x="20" y="270" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">82 is the argument; score is the parameter that receives it.</text></g></svg>