<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">Order of CSS transforms</title><desc id="d">Two panels: the box ends up diagonal in one, straight right in the other.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Same two transforms, different order</text><rect x="20" y="56" width="290" height="230" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 56 290 230"><text x="165" y="82" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">rotate(45deg)</text><text x="165" y="104" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">translateX(100px)</text></g><rect x="50" y="120" width="40" height="40" fill="none" stroke="#3d4560" stroke-dasharray="4 3"/><rect x="163" y="233" width="40" height="40" fill="#f5b026" stroke="#16233f" transform="rotate(45 183 253)"/><line x1="70" y1="140" x2="170.272" y2="240.272" stroke="#9c3119" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ar)"/><rect x="330" y="56" width="290" height="230" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 56 290 230"><text x="475" y="82" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">translateX(100px)</text><text x="475" y="104" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">rotate(45deg)</text></g><rect x="360" y="180" width="40" height="40" fill="none" stroke="#3d4560" stroke-dasharray="4 3"/><rect x="520" y="180" width="40" height="40" fill="#f5b026" stroke="#16233f" transform="rotate(45 540 200)"/><line x1="380" y1="200" x2="522" y2="200" stroke="#9c3119" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="165" y="312" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">moves along the turned axis</text><text x="475" y="312" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">moves right, turns in place</text></g></svg>