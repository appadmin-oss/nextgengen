<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" role="img" aria-labelledby="t d"><title id="t">Audio and video events</title><desc id="d">A timeline of play, timeupdate, pause, play, ended.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="284" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The events a video fires</text><rect x="30" y="110" width="580" height="16" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><rect x="30" y="110" width="340" height="16" rx="8" fill="#20b2c9" stroke="#20b2c9" stroke-width="1.25"/><line x1="30" y1="92" x2="30" y2="144" stroke="#3d4560" stroke-width="2"/><text x="30" y="166" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">play</text><line x1="370" y1="92" x2="370" y2="144" stroke="#3d4560" stroke-width="2"/><text x="370" y="188" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">pause</text><line x1="430" y1="92" x2="430" y2="144" stroke="#3d4560" stroke-width="2"/><text x="430" y="166" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">play</text><line x1="610" y1="92" x2="610" y2="144" stroke="#3d4560" stroke-width="2"/><text x="610" y="188" font-size="16" font-weight="700" fill="#16233f" text-anchor="end" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">ended</text><line x1="80" y1="98" x2="80" y2="106" stroke="#0b6274" stroke-width="2"/><line x1="130" y1="98" x2="130" y2="106" stroke="#0b6274" stroke-width="2"/><line x1="180" y1="98" x2="180" y2="106" stroke="#0b6274" stroke-width="2"/><line x1="230" y1="98" x2="230" y2="106" stroke="#0b6274" stroke-width="2"/><line x1="280" y1="98" x2="280" y2="106" stroke="#0b6274" stroke-width="2"/><line x1="330" y1="98" x2="330" y2="106" stroke="#0b6274" stroke-width="2"/><text x="200" y="86" font-size="16" font-weight="600" fill="#0b6274" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">timeupdate, timeupdate, …</text><text x="20" y="236" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">progress.value = video.currentTime / video.duration</text><text x="20" y="264" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Start playback from a click: browsers block sound by itself.</text></g></svg>