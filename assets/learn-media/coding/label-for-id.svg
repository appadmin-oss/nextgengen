<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="t d"><title id="t">Label for and input id</title><desc id="d">Code with for and id matched, and name as the key sent.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="280" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">for ↔ id ties the label to the field</text><rect x="20" y="56" width="600" height="69" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 56 600 69"><text x="34" y="83.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">&lt;label </tspan><tspan fill="#0b6274" font-weight="800">for=&quot;email&quot;</tspan><tspan fill="#16233f" font-weight="500">&gt;Email&lt;/label&gt;</tspan></text><text x="34" y="108.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">&lt;input </tspan><tspan fill="#0b6274" font-weight="800">id=&quot;email&quot;</tspan><tspan fill="#16233f" font-weight="500"> </tspan><tspan fill="#9c3119" font-weight="800">name=&quot;email&quot;</tspan><tspan fill="#16233f" font-weight="500"> type=&quot;email&quot;&gt;</tspan></text></g><rect x="20" y="170" width="290" height="92" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 170 290 92"><text x="34" y="199.776" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Same word, so:</text><text x="34" y="220.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">the label is read aloud</text><text x="34" y="241.376" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">and tapping it focuses</text></g><rect x="330" y="170" width="290" height="92" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 170 290 92"><text x="344" y="210.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">name is the key sent:</text><text x="344" y="230.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">email=ada@example.org</text></g></g></svg>