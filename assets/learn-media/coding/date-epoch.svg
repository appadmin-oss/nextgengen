<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" role="img" aria-labelledby="t d"><title id="t">Dates as milliseconds</title><desc id="d">A timeline from 1970, and a duration by subtraction.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="328" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A date is a count of milliseconds</text><line x1="30" y1="120" x2="610" y2="120" stroke="#3d4560" stroke-width="3"/><line x1="40" y1="108" x2="40" y2="132" stroke="#3d4560" stroke-width="3"/><text x="40" y="98" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">1 Jan 1970</text><line x1="360" y1="108" x2="360" y2="132" stroke="#3d4560" stroke-width="3"/><text x="360" y="98" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">3 Oct 2026</text><line x1="560" y1="108" x2="560" y2="132" stroke="#3d4560" stroke-width="3"/><text x="560" y="98" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">now</text><text x="40" y="156" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">0 ms</text><path d="M360 146 H556" fill="none" stroke="#9c3119" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><text x="458" y="170" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">now - start = ms</text><text x="20" y="214" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">days = Math.floor(ms / 86400000)</text><text x="20" y="240" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">86400000 = 1000 × 60 × 60 × 24</text><rect x="20" y="262" width="600" height="50" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 262 600 50"><text x="34" y="291.576" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">getMonth(): January is 0, so October is 9.</text></g></g></svg>