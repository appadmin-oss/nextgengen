<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" width="640" height="356" role="img" aria-labelledby="t d"><title id="t">if, else if, else</title><desc id="d">A flowchart of two tests and three outcomes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="356" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Checked top to bottom; the first true one wins</text><polygon points="160,65 270,100 160,135 50,100" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="97 76.5 126 47"><text x="160" y="106" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">score &gt;= 70?</text></g><polygon points="160,175 270,210 160,245 50,210" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="97 186.5 126 47"><text x="160" y="216" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">score &gt;= 50?</text></g><rect x="380" y="76" width="200" height="48" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="380 76 200 48"><text x="480" y="104.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&quot;Distinction&quot;</text></g><rect x="380" y="186" width="200" height="48" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="380 186 200 48"><text x="480" y="214.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&quot;Pass&quot;</text></g><rect x="60" y="290" width="200" height="48" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="60 290 200 48"><text x="160" y="318.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">&quot;Try again&quot;</text></g><line x1="272" y1="100" x2="376" y2="100" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="322" y="90" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">yes</text><line x1="272" y1="210" x2="376" y2="210" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="322" y="200" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">yes</text><line x1="160" y1="137" x2="160" y2="172" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="172" y="160" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">no</text><line x1="160" y1="247" x2="160" y2="286" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="172" y="272" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">no</text><text x="380" y="300" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">else: nothing above</text><text x="380" y="322" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">was true</text></g></svg>