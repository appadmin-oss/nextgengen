<style>
  .aj-boot { position: fixed; inset: 0; display: grid; place-items: center; background: #140b2b; z-index: 9999; transition: opacity .4s ease; }
  .aj-boot img { width: 60px; height: 60px; border-radius: 16px; animation: ajb 1.6s ease-in-out infinite; }
  @keyframes ajb { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.08); opacity: 1; } }
  .aj-boot.gone { opacity: 0; pointer-events: none; }
</style>

<div class="aj-boot" id="aj-boot"><img src="/assets/logo.png" alt="Loading Anchor Journal"/></div>

<script>
  (function () { var t = 0; (function check() { var r = document.getElementById("aj-root"); if (r && r.children.length > 0) { var b = document.getElementById("aj-boot"); if (b) { b.classList.add("gone"); setTimeout(function () { b.remove(); }, 500); } } else if (t++ < 200) setTimeout(check, 80); })(); })();
</script>
