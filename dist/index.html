<style>
  /* Pre-React loading shim — avoids blank-flash on first paint over slow shared hosting */
  .ngg-boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: #0c1432;
    color: #f5b026;
    font-family: "Sora", system-ui, sans-serif;
    z-index: 9999;
    transition: opacity 0.5s ease;
  }
  .ngg-boot img { width: 64px; height: 64px; border-radius: 50%; animation: ngg-pulse 1.6s ease-in-out infinite; }
  .ngg-boot small { display:block; margin-top:18px; font-family:"JetBrains Mono", monospace; font-size:10px; letter-spacing:0.25em; opacity:0.55; text-transform:uppercase; }
  @keyframes ngg-pulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50%      { transform: scale(1.08); opacity: 1; }
  }
  .ngg-boot.gone { opacity: 0; pointer-events: none; }
</style>
<script>
  /* Apply saved accessibility preferences before first paint (no flash). */
  try {
    var a = JSON.parse(localStorage.getItem("ngg.a11y") || "{}"), r = document.documentElement;
    r.setAttribute("data-contrast", a.contrast ? "high" : "normal");
    r.setAttribute("data-motion", a.motion ? "reduce" : "auto");
    r.setAttribute("data-font", a.readable ? "readable" : "default");
    r.setAttribute("data-links", a.underline ? "underline" : "default");
  } catch (e) {}
</script>

<script>
  // Fade out boot screen after React mounts
  (function(){
    var tries = 0;
    function check(){
      var root = document.getElementById("root");
      if (root && root.children.length > 0) {
        var b = document.getElementById("ngg-boot");
        if (b) { b.classList.add("gone"); setTimeout(function(){ b.remove(); }, 600); }
      } else if (tries++ < 200) {
        setTimeout(check, 80);
      }
    }
    check();
  })();

  // Register service worker for instant repeat visits + offline.
  // Disabled on localhost so dev edits aren't cached aggressively.
  //
  // Update discipline (so deploys go live without a manual hard-refresh):
  //  - updateViaCache:'none' — the SW script itself is never served from the
  //    HTTP cache, so a new build's service-worker.js is always noticed.
  //  - reg.update() on load — actively check for a newer SW every visit.
  //  - controllerchange → reload ONCE — when a new SW (new build) takes
  //    control, swap the running app for the fresh one. Guarded so the very
  //    first install (no prior controller) never triggers a reload loop.
  if ('serviceWorker' in navigator
      && location.hostname !== 'localhost'
      && location.hostname !== '127.0.0.1') {
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController || window.__nggReloaded) return;
      window.__nggReloaded = true;
      location.reload();
    });
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js', { updateViaCache: 'none' })
        .then(function (reg) { reg.update(); })
        .catch(function () { /* ignore registration failures */ });
    });
  }
</script>
