  .aj-boot img { width: 60px; height: 60px; border-radius: 16px; animation: ajb 1.6s ease-in-out infinite; }

  /* Carry global accessibility prefs into the journal PWA. */
  /* :not(#_) adds an id's weight without matching anything less, so these beat

  :root[data-motion="reduce"] :not(#_):not(#_), :root[data-motion="reduce"] :not(#_):not(#_)::before, :root[data-motion="reduce"] :not(#_):not(#_)::after {
    animation-duration: .01ms; animation-iteration-count: 1; transition-duration: .01ms;

</style>
<script>
  /* Apply saved accessibility preferences before first paint. */
  try {
    var a = JSON.parse(localStorage.getItem("ngg.a11y") || "{}"), r = document.documentElement;
