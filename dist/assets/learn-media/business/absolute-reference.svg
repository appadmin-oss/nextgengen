ect x="434.0" y="162.0" width="182.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="442.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">=D4*$F$1</text><rect x="394.0" y="214.0" width="222.0" height="44.0" rx="6" fill="#dff3f7" stroke="#16233f" stroke-width="1.25"/><text x="406.0" y="242.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">F1 = 1.075 (VAT rate)</text><text x="24.0" y="230.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Relative: B2 becomes B3, B4 as it is</text><text x="24.0" y="251.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">copied down.</text><text x="24.0" y="283.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Absolute: $F$1 is locked, so every row</text><text x="24.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">uses the one VAT cell. Press F4 to add the</text><text x="24.0" y="325.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">$ signs.</text><text x="624.0" y="357.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>