<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 426" width="640" height="426" role="img" aria-labelledby="t d"><title id="t">Double entry</title><desc id="d">Paying ₦20,000 rent is recorded twice: a credit of ₦20,000 to the bank account and a debit of ₦20,000 to rent expense; the balance sheet always holds Assets = Liabilities + Equity.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="426" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Double entry: one payment, two accounts, equal and</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">opposite</text><text x="160.0" y="106.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Bank (asset)</text><line x1="40.0" y1="120.0" x2="280.0" y2="120.0" stroke="#16233f" stroke-width="2.5"/><line x1="160.0" y1="120.0" x2="160.0" y2="236.0" stroke="#16233f" stroke-width="2.5"/><text x="100.0" y="144.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Debit</text><text x="220.0" y="144.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Credit</text><text x="220.0" y="182.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle">₦20,000 out</text><text x="460.0" y="106.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Rent expense</text><line x1="340.0" y1="120.0" x2="580.0" y2="120.0" stroke="#16233f" stroke-width="2.5"/><line x1="460.0" y1="120.0" x2="460.0" y2="236.0" stroke="#16233f" stroke-width="2.5"/><text x="400.0" y="144.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Debit</text><text x="520.0" y="144.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Credit</text><text x="400.0" y="182.0" font-size="16" font-weight="800" fill="#0b6274" text-anchor="middle">₦20,000 in</text><rect x="24.0" y="256.0" width="592.0" height="56.0" rx="10" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="291.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Assets = Liabilities + Equity</text><text x="24.0" y="344.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Paying ₦20,000 rent reduces the bank and increases rent expense by</text><text x="24.0" y="365.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the same amount — which is why the books always balance and errors</text><text x="24.0" y="386.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">show up.</text><text x="624.0" y="416.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>