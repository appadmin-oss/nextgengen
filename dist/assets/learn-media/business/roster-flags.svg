<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" role="img" aria-labelledby="t d"><title id="t">Duty roster</title><desc id="d">A duty roster grid of roles by shift where conditional formatting highlights Tunde booked twice in the 9–12 shift and an empty instructor slot at 12–3.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="402" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A roster that flags its own gaps and double-bookings</text><rect x="24.0" y="60.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Role</text><rect x="224.0" y="60.0" width="196.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Sat 9–12</text><rect x="420.0" y="60.0" width="196.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="428.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Sat 12–3</text><rect x="24.0" y="94.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Lead</text><rect x="224.0" y="94.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ada</text><rect x="420.0" y="94.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="428.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ada</text><rect x="24.0" y="128.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Instructor</text><rect x="224.0" y="128.0" width="196.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tunde</text><rect x="420.0" y="128.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="428.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Bisi</text><rect x="24.0" y="162.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Instructor</text><rect x="224.0" y="162.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Bisi</text><rect x="420.0" y="162.0" width="196.0" height="34.0" rx="0" fill="#ef6b4d" stroke="#c9cedb" stroke-width="1"/><rect x="24.0" y="196.0" width="200.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Check-in desk</text><rect x="224.0" y="196.0" width="196.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tunde</text><rect x="420.0" y="196.0" width="196.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="428.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ife</text><text x="24.0" y="260.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start">Tunde twice in one shift: double-booked.</text><text x="24.0" y="286.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start">Empty cell: a gap nobody covers.</text><text x="24.0" y="320.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Dropdowns from a staff list keep names spelt the same. Count shifts</text><text x="24.0" y="341.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">per person with COUNTIF for fairness; never one adult alone with</text><text x="24.0" y="362.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">children.</text><text x="624.0" y="392.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>