ill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="454.0" y="357.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">over 100%</text><text x="24.0" y="396.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Actual comes from the expense tab with SUMIF by category, so the</text><text x="24.0" y="417.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">category names must match exactly. Transport is ₦7k over: say why,</text><text x="24.0" y="438.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and adjust.</text><text x="624.0" y="468.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>