<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255" role="img" aria-labelledby="t d"><title id="t">Automation scenario</title><desc id="d">An automation: a new Google Form response triggers the scenario, a filter lets only High-priority requests through, then it emails the facilities lead and adds a row to the tracker.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="255" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A Make scenario: a trigger, a filter, then actions</text><rect x="24.0" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="88.2" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Trigger</text><text x="88.2" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">new form</text><text x="88.2" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">response</text><line x1="155.5" y1="110.0" x2="175.5" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="178.5" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="242.8" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Filter</text><text x="242.8" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">priority =</text><text x="242.8" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">High</text><line x1="310.0" y1="110.0" x2="330.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="333.0" y="60.0" width="128.5" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="397.2" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Email</text><text x="397.2" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">facilities</text><text x="397.2" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">lead, details</text><text x="397.2" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">mapped in</text><line x1="464.5" y1="110.0" x2="484.5" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="487.5" y="60.0" width="128.5" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="551.8" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Add row</text><text x="551.8" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">requests</text><text x="551.8" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">tracker</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Draw it on paper first. Test with sample data, including missing fields</text><text x="24.0" y="211.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and duplicates, and write down who owns it and how to switch it off.</text><text x="624.0" y="245.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>