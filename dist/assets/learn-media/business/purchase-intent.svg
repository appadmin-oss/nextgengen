<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" width="640" height="375" role="img" aria-labelledby="t d"><title id="t">Purchase intent</title><desc id="d">Purchase intent from 40 people: 9 definitely, 14 probably, 8 not sure, 5 probably not, 4 definitely not. Only the 9 “definitely” (23%) are counted as likely buyers.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="375" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Count only “Definitely” as likely buyers</text><text x="24.0" y="84.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Definitely</text><rect x="170.0" y="66.0" width="198.0" height="28.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="378.0" y="86.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">9 of 40</text><text x="24.0" y="130.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Probably</text><rect x="170.0" y="112.0" width="308.0" height="28.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="488.0" y="132.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">14 of 40</text><text x="24.0" y="176.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Not sure</text><rect x="170.0" y="158.0" width="176.0" height="28.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="356.0" y="178.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">8 of 40</text><text x="24.0" y="222.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Probably not</text><rect x="170.0" y="204.0" width="110.0" height="28.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="290.0" y="224.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">5 of 40</text><text x="24.0" y="268.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Definitely not</text><rect x="170.0" y="250.0" width="88.0" height="28.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="268.0" y="270.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">4 of 40</text><text x="24.0" y="314.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">23 of 40 said definitely or probably — but people overstate intent. Plan</text><text x="24.0" y="335.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">on the 9 (23%), and look for commitment: a number left, a pre-order.</text><text x="624.0" y="365.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>