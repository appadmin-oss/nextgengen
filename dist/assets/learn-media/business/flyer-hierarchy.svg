<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 481" width="640" height="481" role="img" aria-labelledby="t d"><title id="t">Flyer hierarchy</title><desc id="d">A flyer read in four steps: the offer as the biggest headline, then the image, then the details, then a clear call to action such as “WhatsApp to order”.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="481" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A flyer is read in this order — so design it in this order</text><rect x="60.0" y="60.0" width="240.0" height="330.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="104.0" font-size="24" font-weight="800" fill="#16233f" text-anchor="start">Lunch at your</text><text x="76.0" y="132.0" font-size="24" font-weight="800" fill="#16233f" text-anchor="start">desk by 12:30</text><rect x="76.0" y="152.0" width="208.0" height="110.0" rx="4" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="180.0" y="212.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">photo</text><text x="76.0" y="290.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Mon–Fri · Ikeja offices</text><rect x="76.0" y="316.0" width="208.0" height="52.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="180.0" y="348.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">WhatsApp to order</text><circle cx="340.0" cy="118.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="340.0" y="124.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="364.0" y="124.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Offer or headline — biggest</text><circle cx="340.0" cy="208.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="340.0" y="214.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="364.0" y="214.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Image</text><circle cx="340.0" cy="286.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="340.0" y="292.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="364.0" y="292.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Details</text><circle cx="340.0" cy="344.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="340.0" y="350.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="364.0" y="350.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Call to action</text><text x="24.0" y="420.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">One message, a benefit not a feature, white space, 4.5:1 contrast. If</text><text x="24.0" y="441.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">someone cannot say what it asks in five seconds, simplify.</text><text x="624.0" y="471.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>