<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 407" width="640" height="407" role="img" aria-labelledby="t d"><title id="t">Bank reconciliation</title><desc id="d">Items in both the cashbook and the bank statement are ticked off. Bank-only items such as SMS alerts and a POS fee are added to the cashbook; a book-only transfer not yet cleared is a timing difference.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="407" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Reconciling: tick what is in both, explain what is left</text><rect x="24.0" y="60.0" width="284.0" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="38.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Your cashbook</text><rect x="36.0" y="108.0" width="260.0" height="34.0" rx="5" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="48.0" y="131.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">✓ Sales deposit ₦45,000</text><rect x="36.0" y="150.0" width="260.0" height="34.0" rx="5" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="48.0" y="173.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">✓ Rent paid ₦50,000</text><rect x="36.0" y="192.0" width="260.0" height="34.0" rx="5" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="48.0" y="215.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Transfer to supplier ₦12,000</text><rect x="332.0" y="60.0" width="284.0" height="230.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="346.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Bank statement</text><rect x="344.0" y="108.0" width="260.0" height="34.0" rx="5" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="356.0" y="131.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">✓ Sales deposit ₦45,000</text><rect x="344.0" y="150.0" width="260.0" height="34.0" rx="5" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="356.0" y="173.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">✓ Rent paid ₦50,000</text><rect x="344.0" y="192.0" width="260.0" height="34.0" rx="5" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="356.0" y="215.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">SMS alerts ₦480</text><rect x="344.0" y="234.0" width="260.0" height="34.0" rx="5" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="356.0" y="257.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">POS fee ₦1,200</text><text x="24.0" y="318.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Left in the bank only (SMS alerts, POS fee): add them to your cashbook.</text><text x="24.0" y="344.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Left in your book only (the transfer not yet cleared): a timing difference</text><text x="24.0" y="365.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">that should appear soon.</text><text x="624.0" y="397.0" font-size="16" font-weight="600"