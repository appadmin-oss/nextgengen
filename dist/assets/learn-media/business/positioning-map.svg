t-size="16" font-weight="600" fill="#3d4560" text-anchor="start">lower quality</text><circle cx="150.0" cy="326.0" r="9.0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="164.0" y="314.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Free YouTube</text><circle cx="230.0" cy="358.0" r="9.0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="244.0" y="346.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Uncle helps</text><circle cx="460.0" cy="150.0" r="9.0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="474.0" y="138.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Private tutor</text><circle cx="510.0" cy="206.0" r="9.0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="496.0" y="194.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="end">Big centre</text><ellipse cx="190.0" cy="166" rx="96" ry="46" fill="#fdf0d2" stroke="#16233f" stroke-dasharray="6 4"/><text x="190.0" y="162.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">the gap:</text><text x="190.0" y="184.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">good and cheaper</text><text x="24.0" y="428.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Plot each competitor from real data (visit, call, read reviews), then your</text><text x="24.0" y="449.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">own offer, honestly. Pick one or two ways to be different.</text><text x="624.0" y="479.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>