<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" width="640" height="412" role="img" aria-labelledby="t d"><title id="t">Dimension and metric</title><desc id="d">In a table of Centre, Month and Sales, Centre and Month are dimensions (what you group by) and Sales is the metric (what is summed or counted).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="412" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Dimension: what you group by. Metric: what you count</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">or add.</text><rect x="24.0" y="86.0" width="200.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Centre</text><rect x="224.0" y="86.0" width="180.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Month</text><rect x="404.0" y="86.0" width="212.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="109.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">Sales ₦</text><rect x="24.0" y="120.0" width="200.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Egbeda</text><rect x="224.0" y="120.0" width="180.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">March</text><rect x="404.0" y="120.0" width="212.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="143.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">42,000</text><rect x="24.0" y="154.0" width="200.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ikeja</text><rect x="224.0" y="154.0" width="180.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">March</text><rect x="404.0" y="154.0" width="212.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="177.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">65,000</text><rect x="24.0" y="188.0" width="200.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="211.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Egbeda</text><rect x="224.0" y="188.0" width="180.0" height="34.0" rx="0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="232.0" y="211.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">April</text><rect x="404.0" y="188.0" width="212.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="211.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">51,000</text><rect x="24.0" y="236.0" width="22.0" height="22.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="56.0" y="253.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Dimensions: categories and dates</text><rect x="24.0" y="268.0" width="22.0" height="22.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="56.0" y="285.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Metric: a number that gets summed, counted or averaged</text><text x="24.0" y="330.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">“Sum of sales by centre” = metric (sales) grouped by a dimension</text><text x="24.0" y="351.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">(centre). Add a date range control and a centre filter so readers</text><text x="24.0" y="372.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">explore.</text><text x="624.0" y="402.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>