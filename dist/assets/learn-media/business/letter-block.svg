<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 507" width="640" height="507" role="img" aria-labelledby="t d"><title id="t">A formal business letter</title><desc id="d">The eight parts of a block-format letter from top to bottom: letterhead, date, recipient, reference, salutation, bold subject line, body, and the close with signature, name and title.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="507" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A formal letter in block format: everything aligned left</text><circle cx="40.0" cy="74.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="80.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="66.0" y="60.0" width="550.0" height="34.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="83.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Letterhead: name, address, phone, email</text><circle cx="40.0" cy="120.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="126.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="66.0" y="106.0" width="550.0" height="34.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="129.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Date in full: 14 March 2026</text><circle cx="40.0" cy="166.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="172.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="66.0" y="152.0" width="550.0" height="34.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="175.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Recipient: name, title, organisation, address</text><circle cx="40.0" cy="212.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="218.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="66.0" y="198.0" width="550.0" height="34.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="221.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ref: Venue booking, 28 March (optional)</text><circle cx="40.0" cy="258.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="264.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">5</text><rect x="66.0" y="244.0" width="550.0" height="34.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="267.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Dear Mrs Okafor,</text><circle cx="40.0" cy="304.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="310.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">6</text><rect x="66.0" y="290.0" width="550.0" height="34.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="313.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Subject line in bold</text><circle cx="40.0" cy="350.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="356.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">7</text><rect x="66.0" y="336.0" width="550.0" height="34.0" rx="6" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="359.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Body: purpose · details · action and date</text><circle cx="40.0" cy="396.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="402.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">8</text><rect x="66.0" y="382.0" width="550.0" height="34.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="80.0" y="405.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Yours sincerely, signature, full name, title</text><text x="24.0" y="446.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">“Yours sincerely” when you named the person; “Yours faithfully” after</text><text x="24.0" y="467.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">“Dear Sir/Madam”.</text><text x="624.0" y="497.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>