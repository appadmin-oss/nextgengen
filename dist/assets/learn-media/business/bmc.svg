150.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="143.6" y="234.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Key</text><text x="143.6" y="255.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">resources</text><rect x="259.2" y="60.0" width="121.6" height="300.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1.2"/><text x="265.2" y="84.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Value</text><text x="265.2" y="105.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">propositions</text><rect x="380.8" y="60.0" width="121.6" height="150.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="386.8" y="84.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Customer</text><text x="386.8" y="105.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">relationships</text><rect x="380.8" y="210.0" width="121.6" height="150.0" rx="0" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="386.8" y="234.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Channels</text><rect x="502.4" y="60.0" width="121.6" height="300.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1.2"/><text x="508.4" y="84.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Customer</text><text x="508.4" y="105.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">segments</text><rect x="16.0" y="360.0" width="304.0" height="80.0" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1.2"/><rect x="320.0" y="360.0" width="304.0" height="80.0" rx="0" fill="#e3f1e6" stroke="#16233f" stroke-width="1.2"/><text x="26.0" y="388.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Cost structure</text><text x="330.0" y="388.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Revenue streams</text><text x="26.0" y="416.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">fixed and variable</text><text x="330.0" y="416.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">how money comes in</text><text x="24.0" y="470.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Start with customer segments and value propositions; everything else</text><text x="24.0" y="491.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">depends on them. Mark untested assumptions differently from facts.</text><text x="624.0" y="521.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>