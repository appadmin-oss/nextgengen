<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d"><title id="t">Linked records</title><desc id="d">Two Airtable tables: three Payment records each link to one Member record, and a rollup field on the member adds them up to ₦15,000 — one member, many payments.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="400" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Linked records: type a member once, link payments to</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">them</text><rect x="24.0" y="86.0" width="250.0" height="170.0" rx="10" fill="#dff3f7" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="38.0" y="114.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Members</text><text x="38.0" y="150.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ada Okafor · 0803…</text><text x="38.0" y="180.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Rollup: total paid</text><text x="38.0" y="210.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">= ₦15,000</text><rect x="366.0" y="86.0" width="250.0" height="170.0" rx="10" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="380.0" y="114.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Payments</text><text x="380.0" y="150.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">₦5,000 · Jan → Ada</text><line x1="362.0" y1="144.0" x2="280.0" y2="156.0" stroke="#3d4560" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/><text x="380.0" y="180.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">₦5,000 · Feb → Ada</text><line x1="362.0" y1="174.0" x2="280.0" y2="156.0" stroke="#3d4560" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/><text x="380.0" y="210.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">₦5,000 · Mar → Ada</text><line x1="362.0" y1="204.0" x2="280.0" y2="156.0" stroke="#3d4560" stroke-width="1.6" stroke-linecap="round" marker-end="url(#a)"/><text x="320.0" y="282.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">one member — many payments</text><text x="24.0" y="318.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Change Ada&#x27;s phone number once and it is right everywhere. Views</text><text x="24.0" y="339.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">(grid, Kanban, calendar, form) show the same records without copying</text><text x="24.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">them.</text><text x="624.0" y="390.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>