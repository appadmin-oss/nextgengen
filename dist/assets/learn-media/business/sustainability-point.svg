<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 468" width="640" height="468" role="img" aria-labelledby="t d"><title id="t">Sustainability point</title><desc id="d">A forecast where one-off set-up costs come first, then monthly income rises to meet running costs of ₦60,000 around month 6 — the sustainability point.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="468" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The sustainability point: when income covers running</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">costs</text><line x1="70.0" y1="326.0" x2="610.0" y2="326.0" stroke="#3d4560" stroke-width="2"/><line x1="70.0" y1="96.0" x2="70.0" y2="326.0" stroke="#3d4560" stroke-width="2"/><rect x="70.0" y="115.2" width="90.0" height="210.8" rx="0" fill="#fde5df" stroke="none" stroke-width="1"/><text x="115.0" y="137.2" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">set-up</text><line x1="70.0" y1="211.0" x2="610.0" y2="211.0" stroke="#9c3119" stroke-width="3"/><text x="610.0" y="233.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">running costs ₦60k/month</text><path d="M70.0 326.0 L115.0 306.8 L160.0 287.7 L205.0 268.5 L250.0 249.3 L295.0 230.2 L340.0 214.8 L385.0 203.3 L430.0 191.8 L475.0 184.2 L520.0 176.5 L565.0 172.7 L610.0 168.8" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="547.0" y="153.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle">income</text><circle cx="355.0" cy="211.0" r="7.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><text x="355.0" y="350.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">month 6</text><text x="24.0" y="386.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Every estimate lives on an assumptions tab that the formulas read.</text><text x="24.0" y="407.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">State the risk plainly: below 60 paying members, the service needs</text><text x="24.0" y="428.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">sponsorship.</text><text x="624.0" y="458.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>