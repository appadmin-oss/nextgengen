roke="#c9cedb" stroke-width="1"/><text x="296.0" y="245.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">70</text><rect x="304.0" y="222.0" width="104.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="400.0" y="245.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">15</text><rect x="408.0" y="222.0" width="104.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="504.0" y="245.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">-25</text><rect x="512.0" y="222.0" width="104.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="608.0" y="245.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">25</text><text x="24.0" y="286.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Closing cash becomes next month&#x27;s opening: =B2+B3-B4. March goes</text><text x="24.0" y="307.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">negative, so act in January: chase debts, delay a purchase, arrange</text><text x="24.0" y="328.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">funds. Profit is not cash.</text><text x="624.0" y="358.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>