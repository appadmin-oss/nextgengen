dth="1.5"/><rect x="54.0" y="190.0" width="156.0" height="36.0" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><text x="64.0" y="214.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Visit two halls</text><line x1="44.0" y1="176.0" x2="44.0" y2="252.0" stroke="#c9cedb" stroke-width="1.5"/><rect x="54.0" y="234.0" width="156.0" height="36.0" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><text x="64.0" y="258.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Pay deposit</text><line x1="320.0" y1="106.0" x2="319.0" y2="136.0" stroke="#3d4560" stroke-width="1.5"/><rect x="226.0" y="136.0" width="186.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="319.0" y="162.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Marketing</text><line x1="246.0" y1="176.0" x2="246.0" y2="208.0" stroke="#c9cedb" stroke-width="1.5"/><rect x="256.0" y="190.0" width="156.0" height="36.0" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><text x="266.0" y="214.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Design flyer</text><line x1="246.0" y1="176.0" x2="246.0" y2="252.0" stroke="#c9cedb" stroke-width="1.5"/><rect x="256.0" y="234.0" width="156.0" height="36.0" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><text x="266.0" y="258.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Print 200</text><line x1="320.0" y1="106.0" x2="521.0" y2="136.0" stroke="#3d4560" stroke-width="1.5"/><rect x="428.0" y="136.0" width="186.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="521.0" y="162.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Programme</text><line x1="448.0" y1="176.0" x2="448.0" y2="208.0" stroke="#c9cedb" stroke-width="1.5"/><rect x="458.0" y="190.0" width="156.0" height="36.0" rx="6" fill="#ffffff" st