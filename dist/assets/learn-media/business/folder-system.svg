<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 536" width="640" height="536" role="img" aria-labelledby="t d"><title id="t">A business folder system</title><desc id="d">Numbered top-level folders (01 Admin, 02 Finance, 03 Customers, 04 Marketing, 05 Projects, 99 Archive), no more than three levels deep, and a file name that starts with the date: 2026-03-14_invoice_Adebayo-Stores.pdf.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="536" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A business folder system: numbered, shallow, named to</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">sort</text><rect x="28.0" y="85.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="58.0" y="98.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Ada&#x27;s Bakery</text><path d="M42 106 V124 H53" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56.0" y="117.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="86.0" y="130.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">01 Admin</text><text x="616.0" y="130.0" font-size="16" font-weight="600" fill="#0b6274" text-anchor="end">registration, policies</text><path d="M42 138 V156 H53" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56.0" y="149.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="86.0" y="162.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">02 Finance</text><text x="616.0" y="162.0" font-size="16" font-weight="600" fill="#0b6274" text-anchor="end">budgets, receipts</text><path d="M70 170 V188 H81" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="84.0" y="181.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="114.0" y="194.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">2026</text><text x="616.0" y="194.0" font-size="16" font-weight="600" fill="#0b6274" text-anchor="end">subfolder by year</text><path d="M98 202 V220 H109" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="115.0" y="210.0" width="16.0" height="19.0" rx="1" fill="#ffffff" stroke="#16233f" stroke-width="1.2"/><text x="142.0" y="226.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">2026-03-14_invoice_Adebayo-Stores.pdf</text><path d="M42 234 V252 H53" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56.0" y="245.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="86.0" y="258.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">03 Customers</text><path d="M42 266 V284 H53" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56.0" y="277.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="86.0" y="290.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">04 Marketing</text><path d="M42 298 V316 H53" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56.0" y="309.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="86.0" y="322.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">05 Projects</text><path d="M42 330 V348 H53" fill="none" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="56.0" y="341.0" width="22.0" height="15.0" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="86.0" y="354.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">99 Archive</text><text x="616.0" y="354.0" font-size="16" font-weight="600" fill="#0b6274" text-anchor="end">finished work</text><rect x="24.0" y="382.0" width="592.0" height="118.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="412.0" font-size="18" font-weight="700" fill="#16233f" text-anchor="start">2026-03-14 _ invoice _ Adebayo-Stores .pdf</text><text x="40.0" y="442.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Date first (YYYY-MM-DD) so files sort in time order;</text><text x="40.0" y="466.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">then what it is; hyphens or underscores, no spaces;</text><text x="40.0" y="490.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">versions at the end: _v2, _final.</text><text x="624.0" y="526.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>