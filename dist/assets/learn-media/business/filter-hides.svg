00" fill="#16233f" text-anchor="start">Yaba</text><rect x="324.0" y="230.0" width="130.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="332.0" y="253.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">1</text><rect x="454.0" y="230.0" width="162.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="462.0" y="253.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Monthly</text><line x1="30.0" y1="145.0" x2="610.0" y2="145.0" stroke="#3d4560" stroke-width="1.5"/><line x1="30.0" y1="213.0" x2="610.0" y2="213.0" stroke="#3d4560" stroke-width="1.5"/><text x="24.0" y="292.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Filter: Area = Yaba → 3 of 5 rows shown; the others are hidden.</text><text x="24.0" y="324.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Count with =COUNTIF(C:C,&quot;Weekly&quot;) and report the base: 2 of 3 Yaba</text><text x="24.0" y="345.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">customers is not the same as 80 of 120.</text><text x="624.0" y="375.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>