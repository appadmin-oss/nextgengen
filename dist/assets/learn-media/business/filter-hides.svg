<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 385" width="640" height="385" role="img" aria-labelledby="t d"><title id="t">Filtering survey responses</title><desc id="d">A response table filtered to Area = Yaba: three of five rows stay visible and the other two are hidden, not deleted. Always report how many people answered.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="385" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A filter hides rows; it does not delete them</text><rect x="24.0" y="60.0" width="150.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Name</text><rect x="174.0" y="60.0" width="150.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="182.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Area</text><rect x="324.0" y="60.0" width="130.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="332.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Rating</text><rect x="454.0" y="60.0" width="162.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="462.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Visits</text><rect x="24.0" y="94.0" width="150.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Bisi</text><rect x="174.0" y="94.0" width="150.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="182.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Yaba</text><rect x="324.0" y="94.0" width="130.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="332.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">5</text><rect x="454.0" y="94.0" width="162.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="462.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Weekly</text><rect x="24.0" y="128.0" width="150.0" height="34.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Emeka</text><rect x="174.0" y="128.0" width="150.0" height="34.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="182.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Ikeja</text><rect x="324.0" y="128.0" width="130.0" height="34.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="332.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">2</text><rect x="454.0" y="128.0" width="162.0" height="34.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="462.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Monthly</text><rect x="24.0" y="162.0" width="150.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"