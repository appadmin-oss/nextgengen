<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 341" width="640" height="341" role="img" aria-labelledby="t d"><title id="t">Sharing access levels</title><desc id="d">Three access levels, each wider than the last: Viewer reads only; Commenter reads, comments and suggests; Editor changes everything and can share further.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="341" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Give the least access needed</text><rect x="24.0" y="140.0" width="186.0" height="104.0" rx="8" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25"/><text x="38.0" y="170.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Viewer</text><text x="38.0" y="198.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">reads only</text><rect x="226.0" y="106.0" width="186.0" height="138.0" rx="8" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="240.0" y="136.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Commenter</text><text x="240.0" y="164.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">reads, comments,</text><text x="240.0" y="185.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">suggests</text><rect x="428.0" y="72.0" width="186.0" height="172.0" rx="8" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="442.0" y="102.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Editor</text><text x="442.0" y="130.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">changes</text><text x="442.0" y="151.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">everything, can</text><text x="442.0" y="172.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">share further</text><text x="24.0" y="280.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Share with named people, not “anyone with the link”, for anything</text><text x="24.0" y="301.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">internal. A shared folder passes its permissions to everything inside.</text><text x="624.0" y="331.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>