<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 488" width="640" height="488" role="img" aria-labelledby="t d"><title id="t">Swimlane process map</title><desc id="d">A swimlane process map with lanes for Customer, Sales and Store: the customer sends an order (oval), Sales logs it (rectangle), the Store decides “In stock?” (diamond) — yes, pack and send; no, Sales offers an alternative.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="488" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A process map in swimlanes: hand-offs are where</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">delays hide</text><rect x="24.0" y="86.0" width="592.0" height="104.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="34.0" y="110.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Customer</text><rect x="24.0" y="190.0" width="592.0" height="104.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="34.0" y="214.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Sales</text><rect x="24.0" y="294.0" width="592.0" height="104.0" rx="0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="34.0" y="318.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Store</text><ellipse cx="190" cy="144" rx="72" ry="22" fill="#fdf0d2" stroke="#16233f"/><text x="190.0" y="150.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Sends order</text><rect x="130.0" y="228.0" width="130.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="195.0" y="254.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Log order</text><polygon points="350,324 412,352 350,380 288,352" fill="#ffffff" stroke="#16233f"/><text x="350.0" y="358.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">In stock?</text><rect x="456.0" y="332.0" width="128.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="520.0" y="358.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Pack, send</text><rect x="330.0" y="228.0" width="152.0" height="40.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.25"/><text x="406.0" y="254.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Offer alternative</text><line x1="190.0" y1="166.0" x2="192.0" y2="226.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="222.0" y1="268.0" x2="300.0" y2="346.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="412.0" y1="352.0" x2="454.0" y2="352.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="350.0" y1="324.0" x2="370.0" y2="270.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="433.0" y="332.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">yes</text><text x="326.0" y="316.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">no</text><ellipse cx="44" cy="428" rx="18" ry="11" fill="#fdf0d2" stroke="#16233f"/><text x="72.0" y="434.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">start / end</text><rect x="226.0" y="418.0" width="36.0" height="22.0" rx="0" fill="#ffffff" stroke="#16233f" stroke-width="1"/><text x="272.0" y="434.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">a step</text><polygon points="444,414 462,428 444,442 426,428" fill="#ffffff" stroke="#16233f"/><text x="472.0" y="434.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">a decision</text><text x="624.0" y="478.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>