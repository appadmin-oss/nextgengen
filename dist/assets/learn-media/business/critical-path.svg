<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 451" width="640" height="451" role="img" aria-labelledby="t d"><title id="t">Critical path and buffer</title><desc id="d">A schedule where confirm date, design, approval and three days of printing form the critical path to sending invitations by 14 March, with two days of buffer; booking the caterer has slack.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="451" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The critical path has no slack — give it a buffer</text><text x="24.0" y="85.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Confirm date</text><rect x="180.0" y="68.0" width="68.0" height="24.0" rx="3" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="24.0" y="125.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Design flyer</text><rect x="248.0" y="108.0" width="102.0" height="24.0" rx="3" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="24.0" y="165.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Approve design</text><rect x="350.0" y="148.0" width="34.0" height="24.0" rx="3" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="24.0" y="205.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Print (3 days)</text><rect x="384.0" y="188.0" width="102.0" height="24.0" rx="3" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="24.0" y="245.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Buffer</text><rect x="486.0" y="228.0" width="68.0" height="24.0" rx="3" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="24.0" y="285.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Book caterer</text><rect x="248.0" y="268.0" width="136.0" height="24.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><line x1="554.0" y1="60.0" x2="554.0" y2="300.0" stroke="#16233f" stroke-width="2"/><text x="550.0" y="322.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">send by 14 March</text><rect x="24.0" y="330.0" width="22.0" height="22.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><text x="54.0" y="347.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">critical path</text><rect x="214.0" y="330.0" width="22.0" height="22.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="244.0" y="347.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">has slack</text><rect x="404.0" y="330.0" width="22.0" height="22.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="434.0" y="347.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">buffer</text><text x="24.0" y="390.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Any delay on a red task delays the invitation date. Work backwards</text><text x="24.0" y="411.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">from it: printing takes 3 days, so the design is approved by 10 March.</text><text x="624.0" y="441.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>