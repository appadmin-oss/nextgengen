<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" width="640" height="392" role="img" aria-labelledby="t d"><title id="t">RACI matrix</title><desc id="d">A RACI matrix of tasks against people: R responsible, A accountable, C consulted, I informed. Each task needs exactly one A; “Set the budget” with two A&#x27;s is flagged.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="392" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A RACI matrix: exactly one A per task</text><rect x="24.0" y="60.0" width="216.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Task</text><rect x="240.0" y="60.0" width="94.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="287.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Ada</text><rect x="334.0" y="60.0" width="94.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="381.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Tunde</text><rect x="428.0" y="60.0" width="94.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="475.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Bisi</text><rect x="522.0" y="60.0" width="94.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="569.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Ife</text><rect x="24.0" y="94.0" width="216.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Book the venue</text><rect x="240.0" y="94.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="287.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">R</text><rect x="334.0" y="94.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="381.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="428.0" y="94.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="475.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">C</text><rect x="522.0" y="94.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="569.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">I</text><rect x="24.0" y="128.0" width="216.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Design the flyer</text><rect x="240.0" y="128.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="287.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="334.0" y="128.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><rect x="428.0" y="128.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="475.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">R</text><rect x="522.0" y="128.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="569.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">I</text><rect x="24.0" y="162.0" width="216.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Set the budget</text><rect x="240.0" y="162.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="287.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">R</text><rect x="334.0" y="162.0" width="94.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="381.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="428.0" y="162.0" width="94.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="475.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="522.0" y="162.0" width="94.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="24.0" y="224.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start">“Set the budget” has two A&#x27;s: confusion and blame. Fix it.</text><text x="24.0" y="268.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">R — Responsible: does the work</text><text x="24.0" y="294.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A — Accountable: owns and signs off</text><text x="24.0" y="320.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">C — Consulted: input before, two-way</text><text x="24.0" y="346.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">I — Informed: told after, one-way</text><text x="624.0" y="382.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>