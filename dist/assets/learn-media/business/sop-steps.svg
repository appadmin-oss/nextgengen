<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" width="640" height="466" role="img" aria-labelledby="t d"><title id="t">SOP steps</title><desc id="d">An SOP&#x27;s procedure as numbered steps, each starting with a verb, with the decision written into the step: if the amount is over ₦50,000, get the coordinator&#x27;s approval before paying.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="466" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">An SOP step list: one action per step, decisions spelled</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">out</text><rect x="64.0" y="86.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="113.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Open the payment request form</text><text x="76.0" y="138.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Check it is signed by the requester.</text><circle cx="40.0" cy="119.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="125.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="155.0" x2="340.0" y2="173.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="177.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="203.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Check the amount</text><text x="76.0" y="229.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">If over ₦50,000, get the coordinator&#x27;s approval before paying.</text><circle cx="40.0" cy="210.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="216.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="246.0" x2="340.0" y2="264.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="268.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="294.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Pay the supplier</text><text x="76.0" y="320.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">From the business account only, never personal.</text><circle cx="40.0" cy="301.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="307.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="337.0" x2="340.0" y2="355.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="359.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="385.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Record it</text><text x="76.0" y="411.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Log entry with the receipt link, the same day.</text><circle cx="40.0" cy="392.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="398.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="624.0" y="456.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>