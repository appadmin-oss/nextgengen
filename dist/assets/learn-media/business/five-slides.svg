<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 421" width="640" height="421" role="img" aria-labelledby="t d"><title id="t">A five-slide presentation</title><desc id="d">Five slides in order: title; the problem with one real number; the solution with a photo; evidence as one clear chart; the ask with contact details.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="421" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Five slides, one idea each, headline states the point</text><rect x="24.0" y="60.0" width="184.0" height="118.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">1 Title</text><text x="36.0" y="118.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Name, one line,</text><text x="36.0" y="139.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">you</text><rect x="224.0" y="60.0" width="184.0" height="118.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="236.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">2 Problem</text><text x="236.0" y="118.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Who has it + one</text><text x="236.0" y="139.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">number</text><rect x="424.0" y="60.0" width="184.0" height="118.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="436.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">3 Solution</text><text x="436.0" y="118.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">What you offer +</text><text x="436.0" y="139.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">photo</text><rect x="124.0" y="210.0" width="184.0" height="118.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="136.0" y="240.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">4 Evidence</text><text x="136.0" y="268.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">One clear chart</text><rect x="324.0" y="210.0" width="184.0" height="118.0" rx="6" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="336.0" y="240.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">5 The ask</text><text x="336.0" y="268.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">What you want +</text><text x="336.0" y="289.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">contact</text><text x="24.0" y="360.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Text at least 24 pt on the slide, high contrast, real images. The slide</text><text x="24.0" y="381.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">supports what you say; it is not your script.</text><text x="624.0" y="411.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>