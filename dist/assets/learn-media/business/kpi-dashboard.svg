<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 463" width="640" height="463" role="img" aria-labelledby="t d"><title id="t">A KPI dashboard</title><desc id="d">Data tabs feed a calculation tab, which feeds the dashboard. Tiles show each KPI with its target and a status colour: attendance 78% (on target), dues 71% (close), new members 4 of 10 (off).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="463" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three tabs: data in, formulas in the middle, dashboard</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">out</text><rect x="24.0" y="86.0" width="180.0" height="121.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="114.0" y="108.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Data tabs</text><text x="114.0" y="133.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">raw attendance and</text><text x="114.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">payments; never</text><text x="114.0" y="175.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">edited by the</text><text x="114.0" y="196.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">dashboard</text><line x1="207.0" y1="146.5" x2="227.0" y2="146.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230.0" y="86.0" width="180.0" height="121.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="129.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Calculation tab</text><text x="320.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">COUNTIF, SUMIF,</text><text x="320.0" y="175.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">percentages</text><line x1="413.0" y1="146.5" x2="433.0" y2="146.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="436.0" y="86.0" width="180.0" height="121.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="526.0" y="129.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Dashboard tab</text><text x="526.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">big numbers, charts</text><text x="526.0" y="175.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">and status colours</text><rect x="24.0" y="231.0" width="186.0" height="120.0" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="38.0" y="259.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Attendance</text><text x="38.0" y="303.0" font-size="34" font-weight="800" fill="#16233f" text-anchor="start">78%</text><text x="38.0" y="335.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">target ≥ 75%</text><rect x="226.0" y="231.0" width="186.0" height="120.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="240.0" y="259.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Dues collected</text><text x="240.0" y="303.0" font-size="34" font-weight="800" fill="#16233f" text-anchor="start">71%</text><text x="240.0" y="335.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">target ≥ 80%</text><rect x="428.0" y="231.0" width="186.0" height="120.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="442.0" y="259.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">New this month</text><text x="442.0" y="303.0" font-size="34" font-weight="800" fill="#16233f" text-anchor="start">4</text><text x="442.0" y="335.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">target ≥ 10</text><text x="24.0" y="381.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Each KPI has a target, so the number means something: green on</text><text x="24.0" y="402.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">target, amber close, red off. Protect the calculation and dashboard</text><text x="24.0" y="423.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">tabs.</text><text x="624.0" y="453.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>