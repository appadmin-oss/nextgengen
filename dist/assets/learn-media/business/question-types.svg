<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415" width="640" height="415" role="img" aria-labelledby="t d"><title id="t">Choosing a question type</title><desc id="d">Multiple choice for one answer from a short list, checkboxes for several, a linear scale for a 1–5 rating, a dropdown for a long list, short answer for open comments.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="415" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Pick the question type from the answer you need</text><rect x="24.0" y="60.0" width="360.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="38.0" y="88.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">One answer from a short list</text><line x1="388.0" y1="82.0" x2="414.0" y2="82.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420.0" y="60.0" width="196.0" height="44.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><text x="518.0" y="88.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Multiple choice</text><rect x="24.0" y="114.0" width="360.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="38.0" y="142.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Several answers allowed</text><line x1="388.0" y1="136.0" x2="414.0" y2="136.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420.0" y="114.0" width="196.0" height="44.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><text x="518.0" y="142.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Checkboxes</text><rect x="24.0" y="168.0" width="360.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="38.0" y="196.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A rating, 1 to 5</text><line x1="388.0" y1="190.0" x2="414.0" y2="190.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420.0" y="168.0" width="196.0" height="44.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><text x="518.0" y="196.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Linear scale</text><rect x="24.0" y="222.0" width="360.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="38.0" y="250.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">One answer from a long list</text><line x1="388.0" y1="244.0" x2="414.0" y2="244.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420.0" y="222.0" width="196.0" height="44.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><text x="518.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Dropdown</text><rect x="24.0" y="276.0" width="360.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="38.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Their own words (use sparingly)</text><line x1="388.0" y1="298.0" x2="414.0" y2="298.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420.0" y="276.0" width="196.0" height="44.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><text x="518.0" y="304.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Short answer</text><text x="24.0" y="354.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Under 10 questions, under 3 minutes. One thing per question, neutral</text><text x="24.0" y="375.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">wording, and an “Other” or “Not sure” option.</text><text x="624.0" y="405.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>