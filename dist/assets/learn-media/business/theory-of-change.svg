<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" width="640" height="255" role="img" aria-labelledby="t d"><title id="t">Theory of change</title><desc id="d">A theory of change as three linked claims: if we text a check-in code the night before, then check-in takes under 15 minutes, which leads to children starting the first session on time.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="255" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A theory of change: if we do X, then Y, which leads to Z</text><rect x="24.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="114.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">If we do X</text><text x="114.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">text a check-in</text><text x="114.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">code the night</text><text x="114.0" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">before</text><line x1="207.0" y1="110.0" x2="227.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">then Y happens</text><text x="320.0" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">check-in takes</text><text x="320.0" y="138.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">under 15 minutes</text><line x1="413.0" y1="110.0" x2="433.0" y2="110.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="436.0" y="60.0" width="180.0" height="100.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="526.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">which leads to Z</text><text x="526.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">children start the</text><text x="526.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">first session on</text><text x="526.0" y="149.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">time</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Every arrow is a claim that needs evidence from your research.</text><text x="24.0" y="211.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Beneficiaries and payers are often different people: map both.</text><text x="624.0" y="245.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>