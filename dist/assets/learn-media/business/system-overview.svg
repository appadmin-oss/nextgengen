<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" width="640" height="427" role="img" aria-labelledby="t d"><title id="t">System overview</title><desc id="d">A one-page system overview: form responses feed the Sheets tracker, which feeds the dashboard; Trello tasks feed the tracker; Airtable and Manager.io feed the dashboard; each tool has an owner.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="427" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A system overview: what each tool is for and how they</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">connect</text><rect x="32.0" y="116.0" width="176.0" height="66.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="120.0" y="142.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Google Form</text><text x="120.0" y="167.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">requests in</text><rect x="232.0" y="116.0" width="176.0" height="66.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="142.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Sheets tracker</text><text x="320.0" y="167.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">status, owner</text><rect x="432.0" y="116.0" width="176.0" height="66.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="520.0" y="142.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Dashboard</text><text x="520.0" y="167.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">KPIs</text><rect x="32.0" y="266.0" width="176.0" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="120.0" y="288.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Airtable</text><text x="120.0" y="313.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">members,</text><text x="120.0" y="334.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">payments</text><rect x="232.0" y="266.0" width="176.0" height="66.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="292.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Trello</text><text x="320.0" y="317.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">tasks</text><rect x="432.0" y="266.0" width="176.0" height="66.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="520.0" y="292.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Manager.io</text><text x="520.0" y="317.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">money</text><line x1="210.0" y1="149.0" x2="228.0" y2="149.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="410.0" y1="149.0" x2="428.0" y2="149.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="320.0" y1="262.0" x2="320.0" y2="186.0" 