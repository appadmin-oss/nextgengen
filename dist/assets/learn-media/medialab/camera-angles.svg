<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 405" width="640" height="405" role="img" aria-labelledby="t d"><title id="t">Camera angles</title><desc id="d">Side view of a camera at three heights: from above the subject looks smaller, at eye level equal, from below powerful.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="405" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Camera height changes how big the subject feels</text><line x1="24.0" y1="310.0" x2="616.0" y2="310.0" stroke="#3d4560" stroke-width="2"/><circle cx="400.0" cy="134.0" r="20.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><rect x="366.0" y="158.0" width="68.0" height="80.0" rx="12.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><rect x="374.0" y="240.0" width="20.0" height="70.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><rect x="406.0" y="240.0" width="20.0" height="70.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><rect x="80.0" y="68.0" width="40.0" height="24.0" rx="4" fill="#16233f" stroke="none" stroke-width="1"/><line x1="120.0" y1="80.0" x2="366.0" y2="190.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="60.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">High: smaller</text><rect x="80.0" y="168.0" width="40.0" height="24.0" rx="4" fill="#16233f" stroke="none" stroke-width="1"/><line x1="120.0" y1="180.0" x2="366.0" y2="190.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="160.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Eye level: equal</text><rect x="80.0" y="268.0" width="40.0" height="24.0" rx="4" fill="#16233f" stroke="none" stroke-width="1"/><line x1="120.0" y1="280.0" x2="366.0" y2="190.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="5 4"/><text x="76.0" y="260.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Low: powerful</text><text x="24.0" y="344.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Crouch to a child&#x27;s eye level rather than pointing down at them. Wide,</text><text x="24.0" y="365.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">medium and close shots of the same moment tell different parts of it.</text><text x="624.0" y="395.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>