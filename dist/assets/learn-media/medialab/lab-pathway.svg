<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 401" width="640" height="401" role="img" aria-labelledby="t d"><title id="t">The Lab pathway</title><desc id="d">Three steps up: Junior Creator uses the core tools with support, Creative Associate produces strong independent work, Team Lead plans and leads projects and mentors others.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="401" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The Lab&#x27;s pathway: more skill, more responsibility</text><rect x="24.0" y="200.0" width="192.0" height="109.0" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="226.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Junior Creator</text><text x="36.0" y="252.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">uses the core tools;</text><text x="36.0" y="273.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">completes projects</text><text x="36.0" y="294.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">with support</text><rect x="224.0" y="130.0" width="192.0" height="109.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="236.0" y="156.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Creative Associate</text><text x="236.0" y="182.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">strong independent</text><text x="236.0" y="203.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">work; reliable in a</text><text x="236.0" y="224.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">team</text><rect x="424.0" y="60.0" width="192.0" height="109.0" rx="10" fill="#f5b026" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="436.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Team Lead</text><text x="436.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">plans and leads</text><text x="436.0" y="133.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">projects; mentors;</text><text x="436.0" y="154.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">owns quality</text><text x="24.0" y="340.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Set the next goal with a deadline: “Produce a three-minute</text><text x="24.0" y="361.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">documentary on my own by March.”</text><text x="624.0" y="391.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>