<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 321" width="640" height="321" role="img" aria-labelledby="t d"><title id="t">Promo video timeline</title><desc id="d">A 60-second promo: a hook in the first 3 seconds, the message from 3 to about 50 seconds shown rather than told, and the call to action on screen for the last 5–10 seconds.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="321" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A 60-second promo, to the second</text><rect x="24.0" y="60.0" width="29.6" height="60.0" rx="0" fill="#ef6b4d" stroke="#16233f" stroke-width="1"/><rect x="53.6" y="60.0" width="463.7" height="60.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="517.3" y="60.0" width="98.7" height="60.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="280.5" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Message: show, don&#x27;t tell</text><text x="24.0" y="144.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">0 s</text><text x="517.3" y="144.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">50 s</text><text x="616.0" y="144.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">60 s</text><text x="24.0" y="180.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Hook, 0–3 s: the most</text><text x="24.0" y="202.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">striking image, no logo</text><text x="616.0" y="180.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">Call to action: what,</text><text x="616.0" y="202.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="end">when, where, long enough</text><text x="616.0" y="224.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="end">to read</text><text x="24.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Vertical 9:16, subtitles and on-screen words, licensed music, real</text><text x="24.0" y="281.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">members with consent. Test it on a phone with the sound off.</text><text x="624.0" y="311.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>