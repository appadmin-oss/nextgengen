<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 493" width="640" height="493" role="img" aria-labelledby="t d"><title id="t">Visual hierarchy</title><desc id="d">A poster with three levels: a large bold headline seen first, then supporting information (when and where), then small details and contact.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="493" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three levels of hierarchy on one poster</text><rect x="60.0" y="60.0" width="250.0" height="340.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="78.0" y="114.0" font-size="28" font-weight="800" fill="#16233f" text-anchor="start">Clean Gutters</text><text x="78.0" y="148.0" font-size="28" font-weight="800" fill="#16233f" text-anchor="start">Saturday</text><rect x="78.0" y="168.0" width="214.0" height="120.0" rx="4" fill="#dff3f7" stroke="#c9cedb" stroke-width="1"/><text x="78.0" y="316.0" font-size="18" font-weight="700" fill="#16233f" text-anchor="start">Sat 14 March · 8am</text><text x="78.0" y="340.0" font-size="18" font-weight="700" fill="#16233f" text-anchor="start">Ojuelegba Road</text><text x="78.0" y="380.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Call 0803 000 0000</text><circle cx="350.0" cy="124.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="350.0" y="130.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="374.0" y="130.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Headline</text><text x="374.0" y="152.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the one thing to remember</text><circle cx="350.0" cy="316.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="350.0" y="322.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="374.0" y="322.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Supporting</text><text x="374.0" y="344.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">what, when, where</text><circle cx="350.0" cy="380.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="350.0" y="386.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="374.0" y="386.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Details</text><text x="374.0" y="408.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">small print, contact</text><text x="24.0" y="432.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Size, contrast, position, space and weight decide the order. If</text><text x="24.0" y="453.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">everything is big, nothing is.</text><text x="624.0" y="483.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>