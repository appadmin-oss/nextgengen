<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" role="img" aria-labelledby="t d"><title id="t">Writing a caption</title><desc id="d">“Fun day!!” tells the viewer nothing; “Kemi, 13, tests the water filter her team built at Egbeda centre on Saturday” gives who, what, where and when — with permission.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="368" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A caption says what the picture cannot</text><rect x="24.0" y="60.0" width="592.0" height="74.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">“Fun day!!”</text><text x="40.0" y="116.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">says nothing a viewer did not already see</text><rect x="24.0" y="150.0" width="592.0" height="100.0" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="180.0" font-size="18" font-weight="700" fill="#16233f" text-anchor="start">“Kemi, 13, tests the water filter her team built at Egbeda</text><text x="40.0" y="203.0" font-size="18" font-weight="700" fill="#16233f" text-anchor="start">centre on Saturday.”</text><text x="40.0" y="233.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">who · what · where · when — and only with her permission</text><text x="24.0" y="284.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Articles follow the inverted pyramid: the first sentence answers who,</text><text x="24.0" y="305.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">what, when, where and why; detail follows; the least important comes</text><text x="24.0" y="326.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">last.</text><text x="624.0" y="358.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>