<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" width="640" height="418" role="img" aria-labelledby="t d"><title id="t">Photo-story shot list</title><desc id="d">A six-shot list for a photo story: establishing (the place), portrait, action, detail, interaction, and a closing shot with the result or feeling.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="418" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A photo-story shot list</text><rect x="24.0" y="60.0" width="186.0" height="112.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="36.0" y="72.0" width="50.0" height="36.0" rx="3" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="61.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="98.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Establishing</text><text x="36.0" y="142.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the place</text><rect x="226.0" y="60.0" width="186.0" height="112.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="238.0" y="72.0" width="50.0" height="36.0" rx="3" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="263.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="300.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Portrait</text><text x="238.0" y="142.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">the main person</text><rect x="428.0" y="60.0" width="186.0" height="112.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="440.0" y="72.0" width="50.0" height="36.0" rx="3" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="465.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="502.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Action</text><text x="440.0" y="142.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">what they do</text><rect x="24.0" y="190.0" width="186.0" height="112.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="36.0" y="202.0" width="50.0" height="36.0" rx="3" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="61.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="98.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Detail</text><text x="36.0" y="272.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">hands, tools, faces</text><rect x="226.0" y="190.0" width="186.0" height="112.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="238.0" y="202.0" width="50.0" height="36.0" rx="3" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="263.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">5</text><text x="300.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Interaction</text><text x="238.0" y="272.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">people together</text><rect x="428.0" y="190.0" width="186.0" height="112.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="440.0" y="202.0" width="50.0" height="36.0" rx="3" fill="#ffffff" stroke="#3d4560" stroke-width="1"/><text x="465.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">6</text><text x="502.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Closing</text><text x="440.0" y="272.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">how it ends</text><text x="24.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Get permission early from everyone who will appear, and from parents</text><text x="24.0" y="357.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">or guardians for children. Plan who gathers names and quotes for the</text><text x="24.0" y="378.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">captions.</text><text x="624.0" y="408.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>