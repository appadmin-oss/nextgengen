<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" width="640" height="506" role="img" aria-labelledby="t d"><title id="t">Campaign sequence</title><desc id="d">A week of campaign posts in sequence — teaser, announcement, member story, behind the scenes, reminder, countdown, day-of — moving from curiosity to reasons to come to urgency.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="506" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A campaign week: curiosity, then reasons, then</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">urgency</text><rect x="24.0" y="86.0" width="190.0" height="82.0" rx="6" fill="#eee6f6" stroke="#16233f" stroke-width="1"/><text x="119.0" y="133.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">curiosity</text><rect x="24.0" y="174.0" width="190.0" height="82.0" rx="6" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="119.0" y="221.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">reasons to come</text><rect x="24.0" y="262.0" width="190.0" height="126.0" rx="6" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="119.0" y="331.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">urgency</text><rect x="230.0" y="86.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="111.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">1  Teaser</text><rect x="230.0" y="130.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="155.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">2  Announcement</text><rect x="230.0" y="174.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="199.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">3  Member story</text><rect x="230.0" y="218.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="243.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">4  Behind the scenes</text><rect x="230.0" y="262.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="287.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">5  Reminder</text><rect x="230.0" y="306.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="331.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">6  Countdown</text><rect x="230.0" y="350.0" width="386.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="244.0" y="375.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">7  Day-of</text><text x="24.0" y="424.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">One measurable goal (“40 registrations”), one key message repeated in</text><text x="24.0" y="445.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">different ways, and an assets list with an owner and deadline for