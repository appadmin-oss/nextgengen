<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 471" width="640" height="471" role="img" aria-labelledby="t d"><title id="t">J-cuts and L-cuts</title><desc id="d">Three edits on a timeline: a straight cut changes picture and sound together; a J-cut starts the next clip&#x27;s sound before its picture; an L-cut lets the last clip&#x27;s sound carry on under the new picture.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="471" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Straight cut, J-cut and L-cut on the timeline</text><text x="24.0" y="78.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Straight cut</text><rect x="24.0" y="90.0" width="296.0" height="32.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="320.0" y="90.0" width="296.0" height="32.0" rx="3" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="112.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">picture A</text><text x="332.0" y="112.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">picture B</text><rect x="24.0" y="126.0" width="296.0" height="26.0" rx="3" fill="#dff3f7" stroke="#3d4560" stroke-width="1"/><rect x="320.0" y="126.0" width="296.0" height="26.0" rx="3" fill="#fdf0d2" stroke="#3d4560" stroke-width="1"/><text x="36.0" y="145.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">sound A</text><text x="604.0" y="145.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">sound B</text><line x1="320.0" y1="84.0" x2="320.0" y2="158.0" stroke="#9c3119" stroke-width="2" stroke-dasharray="4 3"/><text x="24.0" y="190.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">J-cut: next sound first</text><rect x="24.0" y="202.0" width="296.0" height="32.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="320.0" y="202.0" width="296.0" height="32.0" rx="3" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="224.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">picture A</text><text x="332.0" y="224.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">picture B</text><rect x="24.0" y="238.0" width="236.0" height="26.0" rx="3" fill="#dff3f7" stroke="#3d4560" stroke-width="1"/><rect x="260.0" y="238.0" width="356.0" height="26.0" rx="3" fill="#fdf0d2" stroke="#3d4560" stroke-width="1"/><text x="36.0" y="257.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">sound A</text><text x="604.0" y="257.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">sound B</text><line x1="320.0" y1="196.0" x2="320.0" y2="270.0" stroke="#9c3119" stroke-width="2" stroke-dasharray="4 3"/><text x="24.0" y="302.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">L-cut: last sound carries on</text><rect x="24.0" y="314.0" width="296.0" height="32.0" rx="3" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><rect x="320.0" y="314.0" width="296.0" height="32.0" rx="3" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">picture A</text><text x="332.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">picture B</text><rect x="24.0" y="350.0" width="356.0" height="26.0" rx="3" fill="#dff3f7" stroke="#3d4560" stroke-width="1"/><rect x="380.0" y="350.0" width="236.0" height="26.0" rx="3" fill="#fdf0d2" stroke="#3d4560" stroke-width="1"/><text x="36.0" y="369.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">sound A</text><text x="604.0" y="369.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="end">sound B</text><line x1="320.0" y1="308.0" x2="320.0" y2="382.0" stroke="#9c3119" stroke-width="2" stroke-dasharray="4 3"/><text x="24.0" y="410.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Most cuts are plain cuts. Cut on action to hide the join; let sound lead or</text><text x="24.0" y="431.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">trail the picture so edits flow.</text><text x="624.0" y="461.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>