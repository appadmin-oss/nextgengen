<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 591" width="640" height="591" role="img" aria-labelledby="t d"><title id="t">Layout grid</title><desc id="d">A page with an even margin and three columns with gutters: the headline spans all three, the photo two, the date-time-place block is grouped together, and the logo sits on its own.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="591" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Margins, a three-column grid, and grouped information</text><rect x="140.0" y="60.0" width="360.0" height="440.0" rx="0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><rect x="168.0" y="88.0" width="92.0" height="384.0" rx="0" fill="#dff3f7" stroke="none" stroke-width="1" opacity="0.8"/><rect x="274.0" y="88.0" width="92.0" height="384.0" rx="0" fill="#dff3f7" stroke="none" stroke-width="1" opacity="0.8"/><rect x="380.0" y="88.0" width="92.0" height="384.0" rx="0" fill="#dff3f7" stroke="none" stroke-width="1" opacity="0.8"/><rect x="168.0" y="88.0" width="304.0" height="60.0" rx="3" fill="#f5b026" stroke="none" stroke-width="1"/><text x="180.0" y="126.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Headline</text><rect x="168.0" y="164.0" width="198.0" height="160.0" rx="3" fill="#fde5df" stroke="none" stroke-width="1"/><text x="180.0" y="248.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Photo, 2 columns</text><rect x="168.0" y="340.0" width="198.0" height="80.0" rx="3" fill="#f3f5fa" stroke="#3d4560" stroke-width="1"/><text x="178.0" y="366.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Date · time · place</text><text x="178.0" y="390.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">grouped together</text><circle cx="426.0" cy="442.0" r="22.0" fill="#16233f" stroke="none" stroke-width="1"/><path d="M134 60 h-14 M127 60 v28 M120 88 h14" fill="none" stroke="#3d4560" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="114.0" y="82.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="end">margin</text><text x="516.0" y="124.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">columns</text><text x="516.0" y="146.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">and gutters</text><text x="516.0" y="448.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">logo on its own</text><text x="24.0" y="530.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Everything lines up with a column edge; related things sit close; empty</text><text x="24.0" y="551.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">space lets the important things breathe.</text><text x="624.0" y="581.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>