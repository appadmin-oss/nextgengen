<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" width="640" height="514" role="img" aria-labelledby="t d"><title id="t">Orientation</title><desc id="d">A 9:16 vertical frame for Stories, Reels, TikTok and Status beside a 16:9 horizontal frame for YouTube and screens — decided before recording.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="514" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Choose the orientation before you press record</text><rect x="60.0" y="60.0" width="140.0" height="249.0" rx="10" fill="#dff3f7" stroke="#16233f" stroke-width="2"/><text x="130.0" y="190.0" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">9:16</text><text x="130.0" y="340.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Vertical</text><text x="130.0" y="362.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">Stories, Reels,</text><text x="130.0" y="384.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">TikTok, Status</text><rect x="250.0" y="120.0" width="340.0" height="191.0" rx="10" fill="#dff3f7" stroke="#16233f" stroke-width="2"/><text x="420.0" y="222.0" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">16:9</text><text x="420.0" y="340.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Horizontal</text><text x="420.0" y="362.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">YouTube, presentations,</text><text x="420.0" y="384.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">screens</text><text x="24.0" y="432.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A vertical clip cannot become a good horizontal one. Both hands,</text><text x="24.0" y="453.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">elbows in, or rest the phone on something solid; face the subject</text><text x="24.0" y="474.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">towards the light.</text><text x="624.0" y="504.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>