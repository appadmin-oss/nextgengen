nt-size="16" font-weight="500" fill="#3d4560" text-anchor="start">From the Media Lab team</text><circle cx="270.0" cy="226.0" r="14.0" fill="#16233f" stroke="none" stroke-width="1"/><text x="40.0" y="280.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">RSVP to 0803 000 0000</text><text x="40.0" y="304.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">by 20 November</text><text x="40.0" y="360.0" font-size="16" font-weight="600" fill="#0b6274" text-anchor="start">1 name · 2 when and where</text><text x="40.0" y="382.0" font-size="16" font-weight="600" fill="#0b6274" text-anchor="start">3 who · 4 what to do</text><rect x="324.0" y="60.0" width="292.0" height="340.0" rx="10" fill="#ffffff" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><rect x="336.0" y="72.0" width="268.0" height="316.0" rx="4" fill="none" stroke="#f5b026" stroke-width="3"/><text x="470.0" y="122.0" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">Certificate</text><text x="470.0" y="180.0" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">Kemi Adeyemi</text><text x="470.0" y="220.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">for completing the Media Lab</text><text x="470.0" y="242.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">Foundation Programme, 2026</text><line x1="364.0" y1="328.0" x2="454.0" y2="328.0" stroke="#3d4560" stroke-width="1.5"/><line x1="486.0" y1="328.0" x2="576.0" y2="328.0" stroke="#3d4560" stroke-width="1.5"/><text x="409.0" y="352.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">signature</text><text x="531.0" y="352.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">date</text><text x="24.0" y="432.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Invitation: the event&#x27;s name first, when-and-where grouped.</text><text x="24.0" y="453.0" font-size="16" font-weight="600"