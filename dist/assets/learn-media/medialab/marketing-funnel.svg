<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 453" width="640" height="453" role="img" aria-labelledby="t d"><title id="t">Marketing funnel</title><desc id="d">A funnel: 2,000 reached, 140 engaged (an engagement rate of 7%), 60 clicked, and 18 converted by doing the action asked.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="453" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">From seeing to doing: each step loses people</text><rect x="24.0" y="60.0" width="592.0" height="52.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="320.0" y="82.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Reach</text><text x="320.0" y="104.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">2,000 people saw it</text><rect x="69.0" y="120.0" width="502.0" height="52.0" rx="8" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="320.0" y="142.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Engagement</text><text x="320.0" y="164.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">140 liked, commented, shared, saved</text><rect x="114.0" y="180.0" width="412.0" height="52.0" rx="8" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="320.0" y="202.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Clicks</text><text x="320.0" y="224.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">60 opened the link</text><rect x="159.0" y="240.0" width="322.0" height="52.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="320.0" y="262.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Conversions</text><text x="320.0" y="284.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">18 sent OPEN DAY</text><rect x="24.0" y="310.0" width="592.0" height="50.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="342.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Engagement rate = 140 ÷ 2,000 × 100 = 7%</text><text x="24.0" y="392.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Conversions — people who did the action — matter most. Compare</text><text x="24.0" y="413.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">your posts with each other, not with celebrities.</text><text x="624.0" y="443.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>