<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 499" width="640" height="499" role="img" aria-labelledby="t d"><title id="t">Logo types</title><desc id="d">Three logo types — a wordmark (the name in a font), a symbol (a shape), and a combination of both — and the clear space a brand guide keeps empty around the logo.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="499" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three kinds of logo, and the clear space around them</text><rect x="24.0" y="60.0" width="186.0" height="170.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="117.0" y="144.0" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">kora</text><text x="117.0" y="192.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Wordmark</text><text x="117.0" y="216.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">the name in a set font</text><rect x="226.0" y="60.0" width="186.0" height="170.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="319.0" cy="130.0" r="34.0" fill="#0b6274" stroke="none" stroke-width="1"/><circle cx="319.0" cy="130.0" r="14.0" fill="#f3f5fa" stroke="none" stroke-width="1"/><text x="319.0" y="192.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Symbol</text><text x="319.0" y="216.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">a picture or shape</text><rect x="428.0" y="60.0" width="186.0" height="170.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><circle cx="478.0" cy="130.0" r="22.0" fill="#0b6274" stroke="none" stroke-width="1"/><circle cx="478.0" cy="130.0" r="9.0" fill="#f3f5fa" stroke="none" stroke-width="1"/><text x="512.0" y="142.0" font-size="28" font-weight="800" fill="#16233f" text-anchor="start">kora</text><text x="521.0" y="192.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Combination</text><text x="521.0" y="216.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">symbol plus name</text><rect x="200.0" y="256.0" width="240.0" height="120.0" rx="0" fill="#ffffff" stroke="#9c3119" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="280.0" cy="316.0" r="22.0" fill="#0b6274" stroke="none" stroke-width="1"/><circle cx="280.0" cy="316.0" r="9.0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="314.0" y="328.0" font-size="28" font-weight="800" fill="#16233f" text-anchor="start">kora</text><text x="320.0" y="402.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle">clear space: nothing enters the dashed box</text><text x="24.0" y="438.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Test it small (a badge, a phone screen) and in one colour. If you cannot</text><text x="24.0" y="459.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">draw it from memory, it is too complicated.</text><text x="624.0" y="489.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>