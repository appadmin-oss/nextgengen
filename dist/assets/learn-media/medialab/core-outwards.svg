<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" width="640" height="508" role="img" aria-labelledby="t d"><title id="t">From the core outwards</title><desc id="d">Three rings: the logo at the core, then the fixed palette and type, then the pieces — poster, social post, invitation, badge — each adapted to its format.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="508" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Build a brand package from the core outwards</text><circle cx="320.0" cy="230.0" r="165.0" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="230.0" r="110.0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="230.0" r="55.0" fill="#f5b026" stroke="#c9cedb" stroke-width="1.5"/><text x="320.0" y="236.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Logo</text><text x="320.0" y="156.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Palette and type</text><text x="320.0" y="98.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Poster · post · invitation · badge</text><text x="320.0" y="372.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">each adapted to its format</text><text x="24.0" y="426.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Fix the exact colour codes and fonts in a shared folder first. Then lay</text><text x="24.0" y="447.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">every piece side by side: same colours in the same roles, logo in the</text><text x="24.0" y="468.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">same place, every fact the same.</text><text x="624.0" y="498.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>