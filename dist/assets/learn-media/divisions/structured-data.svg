<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" role="img" aria-labelledby="t d"><title id="t">Structured data</title><desc id="d">Four free-text entries in different styles become a table with one fact per column — firstName, surname, age — so a computer can count, sort and spot the duplicate.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="342" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Messy text versus one fact per field</text><rect x="24.0" y="60.0" width="270.0" height="36.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="84.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Tobi, 14, Surulere</text><rect x="24.0" y="104.0" width="270.0" height="36.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="128.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">ADEBAYO Tunde - 13yrs</text><rect x="24.0" y="148.0" width="270.0" height="36.0" rx="6" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="172.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Chidinma (12) Yaba</text><rec