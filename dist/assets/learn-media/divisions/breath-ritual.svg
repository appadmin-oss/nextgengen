<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 363" width="640" height="363" role="img" aria-labelledby="t d"><title id="t">Breathing and the performance ritual</title><desc id="d">Breathe in for 4 counts and out for 6 to 8, four or five times; then the same seven-step ritual every time: walk on, settle, breathe, begin, finish, acknowledge, leave.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="363" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Breathe in for 4, out for 6 to 8 — then a ritual you can</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">rely on</text><rect x="24.0" y="86.0" width="215.3" height="44.0" rx="6" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="36.0" y="114.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">in · 4 counts</text><rect x="243.3" y="86.0" width="372.7" height="44.0" rx="6" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="255.3" y="114.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">out · 6 to 8 counts: slows the heart</text><circle cx="38.0" cy="174.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="38.0" y="180.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="56.0" y="156.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="113.0" y="180.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Walk on</text><circle cx="190.0" cy="174.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="190.0" y="180.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="208.0" y="156.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="265.0" y="180.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Settle</text><circle cx="342.0" cy="174.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="342.0" y="180.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="360.0" y="156.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="417.0" y="180.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Breathe</text><circle cx="494.0" cy="174.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="494.0" y="180.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="512.0" y="156.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="569.0" y="180.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Begin</text><circle cx="38.0" cy="236.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="38.0" y="242.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">5</text><rect x="56.0" y="218.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="113.0" y="242.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Finish</text><circle cx="190.0" cy="236.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="190.0" y="242.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">6</text><rect x="208.0" y="218.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="265.0" y="242.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Acknowledge</text><circle cx="342.0" cy="236.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="342.0" y="242.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">7</text><rect x="360.0" y="218.0" width="114.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="417.0" y="242.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Leave</text><text x="24.0" y="302.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Repeat the breath four or five times, feet on the floor. Do not rush the</text><text x="24.0" y="323.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">start, hold the last moment, and accept the applause.</text><text x="624.0" y="353.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>