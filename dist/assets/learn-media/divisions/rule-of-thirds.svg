<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" width="640" height="456" role="img" aria-labelledby="t d"><title id="t">The rule of thirds</title><desc id="d">A frame divided into thirds: the subject stands on the right-hand vertical line at an upper crossing point, and the horizon sits on the lower third line.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="456" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The rule of thirds: subject on a line or a crossing</text><rect x="70.0" y="60.0" width="500.0" height="282.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="2"/><rect x="70.0" y="248.0" width="500.0" height="94.0" rx="0" fill="#e3f1e6" stroke="none" stroke-width="1"/><line x1="236.7" y1="60.0" x2="236.7" y2="342.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="70.0" y1="154.0" x2="570.0" y2="154.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="403.3" y1="60.0" x2="403.3" y2="342.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="70.0" y1="248.0" x2="570.0" y2="248.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="403.3" cy="184.0" r="26.0" fill="#f5b026" stroke="#16233f" stroke-width="2"/><rect x="373.3" y="210.0" width="60.0" height="70.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="2"/><circle cx="236.7" cy="154.0" r="6.0" fill="#9c3119" stroke="none" stroke-width="1"/><circle cx="236.7" cy="248.0" r="6.0" fill="#9c3119" stroke="none" stroke-width="1"/><circle cx="403.3" cy="154.0" r="6.0" fill="#9c3119" stroke="none" stroke-width="1"/><circle cx="403.3" cy="248.0" r="6.0" fill="#9c3119" stroke="none" stroke-width="1"/><text x="24.0" y="372.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Horizon on the lower third gives sky; on the upper third, ground. Leave</text><text x="24.0" y="393.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">looking room in front of a face. Then break it on purpose: centred</text><text x="24.0" y="414.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">framing gives power and formality.</text><text x="624.0" y="446.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>