<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" width="640" height="386" role="img" aria-labelledby="t d"><title id="t">Margin and break-even</title><desc id="d">Zobo sells for ₦500 and costs ₦200, a margin of ₦300 a cup; ₦60,000 of fixed costs ÷ ₦300 = 200 cups to break even. 150 cups lose ₦15,000; 300 cups make ₦30,000.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="386" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A cup of zobo: margin, then break-even</text><rect x="24.0" y="60.0" width="500.0" height="44.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="88.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Price ₦500</text><rect x="24.0" y="114.0" width="200.0" height="44.0" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="36.0" y="142.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Cost ₦200</text><rect x="224.0" y="114.0" width="300.0" height="44.0" rx="0" fill="#e3f1e6" stroke="#16233f" stroke-width="1"/><text x="236.0" y="142.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Margin ₦300 a cup</text><rect x="24.0" y="186.0" width="592.0" height="72.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="40.0" y="216.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Fixed costs ₦60,000 a month ÷ ₦300 = 200 cups</text><text x="40.0" y="242.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">about 8 a day: realistic?</text><rect x="24.0" y="280.0" width="186.0" height="64.0" rx="8" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><text x="117.0" y="306.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">150 cups</text><text x="117.0" y="330.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">loss ₦15,000</text><rect x="226.0" y="280.0" width="186.0" height="64.0" rx="8" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><text x="319.0" y="306.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">200 cups</text><text x="319.0" y="330.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">break even</text><rect x="428.0" y="280.0" width="186.0" height="64.0" rx="8" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25"/><text x="521.0" y="306.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">300 cups</text><text x="521.0" y="330.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">profit ₦30,000</text><text x="624.0" y="376.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>