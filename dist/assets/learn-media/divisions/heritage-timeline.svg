<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 507" width="640" height="507" role="img" aria-labelledby="t d"><title id="t">Nigerian creative traditions</title><desc id="d">A timeline of Nigerian creative traditions: Nok terracottas over 2,000 years old, Ife heads from about 1100, Benin bronzes from about 1300, Ogunde&#x27;s travelling theatre in the 1940s, Afrobeat in the 1970s, Soyinka&#x27;s Nobel Prize in 1986, and Nollywood from the 1990s.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="507" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Where you are making from: Nigerian creative</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">traditions</text><line x1="196.0" y1="86.0" x2="196.0" y2="416.0" stroke="#3d4560" stroke-width="3"/><circle cx="196.0" cy="96.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="102.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">Over 2,000 years ago</text><text x="218.0" y="102.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Nok terracottas</text><circle cx="196.0" cy="146.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="152.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">From about 1100</text><text x="218.0" y="152.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Ife bronze and terracotta heads</text><circle cx="196.0" cy="196.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="202.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">From about 1300</text><text x="218.0" y="202.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Benin bronzes and ivories</text><circle cx="196.0" cy="246.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="252.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1940s</text><text x="218.0" y="252.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Hubert Ogunde&#x27;s travelling theatre</text><circle cx="196.0" cy="296.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="302.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1970s</text><text x="218.0" y="302.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Afrobeat: Fela Kuti and Tony Allen</text><circle cx="196.0" cy="346.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="352.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1986</text><text x="218.0" y="352.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Wole Soyinka, Nobel Prize</text><circle cx="196.0" cy="396.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="178.0" y="402.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1990s onward</text><text x="218.0" y="402.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Nollywood</text><text x="24.0" y="446.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Not a complete list: add the traditions of your own place — textiles,</text><text x="24.0" y="467.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">music, festivals, stories — and name them when you draw on them.</text><text x="624.0" y="497.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>