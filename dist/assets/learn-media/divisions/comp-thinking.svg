<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">Computational thinking</title><desc id="d">Four parts of computational thinking on a registration desk: decompose it into steps, spot the pattern that repeats for every person, abstract away irrelevant details, and write a precise algorithm.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Computational thinking, on a registration desk</text><rect x="24.0" y="60.0" width="288.0" height="104.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="95.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Decomposition</text><text x="36.0" y="120.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">greet · find name · check</text><text x="36.0" y="141.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">payment · badge · record</text><rect x="328.0" y="60.0" width="288.0" height="104.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="340.0" y="95.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Pattern recognition</text><text x="340.0" y="120.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">same steps for every person: a</text><text x="340.0" y="141.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">loop</text><rect x="24.0" y="180.0" width="288.0" height="104.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="214.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Abstraction</text><text x="36.0" y="240.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">name and status matter; shirt</text><text x="36.0" y="261.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">colour does not</text><rect x="328.0" y="180.0" width="288.0" height="104.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="340.0" y="214.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Algorithm</text><text x="340.0" y="240.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">precise steps anyone can follow</text><text x="340.0" y="261.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">and get the same result</text><text x="624.0" y="320.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>