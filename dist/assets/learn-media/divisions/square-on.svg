<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" width="640" height="412" role="img" aria-labelledby="t d"><title id="t">Photographing flat work</title><desc id="d">A camera pointed straight at the centre of a flat artwork records its true rectangle; from an angle the rectangle becomes a distorted trapezium.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="412" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Photograph flat work square-on, in soft light</text><rect x="24.0" y="60.0" width="292.0" height="240.0" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="170.0" y="90.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Square-on: true shape</text><rect x="110.0" y="110.0" width="120.0" height="120.0" rx="0" fill="#ffffff" stroke="#16233f" stroke-width="2"/><line x1="170.0" y1="288.0" x2="170.0" y2="236.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="152.0" y="256.0" width="36.0" height="22.0" rx="3" fill="#16233f" stroke="none" stroke-width="1"/><rect x="336.0" y="60.0" width="292.0" height="240.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="482.0" y="90.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">At an angle: distorted</text><polygon points="406,120 558,136 558,214 406,230" fill="#ffffff" stroke="#16233f" stroke-width="2"/><line x1="376.0" y1="282.0" x2="416.0" y2="238.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="356.0" y="256.0" width="36.0" height="22.0" rx="3" fill="#16233f" stroke="none" stroke-width="1"/><text x="24.0" y="330.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Camera centred and parallel to the work. Window daylight, not direct</text><text x="24.0" y="351.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">sun, no flash glare. Three-dimensional work: several angles and a</text><text x="24.0" y="372.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">detail.</text><text x="624.0" y="402.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>