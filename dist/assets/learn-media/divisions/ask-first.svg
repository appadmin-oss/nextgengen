<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 516" width="640" height="516" role="img" aria-labelledby="t d"><title id="t">Bottom line up front</title><desc id="d">A decision message: the ask in the first sentence, then options A, B and C with their numbers, a recommendation with its reason, and the date an answer is needed.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="516" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Writing that gets a decision: the ask first</text><rect x="64.0" y="60.0" width="552.0" height="88.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">The ask</text><text x="76.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“I need your approval to spend ₦150,000 on a second fridge by</text><text x="76.0" y="133.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Friday.”</text><circle cx="40.0" cy="104.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="110.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="150.0" x2="340.0" y2="168.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="172.0" width="552.0" height="88.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="198.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Options</text><text x="76.0" y="224.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">A: buy (₦150,000) · B: rent cold room (₦20,000/month) · C: do</text><text x="76.0" y="245.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">nothing (lose ~₦25,000/month).</text><circle cx="40.0" cy="216.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="262.0" x2="340.0" y2="280.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="284.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="310.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Recommendation</text><text x="76.0" y="336.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">“I recommend A, because it pays for itself in about 6 weeks.”</text><circle cx="40.0" cy="317.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="323.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="353.0" x2="340.0" y2="371.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="375.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="401.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">By when</text><text x="76.0" y="427.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">The date you need the answer.</text><circle cx="40.0" cy="408.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="414.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="24.0" y="472.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Under 150 words. Numbers, not adjectives.</text><text x="624.0" y="506.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>