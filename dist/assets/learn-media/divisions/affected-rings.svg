<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 528" width="640" height="528" role="img" aria-labelledby="t d"><title id="t">Who is affected</title><desc id="d">Rings of people affected by a technology: users at the centre, then the people the data is about and workers whose jobs change, then people nearby, people left out and the environment.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="528" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Who is affected — including people who never use it</text><circle cx="320.0" cy="240.0" r="175.0" fill="#eee6f6" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="240.0" r="125.0" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="240.0" r="72.0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.5"/><text x="320.0" y="246.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Users</text><text x="320.0" y="148.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">People the data is about</text><text x="320.0" y="342.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Workers whose jobs change</text><text x="320.0" y="94.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">People nearby</text><text x="320.0" y="396.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">People left out · the environment</text><text x="24.0" y="446.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Name the most likely harm, not the most dramatic — for an attendance</text><text x="24.0" y="467.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">app, a child&#x27;s schedule exposed — and change one design decision to</text><text x="24.0" y="488.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">reduce it.</text><text x="624.0" y="518.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>