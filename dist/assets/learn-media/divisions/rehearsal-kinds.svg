<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" role="img" aria-labelledby="t d"><title id="t">Two kinds of rehearsal</title><desc id="d">A work session repeats only the hard sections of a piece, slowly; a run-through plays the whole piece start to finish without stopping, even after a mistake.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="402" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Two kinds of rehearsal, both needed</text><text x="24.0" y="80.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Work session</text><text x="24.0" y="104.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">isolate the hard parts, slowly, many times</text><rect x="24.0" y="118.0" width="90.0" height="34.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="118.0" y="118.0" width="60.0" height="34.0" rx="4" fill="#fde5df" stroke="#16233f" stroke-width="1.5"/><rect x="182.0" y="118.0" width="110.0" height="34.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><rect x="296.0" y="118.0" width="50.0" height="34.0" rx="4" fill="#fde5df" stroke="#16233f" stroke-width="1.5"/><rect x="350.0" y="118.0" width="90.0" height="34.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1"/><text x="24.0" y="200.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Run-through</text><text x="24.0" y="224.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">start to finish without stopping</text><rect x="24.0" y="238.0" width="90.0" height="34.0" rx="4" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><rect x="118.0" y="238.0" width="60.0" height="34.0" rx="4" fill="#fde5df" stroke="#16233f" stroke-width="1"/><rect x="182.0" y="238.0" width="110.0" height="34.0" rx="4" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><rect x="296.0" y="238.0" width="50.0" height="34.0" rx="4" fill="#fde5df" stroke="#16233f" stroke-width="1"/><rect x="350.0" y="238.0" width="90.0" height="34.0" rx="4" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><line x1="24.0" y1="284.0" x2="436.0" y2="284.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="24.0" y="320.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Hard sections (red) first while you are fresh, then put them back in</text><text x="24.0" y="341.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">context. Run-throughs build stamina and teach you to keep going after</text><text x="24.0" y="362.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">a mistake.</text><text x="624.0" y="392.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>