<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 411" width="640" height="411" role="img" aria-labelledby="t d"><title id="t">A stop rule</title><desc id="d">Sign-ups for an evening class rise to 24 by the end of the month, below the stop line of 30 set in advance, so the class stops and a weekend one is tried.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="411" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Decide the stop number before you start</text><line x1="70.0" y1="290.0" x2="600.0" y2="290.0" stroke="#3d4560" stroke-width="2"/><line x1="70.0" y1="70.0" x2="70.0" y2="290.0" stroke="#3d4560" stroke-width="2"/><line x1="70.0" y1="125.0" x2="600.0" y2="125.0" stroke="#9c3119" stroke-width="2.5" stroke-dasharray="7 5"/><text x="600.0" y="115.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">stop line: 30 sign-ups by month end</text><path d="M70.0 290.0 L202.5 257.0 L335.0 218.5 L467.5 185.5 L600.0 158.0" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="600.0" cy="158.0" r="7.0" fill="#9c3119" stroke="none" stroke-width="1"/><text x="586.0" y="146.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">24: stop, try weekends</text><text x="70.0" y="314.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">start</text><text x="202.5" y="314.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">week 1</text><text x="335.0" y="314.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">week 2</text><text x="467.5" y="314.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">week 3</text><text x="600.0" y="314.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end">week 4</text><text x="24.0" y="350.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Written in advance, the stop number protects you from the sunk-cost</text><text x="24.0" y="371.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">trap: carrying on because you have already invested.</text><text x="624.0" y="401.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>