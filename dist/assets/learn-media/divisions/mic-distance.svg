<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 387" width="640" height="387" role="img" aria-labelledby="t d"><title id="t">Microphone distance</title><desc id="d">With the phone 20 cm from the speaker the voice is far louder than the room noise; with a camera mic 3 metres away the voice is barely above the noise and echo.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="387" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Get the mic close: the voice weakens with distance, the</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">room does not</text><text x="24.0" y="106.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Phone 20 cm away</text><rect x="24.0" y="120.0" width="480.0" height="26.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="514.0" y="140.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">voice</text><rect x="24.0" y="152.0" width="120.0" height="26.0" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="154.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">room noise and echo</text><text x="24.0" y="216.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Camera mic 3 m away</text><rect x="24.0" y="230.0" width="168.0" height="26.0" rx="0" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="202.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">voice</text><rect x="24.0" y="262.0" width="120.0" height="26.0" rx="0" fill="#fde5df" stroke="#16233f" stroke-width="1"/><text x="154.0" y="282.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">room noise and echo</text><text x="24.0" y="326.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Record in small, soft rooms (curtains, cushions, a car), turn fans off,</text><text x="24.0" y="347.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and listen back on headphones before you leave.</text><text x="624.0" y="377.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>