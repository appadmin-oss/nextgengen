<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" width="640" height="482" role="img" aria-labelledby="t d"><title id="t">Consent before publishing</title><desc id="d">Before publishing a person: are they identifiable; did they agree knowing where it will appear, recorded; if under 18, a guardian&#x27;s consent and the child&#x27;s agreement; and never a child&#x27;s name with school or location, or private details.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="482" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">May I publish this person?</text><rect x="64.0" y="60.0" width="552.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Can they be identified?</text><text x="76.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">If not, consent rules still apply to what you say about them.</text><circle cx="40.0" cy="93.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="99.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><line x1="340.0" y1="129.0" x2="340.0" y2="147.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="151.0" width="552.0" height="88.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="177.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Did they agree, knowing where it will appear?</text><text x="76.0" y="203.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">Record it: a signed release, or a recorded “yes” with name, date</text><text x="76.0" y="224.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">and use.</text><circle cx="40.0" cy="195.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="201.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><line x1="340.0" y1="241.0" x2="340.0" y2="259.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="263.0" width="552.0" height="67.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="289.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Under 18?</text><text x="76.0" y="315.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">A parent or guardian consents, and the child agrees too.</text><circle cx="40.0" cy="296.5" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="302.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><line x1="340.0" y1="332.0" x2="340.0" y2="350.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="64.0" y="354.0" width="552.0" height="88.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.0" y="380.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Never publish</text><text x="76.0" y="406.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">A child&#x27;s full name with school or location; addresses, phone</text><text x="76.0" y="427.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">numbers, medical or ID details.</text><circle cx="40.0" cy="398.0" r="14.0" fill="#f5b026" stroke="#16233f" stroke-width="1.25"/><text x="40.0" y="404.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="624.0" y="472.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>