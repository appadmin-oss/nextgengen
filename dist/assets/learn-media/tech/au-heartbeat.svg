<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="t d"><title id="t">Heartbeat monitoring</title><desc id="d">Six weeks of success notes, the last two missing.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="270" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Silence should be an alarm</text><rect x="30" y="70" width="84" height="76" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="30 70 84 76"><text x="72" y="102.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">wk 1</text><text x="72" y="122.976" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="middle" xml:space="preserve">✓ sent 42</text></g><rect x="130" y="70" width="84" height="76" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="130 70 84 76"><text x="172" y="102.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">wk 2</text><text x="172" y="122.976" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="middle" xml:space="preserve">✓ sent 42</text></g><rect x="230" y="70" width="84" height="76" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="230 70 84 76"><text x="272" y="102.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">wk 3</text><text x="272" y="122.976" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="middle" xml:space="preserve">✓ sent 42</text></g><rect x="330" y="70" width="84" height="76" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="330 70 84 76"><text x="372" y="102.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">wk 4</text><text x="372" y="122.976" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="middle" xml:space="preserve">✓ sent 42</text></g><rect x="430" y="70" width="84" height="76" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="430 70 84 76"><text x="472" y="102.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">wk 5</text><text x="472" y="122.976" font-size="16" font-weight="600" fill="#9c3119" text-anchor="middle" xml:space="preserve">—</text></g><rect x="530" y="70" width="84" height="76" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="530 70 84 76"><text x="572" y="102.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">wk 6</text><text x="572" y="122.976" font-size="16" font-weight="600" fill="#9c3119" text-anchor="middle" xml:space="preserve">—</text></g><text x="470" y="180" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle" xml:space="preserve">no heartbeat:</text><text x="470" y="204" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">find out why now</text><text x="20" y="250" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Also: error emails on failure, and a log row for every run.</text></g></svg>