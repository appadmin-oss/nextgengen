<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" width="640" height="242" role="img" aria-labelledby="t d"><title id="t">Regression tests</title><desc id="d">Fail on old code, pass on fixed code, commit together.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="242" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A test must fail on the broken code</text><rect x="20" y="66" width="186" height="120" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 66 186 120"><text x="113" y="107.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">Old code + test</text><text x="113" y="131.72" font-size="20" font-weight="800" fill="#9c3119" text-anchor="middle" xml:space="preserve">FAILS</text><text x="113" y="153.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">so it catches the bug</text></g><line x1="208" y1="126" x2="224" y2="126" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="227" y="66" width="186" height="120" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="227 66 186 120"><text x="320" y="107.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">Fixed code + test</text><text x="320" y="131.72" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="middle" xml:space="preserve">PASSES</text><text x="320" y="153.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">the fix works</text></g><line x1="415" y1="126" x2="431" y2="126" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="434" y="66" width="186" height="120" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="434 66 186 120"><text x="527" y="107.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">Commit both</text><text x="527" y="131.72" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">together</text><text x="527" y="153.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">no quiet return</text></g><text x="20" y="222" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">A test that passes on broken code tests nothing.</text></g></svg>