<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-labelledby="t d"><title id="t">Checking a bank alert</title><desc id="d">A buyer&#x27;s alert checked in your own banking app before goods are released.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="220" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A screenshot of an alert is not money</text><rect x="20" y="64" width="180" height="70" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 180 70"><text x="110" y="93.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Buyer shows a</text><text x="110" y="113.976" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">“credit alert”</text></g><line x1="202" y1="99" x2="236" y2="99" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="240" y="64" width="170" height="70" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="240 64 170 70"><text x="325" y="93.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Open your own</text><text x="325" y="113.976" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">banking app</text></g><line x1="412" y1="99" x2="446" y2="70" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="450" y="40" width="170" height="56" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="450 40 170 56"><text x="535" y="62.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">money there:</text><text x="535" y="82.976" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">release goods</text></g><line x1="412" y1="99" x2="446" y2="130" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="450" y="108" width="170" height="56" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="450 108 170 56"><text x="535" y="130.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">not there:</text><text x="535" y="150.976" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">keep the goods</text></g><text x="20" y="200" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Same rule for every scam: refuse, block, report.</text></g></svg>