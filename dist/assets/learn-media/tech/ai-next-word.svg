<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346" role="img" aria-labelledby="t d"><title id="t">Next-word prediction</title><desc id="d">A prompt, a model, likelihood bars for candidate words, and a loop back.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="346" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Predict the next word, add it, repeat</text><rect x="20" y="60" width="230" height="50" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 230 50"><text x="135" y="89.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">The sun rises in the …</text></g><line x1="252" y1="85" x2="286" y2="85" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="290" y="60" width="110" height="50" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="290 60 110 50"><text x="345" y="89.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">model</text></g><text x="424" y="82" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">east</text><rect x="510" y="68" width="110" height="18" rx="3" fill="#20b2c9"/><text x="424" y="118" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">morning</text><rect x="510" y="104" width="24" height="18" rx="3" fill="#c9cedb"/><text x="424" y="154" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">sky</text><rect x="510" y="140" width="15" height="18" rx="3" fill="#c9cedb"/><text x="424" y="190" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">west</text><rect x="510" y="176" width="6" height="18" rx="3" fill="#c9cedb"/><line x1="402" y1="85" x2="418" y2="76" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="424" y="222" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">likely → unlikely</text><path d="M440 236 V262 H135 V114" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="150" y="254" font-size="16" font-weight="600" fill="#0b6274" text-anchor="start" xml:space="preserve">add “east”, then predict again</text><rect x="20" y="282" width="600" height="48" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 282 600 48"><text x="320" y="310.576" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">Likely is not the same as true: nothing checks the facts.</text></g></g></svg>