<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="t d"><title id="t">Calling an API</title><desc id="d">A request and response, a status check, and two outcomes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="300" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Ask, check, take what you need</text><rect x="20" y="64" width="140" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 140 60"><text x="90" y="98.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">your program</text></g><line x1="162" y1="82" x2="326" y2="82" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="244" y="72" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">GET …/nigeria</text><rect x="330" y="64" width="120" height="60" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 64 120 60"><text x="390" y="98.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">the API</text></g><line x1="326" y1="110" x2="162" y2="110" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="244" y="136" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">status + JSON</text><polygon points="545,56 620,94 545,132 470,94" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="499.5 69 91 50"><text x="545" y="100" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">2xx?</text></g><line x1="452" y1="94" x2="466" y2="94" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="20" y="176" width="290" height="70" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 176 290 70"><text x="165" y="205.176" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">yes: keep only what you need</text><text x="165" y="225.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">name, capital</text></g><rect x="330" y="176" width="290" height="70" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 176 290 70"><text x="475" y="205.176" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">no, or no answer:</text><text x="475" y="225.976" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">say so, and recover</text></g><path d="M545 134 V160 H165 V172" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><line x1="545" y1="134" x2="545" y2="172" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="20" y="280" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">API keys are secrets: never in a public repo or front-end code.</text></g></svg>