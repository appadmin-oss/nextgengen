<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">Problem statement anatomy</title><desc id="d">Four labelled parts of an example statement.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Who · what · why · what it costs</text><rect x="20" y="60" width="140" height="46" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 60 140 46"><text x="90" y="87.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Who</text></g><rect x="170" y="60" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 60 450 46"><text x="184" y="87.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Parents of new NGG members</text></g><rect x="20" y="118" width="140" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 118 140 46"><text x="90" y="145.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">struggles to</text></g><rect x="170" y="118" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 118 450 46"><text x="184" y="145.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">find their child&#x27;s class time and room</text></g><rect x="20" y="176" width="140" height="46" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 176 140 46"><text x="90" y="203.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">because</text></g><rect x="170" y="176" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 176 450 46"><text x="184" y="203.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">it is spread across WhatsApp messages</text></g><rect x="20" y="234" width="140" height="46" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 234 140 46"><text x="90" y="261.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">which costs</text></g><rect x="170" y="234" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 234 450 46"><text x="184" y="261.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">calls, and sometimes a missed first session</text></g><text x="20" y="312" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">No solution in it: “parents need an app” is a solution in disguise.</text></g></svg>