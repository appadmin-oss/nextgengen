<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" role="img" aria-labelledby="t d"><title id="t">Staged rollout</title><desc id="d">Three stages, 10%, 50% and 100%, with checks between.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="288" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Widen the launch only after each check</text><rect x="20" y="105" width="150" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 105 150 60"><text x="95" y="130.32" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">10%</text><text x="95" y="152.576" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">of users</text></g><line x1="172" y1="120" x2="230" y2="120" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="201" y="91" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">check</text><rect x="235" y="85" width="150" height="100" rx="10" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25" filter="url(#sh)"/><g data-fit="235 85 150 100"><text x="310" y="130.32" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">50%</text><text x="310" y="152.576" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">of users</text></g><line x1="387" y1="120" x2="445" y2="120" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="416" y="71" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">check</text><rect x="450" y="65" width="150" height="140" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="450 65 150 140"><text x="525" y="130.32" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">100%</text><text x="525" y="152.576" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">of users</text></g><rect x="20" y="214" width="600" height="56" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 214 600 56"><text x="320" y="246.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">Feature flag: switch it off in minutes. Rollback plan: decided before launch.</text></g></g></svg>