<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d"><title id="t">Commit message format</title><desc id="d">A summary line, blank line and body, labelled.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="340" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A commit message the future can read</text><rect x="20" y="58" width="600" height="144" rx="8" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 58 600 144"><text x="34" y="85.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="800">Fix crash when the name is empty</tspan></text><text x="34" y="110.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500"></tspan></text><text x="34" y="135.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">Saving a learner with no name threw a TypeError</tspan></text><text x="34" y="160.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">because validate() assumed a string. Return</tspan></text><text x="34" y="185.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">&quot;name_required&quot; instead, and add a test.</tspan></text></g><text x="20" y="232" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">1  summary: ~50 characters, “This commit will…”</text><text x="20" y="258" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">2  a blank line</text><text x="20" y="284" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">3  the body: WHY it was needed</text><text x="20" y="320" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">Not this: “fix”, “stuff”, “update”.</text></g></svg>