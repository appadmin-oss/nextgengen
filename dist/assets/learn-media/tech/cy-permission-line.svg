<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d"><title id="t">Permission is the line</title><desc id="d">Legal and illegal uses of the same skills either side of a line.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="310" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The difference is permission</text><rect x="20" y="58" width="280" height="200" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="88" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">With permission: legal</text><text x="36" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• CTF puzzles, e.g. picoCTF</text><text x="36" y="154" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• your own devices</text><text x="36" y="184" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• a bug bounty&#x27;s rules</text><text x="36" y="214" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• reporting a flaw you found</text><rect x="340" y="58" width="280" height="200" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="356" y="88" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Without it: a crime</text><text x="356" y="124" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• a friend&#x27;s account</text><text x="356" y="154" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• trying passwords</text><text x="356" y="184" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• scanning the school</text><text x="356" y="214" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• reading their messages</text><line x1="320" y1="50" x2="320" y2="266" stroke="#16233f" stroke-width="3"/><text x="20" y="290" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Nigeria: Cybercrimes Act 2015 — even if it was easy, even if no harm.</text></g></svg>