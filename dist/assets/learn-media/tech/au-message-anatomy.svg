<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" role="img" aria-labelledby="t d"><title id="t">Anatomy of an automated message</title><desc id="d">An SMS with four numbered parts.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="284" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">What makes a reminder worth reading</text><rect x="20" y="60" width="340" height="170" rx="16" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25" filter="url(#sh)"/><text x="38" y="92" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Hi Mrs Adeyemi, Tobi&#x27;s</text><text x="38" y="118" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Saturday class moves to</text><text x="38" y="144" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">11am this week at Egbeda</text><text x="38" y="170" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">(Lab 1). Reply STOP to</text><text x="38" y="196" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">opt out.</text><text x="384" y="92" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">✓ their name</text><text x="384" y="132" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">✓ what changed</text><text x="384" y="172" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">✓ where and when</text><text x="384" y="212" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">✓ an easy way to stop</text><text x="20" y="264" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Only to those it applies to. Never at 2am.</text></g></svg>