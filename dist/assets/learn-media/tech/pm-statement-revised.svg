<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" role="img" aria-labelledby="t d"><title id="t">A revised problem statement</title><desc id="d">Before and after versions, with the changes labelled.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="342" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The same statement, after the evidence</text><rect x="20" y="58" width="600" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 58 600 52"><text x="34" y="88.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">Before: Parents struggle to find class times.</text></g><line x1="320" y1="112" x2="320" y2="136" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="20" y="140" width="600" height="154" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="170" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">Parents of children in their first month</text><text x="604" y="170" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">narrower user</text><text x="36" y="204" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">struggle to find the right class</text><text x="36" y="238" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">because the timetable is often out of date</text><text x="604" y="238" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">different cause</text><text x="36" y="272" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">— about 1 in 5 first sessions missed</text><text x="604" y="272" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">measurable cost</text><text x="20" y="324" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Record what changed and why. Changing course early is cheap.</text></g></svg>