<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="t d"><title id="t">Anatomy of a phishing message</title><desc id="d">A fake bank email with four numbered warning signs.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="370" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Four tells in one message</text><rect x="20" y="56" width="370" height="270" rx="10" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="84" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">From: YourBank Security</text><text x="36" y="106" font-size="16" font-weight="500" fill="#9c3119" text-anchor="start" xml:space="preserve">alerts@yourbank-verify.com</text><line x1="36" y1="120" x2="374" y2="120" stroke="#c9cedb" stroke-width="1.5"/><text x="36" y="148" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Your account will be closed</text><text x="36" y="170" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">in 24 hours. Verify now:</text><rect x="36" y="186" width="220" height="34" rx="6" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25"/><text x="48" y="209" font-size="16" font-weight="600" fill="#0b6274" text-anchor="start" xml:space="preserve">yourbank.com/verify</text><text x="36" y="252" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Enter your PIN and the</text><text x="36" y="274" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">OTP we just sent you.</text><circle cx="370" cy="100" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="356 86 28 28"><text x="370" y="106" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">1</text></g><circle cx="370" cy="160" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="356 146 28 28"><text x="370" y="166" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">2</text></g><circle cx="370" cy="203" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="356 189 28 28"><text x="370" y="209" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">3</text></g><circle cx="370" cy="263" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="356 249 28 28"><text x="370" y="269" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">4</text></g><circle cx="420" cy="76" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="406 62 28 28"><text x="420" y="82" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">1</text></g><text x="442" y="82" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">sender: not the</text><text x="442" y="104" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">real bank&#x27;s domain</text><circle cx="420" cy="142" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="406 128 28 28"><text x="420" y="148" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">2</text></g><text x="442" y="148" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">urgency, fear:</text><text x="442" y="170" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">act before you think</text><circle cx="420" cy="208" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="406 194 28 28"><text x="420" y="214" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">3</text></g><text x="442" y="214" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">hold the link: it goes</text><text x="442" y="236" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">to yourbank-verify.com</text><circle cx="420" cy="274" r="14" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><g data-fit="406 260 28 28"><text x="420" y="280" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">4</text></g><text x="442" y="280" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">a real bank never</text><text x="442" y="302" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">asks for PIN or OTP</text><text x="20" y="352" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Stop, then check through a channel you already trust.</text></g></svg>