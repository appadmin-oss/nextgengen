<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" width="640" height="272" role="img" aria-labelledby="t d"><title id="t">A fake Wi-Fi hotspot</title><desc id="d">Traffic through an attacker&#x27;s hotspot versus straight over mobile data.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="272" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Whose network is it, really?</text><rect x="20" y="90" width="120" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 90 120 60"><text x="80" y="124.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">your phone</text></g><line x1="142" y1="108" x2="196" y2="80" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="200" y="50" width="200" height="60" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="200 50 200 60"><text x="300" y="74.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">Airport_Free_WiFi</text><text x="300" y="94.976" font-size="16" font-weight="500" fill="#9c3119" text-anchor="middle" xml:space="preserve">a stranger&#x27;s laptop</text></g><line x1="402" y1="80" x2="476" y2="108" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="480" y="90" width="140" height="60" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="480 90 140 60"><text x="550" y="124.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">internet</text></g><text x="300" y="136" font-size="16" font-weight="600" fill="#9c3119" text-anchor="middle" xml:space="preserve">they can see and change traffic</text><path d="M80 152 V210 H550 V154" fill="none" stroke="#1d6b30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ag)"/><text x="315" y="202" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="middle" xml:space="preserve">mobile data: straight to your network operator</text><text x="20" y="252" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Banking and logins: mobile data. Never ignore certificate warnings.</text></g></svg>