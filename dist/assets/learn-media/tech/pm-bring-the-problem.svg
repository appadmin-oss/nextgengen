<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="640" height="304" role="img" aria-labelledby="t d"><title id="t">Bring the problem</title><desc id="d">A PM dictating a solution beside a PM bringing problem, goal and constraints.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="304" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Bring the problem, not the answer</text><rect x="20" y="58" width="270" height="150" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Order-taking</text><text x="36" y="122" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">PM: “Build this screen.”</text><text x="36" y="160" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Team&#x27;s expertise wasted,</text><text x="36" y="184" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">a worse product</text><rect x="310" y="58" width="310" height="150" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="326" y="86" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">Solving together</text><text x="326" y="120" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• the problem + evidence</text><text x="326" y="146" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• the goal + measure</text><text x="326" y="172" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">• the constraints</text><line x1="465" y1="210" x2="465" y2="238" stroke="#1d6b30" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ag)"/><rect x="330" y="240" width="270" height="46" rx="10" fill="#ffffff" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="330 240 270 46"><text x="465" y="267.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">team explores solutions</text></g></g></svg>