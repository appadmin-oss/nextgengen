<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" width="640" height="362" role="img" aria-labelledby="t d"><title id="t">Hardware debugging order</title><desc id="d">Five checks from power to mechanics.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="362" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Check in this order: cheapest first</text><rect x="20" y="58" width="220" height="42" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="20 58 220 42"><text x="130" y="83.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">1 Power</text></g><text x="260" y="85" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">charged? common ground?</text><rect x="44" y="110" width="220" height="42" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="44 110 220 42"><text x="154" y="135.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">2 Wiring</text></g><text x="284" y="137" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">every wire vs the diagram</text><rect x="68" y="162" width="220" height="42" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="68 162 220 42"><text x="178" y="187.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">3 Each part alone</text></g><text x="308" y="189" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">simplest example sketch</text><rect x="92" y="214" width="220" height="42" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="92 214 220 42"><text x="202" y="239.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">4 Code</text></g><text x="332" y="241" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">print what it thinks</text><rect x="116" y="266" width="220" height="42" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="116 266 220 42"><text x="226" y="291.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">5 Mechanics</text></g><text x="356" y="293" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">rubbing, loose, slipping</text><text x="20" y="344" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Change one thing at a time, and write it down.</text></g></svg>