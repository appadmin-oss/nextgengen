<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" role="img" aria-labelledby="t d"><title id="t">Automation payback</title><desc id="d">Cumulative time by hand rising past a flat automation cost at 18 weeks.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="334" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">A 10-minute weekly task, 3 hours to automate</text><line x1="80" y1="260" x2="600" y2="260" stroke="#3d4560" stroke-width="2"/><line x1="80" y1="60" x2="80" y2="260" stroke="#3d4560" stroke-width="2"/><path d="M80.0 260.0 L600.0 60.0" fill="none" stroke="#9c3119" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="496" y="124" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">by hand</text><path d="M80.0 140.0 L600.0 140.0" fill="none" stroke="#1d6b30" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="594" y="164" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="end" xml:space="preserve">automated</text><circle cx="392" cy="140" r="7" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="392" y1="140" x2="392" y2="260" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="4 4"/><text x="392" y="284" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">18 weeks</text><text x="80" y="284" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">0</text><text x="253.333" y="284" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">10</text><text x="600" y="284" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">30</text><text x="72" y="146" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end" xml:space="preserve">3 h</text><text x="72" y="266" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end" xml:space="preserve">0</text><text x="80" y="58" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">total time spent</text><text x="20" y="316" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Pays for itself in about four months — if it is maintained.</text></g></svg>