<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" role="img" aria-labelledby="t d"><title id="t">Branching and merging</title><desc id="d">A main line with commits, a branch of two commits, and a merge.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="314" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Branch off, work safely, merge back</text><line x1="40" y1="110" x2="600" y2="110" stroke="#3d4560" stroke-width="3"/><text x="40" y="88" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">main</text><circle cx="80" cy="110" r="11" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><circle cx="180" cy="110" r="11" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><circle cx="400" cy="110" r="11" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><circle cx="560" cy="110" r="11" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M180 110 C210 110 220 190 260 190 H340 C380 190 390 110 470 110" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="190" r="11" fill="#dff3f7" stroke="#0b6274" stroke-width="2.5"/><circle cx="340" cy="190" r="11" fill="#dff3f7" stroke="#0b6274" stroke-width="2.5"/><circle cx="470" cy="110" r="13" fill="#f5b026" stroke="#16233f" stroke-width="2.5"/><text x="300" y="228" font-size="16" font-weight="700" fill="#0b6274" text-anchor="middle" xml:space="preserve">fix-login branch</text><text x="470" y="80" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">merge</text><text x="20" y="270" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">git switch -c fix-login</text><text x="20" y="296" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">main keeps working while you change things.</text></g></svg>