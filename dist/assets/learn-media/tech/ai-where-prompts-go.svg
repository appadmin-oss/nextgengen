<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" role="img" aria-labelledby="t d"><title id="t">Where prompts go</title><desc id="d">Text travels to a company and may be stored, read or used for training.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="314" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Where your words go</text><rect x="20" y="90" width="150" height="70" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 90 150 70"><text x="95" y="119.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">You type</text><text x="95" y="139.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">on your phone</text></g><line x1="172" y1="125" x2="216" y2="125" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="220" y="80" width="160" height="90" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 80 160 90"><text x="300" y="119.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">the company&#x27;s</text><text x="300" y="139.976" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">computers</text></g><line x1="382" y1="125" x2="416" y2="80" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420" y="62" width="200" height="36" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="420 62 200 36"><text x="520" y="84.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">stored</text></g><line x1="382" y1="125" x2="416" y2="126" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420" y="108" width="200" height="36" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="420 108 200 36"><text x="520" y="130.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">read by staff</text></g><line x1="382" y1="125" x2="416" y2="172" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="420" y="154" width="200" height="36" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="420 154 200 36"><text x="520" y="176.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">used to train models</text></g><rect x="20" y="214" width="600" height="82" rx="10" fill="#ffffff" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 214 600 82"><text x="34" y="238.776" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Never in the box:</text><text x="34" y="259.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">passwords, PINs, card details, your address or school,</text><text x="34" y="280.376" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">other people&#x27;s photos or secrets, confidential work</text></g></g></svg>