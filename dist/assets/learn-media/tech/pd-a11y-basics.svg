<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326" role="img" aria-labelledby="t d"><title id="t">Accessibility basics</title><desc id="d">A 44 px target, an error with words and an icon, and a contrast ratio.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="326" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Three things to build in from the start</text><rect x="20" y="58" width="190" height="220" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Target size</text><rect x="70" y="112" width="88" height="88" rx="8" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><text x="114" y="162" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">44 px</text><text x="36" y="248" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">with space between</text><rect x="225" y="58" width="190" height="220" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="241" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Not colour alone</text><rect x="241" y="110" width="158" height="40" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="2"/><circle cx="253" cy="178" r="9" fill="#b42318" stroke="#b42318" stroke-width="1.5"/><text x="253" y="184" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" xml:space="preserve">!</text><text x="270" y="184" font-size="16" font-weight="700" fill="#b42318" text-anchor="start" xml:space="preserve">Error: add a</text><text x="241" y="208" font-size="16" font-weight="700" fill="#b42318" text-anchor="start" xml:space="preserve">phone number</text><rect x="430" y="58" width="190" height="220" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="446" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Contrast</text><text x="446" y="130" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">body text</text><text x="446" y="166" font-size="26" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">4.5 : 1</text><text x="446" y="196" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">or more</text><text x="446" y="248" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">large text 3 : 1</text><text x="20" y="306" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Plus: labels, keyboard access, reduced motion, plain words.</text></g></svg>