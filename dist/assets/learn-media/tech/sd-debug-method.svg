<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-labelledby="t d"><title id="t">The debugging method</title><desc id="d">Four steps, and a search range halved three times.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="324" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Reproduce, isolate, fix, verify</text><rect x="20" y="60" width="130" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 130 52"><text x="85" y="90.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Reproduce</text></g><line x1="152" y1="86" x2="173" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="177" y="60" width="130" height="52" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="177 60 130 52"><text x="242" y="90.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Isolate</text></g><line x1="309" y1="86" x2="330" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="334" y="60" width="130" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="334 60 130 52"><text x="399" y="90.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Fix the cause</text></g><line x1="466" y1="86" x2="487" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="491" y="60" width="130" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="491 60 130 52"><text x="556" y="90.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Verify</text></g><text x="20" y="160" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">Isolate by halving: is the data wrong before or after this point?</text><rect x="20" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="92" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="164" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="236" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="308" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="380" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="452" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="524" y="178" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="20" y="214" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="92" y="214" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="164" y="214" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="236" y="214" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="308" y="214" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="380" y="214" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="452" y="214" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="524" y="214" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="20" y="250" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="92" y="250" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="164" y="250" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="236" y="250" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="308" y="250" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="380" y="250" width="66" height="26" rx="4" fill="#fdf0d2" stroke="#3d4560"/><rect x="452" y="250" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><rect x="524" y="250" width="66" height="26" rx="4" fill="#f3f5fa" stroke="#c9cedb"/><circle cx="341" cy="263" r="8" fill="#ef6b4d" stroke="#16233f" stroke-width="1.5"/><text x="20" y="306" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Each check halves where the bug can be.</text></g></svg>