<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img" aria-labelledby="t d"><title id="t">Human in the loop</title><desc id="d">Automation, a person deciding, the outcome, and an appeal path back.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="280" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Machines prepare; people decide about people</text><rect x="20" y="76" width="170" height="70" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 76 170 70"><text x="105" y="105.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">automation</text><text x="105" y="125.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">gathers, flags</text></g><line x1="192" y1="111" x2="226" y2="111" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230" y="66" width="180" height="90" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 66 180 90"><text x="320" y="105.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">a person</text><text x="320" y="127.276" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">decides</text></g><line x1="412" y1="111" x2="446" y2="111" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="450" y="76" width="170" height="70" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="450 76 170 70"><text x="535" y="105.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">the outcome</text><text x="535" y="125.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">for a family</text></g><path d="M535 148 V196 H320 V160" fill="none" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="430" y="218" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">reach a human, appeal</text><text x="20" y="260" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Talk first to whoever does the task now: they know the exceptions.</text></g></svg>