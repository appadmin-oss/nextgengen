<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d"><title id="t">A classifier drawn by hand</title><desc id="d">A scatter plot of mangoes and oranges with a dividing line and two new fruit.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="340" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Plot, draw a line, classify</text><line x1="70" y1="300" x2="450" y2="300" stroke="#3d4560" stroke-width="2"/><line x1="70" y1="60" x2="70" y2="300" stroke="#3d4560" stroke-width="2"/><text x="260" y="330" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">weight →</text><text x="40" y="180.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" transform="rotate(-90 40 180.0)">smoothness →</text><circle cx="260" cy="90" r="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><circle cx="300" cy="110" r="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><circle cx="330" cy="80" r="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><circle cx="290" cy="140" r="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><circle cx="350" cy="120" r="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><rect x="101" y="221" width="18" height="18" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><rect x="141" y="241" width="18" height="18" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><rect x="121" y="191" width="18" height="18" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><rect x="171" y="211" width="18" height="18" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><rect x="151" y="261" width="18" height="18" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><line x1="120" y1="70" x2="400" y2="290" stroke="#9c3119" stroke-width="2.5" stroke-dasharray="8 5"/><circle cx="330" cy="230" r="11" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="330" y="236" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">?</text><circle cx="232" cy="172" r="11" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="232" y="178" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">?</text><circle cx="478" cy="90" r="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="496" y="96" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">mango</text><rect x="469" y="117" width="18" height="18" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><text x="496" y="132" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">orange</text><line x1="468" y1="164" x2="490" y2="164" stroke="#9c3119" stroke-width="2.5" stroke-dasharray="8 5"/><text x="496" y="170" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">the boundary</text><text x="470" y="214" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Far from the line:</text><text x="470" y="236" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">a confident call.</text><text x="470" y="268" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Near it: a guess</text><text x="470" y="290" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">said confidently.</text></g></svg>