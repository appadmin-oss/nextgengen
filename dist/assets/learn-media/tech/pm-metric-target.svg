<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" width="640" height="334" role="img" aria-labelledby="t d"><title id="t">Metric with baseline and target</title><desc id="d">A line falling from a baseline to a target after launch.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="334" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Baseline, target, timeframe</text><line x1="80" y1="254" x2="560" y2="254" stroke="#3d4560" stroke-width="2"/><line x1="80" y1="84" x2="80" y2="254" stroke="#3d4560" stroke-width="2"/><path d="M80.0 105.9 L140.0 110.7 L200.0 108.3 L260.0 127.7 L320.0 142.3 L380.0 156.9 L440.0 166.6 L500.0 176.3 L560.0 183.6" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="80" y1="108.286" x2="560" y2="108.286" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="5 4"/><text x="566" y="114.286" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start" xml:space="preserve">baseline</text><line x1="80" y1="181.143" x2="560" y2="181.143" stroke="#1d6b30" stroke-width="2" stroke-dasharray="5 4"/><text x="566" y="187.143" font-size="16" font-weight="700" fill="#