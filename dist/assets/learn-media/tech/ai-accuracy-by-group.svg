<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">Error rates by group</title><desc id="d">Two bars: 0.8% and 34.7% error.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">One overall score hides who it fails</text><text x="20" y="72" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Error rate, worst commercial system (Gender Shades, 2018)</text><text x="20" y="122" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">lighter-skinned men</text><rect x="220" y="104" width="7" height="26" rx="4" fill="#20b2c9"/><text x="235.2" y="124" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">0.8%</text><text x="20" y="184" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">darker-skinned women</text><rect x="220" y="166" width="312" height="26" rx="4" fill="#ef6b4d"/><text x="540.3" y="186" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">34.7%</text><rect x="20" y="236" width="600" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 236 600 76"><text x="34" y="268.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Check results for each group, not just the total —</text><text x="34" y="288.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">and keep a human in charge of decisions about people.</text></g></g></svg>