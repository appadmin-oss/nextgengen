<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="t d"><title id="t">LED and resistor circuit</title><desc id="d">A loop from +5 V through 220 ohms and an LED to ground, with the calculation.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="296" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">5 V, a resistor and an LED in a loop</text><path d="M80 100 H260" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M360 100 H520 V250 H80 V100" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="86" width="100" height="28" rx="4" fill="#fdf0d2" stroke="#16233f" stroke-width="1.25"/><g data-fit="260 86 100 28"><text x="310" y="106" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">220 Ω</text></g><polygon points="505,160 535,160 520,186" fill="#ef6b4d" stroke="#16233f" stroke-width="2"/><line x1="505" y1="188" x2="535" y2="188" stroke="#16233f" stroke-width="3"/><rect x="60" y="160" width="40" height="30" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.25"/><line x1="58" y1="162" x2="102" y2="162" stroke="#16233f" stroke-width="3"/><line x1="70" y1="186" x2="90" y2="186" stroke="#16233f" stroke-width="5"/><text x="52" y="180" font-size="16" font-weight="700" fill="#16233f" text-anchor="end" xml:space="preserve">5 V</text><text x="80" y="92" font-size="18" font-weight="800" fill="#9c3119" text-anchor="middle" xml:space="preserve">+</text><text x="80" y="274" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">GND (0 V)</text><text x="310" y="72" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">3 V across it</text><text x="546" y="170" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">LED</text><text x="546" y="194" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">about 2 V</text><text x="546" y="144" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">long leg +</text><line x1="420" y1="250" x2="340" y2="250" stroke="#1d6b30" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ag)"/><text x="380" y="274" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">15 mA</text><rect x="120" y="160" width="330" height="70" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="120 160 330 70"><text x="285" y="189.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">R = (5 − 2) V ÷ 0.015 A = 200 Ω</text><text x="285" y="209.976" font-size="16" font-weight="600" fill="#1d6b30" text-anchor="middle" xml:space="preserve">next value up: 220 Ω</text></g></g></svg>