<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d"><title id="t">Form into sheet</title><desc id="d">A form, a responses tab and a summary tab of formulas.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="276" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Collect once, cleanly, then let formulas work</text><rect x="20" y="70" width="140" height="120" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 140 120"><text x="90" y="114.348" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Form</text><text x="90" y="135.876" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">drop-downs,</text><text x="90" y="156.676" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">validation</text></g><line x1="162" y1="130" x2="196" y2="130" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="200" y="60" width="200" height="150" rx="8" fill="#ffffff" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><text x="214" y="86" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Responses tab</text><rect x="214" y="100" width="172" height="18" rx="3" fill="#dff3f7"/><rect x="214" y="124" width="172" height="18" rx="3" fill="#dff3f7"/><rect x="214" y="148" width="172" height="18" rx="3" fill="#dff3f7"/><rect x="214" y="172" width="172" height="18" rx="3" fill="#fdf0d2"/><text x="214" y="234" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">new row each time;</text><text x="214" y="256" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">never edit by hand</text><line x1="402" y1="130" x2="436" y2="130" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="440" y="70" width="180" height="120" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="440 70 180 120"><text x="530" y="103.376" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Summary tab</text><text x="530" y="124.176" font-size="16" font-weight="600" fill="#0b6274" text-anchor="middle" xml:space="preserve">=COUNTIF(…)</text><text x="530" y="144.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">per centre,</text><text x="530" y="165.776" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">incomplete list</text></g></g></svg>