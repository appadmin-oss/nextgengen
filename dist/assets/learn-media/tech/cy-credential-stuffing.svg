<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img" aria-labelledby="t d"><title id="t">Credential stuffing</title><desc id="d">A breached site&#x27;s passwords tried on three other services.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="290" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">One leak, tried everywhere</text><rect x="20" y="70" width="160" height="80" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 70 160 80"><text x="100" y="104.176" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Site A</text><text x="100" y="124.976" font-size="16" font-weight="600" fill="#9c3119" text-anchor="middle" xml:space="preserve">breached</text></g><line x1="182" y1="110" x2="216" y2="110" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="220" y="70" width="150" height="80" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 70 150 80"><text x="295" y="104.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">email +</text><text x="295" y="124.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">password list</text></g><line x1="372" y1="110" x2="406" y2="74" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="410" y="58" width="100" height="32" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="410 58 100 32"><text x="460" y="78.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Email</text></g><text x="522" y="80" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">opened</text><line x1="372" y1="110" x2="406" y2="114" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="410" y="98" width="100" height="32" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="410 98 100 32"><text x="460" y="118.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Bank</text></g><text x="522" y="120" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">opened</text><line x1="372" y1="110" x2="406" y2="154" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="410" y="138" width="100" height="32" rx="6" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="410 138 100 32"><text x="460" y="158.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Instagram</text></g><text x="522" y="160" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">opened</text><text x="410" y="196" font-size="16" font-weight="600" fill="#9c3119" text-anchor="start" xml:space="preserve">if you reused it</text><rect x="20" y="222" width="600" height="52" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 222 600 52"><text x="320" y="252.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">A different password for each account: the leak opens nothing else.</text></g></g></svg>