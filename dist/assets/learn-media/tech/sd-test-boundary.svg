<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" role="img" aria-labelledby="t d"><title id="t">Boundary tests</title><desc id="d">A number line split at 50 with tests at 49 and 50.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="318" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Test where the answer changes</text><line x1="40" y1="120" x2="600" y2="120" stroke="#3d4560" stroke-width="3"/><line x1="40" y1="110" x2="40" y2="130" stroke="#3d4560" stroke-width="2"/><text x="40" y="154" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">0</text><line x1="180" y1="110" x2="180" y2="130" stroke="#3d4560" stroke-width="2"/><text x="180" y="154" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">25</text><line x1="314.4" y1="110" x2="314.4" y2="130" stroke="#3d4560" stroke-width="2"/><line x1="320" y1="110" x2="320" y2="130" stroke="#3d4560" stroke-width="2"/><line x1="460" y1="110" x2="460" y2="130" stroke="#3d4560" stroke-width="2"/><text x="460" y="154" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">75</text><line x1="600" y1="110" x2="600" y2="130" stroke="#3d4560" stroke-width="2"/><text x="600" y="154" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle" xml:space="preserve">100</text><text x="308.4" y="154" font-size="16" font-weight="800" fill="#9c3119" text-anchor="end" xml:space="preserve">49</text><text x="326" y="154" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">50</text><rect x="40" y="76" width="274.4" height="24" rx="4" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="40 76 274.4 24"><text x="177.2" y="94" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">Try again</text></g><rect x="320" y="76" width="280" height="24" rx="4" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="320 76 280 24"><text x="460" y="94" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">Pass</text></g><rect x="20" y="178" width="600" height="94" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 178 600 94"><text x="34" y="205.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">test(&quot;50 is a pass&quot;, () =&gt; {</tspan></text><text x="34" y="230.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  expect(grade(50)).toBe(&quot;Pass&quot;);</tspan></text><text x="34" y="255.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">});</tspan></text></g><text x="20" y="298" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Also: empty input, zero, very large values, wrong types.</text></g></svg>