<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" role="img" aria-labelledby="t d"><title id="t">Checking a suspicious voice note</title><desc id="d">Message, stop, call back on a known number.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="232" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Urgent, secret, about money? Call back</text><rect x="20" y="64" width="190" height="84" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 64 190 84"><text x="115" y="89.776" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">“It&#x27;s your uncle.</text><text x="115" y="110.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Send money now,</text><text x="115" y="131.376" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">don&#x27;t tell anyone.”</text></g><line x1="212" y1="106" x2="246" y2="106" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="250" y="76" width="120" height="60" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="250 76 120 60"><text x="310" y="111.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Stop.</text></g><line x1="372" y1="106" x2="406" y2="106" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="410" y="64" width="210" height="84" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="410 64 210 84"><text x="515" y="89.776" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Call them back on</text><text x="515" y="110.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">a number you</text><text x="515" y="131.376" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">already have</text></g><text x="20" y="186" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Never use the number or link in the message itself.</text><text x="20" y="212" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">A family code word helps too.</text></g></svg>