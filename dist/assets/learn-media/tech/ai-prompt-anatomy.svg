<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" width="640" height="332" role="img" aria-labelledby="t d"><title id="t">Anatomy of a prompt</title><desc id="d">Task, context, format and constraint, each with its part of an example prompt.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="332" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Four parts of a useful prompt</text><rect x="20" y="60" width="140" height="46" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 60 140 46"><text x="90" y="87.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Task</text></g><rect x="170" y="60" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 60 450 46"><text x="184" y="87.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">Explain photosynthesis</text></g><rect x="20" y="118" width="140" height="46" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 118 140 46"><text x="90" y="145.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Context</text></g><rect x="170" y="118" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 118 450 46"><text x="184" y="145.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">to a 13-year-old</text></g><rect x="20" y="176" width="140" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 176 140 46"><text x="90" y="203.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Format</text></g><rect x="170" y="176" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 176 450 46"><text x="184" y="203.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">in five short steps, with one everyday example</text></g><rect x="20" y="234" width="140" height="46" rx="10" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 234 140 46"><text x="90" y="261.576" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Constraint</text></g><rect x="170" y="234" width="450" height="46" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="170 234 450 46"><text x="184" y="261.576" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">and end with a question I can test myself on.</text></g><text x="20" y="312" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">Then check it: facts, reasoning, fit — and that any sources exist.</text></g></svg>