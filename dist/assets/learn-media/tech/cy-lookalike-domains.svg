<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" width="640" height="356" role="img" aria-labelledby="t d"><title id="t">Look-alike web addresses</title><desc id="d">One real address and three look-alikes with what gives each away.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="356" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Which one is really ngg-admin.org?</text><rect x="20" y="60" width="360" height="46" rx="6" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="20 60 360 46"><text x="32" y="89" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">ngg-admin.org/login</text></g><text x="394" y="89" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">the real one</text><rect x="20" y="118" width="360" height="46" rx="6" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="20 118 360 46"><text x="32" y="147" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">ngg-adrnin.org/login</text></g><text x="394" y="147" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">rn pretending to be m</text><rect x="20" y="176" width="360" height="46" rx="6" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="20 176 360 46"><text x="32" y="205" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">ngg-admin.org.verify-login.com/</text></g><text x="394" y="205" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">really verify-login.com</text><rect x="20" y="234" width="360" height="46" rx="6" fill="#fde5df" stroke="#9c3119" stroke-width="1.25"/><g data-fit="20 234 360 46"><text x="32" y="263" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">ngg-admin-support.co/login</text></g><text x="394" y="263" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">an extra word</text><text x="20" y="312" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">The real address is the name just before the first single /,</text><text x="20" y="336" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">read from the right. Type important addresses yourself.</text></g></svg>