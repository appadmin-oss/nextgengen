<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-labelledby="t d"><title id="t">Kinds of data</title><desc id="d">Data is categorical (it names a group) or numerical; numerical data is discrete (counted) or continuous (measured).</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="372" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="360" y="40" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">What kind of data is it?</text><rect x="250" y="60" width="220" height="50" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="360" y="92" font-size="18" font-weight="700" fill="#16233f" text-anchor="middle">Data</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="320" y1="112" x2="180" y2="160" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="400" y1="112" x2="540" y2="160" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="70" y="162" width="220" height="56" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="180" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">Categorical</text><text x="180" y="208" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">names a group</text><rect x="430" y="162" width="220" height="56" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="540" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">Numerical</text><text x="540" y="208" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">a count or a measurement</text><text x="180" y="250" font-size="13" font-weight="500" fill="#3d4560" text-anchor="middle">e.g. favourite food, state, yes/no</text><line x1="500" y1="220" x2="440" y2="270" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="580" y1="220" x2="640" y2="270" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="340" y="272" width="190" height="52" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="435" y="296" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Discrete</text><text x="435" y="314" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">counted: 3 siblings</text><rect x="560" y="272" width="150" height="52" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="635" y="296" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Continuous</text><text x="635" y="314" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">measured: 1.62 m</text><text x="706" y="362" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>