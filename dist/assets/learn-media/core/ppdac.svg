<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d"><title id="t">The data investigation cycle (PPDAC)</title><desc id="d">Five steps in a loop: Problem, Plan, Data, Analysis, Conclusion — and the conclusion raises the next question.</desc><rect width="720" height="500" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><line x1="403.9388110528361" y1="116.92341485987743" x2="472.9855141358642" y2="167.08878106825625" stroke="#3d4560" stroke-width="2.5" marker-end="url(#a)"/><line x1="500.14119279177646" y1="250.66536620837883" x2="473.7676990251819" y2="331.8346337916212" stroke="#3d4560" stroke-width="2.5" marker-end="url(#a)"/><line x1="402.67320931643354" y1="383.4878040718663" x2="317.32679068356646" y2="383.4878040718663" stroke="#3d4560" stroke-width="2.5" marker-end="url(#a)"/><line x1="246.2323009748181" y1="331.8346337916212" x2="219.85880720822348" y2="250.66536620837886" stroke="#3d4560" stroke-width="2.5" marker-end="url(#a)"/><line x1="247.01448586413574" y1="167.08878106825625" x2="316.0611889471639" y2="116.92341485987744" stroke="#3d4560" stroke-width="2.5" marker-end="url(#a)"/><rect x="268.0" y="51.0" width="184" height="68" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="360.0" y="79.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">1. Problem</text><text x="360.0" y="101.0" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">What do we want to know?</text><rect x="424.9243251887003" y="165.01219592813368" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="516.9243251887003" y="193.01219592813368" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">2. Plan</text><text x="516.9243251887003" y="215.01219592813368" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">What will we measure, how?</text><rect x="364.98456662825805" y="349.4878040718663" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="456.98456662825805" y="377.4878040718663" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">3. Data</text><text x="456.98456662825805" y="399.4878040718663" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Collect it, tidy it</text><rect x="171.01543337174195" y="349.4878040718663" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="263.01543337174195" y="377.4878040718663" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">4. Analysis</text><text x="263.01543337174195" y="399.4878040718663" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Summaries and charts</text><rect x="111.07567481129965" y="165.0121959281337" width="184" height="68" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="203.07567481129965" y="193.0121959281337" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">5. Conclusion</text><text x="203.07567481129965" y="215.0121959281337" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Answer, and new questions</text><text x="360" y="256" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">PPDAC</text></g></svg>