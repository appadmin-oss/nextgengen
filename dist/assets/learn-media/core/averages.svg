<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="t d"><title id="t">Mean, median and mode with an outlier</title><desc id="d">Eight values, one very large: the mean is pulled to 7 while the median stays at 3.5 and the mode is 3.</desc><rect width="720" height="310" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="19" font-weight="800" fill="#16233f" text-anchor="start">Pocket money a week (₦100s) — eight children</text><line x1="40" y1="230" x2="690" y2="230" stroke="#3d4560" stroke-width="2"/><circle cx="91.0" cy="215" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="111.5" cy="215" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="111.5" cy="195" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="111.5" cy="175" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="132.0" cy="215" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="152.5" cy="215" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="173.0" cy="215" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><circle cx="665.0" cy="215" r="8" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text x="50.0" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">0</text><text x="152.5" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">5</text><text x="255.0" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">10</text><text x="357.5" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">15</text><text x="460.0" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">20</text><text x="562.5" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">25</text><text x="665.0" y="252" font-size="12" font-weight="500" fill="#3d4560" text-anchor="middle">30</text><line x1="111.5" y1="68" x2="111.5" y2="225" stroke="#1d6b30" stroke-width="2" stroke-dasharray="5 4"/><text x="117.5" y="80" font-size="14" font-weight="700" fill="#1d6b30" text-anchor="start">Mode 3</text><line x1="121.75" y1="93" x2="121.75" y2="225" stroke="#16233f" stroke-width="2" stroke-dasharray="5 4"/><text x="127.75" y="105" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Median 3.5</text><line x1="193.5" y1="118" x2="193.5" y2="225" stroke="#ef6b4d" stroke-width="2" stroke-dasharray="5 4"/><text x="199.5" y="130" font-size="14" font-weight="700" fill="#a3361f" text-anchor="start">Mean 7</text><text x="665.0" y="170" font-size="13" font-weight="700" fill="#a3361f" text-anchor="middle">one outlier</text><text x="30" y="290" font-size="14.5" font-weight="600" fill="#16233f" text-anchor="start">One child on ₦3,000 drags the MEAN up to 7; the MEDIAN (3.5) still describes a typical child.</text></g></svg>