<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 410" width="810" height="410" role="img" aria-labelledby="t d"><title id="t">Units of data storage</title><desc id="d">Bit, byte, kilobyte, megabyte, gigabyte, terabyte: each about a thousand times the one before, with an everyday example of each.</desc><rect width="810" height="410" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">How big is data? Each step is about 1,000 times the last</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect x="24" y="260" width="116" height="40" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="82.0" y="282" font-size="15" font-weight="800" fill="#16233f" text-anchor="middle">1 bit</text><text x="82.0" y="322" font-size="11.5" font-weight="700" fill="#3d4560" text-anchor="middle">1 bit</text><text x="82.0" y="340" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">a single 0 or 1</text><rect x="154" y="230" width="116" height="70" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="212.0" y="252" font-size="15" font-weight="800" fill="#16233f" text-anchor="middle">1 byte</text><text x="212.0" y="322" font-size="11.5" font-weight="700" fill="#3d4560" text-anchor="middle">1 byte = 8 bits</text><text x="212.0" y="340" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">one letter: A</text><rect x="284" y="200" width="116" height="100" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="342.0" y="222" font-size="15" font-weight="800" fill="#16233f" text-anchor="middle">1 KB</text><text x="342.0" y="322" font-size="11.5" font-weight="700" fill="#3d4560" text-anchor="middle">1 KB ≈ 1,000 bytes</text><text x="342.0" y="340" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">a short text message</text><rect x="414" y="170" width="116" height="130" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="472.0" y="192" font-size="15" font-weight="800" fill="#16233f" text-anchor="middle">1 MB</text><text x="472.0" y="322" font-size="11.5" font-weight="700" fill="#3d4560" text-anchor="middle">1 MB ≈ 1,000 KB</text><text x="472.0" y="340" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">a phone photo is</text><text x="472.0" y="356" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">2–5 MB</text><rect x="544" y="140" width="116" height="160" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="602.0" y="162" font-size="15" font-weight="800" fill="#16233f" text-anchor="middle">1 GB</text><text x="602.0" y="322" font-size="11.5" font-weight="700" fill="#3d4560" text-anchor="middle">1 GB ≈ 1,000 MB</text><text x="602.0" y="340" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">an hour of video</text><rect x="674" y="110" width="116" height="190" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="732.0" y="132" font-size="15" font-weight="800" fill="#16233f" text-anchor="middle">1 TB</text><text x="732.0" y="322" font-size="11.5" font-weight="700" fill="#3d4560" text-anchor="middle">1 TB ≈ 1,000 GB</text><text x="732.0" y="340" font-size="11.5" font-weight="500" fill="#3d4560" text-anchor="middle">a big external drive</text><text x="24" y="392" font-size="14" font-weight="600" fill="#3d4560" text-anchor="start">Phones and laptops show sizes this way: check before you download, copy or send.</text></g></svg>