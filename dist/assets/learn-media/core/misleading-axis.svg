<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d"><title id="t">A truncated axis exaggerates</title><desc id="d">The same three attendance figures (96, 98, 97) drawn twice: from 95 the bars look wildly different; from 0 they are nearly equal.</desc><rect width="720" height="350" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="160" y="40" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Axis starts at 95</text><rect x="60" y="225.0" width="56" height="55.0" fill="#20b2c9" stroke="#16233f"/><text x="88" y="300" font-size="13" font-weight="600" fill="#16233f" text-anchor="middle">Mon</text><rect x="140" y="115.0" width="56" height="165.0" fill="#20b2c9" stroke="#16233f"/><text x="168" y="300" font-size="13" font-weight="600" fill="#16233f" text-anchor="middle">Tue</text><rect x="220" y="170.0" width="56" height="110.0" fill="#20b2c9" stroke="#16233f"/><text x="248" y="300" font-size="13" font-weight="600" fill="#16233f" text-anchor="middle">Wed</text><line x1="50" y1="280" x2="310" y2="280" stroke="#3d4560"/><line x1="50" y1="60" x2="50" y2="280" stroke="#3d4560"/><text x="44" y="284" font-size="12" font-weight="500" fill="#3d4560" text-anchor="end">95</text><text x="44" y="66" font-size="12" font-weight="500" fill="#3d4560" text-anchor="end">99</text><text x="160" y="330" font-size="13" font-weight="600" fill="#3d4560" text-anchor="middle">Looks like a huge rise</text><text x="520" y="40" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Axis starts at 0</text><rect x="420" y="68.80000000000001" width="56" height="211.2" fill="#20b2c9" stroke="#16233f"/><text x="448" y="300" font-size="13" font-weight="600" fill="#16233f" text-anchor="middle">Mon</text><rect x="500" y="64.4" width="56" height="215.6" fill="#20b2c9" stroke="#16233f"/><text x="528" y="300" font-size="13" font-weight="600" fill="#16233f" text-anchor="middle">Tue</text><rect x="580" y="66.6" width="56" height="213.4" fill="#20b2c9" stroke="#16233f"/><text x="608" y="300" font-size="13" font-weight="600" fill="#16233f" text-anchor="middle">Wed</text><line x1="410" y1="280" x2="670" y2="280" stroke="#3d4560"/><line x1="410" y1="60" x2="410" y2="280" stroke="#3d4560"/><text x="404" y="284" font-size="12" font-weight="500" fill="#3d4560" text-anchor="end">0</text><text x="404" y="66" font-size="12" font-weight="500" fill="#3d4560" text-anchor="end">100</text><text x="520" y="330" font-size="13" font-weight="600" fill="#3d4560" text-anchor="middle">Really: almost no change</text></g></svg>