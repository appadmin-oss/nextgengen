<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d"><title id="t">Typographic hierarchy</title><desc id="d">A flyer&#x27;s text at five levels, from a large bold headline down to a small caption, so the eye reads them in order.</desc><rect width="720" height="300" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="40" y="70" font-size="40" font-weight="800" fill="#16233f" text-anchor="start">NGG Saturday Showcase</text><text x="40" y="112" font-size="22" font-weight="600" fill="#3d4560" text-anchor="start">Music, code and art by the Club&#x27;s members</text><text x="40" y="170" font-size="17" font-weight="700" fill="#0b6e80" text-anchor="start">Saturday 14 March · 11am · Egbeda Centre</text><text x="40" y="215" font-size="15" font-weight="400" fill="#16233f" text-anchor="start">Come and see what a term of practice sounds like. Free entry; bring</text><text x="40" y="237" font-size="15" font-weight="400" fill="#16233f" text-anchor="start">your family. Refreshments from the catering class.</text><text x="40" y="280" font-size="12" font-weight="400" fill="#3d4560" text-anchor="start">Photo: the 2026 junior band</text><text x="700" y="62" font-size="13" font-weight="700" fill="#a3361f" text-anchor="end">1 Headline — biggest, boldest</text><text x="700" y="104" font-size="13" font-weight="700" fill="#a3361f" text-anchor="end">2 Subheading — supports it</text><text x="700" y="162" font-size="13" font-weight="700" fill="#a3361f" text-anchor="end">3 Key facts — colour or weight</text><text x="700" y="218" font-size="13" font-weight="700" fill="#a3361f" text-anchor="end">4 Body — 15–16 px, easy to read</text><text x="700" y="272" font-size="13" font-weight="700" fill="#a3361f" text-anchor="end">5 Caption — smallest</text></g></svg>