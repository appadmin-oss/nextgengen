<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d"><title id="t">A three-column layout grid</title><desc id="d">A page divided into three columns with gutters; the headline spans three, a photo two, a sidebar one, and two stories one each.</desc><rect width="720" height="480" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="36" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">A 3-column grid: everything lines up with something</text><rect x="30" y="54" width="660" height="400" fill="#ffffff" stroke="#16233f" stroke-width="2"/><rect x="50" y="74" width="193" height="360" fill="#20b2c9" opacity=".12"/><rect x="263" y="74" width="193" height="360" fill="#20b2c9" opacity=".12"/><rect x="476" y="74" width="193" height="360" fill="#20b2c9" opacity=".12"/><rect x="50" y="74" width="619" height="70" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="360" y="116" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">Headline spans all three columns</text><rect x="50" y="160" width="406" height="160" rx="4" fill="#f3f5fa" stroke="#3d4560" stroke-width="1.5"/><text x="253" y="245" font-size="15" font-weight="600" fill="#16233f" text-anchor="middle">Photo spans two</text><rect x="476" y="160" width="193" height="274" rx="4" fill="#f3f5fa" stroke="#3d4560" stroke-width="1.5"/><text x="572" y="300" font-size="15" font-weight="600" fill="#16233f" text-anchor="middle">Sidebar</text><rect x="50" y="336" width="193" height="98" rx="4" fill="#f3f5fa" stroke="#3d4560" stroke-width="1.5"/><text x="146" y="390" font-size="15" font-weight="600" fill="#16233f" text-anchor="middle">Story A</text><rect x="263" y="336" width="193" height="98" rx="4" fill="#f3f5fa" stroke="#3d4560" stroke-width="1.5"/><text x="359" y="390" font-size="15" font-weight="600" fill="#16233f" text-anchor="middle">Story B</text></g></svg>