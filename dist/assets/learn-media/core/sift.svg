<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" role="img" aria-labelledby="t d"><title id="t">Checking a source: SIFT</title><desc id="d">Stop, investigate the source, find better coverage, and trace claims back to the original.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="252" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="21" font-weight="800" fill="#16233f" text-anchor="start">Before you believe or share it: S·I·F·T</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect x="30" y="64" width="156" height="110" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="108" y="100" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Stop</text><text x="108" y="128" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Do I know this site</text><text x="108" y="146" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">or person?</text><line x1="188" y1="119" x2="200" y2="119" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="202" y="64" width="156" height="110" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="280" y="100" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Investigate</text><text x="280" y="128" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Who made it? When?</text><text x="280" y="146" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Why?</text><line x1="360" y1="119" x2="372" y2="119" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="374" y="64" width="156" height="110" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="452" y="100" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Find better</text><text x="452" y="128" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">What do other</text><text x="452" y="146" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">trusted sources say?</text><line x1="532" y1="119" x2="544" y2="119" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="546" y="64" width="156" height="110" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="624" y="100" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Trace</text><text x="624" y="128" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">Go back to the</text><text x="624" y="146" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">original data or</text><text x="624" y="164" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">quote</text><text x="30" y="210" font-size="14" font-weight="600" fill="#3d4560" text-anchor="start">A screenshot is not a source. A number with no source, date or link is a claim, not a fact.</text><text x="706" y="242" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>