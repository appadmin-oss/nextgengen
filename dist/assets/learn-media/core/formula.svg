<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" role="img" aria-labelledby="t d"><title id="t">Reading a formula</title><desc id="d">Every formula starts with =, then a function such as SUM, then the range of cells it works on in brackets.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="322" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Reading a formula</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect x="60" y="70" width="66" height="70" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="93.0" y="117" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">=</text><text x="93.0" y="166" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">starts every formula</text><rect x="196" y="70" width="118" height="70" rx="10" fill="#20b2c9" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="255.0" y="117" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">SUM</text><text x="255.0" y="166" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">the function</text><text x="255.0" y="184" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">what to do</text><rect x="384" y="70" width="222" height="70" rx="10" fill="#f6c9bd" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="495.0" y="117" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">(B2:B5)</text><text x="495.0" y="166" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">the range</text><text x="495.0" y="184" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="middle">B2 down to B5</text><text x="30" y="220" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Useful functions:  SUM  AVERAGE  MIN  MAX  COUNT  COUNTIF  ROUND</text><text x="30" y="250" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">Copy a formula down and its cell references move with it: B6&#x27;s =SUM(B2:B5) becomes C6&#x27;s =SUM(C2:C5).</text><text x="30" y="274" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">Put a $ in front to fix one: =B2*$E$1 always uses E1 (an ABSOLUTE reference).</text><text x="706" y="312" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>