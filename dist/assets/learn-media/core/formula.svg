<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d"><title id="t">Reading a formula</title><desc id="d">Every formula starts with =, then a function such as SUM, then the range of cells it works on in brackets.</desc><rect width="720" height="300" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="22" font-weight="800" fill="#16233f" text-anchor="start">Reading a formula</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect x="60" y="70" width="66" height="70" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="93.0" y="117" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">=</text><text x="93.0" y="168" font-size="13" font-weight="600" fill="#3d4560" text-anchor="middle">starts every formula</text><rect x="152" y="70" width="118" height="70" rx="10" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><text x="211.0" y="117" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">SUM</text><text x="211.0" y="168" font-size="13" font-weight="600" fill="#3d4560" text-anchor="middle">the function: what to do</text><rect x="296" y="70" width="222" height="70" rx="10" fill="#f6c9bd" stroke="#16233f" stroke-width="1.5"/><text x="407.0" y="117" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">(B2:B5)</text><text x="407.0" y="168" font-size="13" font-weight="600" fill="#3d4560" text-anchor="middle">the range: B2 down to B5</text><text x="30" y="220" font-size="15" font-weight="700" fill="#16233f" text-anchor="start">Useful functions:  SUM  AVERAGE  MIN  MAX  COUNT  COUNTIF  ROUND</text><text x="30" y="250" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">Copy a formula down and its cell references move with it: B6&#x27;s =SUM(B2:B5) becomes C6&#x27;s =SUM(C2:C5).</text><text x="30" y="274" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">Put a $ in front to fix one: =B2*$E$1 always uses E1 (an ABSOLUTE reference).</text></g></svg>