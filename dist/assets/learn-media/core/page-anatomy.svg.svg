<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620" role="img" aria-labelledby="t d"><title id="t">Bleed, trim and safe area</title><desc id="d">A printed page: the bleed runs 3 mm past the trim line where the paper is cut; text and logos stay inside the safe area.</desc><rect width="760" height="620" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="60" y="40" width="400" height="540" fill="#ef6b4d" opacity=".25"/><rect x="78" y="58" width="364" height="504" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><rect x="106" y="86" width="308" height="448" fill="none" stroke="#20b2c9" stroke-width="2" stroke-dasharray="8 6"/><text x="260" y="300" font-size="20" font-weight="700" fill="#3d4560" text-anchor="middle">Your design</text><text x="490" y="80" font-size="17" font-weight="800" fill="#a3361f" text-anchor="start">Bleed (3 mm)</text><text x="490" y="102" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">background colour runs into it</text><text x="490" y="220" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Trim line</text><text x="490" y="242" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">where the paper is cut</text><text x="490" y="360" font-size="17" font-weight="800" fill="#0b6e80" text-anchor="start">Safe area</text><text x="490" y="382" font-size="13.5" font-weight="500" fill="#3d4560" text-anchor="start">keep text and logos inside</text></g></svg>