<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d"><title id="t">RGB for screens, CMYK for print</title><desc id="d">Screens mix red, green and blue light; printers mix cyan, magenta, yellow and black ink, so some bright screen colours cannot print.</desc><rect width="720" height="320" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="180" y="40" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Screen: RGB (light)</text><text x="540" y="40" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Print: CMYK (ink)</text><circle cx="150" cy="120" r="55" fill="#ff3b30" opacity=".55"/><circle cx="210" cy="120" r="55" fill="#34c759" opacity=".55"/><circle cx="180" cy="170" r="55" fill="#0a84ff" opacity=".55"/><circle cx="510" cy="120" r="55" fill="#00b7eb" opacity=".55"/><circle cx="570" cy="120" r="55" fill="#ff00a0" opacity=".55"/><circle cx="540" cy="170" r="55" fill="#ffe600" opacity=".55"/><text x="180" y="262" font-size="14" font-weight="600" fill="#3d4560" text-anchor="middle">Red + green + blue light → white</text><text x="540" y="262" font-size="14" font-weight="600" fill="#3d4560" text-anchor="middle">Cyan + magenta + yellow (+ black)</text><text x="360" y="300" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Design for print in CMYK, or check a proof: bright screen colours print duller.</text></g></svg>