<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 332" width="860" height="332" role="img" aria-labelledby="t d"><title id="t">The parts of a spreadsheet</title><desc id="d">Columns are letters, rows are numbers, a cell is where they meet (B6), and the formula bar shows what a cell calculates.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="860" height="332" fill="#ffffff"/><rect width="860" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="36" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The parts of a spreadsheet</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect x="30" y="54" width="490" height="34" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="42" y="76" font-size="14" font-weight="600" fill="#3d4560" text-anchor="start">fx   =SUM(B2:B5)</text><rect x="30" y="100" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50.0" y="119" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle"></text><rect x="70" y="100" width="150" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="145.0" y="119" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">A</text><rect x="220" y="100" width="150" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="295.0" y="119" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">B</text><rect x="370" y="100" width="150" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="445.0" y="119" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="30" y="128" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50" y="147" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">1</text><rect x="70" y="128" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="78" y="147" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Item</text><rect x="220" y="128" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="228" y="147" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">₦</text><rect x="370" y="128" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="378" y="147" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Note</text><rect x="30" y="156" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50" y="175" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">2</text><rect x="70" y="156" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="78" y="175" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">Bread</text><rect x="220" y="156" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="228" y="175" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">900</text><rect x="370" y="156" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="378" y="175" font-size="13" font-weight="500" fill="#16233f" text-anchor="start"></text><rect x="30" y="184" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50" y="203" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">3</text><rect x="70" y="184" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="78" y="203" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">Eggs</text><rect x="220" y="184" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="228" y="203" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">1,500</text><rect x="370" y="184" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="378" y="203" font-size="13" font-weight="500" fill="#16233f" text-anchor="start"></text><rect x="30" y="212" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50" y="231" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">4</text><rect x="70" y="212" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="78" y="231" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">Rice</text><rect x="220" y="212" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="228" y="231" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">2,400</text><rect x="370" y="212" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="378" y="231" font-size="13" font-weight="500" fill="#16233f" text-anchor="start"></text><rect x="30" y="240" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50" y="259" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">5</text><rect x="70" y="240" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="78" y="259" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">Oil</text><rect x="220" y="240" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="228" y="259" font-size="13" font-weight="500" fill="#16233f" text-anchor="start">1,800</text><rect x="370" y="240" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="378" y="259" font-size="13" font-weight="500" fill="#16233f" text-anchor="start"></text><rect x="30" y="268" width="40" height="28" fill="#eef1f8" stroke="#c9cedb"/><text x="50" y="287" font-size="13" font-weight="700" fill="#16233f" text-anchor="middle">6</text><rect x="70" y="268" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="78" y="287" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Total</text><rect x="220" y="268" width="150" height="28" fill="#e8f0fe" stroke="#1a56c5" stroke-width="2"/><text x="228" y="287" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">6,600</text><rect x="370" y="268" width="150" height="28" fill="#fff" stroke="#c9cedb" stroke-width="1"/><text x="378" y="287" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">←SUM</text><circle cx="552" cy="116" r="10" fill="#f5b026" stroke="#16233f"/><text x="552" y="121" font-size="11.5" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="570" y="120" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Column = a letter, runs DOWN</text><circle cx="552" cy="156" r="10" fill="#f5b026" stroke="#16233f"/><text x="552" y="161" font-size="11.5" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="570" y="160" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Row = a number, runs ACROSS</text><circle cx="552" cy="196" r="10" fill="#f5b026" stroke="#16233f"/><text x="552" y="201" font-size="11.5" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="570" y="200" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Cell = where they meet: B6</text><circle cx="552" cy="236" r="10" fill="#f5b026" stroke="#16233f"/><text x="552" y="241" font-size="11.5" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text x="570" y="240" font-size="13" font-weight="700" fill="#16233f" text-anchor="start">Formula bar = what the cell holds</text><text x="846" y="322" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>