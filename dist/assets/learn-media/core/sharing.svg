<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" width="720" height="342" role="img" aria-labelledby="t d"><title id="t">Sharing permissions</title><desc id="d">Viewer, commenter and editor access, and the difference between sharing with specific people and with anyone who has the link.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="720" height="342" fill="#ffffff"/><rect width="720" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="21" font-weight="800" fill="#16233f" text-anchor="start">Sharing a file: who, and how much</text><rect x="30" y="62" width="210" height="80" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="135" y="96" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Viewer</text><text x="135" y="120" font-size="13" font-weight="500" fill="#3d4560" text-anchor="middle">can read it</text><rect x="258" y="62" width="210" height="80" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="363" y="96" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Commenter</text><text x="363" y="120" font-size="13" font-weight="500" fill="#3d4560" text-anchor="middle">can read and suggest</text><rect x="486" y="62" width="210" height="80" rx="12" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="591" y="96" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Editor</text><text x="591" y="120" font-size="13" font-weight="500" fill="#3d4560" text-anchor="middle">can change and delete</text><rect x="30" y="160" width="320" height="120" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="46" y="188" font-size="15" font-weight="800" fill="#16233f" text-anchor="start">Specific people</text><text x="46" y="212" font-size="13" font-weight="500" fill="#3d4560" text-anchor="start">only the emails you add</text><text x="46" y="236" font-size="13" font-weight="700" fill="#1d6b30" text-anchor="start">✓ the safe default</text><rect x="370" y="160" width="320" height="120" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="386" y="188" font-size="15" font-weight="800" fill="#16233f" text-anchor="start">Anyone with the link</text><text x="386" y="212" font-size="13" font-weight="500" fill="#3d4560" text-anchor="start">forwarded links travel far</text><text x="386" y="236" font-size="13" font-weight="700" fill="#8c2a14" text-anchor="start">never for personal data</text><text x="30" y="306" font-size="14" font-weight="600" fill="#3d4560" text-anchor="start">Give the least access that does the job — viewer unless they must edit.</text><text x="706" y="332" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>