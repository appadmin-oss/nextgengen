<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 287" width="700" height="287" role="img" aria-labelledby="t d"><title id="t">Tidy data</title><desc id="d">A table with a header row and one row per person: Name, Age, Centre, Hours.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter></defs><rect width="700" height="287" fill="#ffffff"/><rect width="700" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="36" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Tidy data: one row per person, one column per thing measured</text><rect x="30" y="54" width="160" height="40" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="110" y="80" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Name</text><rect x="190" y="54" width="160" height="40" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="270" y="80" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Age</text><rect x="350" y="54" width="160" height="40" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="430" y="80" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Centre</text><rect x="510" y="54" width="160" height="40" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="590" y="80" font-size="15" font-weight="700" fill="#16233f" text-anchor="middle">Hours</text><rect x="30" y="94" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="110" y="120" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">Ada</text><rect x="190" y="94" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="270" y="120" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">12</text><rect x="350" y="94" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="430" y="120" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">Egbeda</text><rect x="510" y="94" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="590" y="120" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">3</text><rect x="30" y="134" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="110" y="160" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">Tobi</text><rect x="190" y="134" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="270" y="160" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">14</text><rect x="350" y="134" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="430" y="160" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">Ikeja</text><rect x="510" y="134" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="590" y="160" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">5</text><rect x="30" y="174" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="110" y="200" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">Zainab</text><rect x="190" y="174" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="270" y="200" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">13</text><rect x="350" y="174" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="430" y="200" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">Egbeda</text><rect x="510" y="174" width="160" height="40" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="590" y="200" font-size="15" font-weight="500" fill="#16233f" text-anchor="middle">4</text><text x="30" y="245" font-size="14" font-weight="600" fill="#3d4560" text-anchor="start">No merged cells, no totals in the middle, one unit per column (hours, not &quot;3 hrs&quot;).</text><text x="686" y="277" font-size="11" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>