<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="t d"><title id="t">Common file types</title><desc id="d">Documents, spreadsheets, CSV, PDF, JPG, PNG and MP4, and what each one is for.</desc><rect width="720" height="340" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="21" font-weight="800" fill="#16233f" text-anchor="start">File types: pick the one for the job</text><rect x="30" y="60" width="150" height="30" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="105" y="80" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.docx / .odt</text><text x="196" y="80" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">a document you will keep editing</text><rect x="30" y="98" width="150" height="30" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="105" y="118" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.xlsx / .ods</text><text x="196" y="118" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">a spreadsheet, with its formulas</text><rect x="30" y="136" width="150" height="30" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="105" y="156" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.csv</text><text x="196" y="156" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">plain table data — any app can open it</text><rect x="30" y="174" width="150" height="30" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="105" y="194" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.pdf</text><text x="196" y="194" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">a finished page that looks the same everywhere</text><rect x="30" y="212" width="150" height="30" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="105" y="232" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.jpg</text><text x="196" y="232" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">photos (small, slightly lossy)</text><rect x="30" y="250" width="150" height="30" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="105" y="270" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.png</text><text x="196" y="270" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">screenshots, logos, sharp edges</text><rect x="30" y="288" width="150" height="30" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="105" y="308" font-size="14" font-weight="800" fill="#16233f" text-anchor="middle">.mp4</text><text x="196" y="308" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">video</text></g></svg>