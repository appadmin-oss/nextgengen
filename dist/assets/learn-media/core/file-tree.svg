<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="t d"><title id="t">Files and folders</title><desc id="d">A folder tree, the parts of a good file name (date, description, version, extension), and a file&#x27;s path.</desc><rect width="720" height="360" fill="#ffffff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="30" y="40" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Files live in folders; a file&#x27;s name says what it is</text><rect x="40" y="59" width="18" height="13" rx="2" fill="#f5b026" stroke="#16233f"/><text x="66" y="71" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Documents</text><path d="M52 82 V98 H64" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="68" y="89" width="18" height="13" rx="2" fill="#f5b026" stroke="#16233f"/><text x="94" y="101" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">School</text><path d="M80 112 V128 H92" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="98" y="117" width="13" height="16" rx="1" fill="#fff" stroke="#16233f"/><text x="122" y="131" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">2026-03-14_maths-homework_v2.docx</text><path d="M80 142 V158 H92" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="96" y="149" width="18" height="13" rx="2" fill="#f5b026" stroke="#16233f"/><text x="122" y="161" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Science project</text><path d="M52 172 V188 H64" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="68" y="179" width="18" height="13" rx="2" fill="#f5b026" stroke="#16233f"/><text x="94" y="191" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Club</text><path d="M80 202 V218 H92" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="96" y="209" width="18" height="13" rx="2" fill="#f5b026" stroke="#16233f"/><text x="122" y="221" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Data Appreciation</text><path d="M108 232 V248 H120" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="126" y="237" width="13" height="16" rx="1" fill="#fff" stroke="#16233f"/><text x="150" y="251" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">lunch-survey.xlsx</text><path d="M108 262 V278 H120" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="126" y="267" width="13" height="16" rx="1" fill="#fff" stroke="#16233f"/><text x="150" y="281" font-size="14" font-weight="500" fill="#16233f" text-anchor="start">lunch-chart.png</text><path d="M52 292 V308 H64" fill="none" stroke="#c9cedb" stroke-width="1.5"/><rect x="68" y="299" width="18" height="13" rx="2" fill="#f5b026" stroke="#16233f"/><text x="94" y="311" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">Photos</text><rect x="420" y="70" width="280" height="150" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="436" y="98" font-size="15" font-weight="800" fill="#16233f" text-anchor="start">Anatomy of a file name</text><text x="436" y="128" font-size="12.5" font-weight="700" fill="#16233f" text-anchor="start">2026-03-14_maths-homework_v2.docx</text><text x="436" y="154" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="start">date first → sorts in order</text><text x="436" y="174" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="start">what it is, which version</text><text x="436" y="194" font-size="12.5" font-weight="700" fill="#ef6b4d" text-anchor="start">.docx = the EXTENSION: the file type</text><text x="436" y="212" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="start">and which app opens it</text><rect x="420" y="236" width="280" height="96" rx="12" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><text x="436" y="262" font-size="14" font-weight="700" fill="#16233f" text-anchor="start">A path is the address:</text><text x="436" y="286" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="start">Documents › Club ›</text><text x="436" y="306" font-size="12.5" font-weight="500" fill="#3d4560" text-anchor="start">Data Appreciation › lunch-survey.xlsx</text></g></svg>