<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 321" width="640" height="321" role="img" aria-labelledby="t d"><title id="t">Dye families</title><desc id="d">Indigo and other vat dyes fix by oxidising in air and are very fast; natural dyes like camwood need a mordant such as alum; reactive dyes fix with alkali, heat and time; direct dyes wash out more.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="321" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Dye families and what fixes them</text><rect x="24.0" y="60.0" width="190.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Family</text><rect x="214.0" y="60.0" width="230.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Fixed by</text><rect x="444.0" y="60.0" width="172.0" height="34.0" rx="0" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1"/><text x="452.0" y="83.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Wash-fast?</text><rect x="24.0" y="94.0" width="190.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Indigo (vat)</text><rect x="214.0" y="94.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">air, then washing</text><rect x="444.0" y="94.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="452.0" y="117.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">very</text><rect x="24.0" y="128.0" width="190.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Natural: camwood</text><rect x="214.0" y="128.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">a mordant, often alum</text><rect x="444.0" y="128.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="452.0" y="151.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">fair</text><rect x="24.0" y="162.0" width="190.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Reactive</text><rect x="214.0" y="162.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">alkali, heat, time</text><rect x="444.0" y="162.0" width="172.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="452.0" y="185.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">very, if fixed</text><rect x="24.0" y="196.0" width="190.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="32.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Direct</text><rect x="214.0" y="196.0" width="230.0" height="34.0" rx="0" fill="#ffffff" stroke="#c9cedb" stroke-width="1"/><text x="222.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">—</text><rect x="444.0" y="196.0" width="172.0" height="34.0" rx="0" fill="#fde5df" stroke="#c9cedb" stroke-width="1"/><text x="452.0" y="219.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">washes out more</text><text x="24.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The wash test: clear water means the dye is fixed; coloured water</text><text x="24.0" y="281.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">means loose dye. Rinse until clear before selling anything.</text><text x="624.0" y="311.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>