<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" width="640" height="365" role="img" aria-labelledby="t d"><title id="t">Building depth with dips</title><desc id="d">Five swatches from one dip (pale blue) through two, four and six to many dips (near-black blue), each with a pale resisted square — contrast increases with every dip.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="365" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Each dip adds depth; the resist stays pale</text><rect x="24.0" y="60.0" width="108.0" height="120.0" rx="4" fill="#cfe0f3" stroke="#16233f" stroke-width="1.5"/><rect x="58.0" y="100.0" width="40.0" height="40.0" rx="2" fill="#f4f1ea" stroke="#3d4560" stroke-width="1"/><text x="78.0" y="206.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">1 dip</text><rect x="144.0" y="60.0" width="108.0" height="120.0" rx="4" fill="#8fb3dd" stroke="#16233f" stroke-width="1.5"/><rect x="178.0" y="100.0" width="40.0" height="40.0" rx="2" fill="#f4f1ea" stroke="#3d4560" stroke-width="1"/><text x="198.0" y="206.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">2 dips</text><rect x="264.0" y="60.0" width="108.0" height="120.0" rx="4" fill="#4f79b8" stroke="#16233f" stroke-width="1.5"/><rect x="298.0" y="100.0" width="40.0" height="40.0" rx="2" fill="#f4f1ea" stroke="#3d4560" stroke-width="1"/><text x="318.0" y="206.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">4 dips</text><rect x="384.0" y="60.0" width="108.0" height="120.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><rect x="418.0" y="100.0" width="40.0" height="40.0" rx="2" fill="#f4f1ea" stroke="#3d4560" stroke-width="1"/><text x="438.0" y="206.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">6 dips</text><rect x="504.0" y="60.0" width="108.0" height="120.0" rx="4" fill="#16294f" stroke="#16233f" stroke-width="1.5"/><rect x="538.0" y="100.0" width="40.0" height="40.0" rx="2" fill="#f4f1ea" stroke="#3d4560" stroke-width="1"/><text x="558.0" y="206.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">many dips</text><line x1="40.0" y1="236.0" x2="600.0" y2="236.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="320.0" y="264.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">contrast between dyed and resisted areas grows</text><text x="24.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A dye log makes it repeatable: date, cloth, resist, number of dips,</text><text x="24.0" y="325.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">minutes per dip and in air, the vat&#x27;s condition, and a cut sample.</text><text x="624.0" y="355.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>