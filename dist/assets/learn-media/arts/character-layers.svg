<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 465" width="640" height="465" role="img" aria-labelledby="t d"><title id="t">Character layers</title><desc id="d">Five layers of a character: facts from the script, questions you answer yourself, physicality, voice, and one specific detail such as a market woman who counts her change twice.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="465" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Build a character in layers</text><rect x="24.0" y="60.0" width="592.0" height="67.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="87.0" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">1 Facts from the script</text><text x="36.0" y="112.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">age, job, family, situation</text><rect x="48.0" y="124.0" width="544.0" height="67.0" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="60.0" y="150.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">2 Questions you answer</text><text x="60.0" y="176.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">where they grew up, what they fear</text><rect x="72.0" y="188.0" width="496.0" height="67.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="84.0" y="214.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">3 Physicality</text><text x="84.0" y="240.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">which part of the body leads</text><rect x="96.0" y="252.0" width="448.0" height="67.0" rx="10" fill="#eee6f6" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="108.0" y="278.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">4 Voice</text><text x="108.0" y="304.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">pitch, pace, volume, rhythm</text><rect x="120.0" y="316.0" width="400.0" height="67.0" rx="10" fill="#f5b026" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="132.0" y="342.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">5 One specific detail</text><text x="132.0" y="368.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">counts her change twice</text><text x="24.0" y="404.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Test it by hot-seating: answer classmates&#x27; questions instantly, in</text><text x="24.0" y="425.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">character. The gaps show where to work.</text><text x="624.0" y="455.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>