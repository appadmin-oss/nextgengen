<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 381" width="640" height="381" role="img" aria-labelledby="t d"><title id="t">Measuring and marking</title><desc id="d">Reading a rule from directly above gives the true measurement; from an angle (parallax) it shifts. Mark the waste side of a line with a cross and cut on that side.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="381" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Read straight on; mark the waste side</text><rect x="60.0" y="100.0" width="520.0" height="40.0" rx="3" fill="#e8ecf4" stroke="#16233f" stroke-width="1.5"/><line x1="70.0" y1="100.0" x2="70.0" y2="116.0" stroke="#16233f" stroke-width="1.5"/><line x1="89.0" y1="100.0" x2="89.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="108.0" y1="100.0" x2="108.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="127.0" y1="100.0" x2="127.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="146.0" y1="100.0" x2="146.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="165.0" y1="100.0" x2="165.0" y2="116.0" stroke="#16233f" stroke-width="1.5"/><line x1="184.0" y1="100.0" x2="184.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="203.0" y1="100.0" x2="203.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="222.0" y1="100.0" x2="222.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="241.0" y1="100.0" x2="241.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="260.0" y1="100.0" x2="260.0" y2="116.0" stroke="#16233f" stroke-width="1.5"/><line x1="279.0" y1="100.0" x2="279.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="298.0" y1="100.0" x2="298.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="317.0" y1="100.0" x2="317.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="336.0" y1="100.0" x2="336.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="355.0" y1="100.0" x2="355.0" y2="116.0" stroke="#16233f" stroke-width="1.5"/><line x1="374.0" y1="100.0" x2="374.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="393.0" y1="100.0" x2="393.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="412.0" y1="100.0" x2="412.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="431.0" y1="100.0" x2="431.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="450.0" y1="100.0" x2="450.0" y2="116.0" stroke="#16233f" stroke-width="1.5"/><line x1="469.0" y1="100.0" x2="469.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="488.0" y1="100.0" x2="488.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="507.0" y1="100.0" x2="507.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="526.0" y1="100.0" x2="526.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="545.0" y1="100.0" x2="545.0" y2="116.0" stroke="#16233f" stroke-width="1.5"/><line x1="564.0" y1="100.0" x2="564.0" y2="109.0" stroke="#16233f" stroke-width="1.5"/><line x1="260.0" y1="50.0" x2="260.0" y2="100.0" stroke="#1d6b30" stroke-width="3"/><text x="268.0" y="62.0" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start">eye directly above: true reading</text><line x1="200.0" y1="50.0" x2="236.0" y2="100.0" stroke="#9c3119" stroke-width="2.5" stroke-dasharray="6 4"/><text x="192.0" y="62.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">at an angle: shifted</text><rect x="60.0" y="170.0" width="520.0" height="90.0" rx="0" fill="#f4ead2" stroke="#16233f" stroke-width="1.5"/><line x1="360.0" y1="170.0" x2="360.0" y2="260.0" stroke="#16233f" stroke-width="1.5"/><text x="470.0" y="222.0" font-size="18" font-weight="800" fill="#9c3119" text-anchor="middle">✕ waste</text><text x="210.0" y="222.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">keep</text><text x="360.0" y="286.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">cut on the waste side of the line</text><text x="24.0" y="320.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Steel rule, sharp hard pencil, set square from a true edge, millimetres.</text><text x="24.0" y="341.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Within 1 mm is good work; within 0.5 mm is excellent.</text><text x="624.0" y="371.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>