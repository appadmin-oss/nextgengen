<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 477" width="640" height="477" role="img" aria-labelledby="t d"><title id="t">Backstage roles</title><desc id="d">Backstage roles around the stage manager, who runs the show and calls every cue: director, lighting, sound, set and props, costume, front of house, producer, deputy and assistant stage managers.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="477" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The stage manager is the centre of communication</text><rect x="230.0" y="194.0" width="180.0" height="72.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="224.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Stage manager</text><text x="320.0" y="248.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">calls every cue</text><line x1="320.0" y1="192.0" x2="320.0" y2="110.0" stroke="#c9cedb" stroke-width="2"/><rect x="246.0" y="70.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="95.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Director</text><line x1="385.1" y1="203.1" x2="452.9" y2="145.1" stroke="#c9cedb" stroke-width="2"/><rect x="408.6" y="111.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="482.6" y="136.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Lighting</text><line x1="412.0" y1="230.0" x2="508.0" y2="230.0" stroke="#c9cedb" stroke-width="2"/><rect x="476.0" y="210.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="550.0" y="235.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Sound</text><line x1="385.1" y1="256.9" x2="452.9" y2="314.9" stroke="#c9cedb" stroke-width="2"/><rect x="408.6" y="309.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="482.6" y="334.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Set and props</text><line x1="320.0" y1="268.0" x2="320.0" y2="350.0" stroke="#c9cedb" stroke-width="2"/><rect x="246.0" y="350.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="375.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Costume</text><line x1="254.9" y1="256.9" x2="187.1" y2="314.9" stroke="#c9cedb" stroke-width="2"/><rect x="83.4" y="309.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="157.4" y="334.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Front of house</text><line x1="228.0" y1="230.0" x2="132.0" y2="230.0" stroke="#c9cedb" stroke-width="2"/><rect x="16.0" y="210.0" width="148.0" height="40.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="90.0" y="235.6" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Producer</text><line x1="254.9" y1="203.1" x2="187.1" y2="145.1" stroke="#c9cedb" stroke-width="2"/><rect x="83.4" y="111.0" width="148.0" height="54.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="157.4" y="133.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">Deputy and</text><text x="157.4" y="154.1" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">ASMs</text><text x="24.0" y="416.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Every role is needed because theatre is live: a missed cue or a missing</text><text x="24.0" y="437.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">prop changes the show for everyone.</text><text x="624.0" y="467.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>