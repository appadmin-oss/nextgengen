<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 371" width="640" height="371" role="img" aria-labelledby="t d"><title id="t">Cutting safely</title><desc id="d">On a cutting mat, the free hand holds the steel rule behind the blade, and the blade travels away from it and away from the body.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="371" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Cut away from your body, free hand behind the blade</text><rect x="24.0" y="60.0" width="592.0" height="220.0" rx="8" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1"/><text x="40.0" y="88.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">cutting mat</text><rect x="80.0" y="160.0" width="480.0" height="26.0" rx="2" fill="#b0b8c8" stroke="#16233f" stroke-width="1.5"/><text x="320.0" y="152.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">steel rule</text><rect x="110.0" y="200.0" width="120.0" height="60.0" rx="20" fill="#fdf0d2" stroke="#16233f" stroke-width="1.5"/><text x="170.0" y="236.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">free hand</text><polygon points="300,188 330,188 322,204 300,204" fill="#16233f"/><line x1="340.0" y1="220.0" x2="540.0" y2="220.0" stroke="#9c3119" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="440.0" y="250.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle">blade moves this way</text><text x="24.0" y="310.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Several light passes against a metal rule, not one heavy cut. Retract or</text><text x="24.0" y="331.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">cap the blade the moment you put it down.</text><text x="624.0" y="361.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>