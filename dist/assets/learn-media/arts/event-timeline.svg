<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 433" width="640" height="433" role="img" aria-labelledby="t d"><title id="t">Event catering timeline</title><desc id="d">A backward timeline from 2 pm service: plating starts at 1:30, jollof at 11:30 (an hour), the base at 10:50 (40 minutes before), and shopping and boiling the meat the day before.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="433" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Cooking for 40: work backwards from 2 pm</text><rect x="24.0" y="60.0" width="120.0" height="40.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="84.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Day before</text><text x="160.0" y="86.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">shop; wash; boil the meat</text><rect x="24.0" y="108.0" width="120.0" height="40.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="84.0" y="134.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">10:50</text><text x="160.0" y="134.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">start the base (40 min before rice)</text><rect x="24.0" y="156.0" width="120.0" height="40.0" rx="6" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="84.0" y="182.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">11:30</text><text x="160.0" y="182.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">start the jollof (1 hour)</text><rect x="24.0" y="204.0" width="120.0" height="40.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1"/><text x="84.0" y="230.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">12:30</text><text x="160.0" y="230.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">fry plantain; make salad</text><rect x="24.0" y="252.0" width="120.0" height="40.0" rx="6" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="84.0" y="278.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1:30</text><text x="160.0" y="278.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">start plating</text><rect x="24.0" y="300.0" width="120.0" height="40.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text x="84.0" y="326.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2:00</text><text x="160.0" y="326.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">serve</text><line x1="600.0" y1="338.0" x2="600.0" y2="66.0" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="588.0" y="210.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">plan</text><text x="588.0" y="232.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="end">upwards</text><text x="24.0" y="372.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Scale by 40 ÷ 4 = 10, but add salt and pepper gradually. Hot holding</text><text x="24.0" y="393.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">above 63°C; anything out over 2 hours is thrown away.</text><text x="624.0" y="423.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>