<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" width="640" height="402" role="img" aria-labelledby="t d"><title id="t">Sound chain and feedback</title><desc id="d">Sound flows mic → mixer → amplifier → speaker. Feedback is the loop when the speaker&#x27;s sound returns into the mic; keep mics behind speakers and close to the mouth, and pull the fader down if it squeals.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="402" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The sound chain, and the loop that makes feedback</text><rect x="26.0" y="80.0" width="124.0" height="52.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="88.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Mic</text><rect x="178.0" y="80.0" width="124.0" height="52.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="240.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Mixer</text><rect x="330.0" y="80.0" width="124.0" height="52.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="392.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Amplifier</text><rect x="482.0" y="80.0" width="124.0" height="52.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="544.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Speaker</text><line x1="152.0" y1="106.0" x2="176.0" y2="106.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="304.0" y1="106.0" x2="328.0" y2="106.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="456.0" y1="106.0" x2="480.0" y2="106.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M544 134 C544 210 88 210 88 140" fill="none" stroke="#9c3119" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6"/><polygon points="88,134 81,148 95,148" fill="#9c3119"/><text x="320.0" y="226.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle">feedback: the speaker&#x27;s sound goes back into the mic, louder each time</text><circle cx="32.0" cy="261.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="44.0" y="266.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Mics behind the speakers, never pointed at one</text><circle cx="32.0" cy="289.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="44.0" y="294.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Mic a hand&#x27;s width from the mouth</text><circle cx="32.0" cy="317.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="44.0" y="322.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Turn up slowly; switch off unused mics</text><circle cx="32.0" cy="345.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="44.0" y="350.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">If it squeals: pull the fader down first</text><text x="624.0" y="392.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>