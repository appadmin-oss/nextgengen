<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" width="640" height="510" role="img" aria-labelledby="t d"><title id="t">Nigerian theatre timeline</title><desc id="d">Nigerian theatre: Ogunde&#x27;s touring company in the 1940s, Ogunmola and Duro Ladipo&#x27;s Oba Koso, Soyinka&#x27;s The Lion and the Jewel (1959) and Death and the King&#x27;s Horseman (1975), Osofisan in the late 1970s, Soyinka&#x27;s Nobel Prize in 1986, and the companies&#x27; move into film — a root of Nollywood.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="510" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Nigerian theatre: from the travelling companies to</text><text x="24.0" y="64.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Nollywood</text><line x1="140.0" y1="86.0" x2="140.0" y2="390.0" stroke="#3d4560" stroke-width="3"/><circle cx="140.0" cy="96.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="102.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1940s</text><text x="160.0" y="102.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Hubert Ogunde&#x27;s touring company</text><circle cx="140.0" cy="142.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="148.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1950s–60s</text><text x="160.0" y="148.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Kola Ogunmola; Duro Ladipo&#x27;s Oba Koso</text><circle cx="140.0" cy="188.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="194.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1959</text><text x="160.0" y="194.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Soyinka, The Lion and the Jewel</text><circle cx="140.0" cy="234.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="240.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1975</text><text x="160.0" y="240.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Soyinka, Death and the King&#x27;s Horseman</text><circle cx="140.0" cy="280.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="286.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">Late 1970s</text><text x="160.0" y="286.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Osofisan: Morountodun, Once Upon Four Robbers</text><circle cx="140.0" cy="326.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="332.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">1986</text><text x="160.0" y="332.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Soyinka, Nobel Prize in Literature</text><circle cx="140.0" cy="372.0" r="8.0" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="124.0" y="378.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">Later</text><text x="160.0" y="378.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">companies move into film and TV: a root of Nollywood</text><text x="24.0" y="428.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">What it asks of an actor: total performance — speech, song, dance,</text><text x="24.0" y="449.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">drumming — weight and stillness, and direct engagement with the</text><text x="24.0" y="470.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">audience.</text><text x="624.0" y="500.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>