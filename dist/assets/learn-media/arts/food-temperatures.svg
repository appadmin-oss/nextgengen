<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 506" width="640" height="506" role="img" aria-labelledby="t d"><title id="t">Food safety temperatures</title><desc id="d">A thermometer: food is kept cold at 5°C or below and hot above 60°C; between 5°C and 60°C is the danger zone where germs multiply fastest, so cooked food stays out no more than two hours.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="506" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Food temperatures: keep it out of the danger zone</text><rect x="150.0" y="70.0" width="40.0" height="320.0" rx="20" fill="#ffffff" stroke="#16233f" stroke-width="2"/><rect x="154.0" y="203.3" width="32.0" height="146.7" rx="2" fill="#ef6b4d" stroke="none" stroke-width="1"/><rect x="154.0" y="350.0" width="32.0" height="36.0" rx="2" fill="#20b2c9" stroke="none" stroke-width="1"/><rect x="154.0" y="74.0" width="32.0" height="129.3" rx="2" fill="#f5b026" stroke="none" stroke-width="1"/><line x1="140.0" y1="96.7" x2="150.0" y2="96.7" stroke="#16233f" stroke-width="2"/><text x="134.0" y="102.7" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">100°C</text><line x1="140.0" y1="203.3" x2="150.0" y2="203.3" stroke="#16233f" stroke-width="2"/><text x="134.0" y="209.3" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">60°C</text><line x1="140.0" y1="350.0" x2="150.0" y2="350.0" stroke="#16233f" stroke-width="2"/><text x="134.0" y="356.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">5°C</text><text x="210.0" y="102.7" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">boiling</text><text x="210.0" y="150.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Keep hot food hot:</text><text x="210.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">above 60°C</text><rect x="202.0" y="208.7" width="400.0" height="136.0" rx="6" fill="#fde5df" stroke="none" stroke-width="1"/><text x="214.0" y="256.7" font-size="18" font-weight="800" fill="#9c3119" text-anchor="start">DANGER ZONE 5–60°C</text><text x="214.0" y="280.7" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">germs multiply fastest here; cooked food</text><text x="214.0" y="302.7" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">out no more than 2 hours</text><text x="210.0" y="368.7" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Keep cold food cold: 5°C or below</text><text x="24.0" y="424.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The WHO&#x27;s Five Keys: keep clean, separate raw and cooked, cook</text><text x="24.0" y="445.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">thoroughly, keep food at safe temperatures, use safe water and raw</text><text x="24.0" y="466.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">materials.</text><text x="624.0" y="496.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>