<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" role="img" aria-labelledby="t d"><title id="t">Oniko bindings</title><desc id="d">Oniko bindings and their results: a single bound point gives a circle with a ring, a row of points a line of small circles, a spiral radiating lines, and fan folds bound at intervals give stripes.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="382" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Oniko: predict what each binding will make</text><rect x="24.0" y="60.0" width="140.0" height="140.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><circle cx="94.0" cy="130.0" r="40.0" fill="#dfe8f5" stroke="none" stroke-width="1"/><circle cx="94.0" cy="130.0" r="26.0" fill="#274b86" stroke="none" stroke-width="1"/><circle cx="94.0" cy="130.0" r="14.0" fill="#dfe8f5" stroke="none" stroke-width="1"/><text x="24.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Single point</text><text x="24.0" y="248.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">a circle with a</text><text x="24.0" y="269.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">ring</text><rect x="176.0" y="60.0" width="140.0" height="140.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><circle cx="200.0" cy="130.0" r="10.0" fill="#dfe8f5" stroke="none" stroke-width="1"/><circle cx="200.0" cy="130.0" r="4.0" fill="#274b86" stroke="none" stroke-width="1"/><circle cx="231.0" cy="130.0" r="10.0" fill="#dfe8f5" stroke="none" stroke-width="1"/><circle cx="231.0" cy="130.0" r="4.0" fill="#274b86" stroke="none" stroke-width="1"/><circle cx="262.0" cy="130.0" r="10.0" fill="#dfe8f5" stroke="none" stroke-width="1"/><circle cx="262.0" cy="130.0" r="4.0" fill="#274b86" stroke="none" stroke-width="1"/><circle cx="293.0" cy="130.0" r="10.0" fill="#dfe8f5" stroke="none" stroke-width="1"/><circle cx="293.0" cy="130.0" r="4.0" fill="#274b86" stroke="none" stroke-width="1"/><text x="176.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Row of points</text><text x="176.0" y="248.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">a line of small</text><text x="176.0" y="269.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">circles</text><rect x="328.0" y="60.0" width="140.0" height="140.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><line x1="398.0" y1="130.0" x2="456.0" y2="130.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="439.0" y2="171.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="398.0" y2="188.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="357.0" y2="171.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="340.0" y2="130.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="357.0" y2="89.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="398.0" y2="72.0" stroke="#dfe8f5" stroke-width="6"/><line x1="398.0" y1="130.0" x2="439.0" y2="89.0" stroke="#dfe8f5" stroke-width="6"/><text x="328.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Spiral</text><text x="328.0" y="248.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">radiating lines</text><rect x="480.0" y="60.0" width="140.0" height="140.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><rect x="492.0" y="60.0" width="12.0" height="140.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="526.0" y="60.0" width="12.0" height="140.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="560.0" y="60.0" width="12.0" height="140.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="594.0" y="60.0" width="12.0" height="140.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><text x="480.0" y="226.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Fan folds, bound</text><text x="480.0" y="248.0" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">stripes</text><text x="24.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Tighter and wider bindings give sharper, paler, wider resists; loose</text><text x="24.0" y="321.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">binding lets dye creep in. Draw your prediction before the cloth goes in</text><text x="24.0" y="342.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the vat.</text><text x="624.0" y="372.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>