<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" role="img" aria-labelledby="t d"><title id="t">Pricing a craft</title><desc id="d">An example bag: materials ₦2,500, labour 4 hours × ₦1,000 = ₦4,000, overheads ₦500 make a cost of ₦7,000; a 40% margin of ₦2,800 gives a price of ₦9,800.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="410" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Pricing a hand-made bag (an example)</text><rect x="24.0" y="60.0" width="380.0" height="60.0" rx="0" fill="#dff3f7" stroke="#16233f" stroke-width="1"/><text x="36.0" y="96.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Materials</text><text x="392.0" y="96.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦2,500</text><rect x="24.0" y="120.0" width="380.0" height="78.0" rx="0" fill="#fdf0d2" stroke="#16233f" stroke-width="1"/><text x="36.0" y="165.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Labour: 4 hours × ₦1,000</text><text x="392.0" y="165.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦4,000</text><rect x="24.0" y="198.0" width="380.0" height="36.0" rx="0" fill="#eee6f6" stroke="#16233f" stroke-width="1"/><text x="36.0" y="222.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Overheads</text><text x="392.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦500</text><line x1="24.0" y1="234.0" x2="404.0" y2="234.0" stroke="#16233f" stroke-width="3"/><text x="420.0" y="240.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">= cost ₦7,000</text><rect x="24.0" y="234.0" width="380.0" height="63.6" rx="0" fill="#e3f1e6" stroke="#16233f" stroke-width="1"/><text x="36.0" y="271.8" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Margin, 40%</text><text x="392.0" y="271.8" font-size="16" font-weight="800" fill="#16233f" text-anchor="end">₦2,800</text><rect x="420.0" y="251.6" width="196.0" height="46.0" rx="10" fill="#f5b026" stroke="#16233f" stroke-width="1.25" filter="url(#sh)"/><text x="434.0" y="281.6" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">= price ₦9,800</text><text x="24.0" y="327.6" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A shop usually pays about half its shelf price, so the wholesale price</text><text x="24.0" y="348.6" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">must still cover the ₦7,000 cost. If cost is above the market, change the</text><text x="24.0" y="369.6" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">making or the market — not the price below cost.</text><text x="624.0" y="400.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>