<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 407" width="640" height="407" role="img" aria-labelledby="t d"><title id="t">Resist dyeing</title><desc id="d">Resist dyeing: where cloth is tied (oniko), stitched (alabere) or pasted with cassava starch (eleko), indigo cannot reach, so those areas stay pale against the blue.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="407" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Resist dyeing: whatever blocks the dye stays pale</text><rect x="24.0" y="60.0" width="592.0" height="80.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><rect x="70.0" y="60.0" width="80.0" height="80.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="260.0" y="60.0" width="80.0" height="80.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="450.0" y="60.0" width="80.0" height="80.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><text x="110.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">tied</text><text x="300.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">stitched</text><text x="490.0" y="106.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">pasted</text><rect x="24.0" y="164.0" width="186.0" height="150.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="200.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Oniko</text><text x="36.0" y="226.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">tied: raffia binds</text><text x="36.0" y="247.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">seeds, stones or</text><text x="36.0" y="268.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">folds → circles,</text><text x="36.0" y="289.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">rings, lines</text><rect x="226.0" y="164.0" width="186.0" height="150.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="238.0" y="211.4" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Alabere</text><text x="238.0" y="236.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">stitched: running</text><text x="238.0" y="257.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">stitch pulled tight</text><text x="238.0" y="278.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">→ fine lines, waves</text><rect x="428.0" y="164.0" width="186.0" height="150.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="440.0" y="200.9" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Eleko</text><text x="440.0" y="226.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">cassava paste</text><text x="440.0" y="247.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">(lafun), freehand or</text><text x="440.0" y="268.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">stencil → the most</text><text x="440.0" y="289.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">detailed designs</text><text x="24.0" y="346.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Made by Yoruba women, especially in Abeokuta and Ibadan. Name the</text><text x="24.0" y="367.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">technique and the tradition when you show or sell your work.</text><text x="624.0" y="397.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>