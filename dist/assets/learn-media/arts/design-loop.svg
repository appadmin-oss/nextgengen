<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 543" width="640" height="543" role="img" aria-labelledby="t d"><title id="t">The design loop</title><desc id="d">The design loop: research with real buyers, design, prototype, test, improve — changing one thing at a time and logging what changed — then round again.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="543" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Design for somebody else: a loop, not a line</text><circle cx="320.0" cy="279.5" r="172.0" fill="none" stroke="#f3f5fa" stroke-width="18"/><path d="M405.7 130.4 A172 172 0 0 1 455.9 174.1" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M492.0 278.4 A172 172 0 0 1 451.8 390.0" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M357.5 447.4 A172 172 0 0 1 304.9 450.8" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M172.0 367.1 A172 172 0 0 1 148.0 278.4" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap=