<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 411" width="640" height="411" role="img" aria-labelledby="t d"><title id="t">Frying temperature</title><desc id="d">Oil too cool soaks into the food and leaves it greasy; at roughly 170–180°C a test drop sizzles and rises and browns in a minute or two; too hot burns the outside while the inside stays raw.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="411" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Oil temperature decides greasy, raw or right</text><rect x="24.0" y="60.0" width="592.0" height="80.0" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="93.5" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Too cool</text><text x="36.0" y="118.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">soaks up oil: greasy, heavy</text><rect x="24.0" y="152.0" width="592.0" height="80.0" rx="10" fill="#f5b026" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="185.4" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">About right: roughly 170–180°C</text><text x="36.0" y="210.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">a drop sizzles at once and rises; browns in a minute or two</text><rect x="24.0" y="244.0" width="592.0" height="80.0" rx="10" fill="#fde5df" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36.0" y="277.4" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">Too hot</text><text x="36.0" y="302.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start">outside burns, inside raw</text><text x="24.0" y="350.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Fry in batches: too much at once drops the temperature. Dry hands and</text><text x="24.0" y="371.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">tools — water spits violently in hot oil. Never leave the pot.</text><text x="624.0" y="401.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>