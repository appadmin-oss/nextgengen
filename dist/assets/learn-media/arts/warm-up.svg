<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" width="640" height="234" role="img" aria-labelledby="t d"><title id="t">Actor&#x27;s warm-up</title><desc id="d">A five-step warm-up in order: shake out and stretch, breathe low and slow, hum then open to vowels, articulate with tongue-twisters, then a moment of focused stillness.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="234" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A warm-up wakes all three parts of the instrument</text><rect x="24.0" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="76.8" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Shake out</text><text x="76.8" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">release</text><text x="76.8" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">tension</text><line x1="132.6" y1="99.5" x2="142.6" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="145.6" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="198.4" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Breathe</text><text x="198.4" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">low and</text><text x="198.4" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">slow</text><line x1="254.2" y1="99.5" x2="264.2" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="267.2" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="320.0" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Hum</text><text x="320.0" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">then</text><text x="320.0" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">vowels</text><line x1="375.8" y1="99.5" x2="385.8" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="388.8" y="60.0" width="105.6" height="79.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="441.6" y="82.1" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Articulate</text><text x="441.6" y="107.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">tongue</text><text x="441.6" y="128.1" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">twisters</text><line x1="497.4" y1="99.5" x2="507.4" y2="99.5" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="510.4" y="60.0" width="105.6" height="79.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="563.2" y="92.6" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Focus</text><text x="563.2" y="117.6" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle">stillness</text><text x="24.0" y="169.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Body, voice and imagination: from a balanced, neutral stance any</text><text x="24.0" y="190.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">character can be built.</text><text x="624.0" y="224.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>