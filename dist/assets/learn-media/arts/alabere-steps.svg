<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 331" width="640" height="331" role="img" aria-labelledby="t d"><title id="t">Alabere stitching</title><desc id="d">Alabere in four steps: mark the line, sew a running stitch, pull it up hard into tight gathers and knot it, then dye and unpick, leaving a fine pale line.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="331" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Alabere: stitch, pull tight, dye, unpick</text><rect x="24.0" y="60.0" width="140.0" height="110.0" rx="4" fill="#f4f1ea" stroke="#16233f" stroke-width="1.5"/><line x1="38.0" y1="115.0" x2="150.0" y2="115.0" stroke="#3d4560" stroke-width="2" stroke-dasharray="3 4"/><text x="94.0" y="194.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="94.0" y="216.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Mark the line</text><rect x="176.0" y="60.0" width="140.0" height="110.0" rx="4" fill="#f4f1ea" stroke="#16233f" stroke-width="1.5"/><line x1="190.0" y1="115.0" x2="200.0" y2="115.0" stroke="#16233f" stroke-width="3"/><line x1="209.0" y1="115.0" x2="219.0" y2="115.0" stroke="#16233f" stroke-width="3"/><line x1="228.0" y1="115.0" x2="238.0" y2="115.0" stroke="#16233f" stroke-width="3"/><line x1="247.0" y1="115.0" x2="257.0" y2="115.0" stroke="#16233f" stroke-width="3"/><line x1="266.0" y1="115.0" x2="276.0" y2="115.0" stroke="#16233f" stroke-width="3"/><line x1="285.0" y1="115.0" x2="295.0" y2="115.0" stroke="#16233f" stroke-width="3"/><text x="246.0" y="194.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text x="246.0" y="216.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Running stitch</text><rect x="328.0" y="60.0" width="140.0" height="110.0" rx="4" fill="#f4f1ea" stroke="#16233f" stroke-width="1.5"/><path d="M348 115 q 10 -26 20 0 q 10 26 20 0 q 10 -26 20 0 q 10 26 20 0 q 10 -26 20 0" fill="none" stroke="#16233f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="398.0" y="194.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text x="398.0" y="216.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Pull up hard,</text><text x="398.0" y="237.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">knot</text><rect x="480.0" y="60.0" width="140.0" height="110.0" rx="4" fill="#274b86" stroke="#16233f" stroke-width="1.5"/><rect x="492.0" y="111.0" width="4.0" height="8.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="500.4" y="111.0" width="4.0" height="8.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="508.8" y="111.0" width="4.0" height="8.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="517.2" y="111.0" width="4.0" height="8.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="525.6" y="111.0" width="4.0" height="8.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="534.0" y="111.0" width="4.0" height="8.0" rx="0" fill="#dfe8f5" stroke="none" stroke-width="1"/><rect x="542.4" y="111.0" width="4.0" height="8.0" rx="0" fill="