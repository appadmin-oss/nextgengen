<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 481" width="640" height="481" role="img" aria-labelledby="t d"><title id="t">Prompt book page</title><desc id="d">A prompt-book page: the script in the middle, the actors&#x27; blocking in pencil in the left margin (X DSL = cross downstage left), and each cue with its standby in the right margin.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="481" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A prompt-book page: script, blocking, cues</text><rect x="24.0" y="60.0" width="592.0" height="330.0" rx="4" fill="#ffffff" stroke="#16233f" stroke-width="1.5"/><line x1="170.0" y1="60.0" x2="170.0" y2="390.0" stroke="#c9cedb" stroke-width="1.5"/><line x1="470.0" y1="60.0" x2="470.0" y2="390.0" stroke="#c9cedb" stroke-width="1.5"/><text x="36.0" y="86.0" font-size="16" font-weight="800" fill="#0b6274" text-anchor="start">Blocking</text><text x="320.0" y="86.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">Script</text><text x="482.0" y="86.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start">Cues</text><text x="184.0" y="134.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">ADA: Where were you?</text><text x="36.0" y="134.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start">X DSL</text><text x="184.0" y="196.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">TUNDE: At the market.</text><text x="482.0" y="196.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start">Standby LX 14</text><text x="184.0" y="258.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">ADA: All night?</text><text x="36.0" y="258.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start">sits</text><text x="482.0" y="258.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start">LX 14 GO</text><text x="184.0" y="320.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">(Thunder.)</text><text x="482.0" y="320.0" font-size="16" font-weight="800" fill="#9c3119" text-anchor="start">SQ 6 GO</text><text x="24.0" y="420.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Pencil, because blocking changes. A standby before every cue; the</text><text x="24.0" y="441.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">word “go” is used only to start cues.</text><text x="624.0" y="471.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>