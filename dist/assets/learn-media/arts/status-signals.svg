<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" width="640" height="352" role="img" aria-labelledby="t d"><title id="t">High and low status</title><desc id="d">High status: stillness, taking up space, a steady gaze, slow complete movements, no rush to fill silence. Low status: fidgeting, looking away, hesitant speech, touching the face.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="352" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">High and low status show in the body</text><rect x="24.0" y="60.0" width="288.0" height="197.0" rx="10" fill="#fdf0d2" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="38.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">High status</text><circle cx="44.0" cy="113.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="118.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Still, takes up space</text><circle cx="44.0" cy="142.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="147.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Steady gaze</text><circle cx="44.0" cy="171.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="176.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Slow, complete movements</text><circle cx="44.0" cy="200.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="56.0" y="205.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Does not fill silences</text><rect x="328.0" y="60.0" width="288.0" height="197.0" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="342.0" y="90.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">Low status</text><circle cx="348.0" cy="113.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="118.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Small or fidgety movements</text><circle cx="348.0" cy="142.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="147.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Looks away</text><circle cx="348.0" cy="171.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="176.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Quick, hesitant speech,</text><text x="360.0" y="197.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">“um”s</text><circle cx="348.0" cy="221.0" r="4.0" fill="#3d4560" stroke="none" stroke-width="1"/><text x="360.0" y="226.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="start">Touches own face</text><text x="24.0" y="287.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Status is played, not owned, and it shifts during a scene — the reversal</text><text x="24.0" y="308.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">is often the best moment.</text><text x="624.0" y="342.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>