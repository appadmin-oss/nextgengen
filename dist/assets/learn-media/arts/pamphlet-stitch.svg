<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 343" width="640" height="343" role="img" aria-labelledby="t d"><title id="t">Pamphlet stitch</title><desc id="d">The pamphlet stitch on three holes along the fold: in through the centre, out through one end hole, back in through the other end hole along the long stitch, out through the centre, and tie across the long stitch.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="343" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="24.0" y="38.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three-hole pamphlet stitch, seen on the fold</text><rect x="60.0" y="120.0" width="520.0" height="100.0" rx="2" fill="#f4f1ea" stroke="#16233f" stroke-width="1.5"/><line x1="60.0" y1="170.0" x2="580.0" y2="170.0" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="6 4"/><circle cx="160.0" cy="170.0" r="6.0" fill="#16233f" stroke="none" stroke-width="1"/><text x="160.0" y="246.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">end</text><circle cx="320.0" cy="170.0" r="6.0" fill="#16233f" stroke="none" stroke-width="1"/><text x="320.0" y="246.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">centre</text><circle cx="480.0" cy="170.0" r="6.0" fill="#16233f" stroke="none" stroke-width="1"/><text x="480.0" y="246.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">end</text><path d="M320 80 L320 162" fill="none" stroke="#9c3119" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="330.0" y="84.0" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start">1 in through the centre</text><path d="M314 184 C280 210 200 210 166 182" fill="none" stroke="#0b6274" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="110.0" y="106.0" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start">2 out at one end</text><path d="M160 160 C240 130 400 130 474 160" fill="none" stroke="#7a4a00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="500.0" y="106.0" font-size="16" font-weight="700" fill="#7a4a00" text-anchor="middle">3 in at the other end</text><text x="24.0" y="280.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">4 out through the centre again, then tie the two ends across the long</text><text x="24.0" y="301.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">stitch and trim. Grain parallel to the spine; score before folding.</text><text x="624.0" y="333.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>