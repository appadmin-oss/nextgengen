<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" role="img" aria-labelledby="t d"><title id="t">How the talking drum changes pitch</title><desc id="d">Two hourglass-shaped dùndún drums with leather cords running between the heads. Relaxed cords give a lower note; squeezing the cords under the arm stretches the heads and raises the note.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="432" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The dùndún: squeeze the cords, raise the pitch</text><path d="M50 80 C70 160 74 180 74 190.0 C74 200 70 220 50 300 L190 300 C170 220 166 200 166 190.0 C166 180 170 160 190 80 Z" fill="#fde7b8" stroke="#16233f" stroke-width="2.5"/><ellipse cx="120" cy="80" rx="70" ry="12" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M60 88 Q80.6 190.0 60 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M80 88 Q93.7 190.0 80 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M100 88 Q106.9 190.0 100 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M120 88 Q120.0 190.0 120 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M140 88 Q133.1 190.0 140 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M160 88 Q146.3 190.0 160 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M180 88 Q159.4 190.0 180 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><text x="120.0" y="336.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Relaxed</text><text x="120.0" y="360.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">lower note</text><path d="M330 80 C350 160 370 180 370 190.0 C370 200 350 220 330 300 L470 300 C450 220 430 200 430 190.0 C430 180 450 160 470 80 Z" fill="#fde7b8" stroke="#16233f" stroke-width="2.5"/><ellipse cx="400" cy="80" rx="70" ry="12" fill="#ffffff" stroke="#16233f" stroke-width="2.5"/><path d="M340 88 Q374.3 190.0 340 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M360 88 Q382.9 190.0 360 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M380 88 Q391.4 190.0 380 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M400 88 Q400.0 190.0 400 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M420 88 Q408.6 190.0 420 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M440 88 Q417.1 190.0 440 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><path d="M460 88 Q425.7 190.0 460 300" fill="none" stroke="#3d4560" stroke-width="1.5"/><line x1="500.0" y1="190.0" x2="438.0" y2="190.0" stroke="#a3361f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="300.0" y1="190.0" x2="362.0" y2="190.0" stroke="#a3361f" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="400.0" y="336.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Squeezed</text><text x="400.0" y="360.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">higher note</text><text x="20.0" y="396.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Tighter cords stretch the heads: the note rises. Strike, then squeeze.</text><text x="626" y="423" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>