<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="t d"><title id="t">A one-bar fill</title><desc id="d">A four-bar phrase: three bars of groove and one bar of fill. The fill: snare on 1 and 2 and, high tom on 3 and, floor tom on 4 and, then crash cymbal and kick together on beat 1 of the next bar.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="440" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Three bars of groove, one bar of fill</text><rect x="20.0" y="60.0" width="112.0" height="48.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="76.0" y="90.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">groove</text><rect x="140.0" y="60.0" width="112.0" height="48.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="196.0" y="90.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">groove</text><rect x="260.0" y="60.0" width="112.0" height="48.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="316.0" y="90.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">groove</text><rect x="380.0" y="60.0" width="112.0" height="48.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="436.0" y="90.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">FILL</text><rect x="500.0" y="60.0" width="112.0" height="48.0" rx="6" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="556.0" y="90.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">groove…</text><rect x="141.0" y="140.0" width="51.3" height="210.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="166.7" y="164.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="194.3" y="140.0" width="51.3" height="210.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="220.0" y="164.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="247.7" y="140.0" width="51.3" height="210.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="273.3" y="164.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="301.0" y="140.0" width="51.3" height="210.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="326.7" y="164.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="354.3" y="140.0" width="51.3" height="210.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="380.0" y="164.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="407.7" y="140.0" width="51.3" height="210.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="433.3" y="164.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="461.0" y="140.0" width="51.3" height="210.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="486.7" y="164.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="514.3" y="140.0" width="51.3" height="210.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="540.0" y="164.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="567.7" y="140.0" width="51.3" height="210.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="593.3" y="164.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text x="20.0" y="202.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Snare</text><line x1="140.0" y1="196.0" x2="620.0" y