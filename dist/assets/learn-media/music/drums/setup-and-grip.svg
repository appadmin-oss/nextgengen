<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="t d"><title id="t">Drum stool height and the stick&#x27;s fulcrum</title><desc id="d">Left: a drummer seen from the side with the thigh sloping slightly down from hip to knee, foot on the pedal. Right: a drumstick with its fulcrum, the balance point, about a third of the way from the butt end.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="360" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Set-up: seat height, and where to hold the stick</text><rect x="40.0" y="210.0" width="90.0" height="14.0" rx="3" fill="#3d4560" stroke="#16233f" stroke-width="1.25"/><line x1="85.0" y1="224.0" x2="85.0" y2="300.0" stroke="#3d4560" stroke-width="6" stroke-linecap="butt"/><line x1="55.0" y1="300.0" x2="115.0" y2="300.0" stroke="#3d4560" stroke-width="6" stroke-linecap="butt"/><line x1="85.0" y1="120.0" x2="85.0" y2="205.0" stroke="#16233f" stroke-width="10" stroke-linecap="round"/><circle cx="85.0" cy="102.0" r="18" fill="#ffffff" stroke="#16233f" stroke-width="3"/><line x1="90.0" y1="205.0" x2="190.0" y2="228.0" stroke="#16233f" stroke-width="10" stroke-linecap="round"/><line x1="190.0" y1="228.0" x2="196.0" y2="300.0" stroke="#16233f" stroke-width="10" stroke-linecap="round"/><line x1="180.0" y1="300.0" x2="222.0" y2="296.0" stroke="#16233f" stroke-width="7" stroke-linecap="round"/><path d="M100 196 L190 196" stroke="#f5b026" stroke-width="3" stroke-dasharray="6 5"/><text x="200.0" y="190.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">level</text><text x="212.0" y="252.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="start">thigh slopes</text><text x="212.0" y="272.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="start">slightly down</text><path d="M340 143 L595 146 Q615 150 595 154 L340 157 Z" fill="#fde7b8" stroke="#16233f" stroke-width="2"/><line x1="431.7" y1="120.0" x2="431.7" y2="180.0" stroke="#a3361f" stroke-width="3" stroke-linecap="butt"/><text x="431.7" y="110.0" font-size="17" font-weight="800" fill="#a3361f" text-anchor="middle">fulcrum</text><text x="340.0" y="200.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">butt</text><text x="615.0" y="200.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="end">tip</text><path d="M340 212 L340 220 L431.6666666666667 220 L431.6666666666667 212" fill="none" stroke="#3d4560" stroke-width="2"/><text x="385.8" y="244.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">about a third</text><text x="340.0" y="300.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Pinch at the fulcrum with thumb</text><text x="340.0" y="324.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">and first finger; others loose.</text><text x="626" y="351" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>