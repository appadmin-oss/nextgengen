<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" aria-labelledby="t d"><title id="t">Vocal registers and the passaggio</title><desc id="d">A band from low to high notes: chest voice at the bottom, head voice at the top, and the passaggio — where the voice changes gear — between them, where the mixed voice carries power across.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="310" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Chest, mix and head — and the passaggio between</text><defs><linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="#fcd9cf"/><stop offset="1" stop-color="#d3f1f6"/></linearGradient></defs><rect x="40.0" y="80.0" width="560.0" height="70.0" rx="10" fill="url(#vg)" stroke="#16233f" stroke-width="1.4"/><rect x="300.0" y="80.0" width="110.0" height="70.0" rx="0" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="150.0" y="122.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">chest voice</text><text x="355.0" y="122.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">passaggio</text><text x="510.0" y="122.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">head voice</text><line x1="40.0" y1="180.0" x2="600.0" y2="180.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="40.0" y="206.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">lower notes</text><text x="600.0" y="206.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="end">higher notes</text><text x="355.0" y="64.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">mix carries power across here</text><text x="20.0" y="250.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Cross gently: sirens on &quot;ng&quot; or &quot;oo&quot;, light volume, narrow vowels, relaxed jaw.</text><text x="20.0" y="274.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The exact notes differ from voice to voice; find yours with a keyboard.</text><text x="626" y="301" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>