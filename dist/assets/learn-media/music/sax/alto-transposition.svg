<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d"><title id="t">Alto saxophone transposition</title><desc id="d">Concert E-flat is written C for alto saxophone; concert B-flat is written G; concert A is written F sharp. The written note is a major sixth above the concert note.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="340" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Alto saxophone in E♭: written and concert pitch</text><text x="20.0" y="104.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Concert (piano) plays</text><rect x="250.0" y="70.0" width="100.0" height="52.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="300.0" y="104.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">E♭</text><rect x="370.0" y="70.0" width="100.0" height="52.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="420.0" y="104.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">B♭</text><rect x="490.0" y="70.0" width="100.0" height="52.0" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.2"/><text x="540.0" y="104.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">A</text><text x="20.0" y="194.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">Alto sax reads</text><rect x="250.0" y="160.0" width="100.0" height="52.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="300.0" y="194.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">C</text><rect x="370.0" y="160.0" width="100.0" height="52.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="420.0" y="194.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">G</text><rect x="490.0" y="160.0" width="100.0" height="52.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="540.0" y="194.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">F♯</text><line x1="300.0" y1="126.0" x2="300.0" y2="156.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="420.0" y1="126.0" x2="420.0" y2="156.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="540.0" y1="126.0" x2="540.0" y2="156.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="20.0" y="280.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Written C sounds E♭. To find your written note, go UP a major sixth</text><text x="20.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">from the concert note (or down a minor third).</text><text x="626" y="331" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>