<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-labelledby="t d"><title id="t">Saxophone embouchure</title><desc id="d">Side view: the top teeth rest on top of the mouthpiece about 1 to 1.5 cm from the tip; the bottom lip is rolled slightly over the lower teeth and cushions the reed underneath.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="350" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Embouchure: how the mouth meets the mouthpiece</text><path d="M120 150 L420 130 L420 210 L120 178 Z" fill="#3d4560" stroke="#16233f" stroke-width="2"/><path d="M120 182 L420 214 L420 222 L150 190 Z" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text x="430.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">reed</text><text x="430.0" y="136.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">mouthpiece</text><path d="M150 112 L185 112 L185 142 L150 146 Z" fill="#ffffff" stroke="#16233f" stroke-width="2"/><path d="M150 236 L188 236 L188 218 L150 208 Z" fill="#ffffff" stroke="#16233f" stroke-width="2"/><path d="M140 196 C170 196 196 196 204 202 C200 218 160 224 136 222 Z" fill="#fcd9cf" stroke="#16233f" stroke-width="2"/><text x="20.0" y="112.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">top teeth rest</text><text x="20.0" y="132.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">on top</text><text x="20.0" y="270.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">bottom lip over the lower</text><text x="20.0" y="290.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">teeth, cushioning the reed</text><line x1="150.0" y1="262.0" x2="165.0" y2="218.0" stroke="#5a6488" stroke-width="1.2" stroke-linecap="butt"/><line x1="110.0" y1="130.0" x2="152.0" y2="128.0" stroke="#5a6488" stroke-width="1.2" stroke-linecap="butt"/><text x="300.0" y="290.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Top teeth about 1–1.5 cm from the tip.</text><text x="300.0" y="314.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Corners firm, like a drawstring.</text><text x="626" y="341" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>