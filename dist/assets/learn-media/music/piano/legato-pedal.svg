<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 308" width="640" height="308" role="img" aria-labelledby="t d"><title id="t">Legato pedalling</title><desc id="d">A timeline of chords C, F, G, C. The pedal goes down after the first chord; at each new chord it comes up and goes straight back down just after the new chord is played, so the old harmony clears without a gap.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="308" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Legato pedalling: change just AFTER the new chord</text><line x1="80.0" y1="110.0" x2="620.0" y2="110.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><rect x="84.0" y="86.0" width="52.0" height="40.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="110.0" y="113.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">C</text><rect x="244.0" y="86.0" width="52.0" height="40.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="270.0" y="113.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">F</text><rect x="404.0" y="86.0" width="52.0" height="40.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="430.0" y="113.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">G</text><rect x="534.0" y="86.0" width="52.0" height="40.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="560.0" y="113.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">C</text><text x="20.0" y="112.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Hands</text><path d="M80 200 L120 200 L126 160 L274 160 L282 200 L290 160 L434 160 L442 200 L450 160 L564 160 L572 200 L580 160 L610 160" fill="none" stroke="#1a4fb4" stroke-width="3" stroke-linejoin="round"/><text x="20.0" y="166.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Pedal</text><text x="626.0" y="150.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="end">down</text><text x="626.0" y="222.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="end">up</text><line x1="282.0" y1="250.0" x2="282.0" y2="206.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><line x1="442.0" y1="250.0" x2="442.0" y2="206.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><line x1="572.0" y1="250.0" x2="572.0" y2="206.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><text x="320.0" y="272.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">lift and press again as the new chord sounds — no gap, no blur</text><text x="626" y="299" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>