<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" width="640" height="274" role="img" aria-labelledby="t d"><title id="t">Reggae skank rhythm</title><desc id="d">A bar counted 1 and 2 and 3 and 4 and. The keyboard plays short chords on every &#x27;and&#x27;; the kick drum plays on beats 1 and 3.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="274" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The reggae skank: chords off the beat</text><rect x="131.0" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="160.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="192.2" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="221.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="253.5" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="283.1" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="314.8" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="344.4" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="376.0" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="405.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="437.2" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="466.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="498.5" y="60.0" width="59.2" height="122.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="528.1" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="559.8" y="60.0" width="59.2" height="122.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="589.4" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><text x="20.0" y="122.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Keys</text><line x1="130.0" y1="116.0" x2="620.0" y2="116.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><circle cx="221.9" cy="116.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><circle cx="344.4" cy="116.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><circle cx="466.9" cy="116.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><circle cx="589.4" cy="116.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="20.0" y="166.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Kick</text><line x1="130.0" y1="160.0" x2="620.0" y2="160.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><circle cx="160.6" cy="160.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><circle cx="405.6" cy="160.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="20.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Short, staccato chord stabs on every &quot;and&quot;; the bass and drums take the beats.</text><text x="20.0" y="238.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The silence between the chops is part of the groove.</text><text x="626" y="265" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>