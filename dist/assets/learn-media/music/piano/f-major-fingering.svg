<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" width="640" height="390" role="img" aria-labelledby="t d"><title id="t">F major scale fingering, right hand</title><desc id="d">F major from F to F: F G A B-flat C D E F with right-hand fingering 1 2 3 4 1 2 3 4; finger 4 plays B-flat and the thumb turns under onto C.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="390" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">F major, right hand: finger 4 on B♭</text><rect x="70.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="101.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">F</text><rect x="132.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="163.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">G</text><rect x="194.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="225.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">A</text><rect x="256.0" y="110" width="62" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="287.0" y="250.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">B</text><rect x="318.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="349.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="380.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="411.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">D</text><rect x="442.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="473.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">E</text><rect x="504.0" y="110" width="62" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="535.0" y="250.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">F</text><rect x="113.4" y="110" width="37.2" height="93.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="175.4" y="110" width="37.2" height="93.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="237.4" y="110" width="37.2" height="93.0" rx="2" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><rect x="361.4" y="110" width="37.2" height="93.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="423.4" y="110" width="37.2" height="93.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><circle cx="101.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="101.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><circle cx="163.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="163.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><circle cx="225.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="225.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><circle cx="256.0" cy="62.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="256.0" y="68.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><circle cx="349.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="349.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1</text><circle cx="411.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="411.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">2</text><circle cx="473.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="473.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">3</text><circle cx="535.0" cy="88.0" r="13" fill="#ffffff" stroke="#16233f" stroke-width="1.6"/><text x="535.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="238.7" y="272.0" width="34.6" height="26.0" rx="6" fill="#f5b026" stroke="#f5b026" stroke-width="1.25"/><text x="256.0" y="292.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">B♭</text><text x="70.0" y="330.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The thumb never plays a black key in standard scale fingering, so</text><text x="70.0" y="354.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the thumb turns under onto C, after B♭.</text><text x="626" y="381" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>