<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" width="640" height="404" role="img" aria-labelledby="t d"><title id="t">Finding C and F on the keyboard</title><desc id="d">Two octaves of keyboard from C3. Each C is the white key just left of a group of two black keys and each F just left of a group of three. Middle C is marked.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="404" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Find C and F from the black keys</text><rect x="40.0" y="104" width="40" height="150" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="60.0" y="244.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="80.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="100.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">D</text><rect x="120.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="140.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">E</text><rect x="160.0" y="104" width="40" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="180.0" y="244.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">F</text><rect x="200.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="220.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">G</text><rect x="240.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="260.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="280.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="300.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">B</text><rect x="320.0" y="104" width="40" height="150" rx="3" fill="#f5b026" stroke="#16233f" stroke-width="1.4"/><text x="340.0" y="244.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">C</text><rect x="360.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="380.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">D</text><rect x="400.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="420.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">E</text><rect x="440.0" y="104" width="40" height="150" rx="3" fill="#fde7b8" stroke="#16233f" stroke-width="1.4"/><text x="460.0" y="244.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">F</text><rect x="480.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="500.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">G</text><rect x="520.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="540.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">A</text><rect x="560.0" y="104" width="40" height="150" rx="3" fill="#ffffff" stroke="#16233f" stroke-width="1.4"/><text x="580.0" y="244.0" font-size="16" font-weight="500" fill="#16233f" text-anchor="middle">B</text><rect x="68.0" y="104" width="24.0" height="93.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="108.0" y="104" width="24.0" height="93.0" rx="2" fill="#16233f" stroke="#16233f" stroke-width="1.4"/><rect x="188.0" y="104" width="24.0" height="93.