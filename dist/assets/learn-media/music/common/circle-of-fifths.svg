<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" width="640" height="596" role="img" aria-labelledby="t d"><title id="t">The circle of fifths</title><desc id="d">Twelve major keys in a circle with their key signatures: C (none), G 1 sharp, D 2, A 3, E 4, B 5, F sharp or G flat 6, D flat 5 flats, A flat 4, E flat 3, B flat 2, F 1 flat. Inside each is its relative minor: Am, Em, Bm, F sharp m, C sharp m, G sharp m, D sharp m, B flat m, Fm, Cm, Gm, Dm.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="596" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The circle of fifths</text><circle cx="320.0" cy="290.0" r="239" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5"/><circle cx="320.0" cy="290.0" r="102" fill="#ffffff" stroke="#c9cedb" stroke-width="1.5"/><line x1="346.4" y1="191.5" x2="381.9" y2="59.1" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="320.0" y="87.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">C</text><text x="320.0" y="107.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">0</text><text x="320.0" y="164.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">Am</text><line x1="392.1" y1="217.9" x2="489.0" y2="121.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="422.5" y="114.5" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">G</text><text x="422.5" y="134.5" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">1♯</text><text x="386.0" y="181.7" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">Em</text><line x1="418.5" y1="263.6" x2="550.9" y2="228.1" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="497.5" y="189.5" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">D</text><text x="497.5" y="209.5" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">2♯</text><text x="434.3" y="230.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">Bm</text><line x1="418.5" y1="316.4" x2="550.9" y2="351.9" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="525.0" y="292.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A</text><text x="525.0" y="312.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">3♯</text><text x="452.0" y="296.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">F♯m</text><line x1="392.1" y1="362.1" x2="489.0" y2="459.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="497.5" y="394.5" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">E</text><text x="497.5" y="414.5" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">4♯</text><text x="434.3" y="362.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">C♯m</text><line x1="346.4" y1="388.5" x2="381.9" y2="520.9" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="422.5" y="469.5" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">B</text><text x="422.5" y="489.5" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">5♯</text><text x="386.0" y="410.3" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">G♯m</text><line x1="293.6" y1="388.5" x2="258.1" y2="520.9" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="320.0" y="497.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">F♯/G♭</text><text x="320.0" y="517.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">6♯/6♭</text><text x="320.0" y="428.0" font-size="16" font-weight="700" fill="#1a4f