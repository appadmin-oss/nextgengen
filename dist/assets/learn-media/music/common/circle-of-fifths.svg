0" text-anchor="middle">1♭</text><text x="254.0" y="181.7" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">Dm</text><text x="320.0" y="282.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">major keys outside</text><text x="320.0" y="306.0" font-size="16" font-weight="700" fill="#1a4fb4" text-anchor="middle">relative minors inside</text><text x="320.0" y="560.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle">Clockwise: up a fifth, one more sharp. Anticlockwise: down a fifth, one more flat.</text><text x="626" y="587" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>