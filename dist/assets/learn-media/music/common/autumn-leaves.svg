<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" role="img" aria-labelledby="t d"><title id="t">Autumn Leaves chord sequence</title><desc id="d">Cm7, F7, B-flat maj7 form a ii-V-I in B-flat major; then E-flat maj7; then Am7 flat 5, D7, G minor form a ii-V-i in G minor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="276" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">&quot;Autumn Leaves&quot;: chains of ii – V – I</text><rect x="20.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="60.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Cm7</text><rect x="106.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="146.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">F7</text><rect x="192.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="232.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">B♭maj7</text><rect x="278.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="318.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">E♭maj7</text><rect x="364.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="404.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Am7♭5</text><rect x="450.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="490.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">D7</text><rect x="536.0" y="90.0" width="80.0" height="50.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="576.0" y="122.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Gm</text><path d="M24 160 L24 172 L274 172 L274 160" fill="none" stroke="#16233f" stroke-width="2"/><text x="149.0" y="198.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">ii – V – I in B♭ major</text><path d="M368 160 L368 172 L618 172 L618 160" fill="none" stroke="#16233f" stroke-width="2"/><text x="493.0" y="198.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">ii – V – i in G minor</text><text x="20.0" y="240.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">The major ii–V–I and its relative minor ii–V–i, one after the other.</text><text x="626" y="267" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>