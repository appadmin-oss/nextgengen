<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" width="640" height="338" role="img" aria-labelledby="t d"><title id="t">Transposing with chord numbers</title><desc id="d">The progression 1-5-6m-4 is C G Am F in C, D A Bm G in D, and B-flat F Gm E-flat in B-flat. To move from C to D, play A7, the V of D.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="338" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Think in numbers: one song, three keys</text><rect x="120.0" y="60.0" width="117.0" height="44.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="178.0" y="90.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">1</text><rect x="245.0" y="60.0" width="117.0" height="44.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="303.0" y="90.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">5</text><rect x="370.0" y="60.0" width="117.0" height="44.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="428.0" y="90.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">6m</text><rect x="495.0" y="60.0" width="117.0" height="44.0" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.2"/><text x="553.0" y="90.0" font-size="22" font-weight="900" fill="#16233f" text-anchor="middle">4</text><text x="20.0" y="146.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">in C</text><rect x="120.0" y="116.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="178.0" y="146.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">C</text><rect x="245.0" y="116.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="303.0" y="146.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">G</text><rect x="370.0" y="116.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="428.0" y="146.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Am</text><rect x="495.0" y="116.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="553.0" y="146.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">F</text><text x="20.0" y="200.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">in D</text><rect x="120.0" y="170.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="178.0" y="200.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">D</text><rect x="245.0" y="170.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="303.0" y="200.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A</text><rect x="370.0" y="170.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="428.0" y="200.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Bm</text><rect x="495.0" y="170.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="553.0" y="200.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">G</text><text x="20.0" y="254.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">in B♭</text><rect x="120.0" y="224.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="178.0" y="254.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">B♭</text><rect x="245.0" y="224.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="303.0" y="254.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">F</text><rect x="370.0" y="224.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="428.0" y="254.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Gm</text><rect x="495.0" y="224.0" width="117.0" height="44.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="553.0" y="254.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">E♭</text><text x="20.0" y="302.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">To modulate up a tone for the last chorus (C to D): play A7, the V of D, then D.</text><text x="626" y="329" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>