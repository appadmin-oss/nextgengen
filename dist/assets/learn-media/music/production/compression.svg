<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" role="img" aria-labelledby="t d"><title id="t">How a compressor works</title><desc id="d">A graph of output level against input level. Below the threshold the line rises one-to-one; above it, at a 4:1 ratio, every 4 dB of extra input gives only 1 dB more output.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="396" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Compression: turning down what goes over the threshold</text><line x1="80.0" y1="330.0" x2="330.0" y2="330.0" stroke="#16233f" stroke-width="2" stroke-linecap="butt"/><line x1="80.0" y1="330.0" x2="80.0" y2="80.0" stroke="#16233f" stroke-width="2" stroke-linecap="butt"/><text x="205.0" y="360.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">level in</text><text x="64" y="205.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle" transform="rotate(-90 64 205.0)">level out</text><line x1="80.0" y1="330.0" x2="330.0" y2="80.0" stroke="#c9cedb" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="5 5"/><path d="M80 330 L230 180 L330 155.0" fill="none" stroke="#1a4fb4" stroke-width="4"/><circle cx="230.0" cy="180.0" r="6" fill="#a3361f" stroke="none" stroke-width="1.5"/><text x="220.0" y="166.0" font-size="16" font-weight="800" fill="#a3361f" text-anchor="end">threshold</text><text x="326.0" y="94.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="end">no compression</text><text x="334.0" y="161.0" font-size="18" font-weight="900" fill="#1a4fb4" text-anchor="start">4:1</text><text x="380.0" y="120.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Below the threshold: unchanged.</text><text x="380.0" y="150.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Above it, at 4:1: every 4 dB</text><text x="380.0" y="174.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">over comes out as 1 dB over.</text><text x="380.0" y="214.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Aim for 3–6 dB of gain</text><text x="380.0" y="238.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">reduction on vocal peaks.</text><text x="626" y="387" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>