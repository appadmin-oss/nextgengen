<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="t d"><title id="t">Panning in the stereo field</title><desc id="d">A stereo field from left to right. Lead vocal, kick, snare and bass in the centre; hi-hat slightly right, shekere left, keys left and guitar right, backing vocals spread wide on both sides.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="340" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Pan: where each part sits from left to right</text><rect x="20.0" y="100.0" width="600.0" height="140.0" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><line x1="320.0" y1="92.0" x2="320.0" y2="248.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt" stroke-dasharray="5 5"/><text x="30.0" y="88.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="start">L</text><text x="610.0" y="88.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="end">R</text><text x="320.0" y="80.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">centre</text><rect x="267.6" y="116.0" width="104.8" height="26.0" rx="6" fill="#f5b026" stroke="#f5b026" stroke-width="1.25"/><text x="320.0" y="136.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Lead vocal</text><rect x="295.4" y="148.0" width="49.1" height="26.0" rx="6" fill="#f5b026" stroke="#f5b026" stroke-width="1.25"/><text x="320.0" y="168.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Kick</text><rect x="290.8" y="180.0" width="58.4" height="26.0" rx="6" fill="#f5b026" stroke="#f5b026" stroke-width="1.25"/><text x="320.0" y="200.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Snare</text><rect x="295.4" y="212.0" width="49.1" height="26.0" rx="6" fill="#f5b026" stroke="#f5b026" stroke-width="1.25"/><text x="320.0" y="232.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Bass</text><rect x="396.2" y="128.0" width="67.7" height="26.0" rx="6" fill="#d3f1f6" stroke="#d3f1f6" stroke-width="1.25"/><text x="430.0" y="148.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Hi-hat</text><rect x="121.5" y="128.0" width="77.0" height="26.0" rx="6" fill="#d3f1f6" stroke="#d3f1f6" stroke-width="1.25"/><text x="160.0" y="148.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Shekere</text><rect x="486.2" y="168.0" width="67.7" height="26.0" rx="6" fill="#d3f1f6" stroke="#d3f1f6" stroke-width="1.25"/><text x="520.0" y="188.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Guitar</text><rect x="95.4" y="168.0" width="49.1" height="26.0" rx="6" fill="#d3f1f6" stroke="#d3f1f6" stroke-width="1.25"/><text x="120.0" y="188.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">Keys</text><rect x="70.1" y="208.0" width="39.8" height="26.0" rx="6" fill="#d3f1f6" stroke="#d3f1f6" stroke-width="1.25"/><text x="90.0" y="228.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">BVs</text><rect x="530.1" y="208.0" width="39.8" height="26.0" rx="6" fill="#d3f1f6" stroke="#d3f1f6" stroke-width="1.25"/><text x="550.0" y="228.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">BVs</text><text x="20.0" y="280.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Centre: kick, snare, bass, lead vocal. Spread the rest, balancing</text><text x="20.0" y="304.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">left against right. Check that the mix still works in mono.</text><text x="626" y="331" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>