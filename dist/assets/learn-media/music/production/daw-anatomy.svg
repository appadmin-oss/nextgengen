<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 408" width="640" height="408" role="img" aria-labelledby="t d"><title id="t">The parts of a DAW</title><desc id="d">A DAW window: the transport (play, stop, record, loop) at the top; tracks named Kick, Snare, Keys (MIDI) and Lead vox (audio) stacked vertically; clips laid on a timeline divided into bars, with time flowing left to right.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="408" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Inside every DAW</text><rect x="20.0" y="60.0" width="600.0" height="36.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="36.0" y="84.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">▶ play   ■ stop   ● record   ⟲ loop</text><text x="600.0" y="84.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="end">transport</text><text x="196.0" y="118.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">bar 1</text><line x1="190.0" y1="104.0" x2="190.0" y2="300.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="302.0" y="118.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">bar 2</text><line x1="296.0" y1="104.0" x2="296.0" y2="300.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="408.0" y="118.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">bar 3</text><line x1="402.0" y1="104.0" x2="402.0" y2="300.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><text x="514.0" y="118.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">bar 4</text><line x1="508.0" y1="104.0" x2="508.0" y2="300.0" stroke="#c9cedb" stroke-width="1.2" stroke-linecap="butt"/><rect x="20.0" y="130.0" width="165.0" height="36.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="30.0" y="154.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Kick</text><rect x="192.0" y="132.0" width="420.0" height="32.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="20.0" y="172.0" width="165.0" height="36.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="30.0" y="196.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Snare</text><rect x="192.0" y="174.0" width="420.0" height="32.0" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="20.0" y="214.0" width="165.0" height="36.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="30.0" y="238.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Keys (MIDI)</text><rect x="298.0" y="216.0" width="208.0" height="32.0" rx="4" fill="#d3f1f6" stroke="#16233f" stroke-width="1"/><rect x="20.0" y="256.0" width="165.0" height="36.0" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="30.0" y="280.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Lead vox (audio)</text><rect x="404.0" y="258.0" width="208.0" height="32.0" rx="4" fill="#fcd9cf" stroke="#16233f" stroke-width="1"/><line x1="190.0" y1="318.0" x2="610.0" y2="318.0" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="400.0" y="342.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">time flows left to right, in bars and beats</text><text x="20.0" y="372.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Tracks stack top to bottom; the mixer sets volume, pan and effects.</text><text x="626" y="399" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>