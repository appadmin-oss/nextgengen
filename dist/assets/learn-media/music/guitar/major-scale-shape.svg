<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">Movable major scale shape, G major</title><desc id="d">G major, frets 2 to 5. 6th string F sharp 2, G 3, A 5; 5th string B 2, C 3, D 5; 4th string E 2, F sharp 4, G 5; 3rd string A 2, B 4, C 5; 2nd string D 3, E 5; 1st string F sharp 2, G 3, A 5. Roots G on the 6th string fret 3, 4th string fret 5 and 1st string fret 3.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A movable major-scale shape: G major at fret 3</text><line x1="54.0" y1="80.0" x2="620.0" y2="80.0" stroke="#3d4560" stroke-width="1.0" stroke-linecap="butt"/><text x="22.0" y="86.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">E</text><line x1="54.0" y1="106.0" x2="620.0" y2="106.0" stroke="#3d4560" stroke-width="1.35" stroke-linecap="butt"/><text x="22.0" y="112.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">B</text><line x1="54.0" y1="132.0" x2="620.0" y2="132.0" stroke="#3d4560" stroke-width="1.7" stroke-linecap="butt"/><text x="22.0" y="138.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">G</text><line x1="54.0" y1="158.0" x2="620.0" y2="158.0" stroke="#3d4560" stroke-width="2.05" stroke-linecap="butt"/><text x="22.0" y="164.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">D</text><line x1="54.0" y1="184.0" x2="620.0" y2="184.0" stroke="#3d4560" stroke-width="2.4" stroke-linecap="butt"/><text x="22.0" y="190.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">A</text><line x1="54.0" y1="210.0" x2="620.0" y2="210.0" stroke="#3d4560" stroke-width="2.75" stroke-linecap="butt"/><text x="22.0" y="216.0" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">E</text><line x1="54.0" y1="80.0" x2="54.0" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><line x1="148.3" y1="80.0" x2="148.3" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><line x1="242.7" y1="80.0" x2="242.7" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><line x1="337.0" y1="80.0" x2="337.0" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><line x1="431.3" y1="80.0" x2="431.3" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><line x1="525.7" y1="80.0" x2="525.7" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><line x1="620.0" y1="80.0" x2="620.0" y2="210.0" stroke="#16233f" stroke-width="1.6" stroke-linecap="butt"/><text x="101.2" y="236.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="middle">1</text><text x="195.5" y="236.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="middle">2</text><text x="289.8" y="236.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="middle">3</text><circle cx="289.8" cy="145.0" r="5" fill="#c9cedb" stroke="none" stroke-width="1.5"/><text x="384.2" y="236.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="middle">4</text><text x="478.5" y="236.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="middle">5</text><circle cx="478.5" cy="145.0" r="5" fill="#c9cedb" stroke="none" stroke-width="1.5"/><text x="572.8" y="236.0" font-size="16" font-weight="600" fill="#5a6488" text-anchor="middle">6</text><circle cx="195.5" cy="210.0" r="15" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="195.5" y="215.5" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">F♯</text><circle cx="289.8" cy="210.0" r="12.5" fill="#f5b026" stroke="#16233f" stroke-width="1.2"