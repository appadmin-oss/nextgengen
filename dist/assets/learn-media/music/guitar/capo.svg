<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img" aria-labelledby="t d"><title id="t">Capo positions and the keys they give</title><desc id="d">A capo clamped at fret 2. Capo 2 with G-shape chords G C D Em sounds A D E F-sharp minor. Capo 3 with G shapes sounds B-flat E-flat F G minor. Capo 2 with C shapes C F G Am sounds D G A B minor.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="372" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A capo moves familiar shapes to a new key</text><rect x="20.0" y="60.0" width="600.0" height="54.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><line x1="60.0" y1="60.0" x2="60.0" y2="114.0" stroke="#3d4560" stroke-width="6" stroke-linecap="butt"/><line x1="140.0" y1="60.0" x2="140.0" y2="114.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt"/><line x1="220.0" y1="60.0" x2="220.0" y2="114.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt"/><line x1="300.0" y1="60.0" x2="300.0" y2="114.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt"/><line x1="380.0" y1="60.0" x2="380.0" y2="114.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt"/><line x1="460.0" y1="60.0" x2="460.0" y2="114.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt"/><line x1="540.0" y1="60.0" x2="540.0" y2="114.0" stroke="#3d4560" stroke-width="2" stroke-linecap="butt"/><rect x="160" y="52" width="16" height="70" rx="6" fill="#ef6b4d" stroke="#16233f" stroke-width="1.5"/><line x1="440.0" y1="87.0" x2="186.0" y2="87.0" stroke="#a3361f" stroke-width="2" stroke-linecap="round" marker-end="url(#a)"/><text x="450.0" y="93.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">capo at fret 2</text><text x="20.0" y="160.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">You play</text><text x="240.0" y="160.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">shapes</text><text x="430.0" y="160.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="start">it sounds</text><rect x="20.0" y="176.0" width="600.0" height="38.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="32.0" y="202.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Capo 2, G shapes</text><text x="240.0" y="202.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">G C D Em</text><text x="430.0" y="202.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">A D E F♯m</text><rect x="20.0" y="222.0" width="600.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="32.0" y="248.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Capo 3, G shapes</text><text x="240.0" y="248.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">G C D Em</text><text x="430.0" y="248.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">B♭ E♭ F Gm</text><rect x="20.0" y="268.0" width="600.0" height="38.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="32.0" y="294.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">Capo 2, C shapes</text><text x="240.0" y="294.0" font-size="16" font-weight="700" fill="#16233f" text-anchor="start">C F G Am</text><text x="430.0" y="294.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="start">D G A Bm</text><text x="20.0" y="336.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Semitones from the shape&#x27;s key to the song&#x27;s key = the capo fret.</text><text x="626" y="363" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>