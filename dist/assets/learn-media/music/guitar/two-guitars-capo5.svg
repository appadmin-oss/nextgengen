<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="t d"><title id="t">Two-guitar arrangement with capo 5</title><desc id="d">For a song with the chords G C D Em, guitar 1 plays those open shapes; guitar 2 with a capo at fret 5 plays D G A Bm shapes, which sound as G C D Em.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="296" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Guitar 2 at capo 5: same chords, higher voicings</text><text x="20.0" y="94.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Song chord</text><rect x="250.0" y="64.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="292.0" y="94.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">G</text><rect x="342.0" y="64.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="384.0" y="94.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">C</text><rect x="434.0" y="64.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="476.0" y="94.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">D</text><rect x="526.0" y="64.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="568.0" y="94.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Em</text><text x="20.0" y="150.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Guitar 1 plays (open)</text><rect x="250.0" y="120.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="292.0" y="150.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">G</text><rect x="342.0" y="120.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="384.0" y="150.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">C</text><rect x="434.0" y="120.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="476.0" y="150.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">D</text><rect x="526.0" y="120.0" width="84.0" height="44.0" rx="6" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="568.0" y="150.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Em</text><text x="20.0" y="206.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="start">Guitar 2 plays (capo 5)</text><rect x="250.0" y="176.0" width="84.0" height="44.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="292.0" y="206.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">D</text><rect x="342.0" y="176.0" width="84.0" height="44.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="384.0" y="206.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">G</text><rect x="434.0" y="176.0" width="84.0" height="44.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="476.0" y="206.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">A</text><rect x="526.0" y="176.0" width="84.0" height="44.0" rx="6" fill="#fde7b8" stroke="#c9cedb" stroke-width="1.25"/><text x="568.0" y="206.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">Bm</text><text x="20.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Capo 5 raises each shape five semitones: D sounds G, Bm sounds Em.</text><text x="626" y="287" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>