<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="t d"><title id="t">Sweep picking an A minor triad</title><desc id="d">Tab: G string fret 14 (A), B string 13 (C), high E 12 (E) with one down-stroke motion, then B 13 (C) and G 14 (A) with one up-stroke motion.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="330" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">A three-string sweep: A minor triad</text><line x1="40.0" y1="90.0" x2="600.0" y2="90.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="110.0" x2="600.0" y2="110.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="130.0" x2="600.0" y2="130.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="150.0" x2="600.0" y2="150.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="170.0" x2="600.0" y2="170.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="190.0" x2="600.0" y2="190.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><rect x="42" y="96" width="24" height="88" fill="#ffffff"/><text x="54.0" y="124.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="middle">T</text><text x="54.0" y="146.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="middle">A</text><text x="54.0" y="168.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="middle">B</text><rect x="116.0" y="120.0" width="28" height="20" fill="#ffffff"/><text x="130.0" y="136.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">14</text><rect x="196.0" y="100.0" width="28" height="20" fill="#ffffff"/><text x="210.0" y="116.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">13</text><rect x="276.0" y="80.0" width="28" height="20" fill="#ffffff"/><text x="290.0" y="96.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">12</text><rect x="356.0" y="100.0" width="28" height="20" fill="#ffffff"/><text x="370.0" y="116.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">13</text><rect x="436.0" y="120.0" width="28" height="20" fill="#ffffff"/><text x="450.0" y="136.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">14</text><text x="130.0" y="74.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle">⊓</text><text x="130.0" y="232.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">A</text><text x="210.0" y="74.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle">⊓</text><text x="210.0" y="232.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">C</text><text x="290.0" y="74.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle">⊓</text><text x="290.0" y="232.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">E</text><text x="370.0" y="74.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle">V</text><text x="370.0" y="232.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">C</text><text x="450.0" y="74.0" font-size="20" font-weight="900" fill="#16233f" text-anchor="middle">V</text><text x="450.0" y="232.0" font-size="16" font-weight="800" fill="#3d4560" text-anchor="middle">A</text><text x="20.0" y="270.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">⊓ = down-stroke, V = up-stroke: one motion down through G–B–E, then back up.</text><text x="20.0" y="294.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Lift each finger as the next note sounds, so the notes never ring together.</text><text x="626" y="321" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>