<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" role="img" aria-labelledby="t d"><title id="t">Hammer-on, pull-off, slide, bend and vibrato in tab</title><desc id="d">Tab: G string 5 hammer-on 7 (C to D); B string 8 pull-off 5 (G to E); D string slide 5 to 7 (G to A); G string fret 7 bent a whole step to sound like fret 9 (D up to E); high E fret 5 with vibrato (A).</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="324" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Four ways to join notes, in the A minor pentatonic</text><line x1="40.0" y1="80.0" x2="600.0" y2="80.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="100.0" x2="600.0" y2="100.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="120.0" x2="600.0" y2="120.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="140.0" x2="600.0" y2="140.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="160.0" x2="600.0" y2="160.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><line x1="40.0" y1="180.0" x2="600.0" y2="180.0" stroke="#3d4560" stroke-width="1.2" stroke-linecap="butt"/><rect x="42" y="86" width="24" height="88" fill="#ffffff"/><text x="54.0" y="114.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="middle">T</text><text x="54.0" y="136.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="middle">A</text><text x="54.0" y="158.0" font-size="18" font-weight="900" fill="#16233f" text-anchor="middle">B</text><rect x="101.0" y="110.0" width="38" height="20" fill="#ffffff"/><text x="120.0" y="126.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">5h7</text><rect x="221.0" y="90.0" width="38" height="20" fill="#ffffff"/><text x="240.0" y="106.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">8p5</text><rect x="341.0" y="130.0" width="38" height="20" fill="#ffffff"/><text x="360.0" y="146.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">5/7</text><rect x="461.0" y="110.0" width="38" height="20" fill="#ffffff"/><text x="480.0" y="126.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">7b9</text><rect x="566.0" y="70.0" width="28" height="20" fill="#ffffff"/><text x="580.0" y="86.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">5~</text><text x="120.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">hammer-on</text><text x="120.0" y="246.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">C → D</text><text x="240.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">pull-off</text><text x="240.0" y="246.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">G → E</text><text x="360.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">slide</text><text x="360.0" y="246.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">G → A</text><text x="480.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">bend</text><text x="480.0" y="246.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">D up to E</text><text x="580.0" y="222.0" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">vibrato</text><text x="580.0" y="246.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">on A</text><text x="20.0" y="288.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">A whole-step bend must reach the pitch two frets higher (fret 9).</text><text x="626" y="315" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>