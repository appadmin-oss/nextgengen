<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" width="640" height="376" role="img" aria-labelledby="t d"><title id="t">12-bar blues in A</title><desc id="d">Twelve bars in three rows of four: A A A A, D D A A, E D A E — I I I I, IV IV I I, V IV I V. The last bar&#x27;s E is the turnaround.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="376" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">The 12-bar blues in A</text><rect x="20.0" y="60.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="32.0" y="86.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 1</text><text x="91.0" y="118.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="170.0" y="60.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="182.0" y="86.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 2</text><text x="241.0" y="118.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="320.0" y="60.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="332.0" y="86.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 3</text><text x="391.0" y="118.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="470.0" y="60.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="482.0" y="86.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 4</text><text x="541.0" y="118.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="20.0" y="146.0" width="142.0" height="76.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="32.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 5</text><text x="91.0" y="204.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">D  (IV)</text><rect x="170.0" y="146.0" width="142.0" height="76.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="182.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 6</text><text x="241.0" y="204.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">D  (IV)</text><rect x="320.0" y="146.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="332.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 7</text><text x="391.0" y="204.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="470.0" y="146.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="482.0" y="172.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 8</text><text x="541.0" y="204.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="20.0" y="232.0" width="142.0" height="76.0" rx="8" fill="#fcd9cf" stroke="#16233f" stroke-width="1.2"/><text x="32.0" y="258.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 9</text><text x="91.0" y="290.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">E  (V)</text><rect x="170.0" y="232.0" width="142.0" height="76.0" rx="8" fill="#d3f1f6" stroke="#16233f" stroke-width="1.2"/><text x="182.0" y="258.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 10</text><text x="241.0" y="290.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">D  (IV)</text><rect x="320.0" y="232.0" width="142.0" height="76.0" rx="8" fill="#fde7b8" stroke="#16233f" stroke-width="1.2"/><text x="332.0" y="258.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 11</text><text x="391.0" y="290.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">A  (I)</text><rect x="470.0" y="232.0" width="142.0" height="76.0" rx="8" fill="#fcd9cf" stroke="#16233f" stroke-width="1.2"/><text x="482.0" y="258.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start">bar 12</text><text x="541.0" y="290.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">E  (V)</text><text x="20.0" y="340.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Bar 12 is the turnaround: E (V) pulls back to bar 1. Often played as A7, D7, E7.</text><text x="626" y="367" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>