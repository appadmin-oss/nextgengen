<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326" role="img" aria-labelledby="t d"><title id="t">Rest stroke and free stroke</title><desc id="d">Two side views of the plucking finger. In a rest stroke it plays through the string and comes to rest on the next string. In a free stroke it plucks and lifts up into the hand, clear of the next string.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="326" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Rest stroke and free stroke (seen from the side)</text><rect x="30.0" y="60.0" width="280.0" height="200.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="170.0" y="88.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Rest stroke (apoyando)</text><circle cx="110.0" cy="200.0" r="9" fill="#ffffff" stroke="#16233f" stroke-width="2"/><circle cx="160.0" cy="200.0" r="9" fill="#ffffff" stroke="#16233f" stroke-width="2"/><circle cx="210.0" cy="200.0" r="9" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="110.0" y="235.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">played</text><text x="160.0" y="235.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">next</text><path d="M96 168 C106 222 142 222 152 196" fill="none" stroke="#1a4fb4" stroke-width="3" marker-end="url(#a)"/><text x="230.0" y="150.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">lands on the</text><text x="230.0" y="172.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">next string</text><rect x="340.0" y="60.0" width="280.0" height="200.0" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><text x="480.0" y="88.0" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">Free stroke (tirando)</text><circle cx="420.0" cy="200.0" r="9" fill="#ffffff" stroke="#16233f" stroke-width="2"/><circle cx="470.0" cy="200.0" r="9" fill="#ffffff" stroke="#16233f" stroke-width="2"/><circle cx="520.0" cy="200.0" r="9" fill="#ffffff" stroke="#16233f" stroke-width="2"/><text x="420.0" y="235.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">played</text><text x="470.0" y="235.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">next</text><path d="M400 170 C420 210 440 180 440 120" fill="none" stroke="#1a4fb4" stroke-width="3" marker-end="url(#a)"/><text x="540.0" y="150.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">lifts into</text><text x="540.0" y="172.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">the hand</text><text x="30.0" y="290.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Rest stroke: full tone, for melody. Free stroke: for arpeggios, chords.</text><text x="626" y="317" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>