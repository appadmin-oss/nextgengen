<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d"><title id="t">Interlocking guitar parts</title><desc id="d">A sixteen-step grid counted 1 e and a. Guitar 1 plays a riff, guitar 2 plays in the gaps it leaves, and the rhythm guitar plays muted chords on the &#x27;and&#x27; of each beat.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker></defs><rect width="640" height="320" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text x="20.0" y="36.0" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">Interlocking guitar parts: each fills the other&#x27;s gaps</text><rect x="121.0" y="60.0" width="29.2" height="166.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="135.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">1</text><rect x="152.2" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="166.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">e</text><rect x="183.5" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="198.1" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="214.8" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="229.4" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">a</text><rect x="246.0" y="60.0" width="29.2" height="166.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="260.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">2</text><rect x="277.2" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="291.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">e</text><rect x="308.5" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="323.1" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="339.8" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="354.4" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">a</text><rect x="371.0" y="60.0" width="29.2" height="166.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="385.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="402.2" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="416.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">e</text><rect x="433.5" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="448.1" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">&amp;</text><rect x="464.8" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="479.4" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">a</text><rect x="496.0" y="60.0" width="29.2" height="166.0" rx="4" fill="#fde7b8" stroke="none" stroke-width="1.25"/><text x="510.6" y="84.0" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="527.2" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="541.9" y="84.0" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">e</text><rect x="558.5" y="60.0" width="29.2" height="166.0" rx="4" fill="#f3f5fa" stroke="none" stroke-width="1.25"/><text x="573.1" y="84.0" font-size="16" font-weight="600" fill="#3d4560" 