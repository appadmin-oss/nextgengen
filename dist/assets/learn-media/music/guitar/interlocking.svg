idth="1.5"/><circle cx="573.1" cy="204.0" r="11" fill="#16233f" stroke="none" stroke-width="1.5"/><text x="20.0" y="260.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">An example to copy: riff, answering thirds, muted off-beat chords.</text><text x="20.0" y="284.0" font-size="16" font-weight="600" fill="#16233f" text-anchor="start">Each part is simple; the shimmer comes from how they fit.</text><text x="626" y="311" font-size="16" font-weight="700" fill="#5a6488" text-anchor="end">NGG · Learn</text></g></svg>