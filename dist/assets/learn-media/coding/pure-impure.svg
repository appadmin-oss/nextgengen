<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" role="img" aria-labelledby="t d"><title id="t">Pure and impure functions</title><desc id="d">A pure function beside one that changes an outside variable.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="284" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Pure: input to output, nothing else</text><rect x="20" y="56" width="290" height="210" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="84" font-size="18" font-weight="800" fill="#1d6b30" text-anchor="start" xml:space="preserve">Pure</text><rect x="36" y="104" width="70" height="44" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="36 104 70 44"><text x="71" y="130.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1000</text></g><line x1="110" y1="126" x2="126" y2="126" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="130" y="104" width="100" height="44" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="130 104 100 44"><text x="180" y="130.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">withTax</text></g><line x1="234" y1="126" x2="250" y2="126" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="252" y="104" width="54" height="44" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="252 104 54 44"><text x="279" y="130.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1075</text></g><text x="36" y="196" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">same input, same output,</text><text x="36" y="220" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">every time</text><rect x="330" y="56" width="290" height="210" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="84" font-size="18" font-weight="800" fill="#9c3119" text-anchor="start" xml:space="preserve">Impure</text><rect x="346" y="104" width="130" height="44" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="346 104 130 44"><text x="411" y="130.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">addToTotal</text></g><rect x="500" y="104" width="104" height="44" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="500 104 104 44"><text x="552" y="130.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">total</text></g><line x1="478" y1="126" x2="496" y2="126" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="346" y="196" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">changes something outside:</text><text x="346" y="220" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">twice is not the same</text></g></svg>