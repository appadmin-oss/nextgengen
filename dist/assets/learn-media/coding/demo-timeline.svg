<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" width="640" height="226" role="img" aria-labelledby="t d"><title id="t">Showcase timing</title><desc id="d">A bar split into problem, demo, how and next.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="226" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Three minutes, mostly demo</text><rect x="20" y="66" width="100" height="70" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="20 66 100 70"><text x="70" y="95.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Problem</text><text x="70" y="115.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">30 s</text></g><rect x="120" y="66" width="300" height="70" rx="4" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="120 66 300 70"><text x="270" y="95.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Demo</text><text x="270" y="115.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">90 s</text></g><rect x="420" y="66" width="133.333" height="70" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="420 66 133.333 70"><text x="486.667" y="95.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">How</text><text x="486.667" y="115.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">40 s</text></g><rect x="553.333" y="66" width="66.6667" height="70" rx="4" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="553.333 66 66.6667 70"><text x="586.667" y="95.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">Next</text><text x="586.667" y="115.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">20 s</text></g><text x="20" y="166" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">0:00</text><text x="620" y="166" font-size="16" font-weight="600" fill="#3d4560" text-anchor="end" xml:space="preserve">3:00</text><text x="20" y="206" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Rehearse twice with a timer; keep screenshots as a backup.</text></g></svg>