<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-labelledby="t d"><title id="t">Colour contrast ratio</title><desc id="d">A contrast scale and three text colours on white.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="348" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Is the text colour readable on its background?</text><line x1="40" y1="120" x2="600" y2="120" stroke="#3d4560" stroke-width="3"/><line x1="40" y1="110" x2="40" y2="130" stroke="#3d4560" stroke-width="2"/><text x="40" y="154" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">1:1</text><line x1="242.075" y1="110" x2="242.075" y2="130" stroke="#3d4560" stroke-width="2"/><text x="242.075" y="154" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">3:1</text><line x1="316.655" y1="110" x2="316.655" y2="130" stroke="#3d4560" stroke-width="2"/><text x="316.655" y="154" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">4.5:1</text><line x1="397.925" y1="110" x2="397.925" y2="130" stroke="#3d4560" stroke-width="2"/><text x="397.925" y="154" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">7:1</text><line x1="600" y1="110" x2="600" y2="130" stroke="#3d4560" stroke-width="2"/><text x="600" y="154" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">21:1</text><rect x="316.655" y="84" width="283.345" height="18" rx="4" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><text x="324.655" y="78" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">normal text: 4.5:1 or more</text><rect x="30" y="186" width="180" height="64" rx="8" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="46" y="202" width="148" height="12" rx="3" fill="#16233f"/><rect x="46" y="222" width="100" height="12" rx="3" fill="#16233f"/><text x="120" y="276" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">navy 15.6:1</text><text x="120" y="300" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="middle" xml:space="preserve">pass</text><rect x="230" y="186" width="180" height="64" rx="8" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="246" y="202" width="148" height="12" rx="3" fill="#767676"/><rect x="246" y="222" width="100" height="12" rx="3" fill="#767676"/><text x="320" y="276" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">mid grey 4.5:1</text><text x="320" y="300" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="middle" xml:space="preserve">pass</text><rect x="430" y="186" width="180" height="64" rx="8" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="446" y="202" width="148" height="12" rx="3" fill="#c9cedb"/><rect x="446" y="222" width="100" height="12" rx="3" fill="#c9cedb"/><text x="520" y="276" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">light grey 1.6:1</text><text x="520" y="300" font-size="16" font-weight="800" fill="#9c3119" text-anchor="middle" xml:space="preserve">fail</text><text x="20" y="330" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">The bars stand for lines of text in each colour on white.</text></g></svg>