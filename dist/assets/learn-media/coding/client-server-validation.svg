<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" width="640" height="346" role="img" aria-labelledby="t d"><title id="t">Client and server validation</title><desc id="d">Browser and server checks; bypass paths reach the server.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="346" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Check in the browser, and again on the server</text><rect x="20" y="60" width="200" height="110" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 200 110"><text x="120" y="99.348" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Browser check</text><text x="120" y="120.876" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">quick help for</text><text x="120" y="141.676" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">honest users</text></g><rect x="420" y="60" width="200" height="110" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="420 60 200 110"><text x="520" y="99.348" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Server check</text><text x="520" y="120.876" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">the real</text><text x="520" y="141.676" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">protection</text></g><line x1="224" y1="100" x2="414" y2="100" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="319" y="90" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">normal use</text><rect x="20" y="210" width="200" height="70" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 210 200 70"><text x="120" y="239.176" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">DevTools: delete</text><text x="120" y="259.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">required</text></g><path d="M224 245 H330 V146 H414" fill="none" stroke="#9c3119" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="20" y="304" font-size="16" font-weight="600" fill="#9c3119" text-anchor="start" xml:space="preserve">A request sent straight to the server skips the browser</text><text x="20" y="328" font-size="16" font-weight="600" fill="#9c3119" text-anchor="start" xml:space="preserve">check entirely: only the server can stop it.</text></g></svg>