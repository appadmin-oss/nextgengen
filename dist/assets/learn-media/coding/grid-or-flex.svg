<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" width="640" height="302" role="img" aria-labelledby="t d"><title id="t">Grid versus Flexbox</title><desc id="d">Flexbox items in one row; grid cells in rows and columns.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="302" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">One direction, or two?</text><rect x="20" y="56" width="290" height="200" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="84" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Flexbox: a line</text><rect x="36" y="104" width="60" height="40" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="36 104 60 40"><text x="66" y="128.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">1</text></g><rect x="106" y="104" width="96" height="40" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="106 104 96 40"><text x="154" y="128.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">2</text></g><rect x="212" y="104" width="72" height="40" rx="6" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="212 104 72 40"><text x="248" y="128.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">3</text></g><text x="36" y="186" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">content decides sizes:</text><text x="36" y="210" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">nav bars, tags, buttons</text><rect x="330" y="56" width="290" height="200" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="84" font-size="18" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Grid: rows and columns</text><rect x="346" y="100" width="78" height="30" rx="4" fill="#dff3f7" stroke="#20b2c9"/><rect x="432" y="100" width="78" height="30" rx="4" fill="#dff3f7" stroke="#20b2c9"/><rect x="518" y="100" width="78" height="30" rx="4" fill="#dff3f7" stroke="#20b2c9"/><rect x="346" y="138" width="78" height="30" rx="4" fill="#dff3f7" stroke="#20b2c9"/><rect x="432" y="138" width="78" height="30" rx="4" fill="#dff3f7" stroke="#20b2c9"/><rect x="518" y="138" width="78" height="30" rx="4" fill="#dff3f7" stroke="#20b2c9"/><text x="346" y="210" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">layout decides: pages, galleries</text><text x="20" y="284" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Most real pages use both.</text></g></svg>