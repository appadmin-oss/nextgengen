<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" width="640" height="298" role="img" aria-labelledby="t d"><title id="t">How a for loop runs</title><desc id="d">Start, check, body, step, check again; exit when false.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="298" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">for (let i = 1; i &lt;= 5; i++)</text><rect x="220" y="56" width="200" height="44" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 56 200 44"><text x="320" y="82.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">start: let i = 1</text></g><line x1="320" y1="102" x2="320" y2="126" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="320,128 420,166 320,204 220,166" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="262 141 116 50"><text x="320" y="172" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">i &lt;= 5 ?</text></g><rect x="220" y="236" width="200" height="44" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 236 200 44"><text x="320" y="262.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">run the body</text></g><line x1="320" y1="206" x2="320" y2="232" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="332" y="224" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">true</text><rect x="20" y="236" width="150" height="44" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 236 150 44"><text x="95" y="262.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">step: i++</text></g><line x1="216" y1="258" x2="174" y2="258" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><path d="M95 234 V166 H216" fill="none" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><line x1="422" y1="166" x2="486" y2="166" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="452" y="156" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">false</text><rect x="490" y="140" width="130" height="52" rx="10" fill="#ffffff" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="490 140 130 52"><text x="555" y="170.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">carry on</text></g></g></svg>