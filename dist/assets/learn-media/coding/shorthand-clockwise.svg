<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" role="img" aria-labelledby="t d"><title id="t">CSS shorthand order</title><desc id="d">Top, right, bottom, left around a box.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="342" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Four values go clockwise from the top</text><text x="320" y="74" font-size="18" font-weight="700" fill="#16233f" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">margin: 8px 16px 4px 0;</text><rect x="220" y="130" width="200" height="100" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 130 200 100"><text x="320" y="184.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">the box</text></g><text x="320" y="118" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">1  top 8px</text><text x="432" y="186" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">2  right 16px</text><text x="320" y="258" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">3  bottom 4px</text><text x="208" y="186" font-size="16" font-weight="700" fill="#16233f" text-anchor="end" xml:space="preserve">4  left 0</text><text x="20" y="300" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Two values: margin: 8px 16px → top and bottom 8px,</text><text x="20" y="324" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">left and right 16px.</text></g></svg>