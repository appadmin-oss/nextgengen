<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="t d"><title id="t">Caching an API answer</title><desc id="d">A decision between a fresh saved answer and a new fetch.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="320" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Cache the answer with the time you got it</text><rect x="20" y="60" width="180" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 180 52"><text x="110" y="90.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">need the data</text></g><line x1="202" y1="86" x2="236" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><polygon points="350,44 460,86 350,128 240,86" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="287 59 126 54"><text x="350" y="81.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">saved and</text><text x="350" y="102.5" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">&lt; 1 hour old?</text></g><line x1="462" y1="86" x2="496" y2="86" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="478" y="76" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">yes</text><rect x="500" y="60" width="120" height="52" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="500 60 120 52"><text x="560" y="90.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">use it</text></g><line x1="350" y1="130" x2="350" y2="162" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="362" y="154" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">no</text><rect x="220" y="166" width="260" height="52" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="220 166 260 52"><text x="350" y="196.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">fetch from the API</text></g><line x1="350" y1="220" x2="350" y2="246" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="160" y="250" width="380" height="52" rx="10" fill="#dff3f7" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="160 250 380 52"><text x="350" y="280.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">save { data, time: Date.now() }</text></g></g></svg>