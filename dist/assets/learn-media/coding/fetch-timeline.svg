<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" role="img" aria-labelledby="t d"><title id="t">Asynchronous fetch</title><desc id="d">A timeline of waiting and the two endings.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="382" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">The page keeps working while it waits</text><text x="20" y="86" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">request</text><line x1="110" y1="80" x2="610" y2="80" stroke="#c9cedb" stroke-width="2"/><rect x="110" y="66" width="330" height="28" rx="6" fill="#dff3f7" stroke="#20b2c9" stroke-width="1.25"/><g data-fit="110 66 330 28"><text x="275" y="86" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">waiting… (show “Loading”)</text></g><text x="20" y="136" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">page</text><rect x="110" y="116" width="500" height="28" rx="6" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="110 116 500 28"><text x="360" y="136" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">still scrolls, still responds</text></g><line x1="440" y1="60" x2="440" y2="160" stroke="#3d4560" stroke-width="2" stroke-dasharray="5 4"/><text x="444" y="180" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">response arrives</text><polygon points="200,215 290,250 200,285 110,250" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.5"/><g data-fit="147 226.5 106 47"><text x="200" y="256" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">res.ok?</text></g><line x1="292" y1="250" x2="356" y2="250" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="324" y="240" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">yes</text><rect x="360" y="224" width="260" height="52" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="360 224 260 52"><text x="490" y="254.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">await res.json(), show it</text></g><line x1="200" y1="287" x2="200" y2="312" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="212" y="306" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">no, or network down</text><rect x="90" y="316" width="330" height="48" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><g data-fit="90 316 330 48"><text x="255" y="344.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">error message + Try again</text></g></g></svg>