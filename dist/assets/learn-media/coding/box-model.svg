<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" width="640" height="384" role="img" aria-labelledby="t d"><title id="t">The CSS box model</title><desc id="d">Nested rectangles: margin, border, padding, content, and the width sum.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="384" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Content, padding, border, margin</text><rect x="20" y="56" width="600" height="250" rx="6" fill="#ffffff" stroke="#3d4560" stroke-width="1.5" stroke-dasharray="6 5"/><text x="36" y="80" font-size="16" font-weight="600" fill="#3d4560" text-anchor="start" xml:space="preserve">margin (always transparent)</text><rect x="60" y="96" width="520" height="176" rx="4" fill="#3d4560" stroke="#3d4560" stroke-width="1.25"/><rect x="66" y="102" width="508" height="164" rx="2" fill="#dff3f7" stroke="#dff3f7" stroke-width="1.25"/><text x="82" y="128" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">padding (takes the background)</text><rect x="140" y="146" width="360" height="80" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="140 146 360 80"><text x="320" y="180.748" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">content</text><text x="320" y="202.276" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">width: 300px</text></g><text x="320" y="292" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">border</text><text x="20" y="340" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">Default: 2 + 20 + 300 + 20 + 2 = 344px wide.</text><text x="20" y="366" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">box-sizing: border-box → the whole box is 300px.</text></g></svg>