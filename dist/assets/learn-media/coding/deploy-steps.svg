<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="t d"><title id="t">Deploying a server</title><desc id="d">Repository, host settings and the live address.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="296" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">From your repo to a live address</text><rect x="20" y="60" width="170" height="76" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 60 170 76"><text x="105" y="81.776" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">GitHub repo</text><text x="105" y="102.576" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">no .env,</text><text x="105" y="123.376" font-size="16" font-weight="500" fill="#3d4560" text-anchor="middle" xml:space="preserve">no node_modules</text></g><line x1="192" y1="98" x2="226" y2="98" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="230" y="56" width="230" height="186" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="230 56 230 186"><text x="345" y="84" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">Host settings</text><text x="244" y="116" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">build: npm install</text><text x="244" y="144" font-size="16" font-weight="600" fill="#16233f" text-anchor="start" xml:space="preserve">start: node server.js</text><text x="244" y="180" font-size="16" font-weight="600" fill="#0b6274" text-anchor="start" xml:space="preserve">env: MONGODB_URI</text><text x="244" y="208" font-size="16" font-weight="600" fill="#0b6274" text-anchor="start" xml:space="preserve">env: PORT (set by host)</text></g><line x1="462" y1="98" x2="496" y2="98" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="500" y="60" width="120" height="76" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><g data-fit="500 60 120 76"><text x="560" y="92.176" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="middle" xml:space="preserve">live</text><text x="560" y="112.976" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">https://…</text></g><text x="20" y="276" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">listen on process.env.PORT || 3000</text></g></svg>