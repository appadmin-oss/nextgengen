<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" width="640" height="348" role="img" aria-labelledby="t d"><title id="t">Flexbox main and cross axis</title><desc id="d">Three items in a row with the two axes marked.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="348" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">display: flex — two axes</text><rect x="80" y="70" width="480" height="170" rx="10" fill="#f3f5fa" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><rect x="110" y="125" width="100" height="60" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="110 125 100 60"><text x="160" y="159.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">item 1</text></g><rect x="270" y="105" width="100" height="100" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="270 105 100 100"><text x="320" y="159.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">item 2</text></g><rect x="430" y="117" width="100" height="76" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25"/><g data-fit="430 117 100 76"><text x="480" y="159.576" font-size="16" font-weight="600" fill="#16233f" text-anchor="middle" xml:space="preserve">item 3</text></g><line x1="84" y1="270" x2="556" y2="270" stroke="#3d4560" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="320" y="298" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">main axis → justify-content</text><line x1="50" y1="74" x2="50" y2="236" stroke="#3d4560" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/><text x="34" y="155" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" transform="rotate(-90 34 155)">cross axis</text><text x="592" y="160" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">align-</text><text x="592" y="180" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">items</text><text x="20" y="330" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">flex-direction: column swaps them: main runs down.</text></g></svg>