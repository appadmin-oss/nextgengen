<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img" aria-labelledby="t d"><title id="t">CSS custom properties</title><desc id="d">One variable in :root feeding three rules.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="312" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Name a value once, use it everywhere</text><rect x="20" y="56" width="250" height="94" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 56 250 94"><text x="34" y="83.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">:root {</tspan></text><text x="34" y="108.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">  --brand: </tspan><tspan fill="#0b6274" font-weight="800">#16233f</tspan><tspan fill="#16233f" font-weight="500">;</tspan></text><text x="34" y="133.6" font-size="16" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve"><tspan fill="#16233f" font-weight="500">}</tspan></text></g><rect x="390" y="56" width="230" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="390 56 230 52"><text x="505" y="76.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">.button</text><text x="505" y="96.976" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">var(--brand)</text></g><line x1="272" y1="100" x2="386" y2="82" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="390" y="120" width="230" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="390 120 230 52"><text x="505" y="140.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">.card h2</text><text x="505" y="160.976" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">var(--brand)</text></g><line x1="272" y1="100" x2="386" y2="146" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="390" y="184" width="230" height="52" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="390 184 230 52"><text x="505" y="204.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">a:hover</text><text x="505" y="224.976" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle" xml:space="preserve">var(--brand)</text></g><line x1="272" y1="100" x2="386" y2="210" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text x="20" y="268" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">Change it in one place and all three follow,</text><text x="20" y="292" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">even inside a media query or from JavaScript.</text></g></svg>