<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" height="370" role="img" aria-labelledby="t d"><title id="t">Recursion step by step</title><desc id="d">Four nested calls down to an empty list, and their returns.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="370" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Down to the base case, then back up</text><rect x="40" y="56" width="240" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="40 56 240 46"><text x="160" y="83.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">sum([3, 5, 2])</text></g><text x="300" y="85" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start" xml:space="preserve">= 10</text><line x1="140" y1="104" x2="160" y2="114" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="80" y="116" width="240" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="80 116 240 46"><text x="200" y="143.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">3 + sum([5, 2])</text></g><text x="340" y="145" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start" xml:space="preserve">= 3 + 7 = 10</text><line x1="180" y1="164" x2="200" y2="174" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="120" y="176" width="240" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="120 176 240 46"><text x="240" y="203.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">5 + sum([2])</text></g><text x="380" y="205" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start" xml:space="preserve">= 5 + 2 = 7</text><line x1="220" y1="224" x2="240" y2="234" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="160" y="236" width="240" height="46" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25"/><g data-fit="160 236 240 46"><text x="280" y="263.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">2 + sum([])</text></g><text x="420" y="265" font-size="16" font-weight="700" fill="#0b6274" text-anchor="start" xml:space="preserve">= 2 + 0 = 2</text><rect x="200" y="296" width="240" height="46" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="200 296 240 46"><text x="320" y="323.576" font-size="16" font-weight="800" fill="#1d6b30" text-anchor="middle" xml:space="preserve">[] → 0  (base case)</text></g><line x1="320" y1="294" x2="320" y2="280" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="600" y1="330" x2="600" y2="70" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="588" y="310" font-size="16" font-weight="700" fill="#0b6274" text-anchor="end" xml:space="preserve">answers</text><text x="588" y="332" font-size="16" font-weight="700" fill="#0b6274" text-anchor="end" xml:space="preserve">come back up</text></g></svg>