<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" width="640" height="274" role="img" aria-labelledby="t d"><title id="t">Memory versus a database</title><desc id="d">An array emptied by a restart beside a database that keeps its data.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="274" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">What survives a restart?</text><rect x="20" y="56" width="290" height="200" rx="10" fill="#fde5df" stroke="#9c3119" stroke-width="1.25" filter="url(#sh)"/><text x="36" y="84" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0" xml:space="preserve">let tasks = []</text><text x="36" y="116" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">lives in memory</text><text x="36" y="160" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">restart →</text><rect x="140" y="140" width="150" height="40" rx="10" fill="#ffffff" stroke="#9c3119" stroke-width="1.25"/><g data-fit="140 140 150 40"><text x="215" y="164.576" font-size="16" font-weight="700" fill="#9c3119" text-anchor="middle" xml:space="preserve">[ ] empty</text></g><text x="36" y="228" font-size="16" font-weight="700" fill="#9c3119" text-anchor="start" xml:space="preserve">every task lost</text><rect x="330" y="56" width="290" height="200" rx="10" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.25" filter="url(#sh)"/><text x="346" y="84" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">MongoDB</text><text x="346" y="116" font-size="16" font-weight="500" fill="#16233f" text-anchor="start" xml:space="preserve">kept on disk</text><text x="346" y="160" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">restart →</text><rect x="450" y="140" width="150" height="40" rx="10" fill="#ffffff" stroke="#1d6b30" stroke-width="1.25"/><g data-fit="450 140 150 40"><text x="525" y="164.576" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="middle" xml:space="preserve">3 tasks</text></g><text x="346" y="228" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">still there</text></g></svg>