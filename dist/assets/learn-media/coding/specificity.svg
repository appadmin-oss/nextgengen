<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" role="img" aria-labelledby="t d"><title id="t">CSS specificity</title><desc id="d">Three selectors and their specificity scores.</desc><defs><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#16233f" flood-opacity=".13"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c3119"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6b30"/></marker></defs><rect width="640" height="342" fill="#ffffff"/><rect width="640" height="5" fill="#f5b026"/><g style="font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif"><text x="20" y="38" font-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Who wins? Count ids, then classes, then elements</text><text x="240" y="70" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle" xml:space="preserve">ids-classes-elements</text><rect x="20" y="84" width="150" height="44" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 84 150 44"><text x="95" y="110.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">p</text></g><rect x="190" y="84" width="100" height="44" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="190 84 100 44"><text x="240" y="111.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">0-0-1</text></g><text x="310" y="112" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">color: black</text><rect x="20" y="140" width="150" height="44" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 140 150 44"><text x="95" y="166.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">.intro</text></g><rect x="190" y="140" width="100" height="44" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="190 140 100 44"><text x="240" y="167.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">0-1-0</text></g><text x="310" y="168" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">color: navy</text><rect x="20" y="196" width="150" height="44" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 196 150 44"><text x="95" y="222.576" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">p.intro</text></g><rect x="190" y="196" width="100" height="44" rx="10" fill="#fdf0d2" stroke="#3d4560" stroke-width="1.25" filter="url(#sh)"/><g data-fit="190 196 100 44"><text x="240" y="223.148" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle" xml:space="preserve">0-1-1</text></g><text x="310" y="224" font-size="16" font-weight="700" fill="#1d6b30" text-anchor="start" xml:space="preserve">color: teal — wins</text><rect x="20" y="262" width="600" height="64" rx="10" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><g data-fit="20 262 600 64"><text x="34" y="288.176" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">A tie? The rule written LATER wins.</text><text x="34" y="308.976" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">!important beats both — avoid it.</text></g></g></svg>