-size="20" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Aa</text><text x="110" y="213.4" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">1.25rem  (20px)</text><text x="20" y="239.8" font-size="16" font-weight="800" fill="#16233f" text-anchor="start" xml:space="preserve">Aa</text><text x="110" y="239.8" font-size="16" font-weight="500" fill="#3d4560" text-anchor="start" xml:space="preserve">1rem — body  (16px)</text><rect x="330" y="60" width="290" height="210" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.25" filter="url(#sh)"/><rect x="346" y="80" width="258" height="8" rx="4" fill="#3d4560"/><rect x="346" y="104" width="258" height="8" rx="4" fill="#3d4560"/><rect x="346" y="128" width="258" height="8" rx="4" fill="#3d4560"/><rect x="346" y="152" width="258" height="8" rx="4" fill="#3d4560"/><rect x="346" y="176" width="258" height="8" rx="4" fill="#3d4560"/><rect x="346" y="200" width="150" height="8" rx="4" fill="#3d4560"/><path d="M346 236 H604" fill="none" stroke="#3d4560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="475" y="260" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle" xml:space="preserve">45–75 characters a line</text><text x="330" y="296" font-size="16" font-weight="700" fill="#16233f" text-anchor="start" xml:space="preserve">line-height about 1.5</text></g></svg>