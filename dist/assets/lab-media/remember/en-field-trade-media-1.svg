<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="From farm to market"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="60" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">from farm to market</text><rect x="15" y="100" width="130" height="70" rx="8" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="80" y="142" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">farmer</text><text xml:space="preserve" x="80" y="205" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">grows the crop</text><rect x="175" y="100" width="130" height="70" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="240" y="142" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">wholesaler</text><text xml:space="preserve" x="240" y="205" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">buys in bulk</text><rect x="335" y="100" width="130" height="70" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="400" y="142" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">retailer</text><text xml:space="preserve" x="400" y="205" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">sells to you</text><rect x="495" y="100" width="130" height="70" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="560" y="142" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">consumer</text><text xml:space="preserve" x="560" y="205" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">uses it</text><line x1="148" y1="135" x2="172" y2="135" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="308" y1="135" x2="332" y2="135" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="468" y1="135" x2="492" y2="135" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="320" y="280" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">yam from Benue reaches a Lagos kitchen this way</text></g></svg>