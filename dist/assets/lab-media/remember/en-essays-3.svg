<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Moving or looking"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="30" y="40" width="280" height="190" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="170" y="78" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">Narrative</text><text xml:space="preserve" x="170" y="120" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">tells what HAPPENED</text><text xml:space="preserve" x="170" y="154" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">past tense, in time order</text><text xml:space="preserve" x="170" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">then · later · at last</text><rect x="330" y="40" width="280" height="190" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="470" y="78" font-size="22" font-weight="800" fill="#a3361f" text-anchor="middle">Descriptive</text><text xml:space="preserve" x="470" y="120" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">shows what it is LIKE</text><text xml:space="preserve" x="470" y="154" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">the five senses</text><text xml:space="preserve" x="470" y="188" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">precise adjectives</text><text xml:space="preserve" x="320" y="280" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">show, don&#x27;t tell: &#x27;her hands shook&#x27;, not &#x27;she was scared&#x27;</text></g></svg>