<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Four times the length, twice the period"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="130" y1="40" x2="270" y2="40" stroke="#16233f" stroke-width="5" stroke-linecap="round"/><line x1="370" y1="40" x2="510" y2="40" stroke="#16233f" stroke-width="5" stroke-linecap="round"/><line x1="200" y1="40" x2="200.0" y2="95.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><circle cx="200.0" cy="95.0" r="13" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="440" y1="40" x2="440.0" y2="260.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><circle cx="440.0" cy="260.0" r="13" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="200" y="135" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">L = 0.25 m</text><text xml:space="preserve" x="200" y="162" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="middle">T ≈ 1 s</text><text xml:space="preserve" x="465" y="255" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">L = 1 m</text><text xml:space="preserve" x="465" y="282" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="start">T ≈ 2 s</text><text xml:space="preserve" x="250" y="315" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">4 × the length → 2 × the period</text></g></svg>