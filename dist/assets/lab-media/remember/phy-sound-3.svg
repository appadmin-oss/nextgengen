<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="The Doppler effect"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><circle cx="270" cy="170" r="45" fill="none" stroke="#20b2c9" stroke-width="2"/><circle cx="240" cy="170" r="90" fill="none" stroke="#20b2c9" stroke-width="2"/><circle cx="210" cy="170" r="135" fill="none" stroke="#20b2c9" stroke-width="2"/><circle cx="300" cy="170" r="10" fill="#ef6b4d" stroke="#16233f" stroke-width="1.5"/><line x1="312" y1="170" x2="347.0" y2="170.0" stroke="#16233f" stroke-width="3" stroke-linecap="round"/><polygon points="360.0,170.0 347.0,163.5 347.0,176.5" fill="#16233f"/><text xml:space="preserve" x="385" y="120" font-size="17" font-weight="800" fill="#0b6e80" text-anchor="start">ahead: waves squashed</text><text xml:space="preserve" x="385" y="145" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">→ higher pitch</text><text xml:space="preserve" x="385" y="205" font-size="17" font-weight="800" fill="#a3361f" text-anchor="start">behind: waves stretched</text><text xml:space="preserve" x="385" y="230" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">→ lower pitch</text></g></svg>