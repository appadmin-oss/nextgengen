<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Why a⁰ = 1"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="120" y="120" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">8</text><text xml:space="preserve" x="120" y="165" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">2³</text><text xml:space="preserve" x="220" y="120" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text xml:space="preserve" x="220" y="165" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">2²</text><text xml:space="preserve" x="320" y="120" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text xml:space="preserve" x="320" y="165" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">2¹</text><text xml:space="preserve" x="420" y="120" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text xml:space="preserve" x="420" y="165" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">2⁰</text><text xml:space="preserve" x="520" y="120" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">½</text><text xml:space="preserve" x="520" y="165" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">2⁻¹</text><text xml:space="preserve" x="320" y="240" font-size="18" font-weight="700" fill="#0b6e80" text-anchor="middle">each step down: ÷ 2</text><text xml:space="preserve" x="320" y="280" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">so 2⁰ = 1 and 2⁻¹ = ½ — the pattern decides</text></g></svg>