<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="One point, one sentence"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="60" y="45" width="520" height="54" rx="8" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="90" y="80" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">1</text><text xml:space="preserve" x="120" y="80" font-size="20" font-weight="700" fill="#16233f" text-anchor="start">Exercise strengthens the heart.</text><rect x="60" y="115" width="520" height="54" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="90" y="150" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">2</text><text xml:space="preserve" x="120" y="150" font-size="20" font-weight="700" fill="#16233f" text-anchor="start">It reduces stress.</text><rect x="60" y="185" width="520" height="54" rx="8" fill="#e3f1e6" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="90" y="220" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">3</text><text xml:space="preserve" x="120" y="220" font-size="20" font-weight="700" fill="#16233f" text-anchor="start">It helps you sleep well.</text><text xml:space="preserve" x="320" y="300" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">one point · one short sentence · your own words</text></g></svg>