<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Both sides of a formula must have the same units"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">v  =  u  +  at</text><text xml:space="preserve" x="320" y="112" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">m/s  =  m/s  +  (m/s²) × s</text><text xml:space="preserve" x="320" y="146" font-size="18" font-weight="700" fill="#1d6b30" text-anchor="middle">every term comes out in m/s ✓</text><text xml:space="preserve" x="320" y="205" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">s  =  ut  +  ½at²</text><text xml:space="preserve" x="320" y="242" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="middle">m  =  (m/s) × s  +  (m/s²) × s²  =  m ✓</text><text xml:space="preserve" x="320" y="298" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">SI base units: m · kg · s · A · K · mol · cd</text></g></svg>