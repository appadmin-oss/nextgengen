<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="A balanced see-saw"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><line x1="80" y1="180" x2="560" y2="180" stroke="#16233f" stroke-width="7" stroke-linecap="round"/><polygon points="320,184 300,222 340,222" fill="#f3f5fa" stroke="#16233f" stroke-width="2" stroke-linejoin="round"/><rect x="80.0" y="120.0" width="60.0" height="54.0" rx="4" fill="#d9f2f6" stroke="#16233f" stroke-width="2"/><text xml:space="preserve" x="110" y="153" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">400 N</text><rect x="430.0" y="120.0" width="60.0" height="54.0" rx="4" fill="#fde3dc" stroke="#16233f" stroke-width="2"/><text xml:space="preserve" x="460" y="153" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">600 N</text><line x1="214.0" y1="240.0" x2="120.0" y2="240.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="110.0,240.0 120.0,245.0 120.0,235.0" fill="#3d4560"/><line x1="214.0" y1="240.0" x2="308.0" y2="240.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="318.0,240.0 308.0,235.0 308.0,245.0" fill="#3d4560"/><text xml:space="preserve" x="214" y="265" font-size="17" font-weight="800" fill="#3d4560" text-anchor="middle">1.5 m</text><line x1="391.0" y1="240.0" x2="332.0" y2="240.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="322.0,240.0 332.0,245.0 332.0,235.0" fill="#3d4560"/><line x1="391.0" y1="240.0" x2="450.0" y2="240.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="460.0,240.0 450.0,235.0 450.0,245.0" fill="#3d4560"/><text xml:space="preserve" x="391" y="265" font-size="17" font-weight="800" fill="#3d4560" text-anchor="middle">1.0 m</text><text xml:space="preserve" x="320" y="310" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">400 × 1.5  =  600 × 1.0</text><text xml:space="preserve" x="320" y="70" font-size="18" font-weight="700" fill="#0b6e80" text-anchor="middle">anticlockwise moments = clockwise moments</text></g></svg>