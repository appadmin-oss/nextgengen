<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="A table top on legs"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="100" y="50" width="440" height="56" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="85" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">Main idea: water is precious in Kano.</text><rect x="105" y="106" width="20" height="82" rx="2" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><rect x="40" y="188" width="150" height="76" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="115" y="220" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">wells are</text><text xml:space="preserve" x="115" y="246" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">drying up</text><rect x="310" y="106" width="20" height="82" rx="2" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><rect x="245" y="188" width="150" height="76" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="220" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">women walk</text><text xml:space="preserve" x="320" y="246" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">far for it</text><rect x="515" y="106" width="20" height="82" rx="2" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5"/><rect x="450" y="188" width="150" height="76" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="525" y="220" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">farms need</text><text xml:space="preserve" x="525" y="246" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">it for crops</text><text xml:space="preserve" x="320" y="305" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">every detail holds up the one main point</text></g></svg>