<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Profit"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="100" y="60" width="400" height="44" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="300" y="89" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">income ₦50,000</text><rect x="100" y="120" width="280" height="44" rx="6" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="240" y="149" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">costs ₦35,000</text><rect x="380" y="120" width="120" height="44" rx="6" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="440" y="149" font-size="19" font-weight="800" fill="#1d6b30" text-anchor="middle">profit</text><text xml:space="preserve" x="320" y="220" font-size="24" font-weight="800" fill="#16233f" text-anchor="middle">profit = income − costs</text><text xml:space="preserve" x="320" y="280" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">interest: the price of a loan · inflation: prices rising</text></g></svg>