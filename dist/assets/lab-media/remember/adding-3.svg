<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Column addition with carrying"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="220" y="60" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">H</text><text xml:space="preserve" x="280" y="60" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">T</text><text xml:space="preserve" x="340" y="60" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">O</text><text xml:space="preserve" x="220" y="88" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">1</text><text xml:space="preserve" x="280" y="88" font-size="16" font-weight="800" fill="#a3361f" text-anchor="middle">1</text><text xml:space="preserve" x="220" y="125" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text xml:space="preserve" x="280" y="125" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">5</text><text xml:space="preserve" x="340" y="125" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">8</text><text xml:space="preserve" x="170" y="170" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">+</text><text xml:space="preserve" x="220" y="170" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">1</text><text xml:space="preserve" x="280" y="170" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">4</text><text xml:space="preserve" x="340" y="170" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">7</text><line x1="180" y1="186" x2="370" y2="186" stroke="#16233f" stroke-width="2.5" stroke-linecap="round"/><text xml:space="preserve" x="220" y="225" font-size="30" font-weight="800" fill="#0b6e80" text-anchor="middle">3</text><text xml:space="preserve" x="280" y="225" font-size="30" font-weight="800" fill="#0b6e80" text-anchor="middle">0</text><text xml:space="preserve" x="340" y="225" font-size="30" font-weight="800" fill="#0b6e80" text-anchor="middle">5</text><text xml:space="preserve" x="410" y="115" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">ones: 8 + 7 = 15</text><text xml:space="preserve" x="410" y="150" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">tens: 1 + 5 + 4 = 10</text><text xml:space="preserve" x="410" y="185" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">hundreds: 1 + 1 + 1 = 3</text><text xml:space="preserve" x="320" y="290" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">line up the places; carry 1 when a column reaches 10</text></g></svg>