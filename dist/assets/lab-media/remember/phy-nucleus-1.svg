<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Nuclear notation and decay"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="140" y="115" font-size="24" font-weight="800" fill="#16233f" text-anchor="end">238</text><text xml:space="preserve" x="140" y="172" font-size="24" font-weight="800" fill="#0b6e80" text-anchor="end">92</text><text xml:space="preserve" x="146" y="168" font-size="66" font-weight="800" fill="#16233f" text-anchor="start">U</text><text xml:space="preserve" x="40" y="225" font-size="16" font-weight="700" fill="#3d4560" text-anchor="start">238 = nucleons (protons + neutrons)</text><text xml:space="preserve" x="40" y="252" font-size="16" font-weight="700" fill="#0b6e80" text-anchor="start">92 = protons</text><text xml:space="preserve" x="360" y="75" font-size="18" font-weight="800" fill="#16233f" text-anchor="start">in a decay:</text><text xml:space="preserve" x="360" y="120" font-size="20" font-weight="800" fill="#a3361f" text-anchor="start">α:  A − 4,  Z − 2</text><text xml:space="preserve" x="360" y="165" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="start">β:  A same,  Z + 1</text><text xml:space="preserve" x="360" y="210" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">γ:  no change (energy)</text></g></svg>