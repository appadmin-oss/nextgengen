<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="At, on, in for time"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="40" y="40" width="560" height="270" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="75" font-size="18" font-weight="700" fill="#16233f" text-anchor="middle">IN — months, years, seasons: in June, in 2026</text><rect x="90" y="95" width="460" height="195" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="130" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">ON — days and dates: on Monday, on 1 October</text><rect x="160" y="155" width="320" height="110" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="200" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">AT — a point in time</text><text xml:space="preserve" x="320" y="238" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">at 7 o&#x27;clock · at noon · at night</text></g></svg>