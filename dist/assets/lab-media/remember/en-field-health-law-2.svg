<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Who is who in court"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="240" y="40" width="160" height="66" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="70" font-size="21" font-weight="800" fill="#16233f" text-anchor="middle">judge</text><text xml:space="preserve" x="320" y="95" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">decides the case</text><rect x="30" y="145" width="190" height="66" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="125" y="175" font-size="21" font-weight="800" fill="#16233f" text-anchor="middle">plaintiff</text><text xml:space="preserve" x="125" y="200" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">brings the case</text><rect x="230" y="145" width="180" height="66" rx="8" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="175" font-size="21" font-weight="800" fill="#16233f" text-anchor="middle">witness</text><text xml:space="preserve" x="320" y="200" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">says what they saw</text><rect x="420" y="145" width="190" height="66" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="515" y="175" font-size="21" font-weight="800" fill="#16233f" text-anchor="middle">defendant</text><text xml:space="preserve" x="515" y="200" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">answers the case</text><text xml:space="preserve" x="320" y="270" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="middle">the judge&#x27;s decision is the verdict</text></g></svg>