<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Time dilation"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">Δt = γ Δt₀</text><text xml:space="preserve" x="320" y="120" font-size="24" font-weight="800" fill="#0b6e80" text-anchor="middle">γ = 1 ÷ √(1 − v²/c²)</text><text xml:space="preserve" x="200" y="180" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">v = 0.6c</text><text xml:space="preserve" x="380" y="180" font-size="20" font-weight="800" fill="#a3361f" text-anchor="start">γ = 1.25</text><text xml:space="preserve" x="200" y="216" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">v = 0.8c</text><text xml:space="preserve" x="380" y="216" font-size="20" font-weight="800" fill="#a3361f" text-anchor="start">γ ≈ 1.67</text><text xml:space="preserve" x="200" y="252" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">v = 0.99c</text><text xml:space="preserve" x="380" y="252" font-size="20" font-weight="800" fill="#a3361f" text-anchor="start">γ ≈ 7.1</text><text xml:space="preserve" x="320" y="310" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">γ is never below 1: a moving clock always runs slow</text></g></svg>