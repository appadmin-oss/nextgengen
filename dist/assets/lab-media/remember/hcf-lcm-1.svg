<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Seven makes one row only"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="60" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="90" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="120" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="150" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="180" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="210" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="240" y="80" width="27" height="27" fill="#f5b026" stroke="#16233f" stroke-width="1"/><text xml:space="preserve" x="320" y="102" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">7 = 1 × 7 only</text><rect x="60" y="150" width="27" height="27" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="90" y="150" width="27" height="27" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="120" y="150" width="27" height="27" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="60" y="180" width="27" height="27" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="90" y="180" width="27" height="27" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><rect x="120" y="180" width="27" height="27" fill="#20b2c9" stroke="#16233f" stroke-width="1"/><text xml:space="preserve" x="320" y="187" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">6 = 1 × 6 = 2 × 3</text><text xml:space="preserve" x="320" y="270" font-size="20" font-weight="800" fill="#a3361f" text-anchor="middle">a prime has exactly two factors: 1 and itself</text></g></svg>