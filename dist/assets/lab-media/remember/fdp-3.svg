<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Converting"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">fraction → decimal: divide top by bottom</text><text xml:space="preserve" x="320" y="105" font-size="24" font-weight="800" fill="#0b6e80" text-anchor="middle">1 ÷ 4 = 0.25</text><text xml:space="preserve" x="320" y="170" font-size="19" font-weight="700" fill="#16233f" text-anchor="middle">decimal → percent: × 100</text><text xml:space="preserve" x="320" y="205" font-size="24" font-weight="800" fill="#a3361f" text-anchor="middle">0.25 × 100 = 25%</text><text xml:space="preserve" x="320" y="275" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">Learn by heart: 1/2 = 0.5 = 50%   1/4 = 0.25 = 25%   1/10 = 0.1 = 10%</text></g></svg>