<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Describing"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="60" y="88" width="78" height="46" rx="6" fill="#e3f1e6" stroke="#e3f1e6" stroke-width="1.2"/><text xml:space="preserve" x="99.0" y="122" font-size="28" font-weight="700" fill="#16233f" text-anchor="middle">tall</text><text xml:space="preserve" x="220" y="120" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">adjective — describes a noun (what kind?)</text><rect x="60" y="168" width="125" height="46" rx="6" fill="#fde3dc" stroke="#fde3dc" stroke-width="1.2"/><text xml:space="preserve" x="122.5" y="202" font-size="28" font-weight="700" fill="#16233f" text-anchor="middle">quickly</text><text xml:space="preserve" x="240" y="200" font-size="17" font-weight="700" fill="#16233f" text-anchor="start">adverb — describes a verb (how? when?)</text><text xml:space="preserve" x="320" y="280" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">the same word can change class: &#x27;a fast car&#x27; / &#x27;she ran fast&#x27;</text></g></svg>