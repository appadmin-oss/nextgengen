<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="How much more has Ada?"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="110" y="103" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">Ada</text><rect x="130" y="75" width="400" height="44" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="520" y="103" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">₦500</text><text xml:space="preserve" x="110" y="168" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">Tobi</text><rect x="130" y="140" width="256" height="44" rx="4" fill="#20b2c9" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="376" y="168" font-size="18" font-weight="800" fill="#16233f" text-anchor="end">₦320</text><rect x="386" y="140" width="144" height="44" rx="4" fill="#fff" stroke="#ef6b4d" stroke-width="2"/><text xml:space="preserve" x="458" y="168" font-size="22" font-weight="800" fill="#a3361f" text-anchor="middle">?</text><text xml:space="preserve" x="320" y="240" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">500 − 320 = 180</text><text xml:space="preserve" x="320" y="285" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">the difference is the gap: Ada has ₦180 more</text></g></svg>