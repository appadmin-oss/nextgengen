<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Let go, and it goes straight on"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><circle cx="220" cy="190" r="110" fill="none" stroke="#c9cedb" stroke-width="2"/><circle cx="220" cy="190" r="4" fill="#16233f" stroke="#16233f" stroke-width="1.5"/><line x1="220" y1="190" x2="220" y2="125" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><line x1="220" y1="108" x2="220" y2="92" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><circle cx="220" cy="80" r="12" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><line x1="234" y1="80" x2="467.0" y2="80.0" stroke="#1d6b30" stroke-width="3.5" stroke-linecap="round"/><polygon points="480.0,80.0 467.0,73.5 467.0,86.5" fill="#1d6b30"/><text xml:space="preserve" x="360" y="64" font-size="17" font-weight="800" fill="#1d6b30" text-anchor="middle">flies off along the tangent ✓</text><line x1="220" y1="66" x2="220.0" y2="30.0" stroke="#ef6b4d" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"/><polygon points="220.0,20.0 215.0,30.0 225.0,30.0" fill="#ef6b4d"/><text xml:space="preserve" x="236" y="34" font-size="16" font-weight="800" fill="#a3361f" text-anchor="start">✗ not straight outwards</text><text xml:space="preserve" x="320" y="310" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">no force left → no turning: it goes straight on</text></g></svg>