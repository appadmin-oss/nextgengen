<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Four facts about zero"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="190" y="80" font-size="28" font-weight="800" fill="#0b6e80" text-anchor="middle">n + 0 = n</text><text xml:space="preserve" x="450" y="80" font-size="28" font-weight="800" fill="#0b6e80" text-anchor="middle">n − 0 = n</text><text xml:space="preserve" x="190" y="160" font-size="28" font-weight="800" fill="#a3361f" text-anchor="middle">n − n = 0</text><text xml:space="preserve" x="450" y="160" font-size="28" font-weight="800" fill="#a3361f" text-anchor="middle">n × 0 = 0</text><text xml:space="preserve" x="320" y="245" font-size="18" font-weight="700" fill="#16233f" text-anchor="middle">adding or taking away 0: the number stays</text><text xml:space="preserve" x="320" y="285" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">taking all of it, or 0 lots of it: nothing is left</text></g></svg>