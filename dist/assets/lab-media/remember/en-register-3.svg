<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Audience and purpose decide"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="30" y="60" width="260" height="95" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="160" y="98" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Who will read it?</text><text xml:space="preserve" x="160" y="132" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">a friend, the principal, the PTA</text><rect x="30" y="185" width="260" height="95" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="160" y="223" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Why am I writing?</text><text xml:space="preserve" x="160" y="257" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">to inform, persuade, thank</text><line x1="298" y1="110" x2="372" y2="160" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><line x1="298" y1="230" x2="372" y2="185" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><rect x="380" y="120" width="230" height="105" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="495" y="162" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">the right register</text><text xml:space="preserve" x="495" y="194" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">and layout</text></g></svg>