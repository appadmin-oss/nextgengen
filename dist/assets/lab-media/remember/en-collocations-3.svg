<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Learn the chunk"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="20" font-weight="800" fill="#16233f" text-anchor="middle">Learn the chunk, not the single word:</text><rect x="132" y="112" width="190" height="42" rx="6" fill="#e3f1e6" stroke="#e3f1e6" stroke-width="1.2"/><text xml:space="preserve" x="227.0" y="142" font-size="24" font-weight="700" fill="#16233f" text-anchor="middle">pay attention</text><rect x="330" y="112" width="177" height="42" rx="6" fill="#e3f1e6" stroke="#e3f1e6" stroke-width="1.2"/><text xml:space="preserve" x="418.5" y="142" font-size="24" font-weight="700" fill="#16233f" text-anchor="middle">take a photo</text><rect x="132" y="182" width="177" height="42" rx="6" fill="#e3f1e6" stroke="#e3f1e6" stroke-width="1.2"/><text xml:space="preserve" x="220.5" y="212" font-size="24" font-weight="700" fill="#16233f" text-anchor="middle">catch a cold</text><rect x="317" y="182" width="190" height="42" rx="6" fill="#e3f1e6" stroke="#e3f1e6" stroke-width="1.2"/><text xml:space="preserve" x="412.0" y="212" font-size="24" font-weight="700" fill="#16233f" text-anchor="middle">keep a secret</text><text xml:space="preserve" x="320" y="290" font-size="17" font-weight="700" fill="#0b6e80" text-anchor="middle">write new words down with the words they travel with</text></g></svg>