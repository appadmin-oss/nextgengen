<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="The formal letter"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="40" y="15" width="220" height="300" rx="4" fill="#fff" stroke="#16233f" stroke-width="1.5"/><rect x="170" y="28" width="76" height="42" rx="3" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5"/><rect x="54" y="80" width="76" height="36" rx="3" fill="#e3f1e6" stroke="#1d6b30" stroke-width="1.5"/><rect x="54" y="124" width="56" height="12" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="80" y="144" width="140" height="12" rx="2" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1"/><line x1="56" y1="170" x2="238" y2="170" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="182" x2="238" y2="182" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="194" x2="190" y2="194" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="206" x2="238" y2="206" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="218" x2="238" y2="218" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="230" x2="190" y2="230" stroke="#c9cedb" stroke-width="3" stroke-linecap="round"/><rect x="54" y="248" width="86" height="12" rx="2" fill="#f5b026" stroke="#16233f" stroke-width="1"/><rect x="54" y="268" width="70" height="26" rx="2" fill="#f3f5fa" stroke="#3d4560" stroke-width="1"/><line x1="250" y1="48" x2="284" y2="48" stroke="#3d4560" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text xml:space="p