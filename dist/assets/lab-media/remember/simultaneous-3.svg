<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Elimination"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="260" y="75" font-size="28" font-weight="800" fill="#16233f" text-anchor="end">x + y = 7</text><text xml:space="preserve" x="260" y="120" font-size="28" font-weight="800" fill="#16233f" text-anchor="end">−x + y = 1</text><text xml:space="preserve" x="98" y="120" font-size="28" font-weight="800" fill="#3d4560" text-anchor="end">+</text><line x1="90" y1="138" x2="270" y2="138" stroke="#16233f" stroke-width="2.5" stroke-linecap="round"/><text xml:space="preserve" x="260" y="180" font-size="28" font-weight="800" fill="#0b6e80" text-anchor="end">2y = 8</text><text xml:space="preserve" x="320" y="75" font-size="18" font-weight="700" fill="#3d4560" text-anchor="start">add them: the x&#x27;s cancel</text><text xml:space="preserve" x="320" y="180" font-size="20" font-weight="800" fill="#16233f" text-anchor="start">so y = 4, then x = 3</text><text xml:space="preserve" x="320" y="255" font-size="18" font-weight="700" fill="#a3361f" text-anchor="middle">add or subtract whole equations to make a letter vanish</text><text xml:space="preserve" x="320" y="292" font-size="18" font-weight="700" fill="#1d6b30" text-anchor="middle">check in BOTH: 3 + 4 = 7 ✓  4 − 3 = 1 ✓</text></g></svg>