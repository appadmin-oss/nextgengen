<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Shared and not shared"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><circle cx="255" cy="135" r="95" fill="#fde3dc" fill-opacity=".7" stroke="#ef6b4d" stroke-width="2"/><circle cx="385" cy="135" r="95" fill="#d9f2f6" fill-opacity=".7" stroke="#20b2c9" stroke-width="2"/><text xml:space="preserve" x="130" y="60" font-size="22" font-weight="800" fill="#a3361f" text-anchor="middle">12</text><text xml:space="preserve" x="510" y="60" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="middle">18</text><text xml:space="preserve" x="205" y="145" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text xml:space="preserve" x="320" y="125" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">2</text><text xml:space="preserve" x="320" y="165" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text xml:space="preserve" x="435" y="145" font-size="26" font-weight="800" fill="#16233f" text-anchor="middle">3</text><text xml:space="preserve" x="320" y="268" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="middle">HCF = the shared primes: 2 × 3 = 6</text><text xml:space="preserve" x="320" y="305" font-size="20" font-weight="800" fill="#a3361f" text-anchor="middle">LCM = all of them: 2 × 2 × 3 × 3 = 36</text></g></svg>