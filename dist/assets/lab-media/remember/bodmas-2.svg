<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="BODMAS"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="30" y="90" width="88" height="110" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="74" y="140" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">B</text><text xml:space="preserve" x="74" y="180" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Brackets</text><rect x="130" y="90" width="88" height="110" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="174" y="140" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">O</text><text xml:space="preserve" x="174" y="180" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Orders ²</text><rect x="230" y="90" width="88" height="110" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="274" y="140" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">D</text><text xml:space="preserve" x="274" y="180" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Divide</text><rect x="330" y="90" width="88" height="110" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="374" y="140" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">M</text><text xml:space="preserve" x="374" y="180" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Multiply</text><rect x="430" y="90" width="88" height="110" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="474" y="140" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">A</text><text xml:space="preserve" x="474" y="180" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Add</text><rect x="530" y="90" width="88" height="110" rx="8" fill="#f3f5fa" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="574" y="140" font-size="34" font-weight="800" fill="#16233f" text-anchor="middle">S</text><text xml:space="preserve" x="574" y="180" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">Subtract</text><text xml:space="preserve" x="320" y="250" font-size="17" font-weight="700" fill="#16233f" text-anchor="middle">D and M are equal partners — left to right. So are A and S.</text></g></svg>