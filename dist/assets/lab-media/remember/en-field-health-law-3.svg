<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Three arms of government"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><polygon points="40,95 600,95 320,30" fill="#fff9e8" stroke="#16233f" stroke-width="2" stroke-linejoin="round"/><text xml:space="preserve" x="320" y="82" font-size="18" font-weight="800" fill="#16233f" text-anchor="middle">government</text><rect x="55" y="110" width="160" height="180" rx="8" fill="#d9f2f6" stroke="#20b2c9" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="135" y="145" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">Legislature</text><text xml:space="preserve" x="135" y="185" font-size="16" font-weight="700" fill="#0b6e80" text-anchor="middle">makes laws</text><text xml:space="preserve" x="135" y="225" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">National</text><text xml:space="preserve" x="135" y="250" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">Assembly</text><rect x="240" y="110" width="160" height="180" rx="8" fill="#f5b026" stroke="#16233f" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="320" y="145" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">Executive</text><text xml:space="preserve" x="320" y="185" font-size="16" font-weight="700" fill="#16233f" text-anchor="middle">carries them out</text><text xml:space="preserve" x="320" y="225" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">the President</text><text xml:space="preserve" x="320" y="250" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">and ministers</text><rect x="425" y="110" width="160" height="180" rx="8" fill="#fde3dc" stroke="#ef6b4d" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="505" y="145" font-size="19" font-weight="800" fill="#16233f" text-anchor="middle">Judiciary</text><text xml:space="preserve" x="505" y="185" font-size="16" font-weight="700" fill="#a3361f" text-anchor="middle">interprets them</text><text xml:space="preserve" x="505" y="225" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">the courts</text><text xml:space="preserve" x="505" y="250" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">and judges</text></g></svg>