<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Doubled words"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="300" y="70" font-size="20" font-weight="800" fill="#a3361f" text-anchor="end">✗ It is more better.</text><line x1="312" y1="63" x2="348" y2="63" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="360" y="70" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓ It is better.</text><text xml:space="preserve" x="320" y="100" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">better already means &#x27;more good&#x27;</text><text xml:space="preserve" x="300" y="148" font-size="20" font-weight="800" fill="#a3361f" text-anchor="end">✗ The both of them came.</text><line x1="312" y1="141" x2="348" y2="141" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="360" y="148" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓ Both of them came.</text><text xml:space="preserve" x="320" y="178" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">&#x27;both&#x27; needs no &#x27;the&#x27;</text><text xml:space="preserve" x="300" y="226" font-size="20" font-weight="800" fill="#a3361f" text-anchor="end">✗ Myself and Tunde went.</text><line x1="312" y1="219" x2="348" y2="219" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="360" y="226" font-size="20" font-weight="800" fill="#1d6b30" text-anchor="start">✓ Tunde and I went.</text><text xml:space="preserve" x="320" y="256" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">the doer is &#x27;I&#x27;, not &#x27;myself&#x27;</text></g></svg>