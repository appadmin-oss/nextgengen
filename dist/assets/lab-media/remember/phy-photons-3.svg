<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Where the photon&#x27;s energy goes"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="70" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">hf  =  φ  +  ½mv²max</text><rect x="120.0" y="120.0" width="160.0" height="50.0" rx="0" fill="#fde3dc" stroke="#16233f" stroke-width="2"/><rect x="280.0" y="120.0" width="240.0" height="50.0" rx="0" fill="#d9f2f6" stroke="#16233f" stroke-width="2"/><line x1="320.0" y1="110.0" x2="130.0" y2="110.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="120.0,110.0 130.0,115.0 130.0,105.0" fill="#3d4560"/><line x1="320.0" y1="110.0" x2="510.0" y2="110.0" stroke="#3d4560" stroke-width="2" stroke-linecap="round"/><polygon points="520.0,110.0 510.0,105.0 510.0,115.0" fill="#3d4560"/><text xml:space="preserve" x="320" y="99" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">the photon&#x27;s energy, hf</text><text xml:space="preserve" x="200" y="152" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">φ</text><text xml:space="preserve" x="400" y="152" font-size="17" font-weight="800" fill="#16233f" text-anchor="middle">KE of the electron</text><text xml:space="preserve" x="200" y="200" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">work function:</text><text xml:space="preserve" x="200" y="222" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">to get out</text><text xml:space="preserve" x="400" y="200" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">what is left over</text><text xml:space="preserve" x="320" y="290" font-size="17" font-weight="800" fill="#0b6e80" text-anchor="middle">X-rays: fast electrons stop in metal → very high-f photons</text></g></svg>