<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Paying for energy"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="320" y="60" font-size="24" font-weight="800" fill="#16233f" text-anchor="middle">energy = power × time</text><rect x="110.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="140" y="131" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1 kWh</text><rect x="182.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="212" y="131" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1 kWh</text><rect x="254.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="284" y="131" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1 kWh</text><rect x="326.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="356" y="131" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1 kWh</text><rect x="398.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="428" y="131" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1 kWh</text><rect x="470.0" y="95.0" width="60.0" height="60.0" rx="6" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="500" y="131" font-size="16" font-weight="800" fill="#16233f" text-anchor="middle">1 kWh</text><text xml:space="preserve" x="320" y="185" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="middle">2 kW heater for 3 h = 6 kWh (6 units)</text><text xml:space="preserve" x="320" y="240" font-size="24" font-weight="800" fill="#16233f" text-anchor="middle">at ₦70 a unit:  6 × ₦70 = ₦420</text><text xml:space="preserve" x="320" y="290" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">kilowatts × hours — not watts, not seconds</text></g></svg>