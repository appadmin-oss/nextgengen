<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Place-value columns"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="110" y="70" width="130" height="70" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="175" y="100" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">Hundreds</text><text xml:space="preserve" x="175" y="130" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">3</text><rect x="260" y="70" width="130" height="70" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="325" y="100" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">Tens</text><text xml:space="preserve" x="325" y="130" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">4</text><rect x="410" y="70" width="130" height="70" rx="8" fill="#f3f5fa" stroke="#c9cedb" stroke-width="1.5" filter="url(#sh)"/><text xml:space="preserve" x="475" y="100" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">Ones</text><text xml:space="preserve" x="475" y="130" font-size="30" font-weight="800" fill="#16233f" text-anchor="middle">5</text><text xml:space="preserve" x="320" y="200" font-size="28" font-weight="800" fill="#16233f" text-anchor="middle">300  +  40  +  5  =  345</text><text xml:space="preserve" x="320" y="245" font-size="16" font-weight="600" fill="#3d4560" text-anchor="middle">The same digit 4 is worth 4, 40 or 400 — it depends on its column.</text></g></svg>