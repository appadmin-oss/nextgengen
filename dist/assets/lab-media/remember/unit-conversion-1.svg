<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="One kilometre is a thousand metres"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="70" y="70" width="500" height="50" rx="4" fill="#f5b026" stroke="#16233f" stroke-width="1.5"/><text xml:space="preserve" x="320" y="103" font-size="22" font-weight="800" fill="#16233f" text-anchor="middle">1 km</text><rect x="70" y="150" width="50" height="50" fill="#20b2c9" stroke="#16233f" stroke-width="1.2"/><rect x="120" y="150" width="50" height="50" fill="#d9f2f6" stroke="#16233f" stroke-width="1.2"/><rect x="170" y="150" width="50" height="50" fill="#20b2c9" stroke="#16233f" stroke-width="1.2"/><rect x="220" y="150" width="50" height="50" fill="#d9f2f6" stroke="#16233f" stroke-width="1.2"/><rect x="270" y="150" width="50" height="50" fill="#20b2c9" stroke="#16233f" stroke-width="1.2"/><rect x="320" y="150" width="50" height="50" fill="#d9f2f6" stroke="#16233f" stroke-width="1.2"/><rect x="370" y="150" width="50" height="50" fill="#20b2c9" stroke="#16233f" stroke-width="1.2"/><rect x="420" y="150" width="50" height="50" fill="#d9f2f6" stroke="#16233f" stroke-width="1.2"/><rect x="470" y="150" width="50" height="50" fill="#20b2c9" stroke="#16233f" stroke-width="1.2"/><rect x="520" y="150" width="50" height="50" fill="#d9f2f6" stroke="#16233f" stroke-width="1.2"/><text xml:space="preserve" x="320" y="235" font-size="20" font-weight="800" fill="#0b6e80" text-anchor="middle">10 pieces of 100 m = 1,000 m</text><text xml:space="preserve" x="320" y="280" font-size="18" font-weight="700" fill="#3d4560" text-anchor="middle">smaller pieces → more of them; bigger pieces → fewer</text></g></svg>