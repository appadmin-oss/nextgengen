<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Cut what adds nothing"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><text xml:space="preserve" x="290" y="80" font-size="20" font-weight="700" fill="#a3361f" text-anchor="end">at this point in time</text><line x1="305" y1="72" x2="355" y2="72" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="370" y="80" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="start">now</text><text xml:space="preserve" x="290" y="130" font-size="20" font-weight="700" fill="#a3361f" text-anchor="end">in spite of the fact that</text><line x1="305" y1="122" x2="355" y2="122" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="370" y="130" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="start">although</text><text xml:space="preserve" x="290" y="180" font-size="20" font-weight="700" fill="#a3361f" text-anchor="end">due to the fact that</text><line x1="305" y1="172" x2="355" y2="172" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="370" y="180" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="start">because</text><text xml:space="preserve" x="290" y="230" font-size="20" font-weight="700" fill="#a3361f" text-anchor="end">return back</text><line x1="305" y1="222" x2="355" y2="222" stroke="#3d4560" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a)"/><text xml:space="preserve" x="370" y="230" font-size="22" font-weight="800" fill="#0b6e80" text-anchor="start">return</text><text xml:space="preserve" x="320" y="295" font-size="17" font-weight="700" fill="#3d4560" text-anchor="middle">cut every word that adds no meaning</text></g></svg>