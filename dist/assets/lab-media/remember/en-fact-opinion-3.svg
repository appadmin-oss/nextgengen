<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-label="Both in one sentence"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d4560"/></marker><filter id="sh" x="-8%" y="-8%" width="116%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#16233f" flood-opacity=".12"/></filter></defs><rect width="640" height="330" fill="#fff"/><g style="font-family:'Inter','Segoe UI',Arial,sans-serif"><rect x="188" y="60" width="263" height="44" rx="6" fill="#d9f2f6" stroke="#d9f2f6" stroke-width="1.2"/><text xml:space="preserve" x="319.5" y="92" font-size="26" font-weight="700" fill="#16233f" text-anchor="middle">Our team won 3–1,</text><text xml:space="preserve" x="320" y="142" font-size="18" font-weight="800" fill="#0b6e80" text-anchor="middle">FACT — it can be checked</text><rect x="77" y="177" width="486" height="42" rx="6" fill="#fde3dc" stroke="#fde3dc" stroke-width="1.2"/><text xml:space="preserve" x="320.0" y="207" font-size="24" font-weight="700" fill="#16233f" text-anchor="middle">and it was the greatest match ever.</text><text xml:space="preserve" x="320" y="255" font-size="18" font-weight="800" fill="#a3361f" text-anchor="middle">OPINION — a judgement</text><text xml:space="preserve" x="320" y="305" font-size="16" font-weight="700" fill="#3d4560" text-anchor="middle">one sentence can hold both — split it and test each part</text></g></svg>